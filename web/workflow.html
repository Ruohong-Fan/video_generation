            toast('Upload done', 'success');
          } else { toast('Upload failed', 'error'); }
        } catch { toast('Upload failed', 'error'); }
      });
      return;
    }

    panel.innerHTML = `<div class="upstream" style="display:flex;flex-direction:column;height:100%">
      <div class="upstream-head">
        <div class="upstream-target">
          <span class="upstream-target-badge">${ICONS[selNode.type] || ''}</span>
          <div class="upstream-target-meta">
            <div class="upstream-target-label">Feeding into</div>
            <div class="upstream-target-title">${esc(selNode.title || NODE_SPECS[selNode.type].title)}</div>
          </div>
          ${totalSize > 0 ? `<div class="upstream-target-count">
            <span class="num">${totalSize}</span>
            <span class="lbl">input${totalSize===1?'':'s'}</span>
          </div>` : ''}
        </div>
        ${filterRow}
      </div>
      <div class="upstream-body" style="flex:1">${groupsHtml}</div>
    </div>`;

    // Wire filter chip clicks
    panel.querySelectorAll('[data-ifilter]').forEach(btn => {
      btn.addEventListener('click', () => { inputsFilter = btn.dataset.ifilter; renderRightPanel(); });
    });
    panel.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.jump;
        clearSelection(); setSelected(id, true); updateSelInfo();
      });
    });
    panel.querySelectorAll('[data-iexpand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const el = btn.closest('.input-text');
        if (el) { el.classList.toggle('expanded'); btn.textContent = el.classList.contains('expanded') ? 'less' : 'more'; }
      });
    });
  }

  function upstreamGroupHtml(title, type, items, hop) {
    const icon = type ? `<span class="upstream-group-icon">${ICONS[type]||''}</span>` :
      (hop ? `<span class="upstream-hop-pip">${hop}</span>` : '');
    const cards = items.map(({node, depth}) => inputCardHtml(node, depth)).join('');
    return `<section class="upstream-group">
      <header class="upstream-group-head">
        ${ICONS.chevD}
        ${icon}
        <span class="upstream-group-title">${esc(title)}</span>
        <span class="upstream-group-count">${items.length}</span>
      </header>
      <div class="upstream-group-body">${cards}</div>
    </section>`;
  }

  function inputCardHtml(node, depth) {
    const last = (node.results||[])[node.results.length-1];
    const mediaUrl_ = url => mediaUrl(url);

    let mediaHtml = '';
    if (node.type === 'text') {
      // Prefer generated text; fall back to instruction.
      const generated = last?.kind === 'text' ? last.text : '';
      const content = generated || node.prompt || '(empty)';
      const isLong = content.length > 160;
      const tag = generated ? '<span style="color:var(--amber);font-family:var(--type-mono);font-size:9px;letter-spacing:0.1em">OUTPUT · </span>' : '';
      mediaHtml = `<div class="input-text${isLong?' expandable':''}">
        <div class="input-text-content">${tag}${esc(content)}</div>
        ${isLong ? `<div class="input-text-fade"><button data-iexpand style="font:inherit;color:inherit;cursor:pointer">more</button></div>` : ''}
      </div>`;
    } else if (node.type === 'audio') {
      const bars = 40;
      const waveBars = Array.from({length: bars}, (_,i) => {
        const h = 8 + 16*Math.abs(Math.sin(i*0.5+(node.id.charCodeAt(1)||1))) + 4*Math.abs(Math.sin(i*1.3));
        return `<span style="height:${h}px"></span>`;
      }).join('');
      mediaHtml = `<div class="input-audio">
        <button class="input-audio-btn">${ICONS.play}</button>
        <div class="input-audio-track">
          <div class="input-audio-wave">${waveBars}</div>
          <div class="input-audio-meta"><span>Audio</span></div>
        </div>
      </div>`;
    } else if (node.type === 'upload') {
      const src = node.uploadUrl;
      const kind = node.uploadKind;
      const mediaEl = src
        ? (kind === 'video'
            ? `<video src="${esc(mediaUrl_(src))}" muted preload="metadata" referrerpolicy="no-referrer"></video>`
            : kind === 'audio'
              ? `<div style="display:grid;place-items:center;height:100%;color:var(--fg-2)">${ICONS.audio}</div>`
              : `<img src="${esc(mediaUrl_(src))}" alt="" referrerpolicy="no-referrer"/>`)
        : null;
      mediaHtml = `<div class="input-media image">
        ${mediaEl || `<div class="input-media-placeholder">UPLOAD</div>`}
      </div>`;
    } else if (node.type === 'video' || node.type === 'image') {
      const mediaSrc = last ? (last.servePath || last.url) : null;
      const uploadSrc = node.uploadUrl || null;
      const isVideo = last?.kind === 'video';
      const mediaEl = mediaSrc
        ? (isVideo
            ? `<video src="${esc(mediaUrl_(mediaSrc))}" muted preload="metadata" referrerpolicy="no-referrer"></video>`
            : `<img src="${esc(mediaUrl_(mediaSrc))}" alt="" referrerpolicy="no-referrer"/>`)
        : uploadSrc
          ? `<img src="${esc(mediaUrl_(uploadSrc))}" alt="" referrerpolicy="no-referrer"/>`
          : null;
      mediaHtml = `<div class="input-media ${node.type}">
        ${mediaEl || `<div class="input-media-placeholder">${node.status==='running'?`RENDERING · ${node.progress||0}%`:node.type.toUpperCase()}</div>`}
        ${node.type==='video' ? `<span class="input-media-pill duration">${node.params?.duration||'5'}s</span>` : ''}
      </div>`;
    }

    const rc = (node.results||[]).length;
    const metaStr = rc ? `${rc} run${rc===1?'':'s'}` : NODE_SPECS[node.type]?.title || node.type;

    return `<div class="input-card type-${node.type}">
      <div class="input-card-head">
        <span class="input-type-mark t-${node.type}">${ICONS[node.type]||''}</span>
        <span class="input-card-title" data-jump="${esc(node.id)}">${esc(node.title||NODE_SPECS[node.type].title)}</span>
        ${depth > 1 ? `<span class="input-hop">${depth}↑</span>` : ''}
        ${nodeStatusHtml(node)}
      </div>
      ${mediaHtml}
      <div class="input-card-foot">
        <span class="input-meta">${esc(metaStr)}</span>
        <div class="input-card-actions">
          <button class="input-action" data-jump="${esc(node.id)}" title="Reveal on canvas">${ICONS.fit}</button>
          ${node.type !== 'upload' ? `<button class="input-action" title="Re-run" onclick="runNode('${esc(node.id)}')">${ICONS.refresh}</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  // ── Params tab ────────────────────────────────────────────────────────────
  function renderParamsTab(panel, selNode) {
    if (!selNode) {
      panel.innerHTML = `<div class="empty-state">
        ${ICONS.layers}
        <div class="empty-state-title">Nothing selected</div>
        <div class="empty-state-sub">Click a node on the canvas to edit its parameters.</div>
      </div>`;
      return;
    }
    const node = selNode;
    const spec = NODE_SPECS[node.type];
    const ups = upstreamNodes(node.id);
    const imageUps  = ups.filter(u => u.type === 'image' || u.type === 'video');
    const isPassive = PASSIVE_TYPES.has(node.type);
    const sel = (opts, cur) => opts.map(([v,l]) => `<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('');

    // Thumbnail / preview header
    const last = (node.results||[])[(node.results||[]).length-1];
    const thumbHtml = (last && resultThumb(last))
      ? `<div class="inspector-thumb">${resultThumb(last)}</div>`
      : node.uploadUrl
        ? `<img class="inspector-thumb" src="${esc(mediaUrl(node.uploadUrl))}" alt="" referrerpolicy="no-referrer"/>`
        : `<div class="inspector-thumb placeholder">${ICONS[node.type]||''}</div>`;

    let f = '';

    // Name
    f += `<div class="field">
      <label class="field-label">Name</label>
      <input class="field-input" data-field="title" value="${esc(node.title||spec.title)}"/>
    </div>`;

    // Prompt
    if (['text','image','video'].includes(node.type)) {
      const isI2V = node.type === 'video' && videoMode(node) === 'I2V';
      const ph = {
        text:'Write a 30s product script highlighting the selling points above…',
        image:'A misty mountain at dawn…',
        video: isI2V ? 'Camera slowly pushes in, leaves rustle in the breeze…' : 'A fox sitting in a snowy forest, cinematic 4K…',
      }[node.type] || '';
      const lbl = node.type === 'text' ? 'Instruction' : 'Prompt';
      let helper = '';
      if (node.type === 'text') {
        helper = `<div class="field-helper">The model receives all upstream inputs (text · images · video refs) plus this instruction.</div>`;
      } else if (node.type === 'video') {
        helper = isI2V
          ? `<div class="field-helper" style="color:var(--amber)">I2V mode — describes motion applied to the upstream image (optional).</div>`
          : `<div class="field-helper">T2V mode — connect an Image node to switch to I2V (animate that image).</div>`;
      }
      f += `<div class="field">
        <label class="field-label">${lbl}</label>
        <textarea class="field-textarea" data-field="prompt" rows="5" placeholder="${esc(ph)}">${esc(node.prompt)}</textarea>
        ${helper}
      </div>`;
    }

    // Generated text output (Text node)
    if (node.type === 'text') {
      const lastTxt = (node.results || []).slice().reverse().find(r => r?.kind === 'text');
      if (lastTxt?.text) {
        f += `<div class="field">
          <label class="field-label">Generated text <span style="color:var(--amber);font-size:10px">${node.results.length} run${node.results.length===1?'':'s'}</span></label>
          <div class="generated-text">${esc(lastTxt.text)}</div>
          <button class="btn ghost" type="button" data-action="copy-text" style="margin-top:6px;font-size:11px">Copy</button>
        </div>`;
      }
    }

    // Duration chips (video)
    if (node.type === 'video') {
      f += `<div class="field">
        <label class="field-label">Duration</label>
        <div class="chip-row">
          ${['5','10'].map(d => `<button class="chip${node.params.duration===d?' active':''}" data-field="duration" data-val="${d}">${d}s</button>`).join('')}
        </div>
      </div>`;
    }

    // Aspect ratio chips
    if (node.type === 'image' || node.type === 'video') {
      const ratios = node.type === 'image' ? ['16:9','1:1','9:16','4:3','3:4'] : ['16:9','9:16','1:1'];
      f += `<div class="field">
        <label class="field-label">Aspect ratio</label>
        <div class="chip-row">
          ${ratios.map(r => `<button class="chip${node.params.ratio===r?' active':''}" data-field="ratio" data-val="${r}">${r}</button>`).join('')}
        </div>
      </div>`;
    }

    // Resolution select
    if (node.type === 'image') {
      f += `<div class="field"><label class="field-label">Resolution</label>
        <select class="field-select" data-field="resolution">
          ${sel([['1k','1K'],['2k','2K'],['4k','4K']], node.params.resolution)}
        </select></div>`;
    }
    if (node.type === 'video') {
      f += `<div class="field"><label class="field-label">Resolution</label>
        <select class="field-select" data-field="resolution">
          ${sel([['480P','480P'],['720P','720P'],['1080P','1080P']], node.params.resolution)}
        </select></div>`;
    }

    // Model (video)
    if (node.type === 'video') {
      f += `<div class="field"><label class="field-label">Model</label>
        <select class="field-select" data-field="modelVersion">
          ${sel([['seedance2.0fast','Non-VIP Fast'],['seedance2.0','Non-VIP'],['seedance2.0fast_vip','VIP Fast'],['seedance2.0_vip','VIP']], node.params.modelVersion)}
        </select></div>`;
    }

    // Upload node params
    if (node.type === 'upload') {
      const kind = node.uploadKind;
      const url = node.uploadUrl;
      if (url) {
        if (kind === 'image') {
          f += `<div class="field"><label class="field-label">Uploaded image</label>
            <img src="${esc(mediaUrl(url))}" alt="" referrerpolicy="no-referrer" style="width:100%;border-radius:6px;max-height:160px;object-fit:contain;background:var(--bg-0)"/>
          </div>`;
        } else if (kind === 'video') {
          f += `<div class="field"><label class="field-label">Uploaded video</label>
            <video src="${esc(mediaUrl(url))}" controls muted style="width:100%;border-radius:6px;max-height:160px;background:var(--bg-0)"></video>
          </div>`;
        } else if (kind === 'audio') {
          f += `<div class="field"><label class="field-label">Uploaded audio</label>
            <audio src="${esc(mediaUrl(url))}" controls style="width:100%;border-radius:6px"></audio>
          </div>`;
        }
        f += `<div class="field" style="display:flex;gap:6px">
          <label style="flex:1"><input type="file" accept="image/*,video/*,audio/*" data-upload-replace-input style="display:none"/>
            <span class="btn ghost" style="width:100%;justify-content:center;font-size:11px;cursor:pointer">Replace</span>
          </label>
          <button class="btn ghost" type="button" data-clear-upload style="font-size:11px;color:var(--err)">Remove</button>
        </div>`;
      } else {
        f += `<div class="field">
          <label style="display:block"><input type="file" accept="image/*,video/*,audio/*" data-upload-replace-input style="display:none"/>
            <span class="btn primary" style="width:100%;justify-content:center;font-size:12px;cursor:pointer">${ICONS.upload} Choose file</span>
          </label>
          <div class="field-helper" style="text-align:center;margin-top:6px">Or drag a file onto the node.</div>
        </div>`;
      }
    }

    // Image references (for image/video generation nodes)
    if (node.type === 'image' || node.type === 'video') {
      const allImageUps = ups.filter(u =>
        u.type === 'image' || u.type === 'video' ||
        (u.type === 'upload' && (u.uploadKind === 'image' || u.uploadKind === 'video'))
      );
      let thumbs = '';
      for (const iu of allImageUps) {
        if (iu.type === 'upload') {
          const ref = iu.uploadUrl;
          if (ref) thumbs += `<div class="insp-thumb"><img src="${esc(mediaUrl(ref))}" alt="" referrerpolicy="no-referrer"/><div class="insp-thumb-label">Upload</div></div>`;
        } else {
          const refLast = iu.results?.[iu.results.length - 1];
          const t = resultThumb(refLast);
          if (t) {
            thumbs += `<div class="insp-thumb">${t}<div class="insp-thumb-label">Ref</div></div>`;
          } else if (iu.uploadUrl) {
            thumbs += `<div class="insp-thumb"><img src="${esc(mediaUrl(iu.uploadUrl))}" alt="" referrerpolicy="no-referrer"/><div class="insp-thumb-label">Upload</div></div>`;
          } else {
            thumbs += `<div class="insp-thumb"><div class="insp-thumb-pending">⏳</div><div class="insp-thumb-label">Run first</div></div>`;
          }
        }
      }
      const sectionLabel = node.type === 'video' ? 'Visual references' : 'Source images';
      if (allImageUps.length > 0) {
        f += `<div class="field">
          <label class="field-label">${sectionLabel} <span style="color:var(--ok);font-size:10px">✓ ${allImageUps.length}</span></label>
          ${thumbs ? `<div class="insp-thumb-grid">${thumbs}</div>` : ''}
        </div>`;
      }
    }

    // Audio: prompt + voice + generated preview (MiniMax TTS)
    if (node.type === 'audio') {
      f += `<div class="field">
        <label class="field-label">Prompt</label>
        <textarea class="field-textarea" data-field="prompt" rows="4"
          placeholder="Upbeat cinematic background music, orchestral with piano and strings…">${esc(node.prompt)}</textarea>
        <div class="field-helper">Describe the audio. MiniMax TTS generates speech or music based on your description. Set MINIMAX_API_KEY and optionally MINIMAX_VOICE_ID on the server.</div>
      </div>`;
      const lastAudio = (node.results||[]).slice().reverse().find(r => r?.kind === 'audio');
      if (lastAudio) {
        const src = esc(mediaUrl(lastAudio.servePath || lastAudio.url));
        f += `<div class="field">
          <label class="field-label">Generated audio <span style="color:var(--amber);font-size:10px">${(node.results||[]).length} run${(node.results||[]).length===1?'':'s'}</span></label>
          <audio src="${src}" controls style="width:100%;border-radius:6px"></audio>
        </div>`;
      }
    }

    // Edit node params
    if (node.type === 'edit') {
      f += `<div class="field">
        <label class="field-label">Instructions</label>
        <textarea class="field-textarea" data-field="prompt" rows="4"
          placeholder="Trim the intro of clip 1 to 3s, double the speed of clip 2, add a fade in…">${esc(node.prompt)}</textarea>
        <div class="field-helper">The AI will read your instructions and generate an edit plan. Leave blank to auto-combine all clips.</div>
      </div>`;
      // Show connected clips (video and upload-video nodes)
      const editClips = upstreamNodes(node.id).filter(u => u.type === 'video' || (u.type === 'upload' && u.uploadKind === 'video'));
      const editAudio = upstreamNodes(node.id).filter(u => u.type === 'audio' || (u.type === 'upload' && u.uploadKind === 'audio'));
      if (editClips.length) {
        const clipList = editClips.map((u, i) => {
          const uLast = u.results?.[u.results.length - 1];
          const dur = uLast ? '' : (u.uploadUrl ? '(uploaded)' : '(not run)');
          return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line-soft)">
            <span style="font-family:var(--type-mono);font-size:10px;color:var(--amber);min-width:16px">${i}</span>
            <span style="flex:1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.title||'Video')}</span>
            <span style="font-size:10px;color:var(--fg-3)">${esc(dur)}</span>
          </div>`;
        }).join('');
        f += `<div class="field">
          <label class="field-label">Clips (${editClips.length})${editAudio.length ? ` · +${editAudio.length} audio` : ''}</label>
          ${clipList}
        </div>`;
      }
      // Show edit plan if available
      const lastEditResult = (node.results||[]).slice().reverse().find(r => r?.editPlan);
      if (lastEditResult?.editPlan) {
        const plan = lastEditResult.editPlan;
        const planSummary = (plan.clips||[]).map((c, i) =>
          `<span style="color:var(--amber)">${c.index}</span> ${c.trim_start||0}–${c.trim_end??'end'}s${c.speed&&c.speed!==1?' ×'+c.speed:''}${c.mute?' 🔇':''}`
        ).join(', ');
        f += `<div class="field">
          <label class="field-label">Last edit plan <span style="color:var(--fg-3);font-size:10px">AI generated</span></label>
          <div style="font-family:var(--type-mono);font-size:10px;color:var(--fg-2);background:var(--bg-0);padding:8px;border-radius:4px;overflow:auto;max-height:100px;white-space:pre-wrap;word-break:break-all">${esc(planSummary||JSON.stringify(plan,null,2))}</div>
        </div>`;
      }
    }

    // Status
    let statusHtml = '';
    if (node.status === 'running') statusHtml = `<div class="insp-status">${node.type === 'edit' ? 'Editing…' : 'Rendering…'}</div>`;
    else if (node.status === 'queued') statusHtml = `<div class="insp-status">Queued${node.queueIdx!=null?' #'+node.queueIdx:''}…</div>`;
    else if (node.status === 'error' && node.error) statusHtml = `<div class="insp-status error">⚠ ${esc(node.error)}</div>`;

    const rc = node.results?.length || 0;
    const rcHtml = rc ? `<div class="insp-run-count">${rc} run${rc===1?'':'s'} · see Files</div>` : '';

    panel.innerHTML = `
      <div class="inspector-head">
        ${thumbHtml}
        <div class="inspector-meta">
          <div class="inspector-title">${esc(node.title||spec.title)}</div>
          <div class="inspector-sub">${esc(spec.title)} · ${esc(node.id)}</div>
        </div>
      </div>
      <div class="params-body">
        ${f}
        ${statusHtml}
        ${rcHtml}
        ${!isPassive ? `<button class="btn primary" style="width:100%;justify-content:center" data-action="run">${ICONS.play} Run this node</button>` : ''}
      </div>`;

    // Wire input/select changes
    panel.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('input', e => {
        const field = e.target.dataset.field;
        if (field === 'prompt') { node.prompt = e.target.value; renderNode(node); }
        else if (field === 'title') { node.title = e.target.value; renderNode(node); }
        else node.params[field] = e.target.value;
        scheduleSave();
      });
    });
    // Chip buttons
    panel.querySelectorAll('.chip[data-field]').forEach(btn => {
      btn.addEventListener('click', () => {
        const field = btn.dataset.field;
        node.params[field] = btn.dataset.val;
        panel.querySelectorAll(`.chip[data-field="${field}"]`).forEach(b => b.classList.toggle('active', b === btn));
        scheduleSave();
      });
    });
    // Run button
    panel.querySelector('[data-action=run]')?.addEventListener('click', () => runNode(node.id));
    // Copy generated text (Text node)
    panel.querySelector('[data-action=copy-text]')?.addEventListener('click', () => {
      const lastTxt = (node.results || []).slice().reverse().find(r => r?.kind === 'text');
      if (!lastTxt?.text) return;
      navigator.clipboard?.writeText(lastTxt.text).then(
        () => toast('Copied', 'success'),
        () => toast('Copy failed', 'error'),
      );
    });
    // Clear-upload button (upload node)
    panel.querySelector('[data-clear-upload]')?.addEventListener('click', () => {
      node.uploadUrl = null; node.uploadPath = null; node.uploadKind = null; node.uploadRatio = null;
      renderNode(node); renderRightPanel(); scheduleSave();
    });
    // Replace/choose file input (upload node params)
    panel.querySelector('[data-upload-replace-input]')?.addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      const kind = file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'image';
      const fd = new FormData(); fd.append('file', file);
      toast('Uploading…');
      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: fd });
        const d = await resp.json();
        if (d.ok) {
          node.uploadUrl = d.url; node.uploadPath = d.path || null; node.uploadKind = kind; node.uploadRatio = null;
          renderNode(node); renderRightPanel(); scheduleSave();
          if (document.getElementById('panel-files')?.style.display !== 'none') renderFilesPanel();
          toast('Upload done', 'success');
        } else { toast('Upload failed', 'error'); }
      } catch { toast('Upload failed', 'error'); }
    });
  }

  // ── Queue + Done tabs ─────────────────────────────────────────────────────
  function renderQueueTab(panel) {
    const queue = [...nodes.values()].filter(n => n.status === 'running' || n.status === 'queued');
    if (!queue.length) {
      panel.innerHTML = `<div class="empty-state"><div style="margin-bottom:12px;opacity:0.4">${ICONS.refresh}</div><div class="empty-state-title">Queue is clear</div><div class="empty-state-sub">Runs will appear here with live progress.</div></div>`;
      return;
    }
    panel.innerHTML = `<div style="padding:14px">
      <div class="side-section-title" style="margin-top:0">Active · ${queue.length}</div>
      ${queue.map(n => `<div class="queue-item">
        ${(() => { const lr = (n.results||[]).slice(-1)[0]; const t = resultThumb(lr); return t ? `<div class="queue-thumb">${t}</div>` : `<div class="queue-thumb" style="display:grid;place-items:center;color:var(--fg-3)">${ICONS[n.type]||''}</div>`; })()}
        <div class="queue-info">
          <div class="queue-name">${esc(n.title||NODE_SPECS[n.type].title)}</div>
          <div class="queue-sub">${esc(n.type)}${n.progress!=null?' · '+n.progress+'%':''}</div>
          ${n.status==='running' ? `<div class="queue-bar"><div class="queue-bar-fill" style="width:${n.progress||0}%"></div></div>` : ''}
        </div>
        ${nodeStatusHtml(n)}
      </div>`).join('')}
    </div>`;
  }

  function renderDoneTab(panel) {
    const done = [...nodes.values()].filter(n => n.status === 'done' || n.status === 'error');
    if (!done.length) {
      panel.innerHTML = `<div class="empty-state"><div style="opacity:0.4;margin-bottom:12px">${ICONS.layers}</div><div class="empty-state-title">No runs yet</div></div>`;
      return;
    }
    panel.innerHTML = `<div style="padding:14px">
      <div class="side-section-title" style="margin-top:0">Completed · ${done.length}</div>
      ${done.map(n => {
        const last = (n.results||[]).slice(-1)[0];
        return `<div class="queue-item">
          ${(() => { const t = resultThumb(last); return t ? `<div class="queue-thumb">${t}</div>` : `<div class="queue-thumb" style="display:grid;place-items:center;color:var(--fg-3)">${ICONS[n.type]||''}</div>`; })()}
          <div class="queue-info">
            <div class="queue-name">${esc(n.title||NODE_SPECS[n.type].title)}</div>
            <div class="queue-sub">${esc(n.type)}${last?` · ${last.kind||''}`:''}</div>
          </div>
          ${nodeStatusHtml(n)}
        </div>`;
      }).join('')}
    </div>`;
  }

  // Wire right panel input → save
  document.getElementById('right-panel-content')?.addEventListener('input', scheduleSave);

  // ── User menu (avatar dropdown + sign out) ────────────────────────────────
  (function setupUserMenu() {
    const menu    = document.getElementById('user-menu');
    const trigger = document.getElementById('user-menu-trigger');
    const emailEl = document.getElementById('user-menu-email');
    const signOut = document.getElementById('user-menu-signout');
    if (!menu || !trigger) return;

    fetch('/api/me', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(d => {
        if (d?.user) {
          emailEl.textContent = d.user;
          trigger.textContent = (d.user[0] || 'R').toUpperCase();
        }
      }).catch(() => {});

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('open');
      trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target)) {
        menu.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      }
    });
    signOut.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      } finally {
        window.location.href = '/login';
      }
    });
  })();
</script>
</body>
</html>
