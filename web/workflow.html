      }
      if (node.status === 'running') return `<div class="node-preview empty">Generating…</div>`;
      if (node.status === 'queued')  return `<div class="node-preview empty">Queued…</div>`;
      return `<div class="node-preview empty">Type a prompt or upload a file</div>`;
    }

    // Edit node: show output if done, else filmstrip of upstream clips
    if (node.type === 'edit') {
      if (last?.url || last?.servePath) {
        const u = mediaUrl(last.servePath || last.url);
        const playBadge = `<div class="video-play-badge"><svg viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg></div>`;
        // Derive ratio from first upstream video node's params, fall back to 16:9
        const firstVidUp = upstreamNodes(node.id).find(u => u.type === 'video');
        const editRatio = firstVidUp?.params?.ratio || '16:9';
        const editRatioParts = editRatio.split(':').map(Number);
        const editAspect = (editRatioParts.length === 2 && editRatioParts[0] && editRatioParts[1])
          ? `aspect-ratio:${editRatioParts[0]}/${editRatioParts[1]}`
          : 'aspect-ratio:16/9';
        return `<div class="node-output-wrap"><div class="node-preview" style="${editAspect}" data-video-preview>
          <video preload="metadata" muted playsinline referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"><source src="${esc(u)}" type="video/mp4"/></video>${playBadge}
        </div>${countBadge}</div>`;
      }
      if (node.status === 'running') return `<div class="node-preview empty">Editing…</div>`;
      if (node.status === 'queued')  return `<div class="node-preview empty">Queued…</div>`;
      const videoUps = upstreamNodes(node.id).filter(u => u.type === 'video' || (u.type === 'upload' && u.uploadKind === 'video'));
      const audioUps = upstreamNodes(node.id).filter(u => u.type === 'audio' || (u.type === 'upload' && u.uploadKind === 'audio'));
      if (!videoUps.length) return `<div class="node-preview empty">Connect Video or Upload nodes to edit</div>`;
      // Expand each upstream into one tile PER video result, so a Video
      // node with 6 clips renders as 6 strip items — matches what the
      // Edit node actually submits (every clip becomes a timeline entry).
      const strip = [];
      for (const u of videoUps) {
        if (u.type === 'upload') {
          if (u.uploadUrl) strip.push({ src: u.uploadUrl, label: u.title || 'Upload', kind: 'video' });
          continue;
        }
        // Match the upstream collector in startTask — show only clips
        // from the most recent Run press, so the strip matches what
        // gets submitted on Run.
        const vidResults = latestRunResults(u).filter(r => r && r.kind === 'video');
        if (vidResults.length) {
          const multi = vidResults.length > 1;
          vidResults.forEach((r, idx) => {
            const src = r.servePath || r.url;
            if (!src) return;
            const label = multi ? `${u.title || 'Video'} · ${idx + 1}` : (u.title || 'Video');
            strip.push({ src, label, kind: 'video' });
          });
        } else if (u.uploadUrl) {
          strip.push({ src: u.uploadUrl, label: u.title || 'Video', kind: 'video' });
        } else {
          strip.push({ src: null, label: u.title || 'Video', kind: 'video' });
        }
      }
      const stripItems = strip.map(({ src, label }) => {
        const mediaEl = src
          ? `<video src="${esc(mediaUrl(src))}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block"></video>`
          : `<div style="display:grid;place-items:center;height:100%;color:var(--fg-3)">${ICONS.video}</div>`;
        return `<div class="node-edit-clip">${mediaEl}<div class="node-edit-clip-label">${esc(label)}</div></div>`;
      }).join('');
      const audioNote = audioUps.length
        ? `<div class="node-edit-audio-note">${ICONS.audio} +${audioUps.length} audio</div>` : '';
      return `<div class="node-edit-strip">${stripItems}</div>${audioNote}`;
    }

    const aspectStyle = previewAspectStyle(node);
    if (last?.url || last?.localPath || last?.servePath) {
      // For Video nodes, if the most recent Run produced multiple clips,
      // show them as a filmstrip on the card itself — the user can see
      // exactly which clips a downstream Edit node will pick up (which
      // is also defined as latestRunResults). The filmstrip replaces the
      // single big preview only when there's > 1 clip in this run; one-
      // clip runs keep the existing big preview.
      if (node.type === 'video') {
        const batch = latestRunResults(node).filter(r => r && r.kind === 'video' && (r.servePath || r.url));
        if (batch.length > 1) {
          const playBadge = `<div class="video-play-badge"><svg viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg></div>`;
          const tiles = batch.map((r, i) => {
            const src = mediaUrl(r.servePath || r.url);
            return `<div class="node-edit-clip">
              <video preload="metadata" muted playsinline referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"><source src="${esc(src)}" type="video/mp4"/></video>
              ${playBadge}
              <div class="node-edit-clip-label">${i + 1}</div>
            </div>`;
          }).join('');
          const olderCount = (node.results || []).length - batch.length;
          const stripBadge = `<div class="node-output-count">${batch.length} clips · this run${olderCount > 0 ? ` · ${olderCount} older` : ''}</div>`;
          return `<div class="node-output-wrap"><div class="node-edit-strip" data-run-strip>${tiles}</div>${stripBadge}</div>`;
        }
      }
      const u = mediaUrl(last.servePath || last.url);
      const playBadge = `<div class="video-play-badge"><svg viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg></div>`;
      const media = last.kind === 'video'
        ? `<video preload="metadata" muted playsinline referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"><source src="${esc(u)}" type="video/mp4"/></video>${playBadge}`
        : `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"/>`;
      return `<div class="node-output-wrap"><div class="node-preview"${aspectStyle} data-video-preview>${media}</div>${countBadge}</div>`;
    }
    if ((node.type === 'image' || node.type === 'video') && node.uploadUrl) {
      return `<div class="node-preview"${aspectStyle}><img src="${esc(mediaUrl(node.uploadUrl))}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"/></div>`;
    }
    const msg = {
      running: node.progress != null ? `Rendering · ${node.progress}%` : 'Rendering…',
      queued: 'Queued…',
      error: 'Error — see Params',
    };
    return `<div class="node-preview empty"${aspectStyle}>${msg[node.status] || 'No output yet'}</div>`;
  }

  function duplicateNode(id) {
    const n = nodes.get(id);
    if (!n) return;
    const newNode = createNode(n.type, n.x + 260, n.y + 20);
    if (newNode) {
      newNode.prompt = n.prompt;
      newNode.params = { ...n.params };
      newNode.title  = (n.title || NODE_SPECS[n.type].title) + ' copy';
      renderNode(newNode);
    }
  }

  function deleteNode(id) {
    const n = nodes.get(id);
    if (!n) return;
    document.getElementById(id)?.remove();
    nodes.delete(id);
    selected.delete(id);
    // Remove connected edges
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].fromId === id || edges[i].toId === id) edges.splice(i, 1);
    }
    renderAllEdges();
    updateSelInfo();
  }

  function toggleSelectNode(id) {
    setSelected(id, !selected.has(id));
    updateSelInfo();
  }

  // ── Execution ───────────────────────────────────────────────────────────
  function setNodeStatus(id, status, extra = {}) {
    const n = nodes.get(id);
    if (!n) return;
    n.status = status;
    Object.assign(n, extra);
    renderNode(n);
    updateEdgesFor(id);
    if (document.getElementById('panel-output')?.style.display !== 'none') renderFilesPanel();
    if (selected.has(id)) renderInspector(id);
    // Refresh downstream nodes so they pick up new upstream outputs (image
    // becoming available switches a Video node from T2V to I2V mode, etc.)
    if (status === 'done') {
      edges.filter(e => e.fromId === id).forEach(e => {
        const dn = nodes.get(e.toId);
        if (dn) renderNode(dn);
        if (selected.has(e.toId)) renderInspector(e.toId);
      });
    }
  }

  function upstreamNodes(id) {
    return edges.filter(e => e.toId === id).map(e => nodes.get(e.fromId)).filter(Boolean);
  }

  // Returns the user-selected generation mode for a video node:
  //   'T2V' | 'I2V' | 'R2V' (Reference-to-Video / 全能参考).
  // Legacy values: nodes saved before the chip-selector existed may carry
  // 'auto' or 'MM2V' — map them to a sensible explicit choice.
  function videoMode(node) {
    if (node.type !== 'video') return '';
    const v = node.params?.videoMode;
    if (v === 'I2V' || v === 'T2V' || v === 'R2V') return v;
    if (v === 'MM2V') return 'R2V';  // legacy rename
    return 'T2V';                    // legacy 'auto' / missing → default
  }

  // Pull the most recent generated text from a Text node, falling back to its prompt.
  function textNodeOutput(n) {
    const last = n.results?.[n.results.length - 1];
    if (last?.text) return last.text;  // LLM-generated; vars already resolved upstream
    return resolveVars(n.prompt || '');
  }

  function collectInputs(node, overrides, iterationIndex) {
    const up = upstreamNodes(node.id);
    // Use the runtime resolver so the user can reference upstream Text
    // outputs (e.g. {{text}}, {{prev}}, {{node-title}}) directly in their
    // prompt — same syntax as project variables. `overrides` lets the
    // caller inject per-iteration values (the per-scene loop uses this
    // to swap {{text}} / {{prev}} for the current scene block).
    const userPrompt = resolveRuntimeVars(node.prompt || '', node, overrides, iterationIndex);
    // Single line so every Run leaves an unambiguous trace whether or not
    // any matching path fires below. If this line isn't visible after a
    // Run, collectInputs isn't being called at all (server bug / stale
    // deploy) and the rest of the diagnostics can't help.
    console.log(`[collectInputs] enter: node=${node.title || node.id} type=${node.type} iterIdx=${iterationIndex} projectInputs=${projectInputs.length} (${projectInputs.map(i => `${_inputVarKey(i)}:${i.kind || 'file'}${(i.url || i.path) ? '' : '∅'}`).join(',') || 'empty'})`);
    let textNodePrompt = '';
    const imageRefs = [];
    const imagePrompts = [];
    const audioRefs = [];
    const videoRefs = [];  // camera-motion references (multimodal2video --video)
    // When a per-scene loop is active, we want every upstream result to
    // be available so the caller can pick result[i] for clip i. Outside
    // the loop, we keep the old "last only" behaviour so single-shot runs
    // still use the most recent generation. _picks() encapsulates that.
    const inLoop = typeof iterationIndex === 'number' && iterationIndex >= 0;
    const _picks = (results, kindFilter) => {
      const list = (results || []).filter(r => r && (!kindFilter || r.kind === kindFilter));
      if (!list.length) return [];
      return inLoop ? list : [list[list.length - 1]];
    };
    for (const u of up) {
      if (u.type === 'text') {
        const t = textNodeOutput(u);
        if (t) textNodePrompt = t;  // collected separately so the user's typed prompt can win
      }
      if (u.type === 'upload') {
        const ref = u.uploadPath || u.uploadUrl;
        if (!ref) continue;
        if (u.uploadKind === 'image') imageRefs.push(ref);
        else if (u.uploadKind === 'audio') audioRefs.push(ref);
        else if (u.uploadKind === 'video') videoRefs.push(ref);
      }
      if (u.type === 'image') {
        const picks = _picks(u.results, 'image');
        for (const r of picks) {
          const ref = r.servePath || r.localPath || r.url || null;
          if (ref) imageRefs.push(ref);
        }
        if (!picks.length && (u.uploadPath || u.uploadUrl)) {
          imageRefs.push(u.uploadPath || u.uploadUrl);
        }
        if (u.prompt) imagePrompts.push(u.prompt);
      }
      if (u.type === 'audio') {
        const picks = _picks(u.results);  // any kind that walks audio path
        for (const r of picks) {
          const ref = r.servePath || r.localPath || r.url || null;
          if (ref) audioRefs.push(ref);
        }
        if (!picks.length && (u.uploadPath || u.uploadUrl)) audioRefs.push(u.uploadPath || u.uploadUrl);
      }
      if (u.type === 'video') {
        const picks = _picks(u.results, 'video');
        for (const r of picks) {
          const ref = r.servePath || r.localPath || r.url || null;
          if (ref) videoRefs.push(ref);
        }
      }
    }
    // Node's own upload (legacy — from before Upload node existed). Image only;
    // a node-level audio/video upload doesn't apply to T2V/I2V/MM2V.
    if (node.uploadPath) imageRefs.push(node.uploadPath);
    else if (node.uploadUrl) imageRefs.push(node.uploadUrl);

    // Project-input files referenced by {{name}} in the user's prompt are
    // routed to the matching per-kind list so the file flows into the
    // dreamina CLI's --image / --audio / --video flag, even though the
    // {{name}} token in the prompt itself was already substituted to the
    // file's URL by resolveRuntimeVars above.
    const referenced = new Set();
    const _matches = (node.prompt || '').matchAll(/\{\{\s*([\p{L}\p{N}_]+)\s*\}\}/gu);
    for (const m of _matches) referenced.add(m[1]);
    const matchedInputKeys = new Set();
    if (referenced.size) {
      for (const inp of projectInputs) {
        const k = _inputVarKey(inp);
        if (!referenced.has(k)) continue;
        matchedInputKeys.add(k);
        const ref = inp.url || inp.path;
        if (!ref) {
          console.log(`[collectInputs] {{${k}}} matched a project input but it has no file attached yet — upload one in the Input tab.`);
          continue;
        }
        // Resolve kind defensively: trust the stored value when it
        // matches a known media bucket, otherwise re-guess from the
        // filename. Catches the case where the entry was saved with
        // kind='file' for an actual image (legacy data, manual edit)
        // and routing would otherwise silently skip it.
        let kind = inp.kind;
        if (kind !== 'image' && kind !== 'audio' && kind !== 'video') {
          const guessed = _guessKindFromName(inp.name || inp.url || '');
          if (guessed && guessed !== 'file') kind = guessed;
        }
        if      (kind === 'image') imageRefs.push(ref);
        else if (kind === 'audio') audioRefs.push(ref);
        else if (kind === 'video') videoRefs.push(ref);
        else console.log(`[collectInputs] project input {{${k}}} referenced but kind="${inp.kind}" (resolved="${kind}") — not routed to image/audio/video. name=${JSON.stringify(inp.name)} url=${JSON.stringify(inp.url)}`);
        // text / subtitle / file: substitution alone is enough — the URL
        // is already in the prompt where the user put the {{token}}.
      }
      // Log any {{token}} the user typed that didn't match a project
      // input AND isn't a text variable / upstream-text alias. Usually
      // means a typo in the key — without this log a misspelled
      // {{product_iamge}} fails silently because the literal token just
      // stays in the prompt text and never routes the file.
      const knownVarKeys = new Set(projectVars.map(v => v.key).filter(Boolean));
      const upstreamTextKeys = new Set();
      for (const u of up) {
        if (u.type !== 'text') continue;
        const tk = _sanitizeVarKey(u.title);
        if (tk) upstreamTextKeys.add(tk);
      }
      for (const r of referenced) {
        if (r === 'text' || r === 'prev') continue;
        if (matchedInputKeys.has(r)) continue;
        if (knownVarKeys.has(r)) continue;
        if (upstreamTextKeys.has(r)) continue;
        const imageKeys = projectInputs.filter(i => i.kind === 'image').map(i => _inputVarKey(i)).filter(Boolean);
        console.log(`[collectInputs] {{${r}}} in the prompt doesn't match any project input / variable / upstream-text alias. Available image inputs: [${imageKeys.join(', ') || '(none)'}]. Check for typos in the key.`);
      }
    }

    // User's typed prompt wins; the upstream Text node only fills the gap.
    const prompt = userPrompt || textNodePrompt;

    // Resolved-prompt sweep: scan the FINAL prompt text for any project-
    // input URL / path / filename / UUID that got substituted in (e.g.,
    // {{product_image}} resolved inside an upstream Text node's output,
    // then carried into the Video node via {{text}}). The {{key}} scan
    // above only sees the raw node.prompt template, so without this
    // step a URL that arrived indirectly through scene text would land
    // in the prompt as inert characters but never reach the API's
    // image / audio / video flags. Real failure: scene contained
    // "产品参考图片：/uploads/<hash>_logo.jpg" but Jimeng never
    // received the file.
    //
    // Match strategies, most-to-least specific. UUID alone is the
    // fallback because uploads carry a "/uploads/<uuid>_<filename>"
    // shape — the UUID prefix is unique, survives the LLM rephrasing
    // the URL (encoded spaces, dropped /uploads/ prefix, quoted, etc.),
    // and is the most robust matcher available.
    const _ATTACHED_VIA = 'attached-via-prompt-sweep';
    for (const inp of projectInputs) {
      const url = inp.url || '';
      const path = inp.path || '';
      const candidate = url || path;
      if (!candidate) continue;
      if (imageRefs.includes(candidate) || audioRefs.includes(candidate) || videoRefs.includes(candidate)) continue;
      // Extract the upload's UUID, original filename, and unprefixed
      // filename — any one of those showing up in the prompt is
      // sufficient evidence the user wants the file.
      const uuidMatch = candidate.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
      const uuidPart = uuidMatch ? uuidMatch[1] : null;
      const fileName = String(inp.name || '').trim();
      const lastSegment = candidate.split('/').filter(Boolean).pop() || '';
      let mentioned = false;
      let why = '';
      if (prompt.includes(candidate)) { mentioned = true; why = 'exact url/path'; }
      else if (url && prompt.includes(url)) { mentioned = true; why = 'url'; }
      else if (path && prompt.includes(path)) { mentioned = true; why = 'path'; }
      else if (uuidPart && prompt.includes(uuidPart)) { mentioned = true; why = `uuid ${uuidPart.slice(0, 8)}…`; }
      else if (lastSegment && prompt.includes(lastSegment)) { mentioned = true; why = 'filename segment'; }
      else if (fileName && fileName.length >= 4 && prompt.includes(fileName)) { mentioned = true; why = 'original filename'; }
      if (!mentioned) continue;
      let kind = inp.kind;
      if (kind !== 'image' && kind !== 'audio' && kind !== 'video') {
        const guessed = _guessKindFromName(inp.name || inp.url || '');
        if (guessed && guessed !== 'file') kind = guessed;
      }
      if      (kind === 'image') imageRefs.push(candidate);
      else if (kind === 'audio') audioRefs.push(candidate);
      else if (kind === 'video') videoRefs.push(candidate);
      else continue;
      console.log(`[collectInputs] picked up project input ${_inputVarKey(inp)} (${kind}) from the resolved prompt via ${why} match — routed to the API's image/audio/video flag`);
    }

    // Loud diagnostic when project inputs EXIST but none got attached
    // via either path (raw {{key}} scan or resolved-prompt sweep). The
    // user has uploaded files and is running a Video node that needs
    // an image — if neither routing path fired, log enough state for
    // a one-line answer to "why didn't my image attach?" without me
    // needing to ask for more details.
    if (projectInputs.length && !imageRefs.length && (node.type === 'video' || node.type === 'image')) {
      const summary = projectInputs.map(i => ({
        key: _inputVarKey(i), kind: i.kind, hasUrl: !!(i.url || i.path), urlHead: (i.url || i.path || '').slice(0, 60),
      }));
      console.log(`[collectInputs] no image attached but ${projectInputs.length} project input(s) exist:`, summary);
      console.log(`[collectInputs] resolved prompt head (first 300 chars): ${JSON.stringify(prompt.slice(0, 300))}`);
      console.log(`[collectInputs] raw node.prompt: ${JSON.stringify((node.prompt || '').slice(0, 200))}`);
    }

    // Always-on final summary — one line per Run iteration with the
    // counts of every ref bucket. If imageRefs is empty here and you
    // expected an image to attach, scroll up to find the [collectInputs]
    // enter line + the earlier diagnostics; one of them will tell you
    // why nothing matched.
    console.log(`[collectInputs] exit: imageRefs=${imageRefs.length} audioRefs=${audioRefs.length} videoRefs=${videoRefs.length} prompt-len=${prompt.length} prompt-head=${JSON.stringify(prompt.slice(0, 120))}`);

    return { prompt, imageRefs, imagePrompts, audioRefs, videoRefs };
  }

  // Walk upstream and pack everything into the multi-modal payload Doubao expects.
  function collectMultimodalInputs(node) {
    const up = upstreamNodes(node.id);
    const inputs = [];
    for (const u of up) {
      const label = u.title || NODE_SPECS[u.type]?.title || u.type;
      if (u.type === 'upload') {
        const ref = u.uploadPath || u.uploadUrl;
        if (!ref) continue;
        if (u.uploadKind === 'image') inputs.push({ type: 'image', url: ref, label });
        else if (u.uploadKind === 'video') inputs.push({ type: 'video', url: ref, label });
        else if (u.uploadKind === 'audio') inputs.push({ type: 'text', content: `[${label}] (audio: ${ref})` });
      } else if (u.type === 'text') {
        const t = textNodeOutput(u);  // already runs through resolveVars
        if (t) inputs.push({ type: 'text', content: `[${label}]\n${t}` });
        if (u.uploadText) inputs.push({ type: 'text', content: `[${label} · uploaded text]\n${resolveVars(u.uploadText)}` });
      } else if (u.type === 'image') {
        const last = u.results?.[u.results.length - 1];
        const ref = last?.servePath || last?.url || u.uploadUrl;
        if (ref) inputs.push({ type: 'image', url: ref, label });
        if (u.prompt) inputs.push({ type: 'text', content: `[${label} prompt]\n${resolveVars(u.prompt)}` });
      } else if (u.type === 'video') {
        const last = u.results?.[u.results.length - 1];
        const ref = last?.servePath || last?.url;
        if (ref) inputs.push({ type: 'video', url: ref, label });
        if (u.prompt) inputs.push({ type: 'text', content: `[${label} prompt]\n${resolveVars(u.prompt)}` });
      } else if (u.type === 'audio') {
        if (u.uploadUrl) inputs.push({ type: 'text', content: `[${label}] (audio reference: ${u.uploadUrl})` });
      }
    }
    return inputs;
  }

  // Upload nodes are passive sources — they hold a file rather than generating one.
  const PASSIVE_TYPES = new Set(['upload']);

  // Per-scene duration hint extractor. Looks for explicit time markers
  // inside the scene's header line (most reliable) or an explicit
  // "Duration:" / "时长:" key anywhere in the block. Conservative on
  // purpose — random "5 seconds later" narration shouldn't be parsed
  // as a clip length. Returns null when no marker is found so the
  // caller falls back to node.params.duration.
  function extractSceneDuration(sceneText) {
    if (!sceneText || typeof sceneText !== 'string') return null;
    const headerLine = sceneText.split(/\r?\n/, 1)[0] || '';
    // 1. Parens / brackets: "Scene 1 (5s):" / "Scene 1 [5s]:" / "镜头一(5秒):"
    let m = headerLine.match(/[\(\[【（]\s*(\d+(?:\.\d+)?)\s*(?:s|秒|sec|seconds?)\s*[\)\]】）]/i);
    if (m) return _clampDuration(parseFloat(m[1]));
    // 2. Dash / dot / middle-dot delimiter near the header: " — 5s" / " · 5 秒"
    //    No \b after the unit — JS \b is ASCII-only and won't fire next to 秒.
    m = headerLine.match(/[\-·—~～]\s*(\d+(?:\.\d+)?)\s*(?:seconds?|sec|s|秒)/i);
    if (m) return _clampDuration(parseFloat(m[1]));
    // 3. Explicit "Duration:" / "时长:" / "长度:" / "Length:" key anywhere
    //    inside the scene body.
    m = sceneText.match(/(?:Duration|Length|时长|长度|Time)\s*[:：]\s*(\d+(?:\.\d+)?)\s*(?:seconds?|sec|s|秒)?/i);
    if (m) return _clampDuration(parseFloat(m[1]));
    return null;
  }

  function _clampDuration(n) {
    if (!Number.isFinite(n)) return null;
    const i = Math.round(n);
    return Math.max(4, Math.min(15, i));
  }

  async function startTask(node, overrides, paramOverrides, iterationIndex) {
    const { prompt, imageRefs, imagePrompts, audioRefs, videoRefs } = collectInputs(node, overrides, iterationIndex);
    // Merge per-call param overrides (per-scene duration from runNode's
    // scene-driven loop) on top of the saved node params. Anything not
    // explicitly overridden falls back to node.params.
    const params = { ...node.params, ...(paramOverrides || {}) };
    // Pick the iteration-matched ref when looping. _picks() in
    // collectInputs already gave us the full list in that case, so a
    // straight `refs[i % refs.length]` is enough. Outside the loop the
    // list is "last only" and refs[0] preserves the legacy behaviour.
    const inLoop = typeof iterationIndex === 'number' && iterationIndex >= 0;
    const _pickRef = (refs) => {
      if (!refs || !refs.length) return null;
      return inLoop ? refs[iterationIndex % refs.length] : refs[0];
    };
    // Pin to the project-input image whose URL appears in the resolved
    // prompt, if any — overrides the modulo-indexed pick from imageRefs.
    // Rationale: when imageRefs has multiple candidates (upstream Image
    // node results + a project-input "constant" image referenced from
    // the scene text via Text-node substitution), the modulo pick
    // shuffles between them by iteration, so a user-supplied product
    // image at position N gets cycled in instead of being used for
    // every clip. The resolved prompt is the source of truth: whichever
    // image URL the user got the LLM to embed in the scene is the one
    // they want as the reference for THAT clip. Per-clip variation
    // still works — if the user has multiple project images mentioned
    // in different scenes, each iteration's resolved prompt mentions a
    // different URL.
    const _imageRefFromPrompt = (() => {
      const p = prompt || '';
      if (!p) return null;
      for (const inp of projectInputs) {
        if (inp.kind !== 'image') continue;
        const url = inp.url || '';
        const path = inp.path || '';
        if (!url && !path) continue;
        if (url && p.includes(url)) return url || path;
        if (path && p.includes(path)) return url || path;
        const m = (url || path).match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
        if (m && p.includes(m[0])) return url || path;
        const lastSeg = (url || path).split('/').filter(Boolean).pop() || '';
        if (lastSeg && p.includes(lastSeg)) return url || path;
      }
      return null;
    })();
    const _moduloImageRef = _pickRef(imageRefs);
    const imageRef = _imageRefFromPrompt || _moduloImageRef;
    if (_imageRefFromPrompt && _moduloImageRef && _imageRefFromPrompt !== _moduloImageRef) {
      console.log(`[startTask] pinning imageRef to ${_imageRefFromPrompt} (referenced in resolved prompt) instead of the modulo-picked ${_moduloImageRef}`);
    }
    const audioRef = _pickRef(audioRefs);
    const videoRef = _pickRef(videoRefs);
    let endpoint, body;

    if (node.type === 'text') {
      // Doubao multi-modal text generation. Synchronous — handled separately below.
      const inputs = collectMultimodalInputs(node);
      if (node.uploadText) inputs.push({ type: 'text', content: `[Uploaded text]\n${node.uploadText}` });
      if (!node.prompt && !inputs.length) {
        throw new Error('Add an instruction or connect upstream inputs to generate text');
      }
      const resp = await fetch('/api/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ prompt: resolveRuntimeVars(node.prompt || '', node, overrides, iterationIndex), inputs }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        throw new Error(data.error || `Doubao request failed (HTTP ${resp.status})`);
      }
      return { sync: true, text: data.text };
    }

    if (node.type === 'audio') {
      const audioPrompt = prompt || '';
      if (!audioPrompt) throw new Error('prompt required — describe the music or audio you want');
      endpoint = '/api/text2audio';
      body = { prompt: audioPrompt };
    } else if (node.type === 'image') {
      if (imageRef) {
        if (!prompt) throw new Error('prompt required for image transform');
        endpoint = '/api/image2image';
        body = { image: imageRef, prompt, ratio: params.ratio };
      } else {
        if (!prompt) throw new Error('prompt required (connect a Text node or type one)');
        endpoint = '/api/text2image';
        body = { prompt, ratio: params.ratio, resolution: params.resolution };
      }
    } else if (node.type === 'video') {
      const mode = videoMode(node);
      // Project-input image keys, useful for the error messages below so
      // the user sees exactly what to type instead of a generic "needs
      // an image reference".
      const projectImageKeys = projectInputs
        .filter(inp => inp.kind === 'image' && (inp.url || inp.path))
        .map(inp => _inputVarKey(inp))
        .filter(Boolean);
      const referenceHint = projectImageKeys.length
        ? ` Reference an Input-tab image in your prompt as ${projectImageKeys.map(k => `{{${k}}}`).join(' / ')}, or connect an Image / Upload node upstream.`
        : ` Upload an image to the Input tab and reference it as {{key}}, or connect an Image / Upload node upstream.`;
      // T2V endpoint has no image parameter. If the user wired an image
      // in (upstream Image / Upload, the node's own uploadUrl, or a
      // project-input file referenced via {{key}}) but left the mode
      // chip on T2V, silently dropping the image would mislead them —
      // they assume it's being used. Refuse the run and tell them which
      // mode to pick. The "auto-upgrade" alternative was rejected by
      // the user precisely because it removes their explicit choice.
      if (mode === 'T2V' && imageRef) {
        throw new Error('An image is wired in but the mode is T2V (text-only). Switch to R2V to use the image as a style / subject reference, or I2V to animate that exact image.');
      }
      if (mode === 'R2V') {
        if (!imageRef) throw new Error('R2V (reference) mode requires an image reference.' + referenceHint);
        const mmPrompt = prompt || imagePrompts.join(', ');
        if (!mmPrompt) throw new Error('R2V (reference) mode requires a prompt');
        endpoint = '/api/multimodal2video';
        body = {
          image: imageRef,
          prompt: mmPrompt,
          duration: params.duration,
          ratio: params.ratio,
          model_version: params.modelVersion,
          audio_path: audioRef,
          video_path: videoRef,  // optional camera-motion reference
        };
      } else if (mode === 'I2V') {
        if (!imageRef) throw new Error('I2V mode requires an image reference.' + referenceHint);
        // Animate the upstream/uploaded image. Prompt becomes the motion description.
        endpoint = '/api/image2video';
        body = {
          image: imageRef,
          prompt: prompt || imagePrompts.join(', '),
          duration: params.duration,
          ratio: params.ratio,
          model_version: params.modelVersion,
          audio_path: audioRef,
        };
      } else {
        // T2V mode — text only.
        const videoPrompt = prompt || imagePrompts.join(', ');
        if (!videoPrompt) throw new Error('prompt required (connect a Text or Image node, or type one)');
        endpoint = '/api/text2video';
        body = { prompt: videoPrompt, duration: params.duration, ratio: params.ratio, resolution: params.resolution, model_version: params.modelVersion, audio_path: audioRef };
      }
    } else if (node.type === 'edit') {
      const up = upstreamNodes(node.id);
      const clips = [];
      let audioPath = null;
      let subtitlePath = null;   // .srt / .vtt / .ass upload → burned-in subtitles
      let watermarkPath = null;  // image upload or Image node → watermark overlay
      for (const u of up) {
        if (u.type === 'upload') {
          const path = u.uploadPath || u.uploadUrl || null;
          if (!path) continue;
          if (u.uploadKind === 'video') {
            clips.push({ path, label: u.title || 'Upload' });
          } else if (u.uploadKind === 'audio') {
            if (!audioPath) audioPath = path;
          } else if (u.uploadKind === 'image') {
            if (!watermarkPath) watermarkPath = path;
          } else {
            const lower = String(path).toLowerCase();
            if (!subtitlePath && (lower.endsWith('.srt') || lower.endsWith('.vtt') || lower.endsWith('.ass'))) {
              subtitlePath = path;
            }
          }
        } else if (u.type === 'video') {
          // Edit nodes stitch a sequence — pull every clip from the
          // upstream Video node's MOST RECENT Run press (not every clip
          // ever generated). Accumulated history stays visible in the
          // Output tab but won't bloat the edit timeline. Each clip is
          // labelled "<title> · run N" so the AI plan / files panel can
          // tell them apart.
          const results = latestRunResults(u).filter(r => r && r.kind === 'video');
          const total = results.length;
          if (total) {
            results.forEach((r, idx) => {
              const path = r.servePath || r.localPath || r.url || null;
              if (!path) return;
              const label = total > 1 ? `${u.title || 'Video'} · run ${idx + 1}` : (u.title || 'Video');
              clips.push({ path, label });
            });
          } else if (u.uploadPath || u.uploadUrl) {
            clips.push({ path: u.uploadPath || u.uploadUrl, label: u.title || 'Video' });
          }
        } else if (u.type === 'audio') {
          const last = u.results?.[u.results.length - 1];
          const path = last?.servePath || last?.localPath || u.uploadPath || last?.url || u.uploadUrl || null;
          if (path && !audioPath) audioPath = path;
        } else if (u.type === 'image') {
          const last = u.results?.[u.results.length - 1];
          const path = last?.servePath || last?.localPath || u.uploadPath || last?.url || u.uploadUrl || null;
          if (path && !watermarkPath) watermarkPath = path;
        }
      }
      if (!clips.length) throw new Error('Connect at least one Video or Upload (video) node');
      // PIP source defaults to a clip the LLM picks via clip_index — only set
      // pip_path explicitly if the user has more videos than they want as clips.
      endpoint = '/api/video_edit';
      body = {
        clips,
        audio_path: audioPath,
        subtitle_path: subtitlePath,
        watermark_path: watermarkPath,
        instructions: resolveRuntimeVars(node.prompt || '', node),
      };
    } else {
      throw new Error('Unsupported node type: ' + node.type);
    }

    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.ok) throw new Error(data.error || `Request failed (HTTP ${resp.status})`);
    return data.task_id;
  }

  function extractOutputUrl(task) {
    const r = task?.result;
    if (!r || typeof r !== 'object') return null;
    if (r.url) return r.url;
    if (r.data?.url) return r.data.url;
    if (r.video_url) return r.video_url;
    if (r.image_url) return r.image_url;
    if (r.data?.video_url) return r.data.video_url;
    if (r.data?.image_url) return r.data.image_url;
    if (r.local_path) return r.local_path;
    if (r.data?.local_path) return r.data.local_path;
    if (Array.isArray(r.urls) && r.urls[0]) return r.urls[0];
    if (Array.isArray(r.data) && r.data[0]?.url) return r.data[0].url;
    if (r.item_list && Array.isArray(r.item_list) && r.item_list[0]) {
      const it = r.item_list[0];
      return it.video?.url || it.image?.url || it.url || null;
    }
    if (r.data?.item_list && Array.isArray(r.data.item_list) && r.data.item_list[0]) {
      const it = r.data.item_list[0];
      return it.video?.url || it.image?.url || it.url || null;
    }
    if (r.result_json?.videos?.[0]?.video_url) return r.result_json.videos[0].video_url;
    if (r.result_json?.videos?.[0]?.url) return r.result_json.videos[0].url;
    if (r.result_json?.images?.[0]?.image_url) return r.result_json.images[0].image_url;
    if (r.result_json?.images?.[0]?.url) return r.result_json.images[0].url;
    if (r.data?.result_json?.videos?.[0]?.video_url) return r.data.result_json.videos[0].video_url;
    if (r.data?.result_json?.videos?.[0]?.url) return r.data.result_json.videos[0].url;
    if (r.data?.result_json?.images?.[0]?.image_url) return r.data.result_json.images[0].image_url;
    if (r.data?.result_json?.images?.[0]?.url) return r.data.result_json.images[0].url;
    return null;
  }

  async function pollUntilDone(taskId, nodeId) {
    let networkErrors = 0;
    while (true) {
      await new Promise(r => setTimeout(r, 3000));
      let resp, t;
      try {
        resp = await fetch('/api/task/' + taskId);
        t = await resp.json();
      } catch (e) {
        // Transient network error (server restart, brief hiccup) — retry up to 5 times
        networkErrors++;
        if (networkErrors >= 5) throw new Error('Server unreachable after several retries');
        await new Promise(r => setTimeout(r, 2000 * networkErrors));
        continue;
      }
      networkErrors = 0;
      if (!resp.ok) throw new Error('Task lookup failed');
      if (t.status === 'done')  return t;
      if (t.status === 'error') throw new Error(t.error || 'Task errored');
      const n = nodes.get(nodeId);
      if (n && t.queue_idx != null) {
        n.queueIdx = t.queue_idx;
        const el = document.getElementById(nodeId);
        const badge = el?.querySelector('.node-id');
        if (badge) badge.textContent = `queued #${t.queue_idx}`;
      }
    }
  }

  // Translate a finished /api/task/<id> payload into a node-result entry and
  // commit it to the node. Shared between the live runNode flow and the
  // refresh-resume path (resumeTask) so both code paths produce the exact
  // same `node.results` shape.
  // Translate a finished /api/task/<id> payload into a node-result entry.
  // Returns the new results array — does NOT mutate node.results or set
  // status. Used by runNode's loop (which needs to append per-iteration
  // without flipping status='done' until the last one) and by resumeTask
  // (via the applyTaskResult wrapper below) which DOES want 'done'.
  function appendTaskResult(node, task, runId) {
    const url = extractOutputUrl(task);
    const kind = (node.type === 'video' || node.type === 'edit') ? 'video'
               : node.type === 'audio' ? 'audio' : 'image';
    const localPath = task?.result?.data?.local_path || task?.result?.local_path || null;
    const servePath = task?.result?.data?.serve_path || task?.result?.serve_path || null;
    const editPlan  = node.type === 'edit' ? (task?.result?.edit_plan || null) : null;
    const newResults = [...(node.results || [])];
    if (url || localPath || servePath) {
      const entry = { url, kind, localPath, servePath, editPlan, ts: Date.now() };
      // runId groups all clips from one Run press together so downstream
      // consumers (Edit node, filmstrip preview) can isolate "the latest
      // run" from accumulated history.
      if (runId) entry.runId = runId;
      newResults.push(entry);
    }
    return newResults;
  }

  // Used by resumeTask (which doesn't know the original runId — pick the
  // most recent one already attached to the node's results so the resumed
  // task lands in the right group rather than starting a fresh phantom
  // run-batch).
  function _latestKnownRunId(node) {
    const results = node.results || [];
    for (let i = results.length - 1; i >= 0; i--) {
      if (results[i]?.runId) return results[i].runId;
    }
    return null;
  }

  function applyTaskResult(node, task) {
    const newResults = appendTaskResult(node, task, _latestKnownRunId(node));
    setNodeStatus(node.id, 'done', { results: newResults, error: null, queueIdx: null, taskId: null, loopProgress: null });
  }

  // Return only the results from the most recent Run press. Used by the
  // Edit node's upstream-clip collector and by the Video-node card's
  // filmstrip — both want "what the user just generated", not the whole
  // historical pile. Legacy results without runId (from before this
  // change shipped) are returned wholesale when NO entry has a runId,
  // so old workflows don't suddenly show "no clips".
  function latestRunResults(node) {
    const results = node.results || [];
    if (!results.length) return [];
    let maxRunId = null;
    for (const r of results) {
      if (r?.runId && (maxRunId === null || String(r.runId) > String(maxRunId))) {
        maxRunId = r.runId;
      }
    }
    if (maxRunId === null) return results.slice();
    return results.filter(r => r?.runId === maxRunId);
  }

  // Re-attach polling to a task that was in flight when the page closed.
  // Snapshots /api/task/<id> first so an already-finished task short-circuits
  // the 3s polling delay.
  async function resumeTask(nodeId) {
    const node = nodes.get(nodeId);
    if (!node) return;
    const taskId = node.taskId;
    if (!taskId) return;
    try {
      let task = null;
      try {
        const r = await fetch('/api/task/' + taskId);
        if (r.status === 404) throw new Error('Task no longer tracked by server');
        if (r.ok) task = await r.json();
      } catch (e) {
        // Network error here is non-fatal — pollUntilDone will retry. But a
        // 404 is terminal: the server has forgotten this task, so surface it.
        if (e.message?.includes('no longer tracked')) throw e;
      }

      if (task?.status === 'done') {
        applyTaskResult(node, task);
        toast(`${node.type} done`, 'success');
        return;
      }
      if (task?.status === 'error') {
        throw new Error(task.error || 'Task errored');
      }

      // Still queued / running on the server — re-attach the polling loop.
      setNodeStatus(nodeId, task?.status === 'running' ? 'running' : 'queued', { taskId, error: null });
      const finalTask = await pollUntilDone(taskId, nodeId);
      applyTaskResult(node, finalTask);
      toast(`${node.type} done`, 'success');
    } catch (err) {
      setNodeStatus(nodeId, 'error', { error: err.message, queueIdx: null, taskId: null });
      toast(`${node.type}: ${err.message}`, 'error');
    }
  }

  // After loadWorkflow restores nodes, fan out a resumeTask for every node
  // that was in flight when the tab closed — the queue panel re-populates
  // and polling continues as if the refresh never happened.
  function resumeInFlightTasks() {
    for (const node of nodes.values()) {
      if (!node.taskId) continue;
      if (node.status !== 'running' && node.status !== 'queued') continue;
      resumeTask(node.id);
    }
  }

  // Walk upstream from `id` and return every transitive ancestor that:
  //   - is non-passive (so Upload sources don't get treated as runnable)
  //   - has no result yet (already-run nodes are not re-run)
  // The returned list is unordered; runGraph topo-sorts internally.
  function _collectUnrunAncestors(id) {
    const need = [];
    const seen = new Set([id]);
    const queue = [id];
    while (queue.length) {
      const cur = queue.shift();
      for (const e of edges) {
        if (e.toId !== cur || seen.has(e.fromId)) continue;
        seen.add(e.fromId);
        queue.push(e.fromId);
        const up = nodes.get(e.fromId);
        if (!up || PASSIVE_TYPES.has(up.type)) continue;
        const hasResult = Array.isArray(up.results) && up.results.length > 0;
        if (!hasResult) need.push(e.fromId);
      }
    }
    return need;
  }

  async function runNode(id) {
    const node = nodes.get(id);
    if (!node) return;
    if (node.type === 'upload') {
      // Upload nodes don't generate — use the upload button (↑) in the node header
      toast('Use the upload button on the node to choose a file', '');
      return;
    }
    if (PASSIVE_TYPES.has(node.type)) {
      toast('This node type provides data — no generation needed', '');
      return;
    }
    if (node.status === 'running' || node.status === 'queued') {
      // The node thinks it's still running. If it actually has a taskId,
      // re-attach: the server now does on-demand recovery in /api/task/<id>
      // when the cached state looks stale, so resumeTask will pick up a
      // completed-but-not-noticed result instead of leaving the user
      // staring at a forever-spinning preview.
      if (node.taskId) { resumeTask(id); }
      else { toast('Already running', ''); }
      return;
    }

    // Cascade: any non-passive upstream that doesn't have a result yet must
    // run first — otherwise an Image node fed by an unrun Text node would
    // see an empty (or instruction-only) prompt instead of the script the
    // user expects. Walks transitively, skips already-run ancestors, and
    // delegates to runGraph for proper topo ordering + status tracking.
    const ancestorsToRun = _collectUnrunAncestors(id);
    if (ancestorsToRun.length) {
      return runGraph([...ancestorsToRun, id]);
    }

    // Per-node loop count. node.params.count is "how many clips/results
    // to produce per Run press". Clamped [1, 20] — script-driven loops
    // can plausibly want 10–15, but we still cap to keep an accidental
    // paste of "999" from queuing a runaway batch.
    const userCount = Math.max(1, Math.min(20, parseInt(node.params?.count, 10) || 1));

    // Scene-driven loop: if the upstream Text node's output looks like
    // a multi-scene script, split it and use one scene per iteration —
    // each clip gets its own piece of script as {{text}} / {{prev}}.
    // When no scene markers are detected we fall back to the variant
    // semantics (same prompt N times).
    //
    // Detection runs UNCONDITIONALLY — even when Count is the default 1.
    // That way connecting a multi-scene Text node "just works": the user
    // doesn't need to remember to also bump Count to enable the loop.
    // Count's role in scene mode is purely as a cap: 1 means "use every
    // scene", anything higher truncates to that many.
    let scenes = null;
    let upstreamTextSeen = false;
    let lastUpstreamText = '';
    const ups = upstreamNodes(node.id);
    for (const u of ups) {
      if (u.type !== 'text') continue;
      const t = textNodeOutput(u);
      if (!t) continue;
      upstreamTextSeen = true;
      lastUpstreamText = t;
      const parts = splitIntoScenes(t);
      if (parts.length >= 2) { scenes = parts; break; }
    }
    const sceneDriven = !!scenes;
    // In scene mode:
    //   count = 1 (default) → process EVERY detected scene (no truncation)
    //   count > 1           → cap at the lower of count and scenes.length,
    //                         so users can truncate to a preview length
    // In variant mode (no scene markers), count is just "how many variants".
    let total;
    if (sceneDriven) {
      total = userCount > 1 ? Math.min(userCount, scenes.length) : scenes.length;
    } else {
      total = userCount;
    }
    if (sceneDriven) {
      console.log(`[runNode] ${node.title || node.id}: scene-driven loop, ${total} of ${scenes.length} scenes (count=${userCount})`);
    } else if (upstreamTextSeen) {
      // Loud diagnostic so the user can see WHY only one task fired when
      // they expected a per-scene loop. Most common cause: the model's
      // actual output doesn't follow any of the patterns splitIntoScenes
      // recognises. Print the head of the upstream text to make that
      // obvious in DevTools without needing to copy it out manually.
      console.log(`[runNode] ${node.title || node.id}: upstream Text node had output but no scene markers were detected — falling back to single run. Total runs = ${total}.`);
      console.log(`[runNode] upstream text preview (first 400 chars): ${JSON.stringify(lastUpstreamText.slice(0, 400))}`);
      console.log(`[runNode] tip: splitIntoScenes wants headers like "Scene 1:" / "Scene 1\\n" / "镜头一:" / "## Scene 1" / "1. ..." — adjust the Text-node prompt to ask for one of these, or paste the upstream output here so I can extend the pattern table.`);
    }

    // One Run press = one runId. Every clip this loop produces shares it,
    // so the Edit node and the Video-node filmstrip can isolate "this
    // batch" from older accumulated results. Use Date.now() + a short
    // random suffix so concurrent runs (different nodes, same tick)
    // don't collide.
    const runId = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

    try {
      for (let iter = 1; iter <= total; iter++) {
        const loop = total > 1 ? { current: iter, total, mode: sceneDriven ? 'scene' : 'variant' } : null;
        // Per-iteration overrides: in scene mode, {{text}}/{{prev}}
        // become THIS scene's text; the user's typed prompt template
        // gets re-resolved each pass so a prompt like
        //   "Cinematic shot of: {{text}}"
        // turns into a different real prompt for each clip.
        const sceneText = sceneDriven ? scenes[iter - 1] : null;
        const overrides = sceneText ? { text: sceneText, prev: sceneText } : null;
        // Per-scene duration override: if the scene header carries a
        // "(5s)" / " — 8 秒" / "Duration: 10" marker, the parser picks
        // it up and that clip alone renders at that length. Falls back
        // to node.params.duration when the scene doesn't specify one,
        // so a mixed-format script (some scenes with timings, some
        // without) still works.
        let paramOverrides = null;
        if (sceneText && node.type === 'video') {
          const d = extractSceneDuration(sceneText);
          if (d != null) paramOverrides = { duration: String(d) };
        }
        // Only set iterationIndex when actually looping (total > 1).
        // For a single-shot run, leaving it undefined keeps the legacy
        // "use the last upstream result" behaviour untouched.
        const iterationIndex = total > 1 ? (iter - 1) : null;
        setNodeStatus(id, 'queued', { error: null, queueIdx: null, loopProgress: loop });
        const submitResult = await startTask(node, overrides, paramOverrides, iterationIndex);

        // Text node: the response is synchronous, no polling.
        if (submitResult && submitResult.sync) {
          const newResults = [...(node.results || [])];
          newResults.push({ kind: 'text', text: submitResult.text, ts: Date.now(), runId });
          if (iter < total) {
            setNodeStatus(id, 'running', { results: newResults, error: null, loopProgress: loop });
          } else {
            setNodeStatus(id, 'done', { results: newResults, error: null, queueIdx: null, loopProgress: null });
          }
          continue;
        }

        const taskId = submitResult;
        node.taskId = taskId;
        setNodeStatus(id, 'running', { taskId, loopProgress: loop });
        const task = await pollUntilDone(taskId, id);
        const newResults = appendTaskResult(node, task, runId);
        if (iter < total) {
          setNodeStatus(id, 'running', { results: newResults, taskId: null, queueIdx: null, loopProgress: loop });
        } else {
          setNodeStatus(id, 'done', { results: newResults, error: null, queueIdx: null, taskId: null, loopProgress: null });
        }
      }
      const summary = sceneDriven ? ` (${total} scenes)` : (total > 1 ? ` (×${total})` : '');
      toast(`${node.type} done${summary}`, 'success');
    } catch (err) {
      setNodeStatus(id, 'error', { error: err.message, queueIdx: null, taskId: null, loopProgress: null });
      toast(`${node.type}: ${err.message}`, 'error');
    }
  }

  function topoSort(ids) {
    const set = new Set(ids);
    const inDeg = new Map();
    for (const id of ids) inDeg.set(id, 0);
    for (const e of edges) {
      if (set.has(e.fromId) && set.has(e.toId)) {
        inDeg.set(e.toId, (inDeg.get(e.toId) || 0) + 1);
      }
    }
    const queue = [...ids].filter(id => inDeg.get(id) === 0);
    const out = [];
    while (queue.length) {
      const id = queue.shift();
      out.push(id);
      for (const e of edges) {
        if (e.fromId === id && set.has(e.toId)) {
          inDeg.set(e.toId, inDeg.get(e.toId) - 1);
          if (inDeg.get(e.toId) === 0) queue.push(e.toId);
        }
      }
    }
    return out.length === ids.length ? out : null;
  }

  async function runGraph(ids) {
    const order = topoSort(ids);
    if (!order) { toast('Cycle detected — cannot run', 'error'); return; }
    const runnableSet = new Set(order.filter(id => !PASSIVE_TYPES.has(nodes.get(id)?.type)));
    if (!runnableSet.size) { toast('Nothing runnable selected'); return; }
    toast(`Running ${runnableSet.size} node(s)…`);

    // For each runnable node, find which OTHER runnable nodes it depends on (direct upstream edges within selection)
    const upstreamDeps = new Map(); // id -> [upstream id, ...]
    for (const id of runnableSet) {
      upstreamDeps.set(id, edges.filter(e => e.toId === id && runnableSet.has(e.fromId)).map(e => e.fromId));
    }

    // One promise per runnable node; resolve when that node finishes (success or error)
    const promises = new Map();

    function launchNode(id) {
      if (promises.has(id)) return promises.get(id);
      const p = (async () => {
        // Wait for all upstream runnable deps first
        const ups = upstreamDeps.get(id);
        if (ups.length) await Promise.all(ups.map(uid => launchNode(uid)));
        // Skip if any direct upstream errored
        const upstreamFailed = ups.some(uid => nodes.get(uid)?.status === 'error');
        if (upstreamFailed) {
          setNodeStatus(id, 'error', { error: 'Skipped — upstream node failed' });
          return;
        }
        await runNode(id);
      })();
      promises.set(id, p);
      return p;
    }

    // Launch all — each one will self-suspend until its deps resolve
    await Promise.all([...runnableSet].map(id => launchNode(id)));
  }

  // ── Edge drawing ────────────────────────────────────────────────────────
  const NODE_WIDTH = 240;

  function handlePos(nodeId, dir) {
    const el = document.getElementById(nodeId);
    const n = nodes.get(nodeId);
    if (!el || !n) return { x: 0, y: 0 };
    const h = el.offsetHeight || 200;
    return {
      x: n.x + (dir === 'out' ? NODE_WIDTH : 0),
      y: n.y + h / 2,
    };
  }

  function edgePath(x1, y1, x2, y2) {
    const dx = Math.max(60, Math.abs(x2 - x1) * 0.5);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }

  function renderAllEdges() {
    edgesSvg.innerHTML = '';
    for (const edge of edges) renderEdge(edge);
  }

  function renderEdge(edge) {
    const existing = edgesSvg.querySelector(`[data-edge-id="${edge.id}"]`);
    const existingHit = edgesSvg.querySelector(`[data-edge-hit="${edge.id}"]`);
    if (existing) existing.remove();
    if (existingHit) existingHit.remove();

    const a = handlePos(edge.fromId, 'out');
    const b = handlePos(edge.toId,   'in');
    const d = edgePath(a.x, a.y, b.x, b.y);

    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'edge-hit');
    hit.setAttribute('data-edge-hit', edge.id);
    hit.addEventListener('click', (e) => { e.stopPropagation(); selectEdge(edge.id); });
    edgesSvg.appendChild(hit);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge' + (edge.selected ? ' selected' : ''));
    path.setAttribute('data-edge-id', edge.id);
    path.addEventListener('click', (e) => { e.stopPropagation(); selectEdge(edge.id); });
    edgesSvg.appendChild(path);
  }

  function updateEdgesFor(nodeId) {
    for (const edge of edges) {
      if (edge.fromId === nodeId || edge.toId === nodeId) renderEdge(edge);
    }
  }

  function selectEdge(id) {
    clearSelection();
    for (const e of edges) e.selected = (e.id === id);
    renderAllEdges();
    toast('Edge selected — press Delete to remove');
  }

  function deleteSelectedEdges() {
    const affected = new Set();
    let removed = 0;
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].selected) { affected.add(edges[i].toId); edges.splice(i, 1); removed++; }
    }
    if (removed) {
      renderAllEdges();
      for (const id of affected) { const n = nodes.get(id); if (n) renderNode(n); }
      toast(`${removed} edge(s) deleted`);
    }
    return removed;
  }

  function canConnect(fromId, toId) {
    if (fromId === toId) return false;
    if (!NODE_SPECS[nodes.get(fromId).type].hasOut) return false;
    if (!NODE_SPECS[nodes.get(toId).type].hasIn) return false;
    for (const e of edges) if (e.fromId === fromId && e.toId === toId) return false;
    return true;
  }

  function addEdge(fromId, toId) {
    if (!canConnect(fromId, toId)) { toast('Cannot connect these nodes', 'error'); return; }
    edges.push({ id: 'e' + Math.random().toString(36).slice(2, 8), fromId, toId, selected: false });
    renderAllEdges();
    const n = nodes.get(toId); if (n) renderNode(n);
    if (selected.has(toId)) renderInspector(toId);
    if (selected.has(fromId)) renderInspector(fromId);
  }

  // ── Handle drag (create edges) ──────────────────────────────────────────
  let edgeDrag = null;

  function cancelEdgeDrag() {
    document.querySelectorAll('.handle.connecting').forEach(h => h.classList.remove('connecting'));
    edgesSvg.querySelector('.edge-temp')?.remove();
    edgeDrag = null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.handle');
    if (!handle) return;
    if (handle.dataset.dir !== 'out') return;
    if (!canEdit()) {
      // View users can't draw new edges; let pan/select handle the gesture.
      return;
    }
    e.stopPropagation();
    e.preventDefault();

    const fromId = handle.dataset.node;
    edgeDrag = { fromId };
    handle.classList.add('connecting');

    function onMove(ev) {
      const a = handlePos(fromId, 'out');
      const w = screenToWorld(ev.clientX, ev.clientY);
      let tempPath = edgesSvg.querySelector('.edge-temp');
      if (!tempPath) {
        tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tempPath.setAttribute('class', 'edge-temp');
        edgesSvg.appendChild(tempPath);
      }
      tempPath.setAttribute('d', edgePath(a.x, a.y, w.x, w.y));
    }

    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup',   onUp);
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = el?.closest?.('.handle');
      if (target && target.dataset.dir === 'in' && target.dataset.node !== fromId) {
        addEdge(fromId, target.dataset.node);
      }
      cancelEdgeDrag();
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup',   onUp);
  });

  // Cancel edge drag on Escape
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && edgeDrag) cancelEdgeDrag();
  });

  // ── Selection ───────────────────────────────────────────────────────────
  function setSelected(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    if (value) { selected.add(id); el.classList.add('selected'); }
    else       { selected.delete(id); el.classList.remove('selected'); }
  }
  function clearSelection() {
    for (const id of [...selected]) setSelected(id, false);
    updateSelInfo();
  }
  function selectOnly(id) {
    clearSelection();
    setSelected(id, true);
    updateSelInfo();
  }
  function toggleSelect(id) {
    setSelected(id, !selected.has(id));
    updateSelInfo();
  }
  function selectInRect(x1, y1, x2, y2) {
    const [lo, hi] = [Math.min(x1,x2), Math.max(x1,x2)];
    const [to, bo] = [Math.min(y1,y2), Math.max(y1,y2)];
    clearSelection();
    for (const n of nodes.values()) {
      const nx2 = n.x + 240, ny2 = n.y + 260;
      if (n.x < hi && nx2 > lo && n.y < bo && ny2 > to) setSelected(n.id, true);
    }
    updateSelInfo();
  }

  function deleteNode(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    const downstream = new Set();
    let edgeRemoved = false;
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].fromId === id) { downstream.add(edges[i].toId); edges.splice(i, 1); edgeRemoved = true; }
      else if (edges[i].toId === id) { edges.splice(i, 1); edgeRemoved = true; }
    }
    nodes.delete(id);
    selected.delete(id);
    if (edgeRemoved) renderAllEdges();
    for (const did of downstream) { const n = nodes.get(did); if (n) renderNode(n); }
    updateSelInfo();
  }

  function deleteSelected() {
    if (!canEdit()) {
      toast('View only — ask the project owner for edit access', '');
      return;
    }
    const removedEdges = deleteSelectedEdges();
    if (selected.size === 0) {
      if (!removedEdges) return;
      return;
    }
    const n = selected.size;
    for (const id of [...selected]) deleteNode(id);
    toast(`${n} node(s) deleted`);
  }

  // ── Node interactions ────────────────────────────────────────────────────
  // Selection + drag-start are attached per-node inside renderNode(). Pointer
  // is captured to canvasWrap, so drag-move + drag-end live in the consolidated
  // canvasWrap pointermove / pointerup handlers below alongside pan + rubber-band.
  let dragState = null;

  // ── Tool mode ────────────────────────────────────────────────────────────
  let canvasTool = 'pan'; // 'pan' | 'select'

  function setTool(tool) {
    canvasTool = tool;
    canvasWrap.classList.toggle('mode-select', tool === 'select');
  }

  // ── Canvas panning + box-selection ──────────────────────────────────────
  let panState = null;
  let selBoxState = null;
  let selBoxEl = null;
  let selBoxMoved = false;

  window.addEventListener('keydown', (e) => {
    const active = document.activeElement.tagName;
    if (active === 'TEXTAREA' || active === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); } // prevent page scroll
    if (e.key === 'h' || e.key === 'H') setTool('pan');
    if (e.key === 'v' || e.key === 'V') setTool('select');
    if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
    if (e.key === 'Escape') clearSelection();
  });

  canvasWrap.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.node')) return;
    if (e.target.closest('svg')) return; // let edge-path clicks reach their handlers
    if (e.target.closest('.canvas-overlay')) return; // let overlay controls handle their own events
    if (e.button === 2) return;

    // Middle-click always pans regardless of mode
    const wantPan = canvasTool === 'pan' || e.button === 1;

    if (wantPan) {
      panState = { startX: e.clientX, startY: e.clientY, origX: view.x, origY: view.y, moved: false };
      canvasWrap.classList.add('panning');
      canvasWrap.setPointerCapture?.(e.pointerId);
      return;
    }

    // Select mode: drag to draw a selection box
    const start = screenToWorld(e.clientX, e.clientY);
    selBoxState = { sx: start.x, sy: start.y };
    selBoxMoved = false;
    selBoxEl = document.createElement('div');
    selBoxEl.className = 'sel-box';
    canvas.appendChild(selBoxEl);
    canvasWrap.setPointerCapture?.(e.pointerId);
  });

  canvasWrap.addEventListener('pointermove', (e) => {
    // Self-heal: if a button was released outside the viewport, pointerup may
    // have been missed. Reset all gesture state when no buttons are held.
    if (e.buttons === 0 && (dragState || panState || selBoxState)) {
      dragState = null;
      panState = null;
      canvasWrap.classList.remove('panning');
      if (selBoxEl) { selBoxEl.remove(); selBoxEl = null; }
      selBoxState = null;
      selBoxMoved = false;
      return;
    }
    if (dragState) {
      const dx = (e.clientX - dragState.startX) / view.scale;
      const dy = (e.clientY - dragState.startY) / view.scale;
      if (Math.abs(dx) + Math.abs(dy) > 2) dragState.moved = true;
      for (const g of dragState.group) {
        const n = nodes.get(g.id);
        if (!n) continue;
        n.x = g.origX + dx;
        n.y = g.origY + dy;
        const nEl = document.getElementById(g.id);
        if (nEl) { nEl.style.left = n.x + 'px'; nEl.style.top = n.y + 'px'; }
        updateEdgesFor(g.id);
      }
      return;
    }
    if (panState) {
      const dx = e.clientX - panState.startX;
      const dy = e.clientY - panState.startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) panState.moved = true;
      view.x = panState.origX + dx;
      view.y = panState.origY + dy;
      applyView();
      return;
    }
    if (selBoxState && selBoxEl) {
      const cur = screenToWorld(e.clientX, e.clientY);
      const lo = Math.min(selBoxState.sx, cur.x);
      const to = Math.min(selBoxState.sy, cur.y);
      const w  = Math.abs(cur.x - selBoxState.sx);
      const h  = Math.abs(cur.y - selBoxState.sy);
      if (w + h > 4) selBoxMoved = true;
      selBoxEl.style.left   = lo + 'px';
      selBoxEl.style.top    = to + 'px';
      selBoxEl.style.width  = w  + 'px';
      selBoxEl.style.height = h  + 'px';
      selectInRect(selBoxState.sx, selBoxState.sy, cur.x, cur.y);
    }
  });

  function _endGesture(e) {
    if (dragState) {
      dragState = null;
    } else if (panState) {
      if (!panState.moved) clearSelection();
      panState = null;
      canvasWrap.classList.remove('panning');
    } else if (selBoxState || selBoxEl) {
      if (selBoxEl) { selBoxEl.remove(); selBoxEl = null; }
      if (!selBoxMoved) clearSelection();
      selBoxState = null;
      selBoxMoved = false;
    }
    if (e?.pointerId != null) {
      try { canvasWrap.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  }
  canvasWrap.addEventListener('pointerup',     _endGesture);
  canvasWrap.addEventListener('pointercancel', _endGesture);

  // ── Canvas zoom (wheel) ─────────────────────────────────────────────────
  canvasWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.0015;
    const newScale = Math.min(2, Math.max(0.3, view.scale * (1 + delta)));
    const w = screenToWorld(e.clientX, e.clientY);
    view.scale = newScale;
    // Re-center around cursor position
    const rect = canvasWrap.getBoundingClientRect();
    view.x = e.clientX - rect.left - w.x * view.scale;
    view.y = e.clientY - rect.top  - w.y * view.scale;
    applyView();
  }, { passive: false });

  // ── Add-node menu wiring ────────────────────────────────────────────────
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#add-menu')) addMenu.classList.remove('open');
  });
  addMenu.querySelectorAll('.add-menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const type = item.dataset.nodeType;
      // Drop the new node near the center of the current viewport
      const rect = canvasWrap.getBoundingClientRect();
      const center = screenToWorld(rect.left + rect.width/2, rect.top + rect.height/2);
      createNode(type, center.x - 120 + Math.random()*40, center.y - 60 + Math.random()*40);
      addMenu.classList.remove('open');
    });
  });

  // ── Fit to view ──────────────────────────────────────────────────────────
  function fitToView() {
    if (nodes.size === 0) return;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 240); maxY = Math.max(maxY, n.y + 260);
    }
    const rect = canvasWrap.getBoundingClientRect();
    const sx = (rect.width  - 80) / (maxX - minX || 1);
    const sy = (rect.height - 80) / (maxY - minY || 1);
    view.scale = Math.min(2, Math.max(0.3, Math.min(sx, sy)));
    view.x = 40 - minX * view.scale;
    view.y = 40 - minY * view.scale;
    applyView();
  }
  document.getElementById('btn-fit').addEventListener('click', fitToView);

  // ── Clear canvas ────────────────────────────────────────────────────────
  // ── Run buttons ─────────────────────────────────────────────────────────
  // Workflow-level loop count — how many times to run the WHOLE selected
  // graph back-to-back when Run all / Run selected is pressed. Distinct
  // from per-node count: this one re-runs every node N times sequentially
  // (so each pass produces a fresh complete pipeline output), while
  // node.params.count multiplies a single node's per-pass result count.
  // Persisted per-project in localStorage so a refresh doesn't reset it.
  const runLoopInput = document.getElementById('run-loop');
  const _runLoopKey = `app.runLoop.${projectId || 'default'}`;
  try {
    const saved = parseInt(localStorage.getItem(_runLoopKey), 10);
    if (saved >= 1 && saved <= 20 && runLoopInput) runLoopInput.value = String(saved);
  } catch (_) {}
  runLoopInput?.addEventListener('change', () => {
    let v = parseInt(runLoopInput.value, 10) || 1;
    v = Math.max(1, Math.min(20, v));
    runLoopInput.value = String(v);
    try { localStorage.setItem(_runLoopKey, String(v)); } catch (_) {}
  });
  const getRunLoop = () => Math.max(1, Math.min(20, parseInt(runLoopInput?.value, 10) || 1));
  async function runGraphLooped(ids) {
    const n = getRunLoop();
    if (n <= 1) return runGraph(ids);
    for (let i = 1; i <= n; i++) {
      toast(`Pass ${i}/${n}…`);
      await runGraph(ids);
    }
    toast(`All ${n} passes done`, 'success');
  }
  document.getElementById('btn-run-selected').addEventListener('click', () => {
    if (!selected.size) { toast('Select nodes first (click or drag a box)'); return; }
    runGraphLooped([...selected]);
  });
  document.getElementById('btn-run-all').addEventListener('click', () => {
    if (!nodes.size) { toast('Canvas is empty'); return; }
    runGraphLooped([...nodes.keys()]);
  });

  // ── Panel toggle ────────────────────────────────────────────────────────
  const sideLeft  = document.getElementById('side-left');
  const sideRight = document.getElementById('side-right');
  const iconLeft  = document.getElementById('toggle-left-icon');
  const iconRight = document.getElementById('toggle-right-icon');

  document.getElementById('toggle-left').addEventListener('click', () => {
    const collapsed = sideLeft.classList.toggle('collapsed');
    document.body.classList.toggle('left-collapsed', collapsed);
    iconLeft.querySelector('path').setAttribute('d', collapsed ? 'M4 2l3 3-3 3' : 'M6 2L3 5l3 3');
  });
  document.getElementById('toggle-right').addEventListener('click', () => {
    const collapsed = sideRight.classList.toggle('collapsed');
    document.body.classList.toggle('right-collapsed', collapsed);
    iconRight.querySelector('path').setAttribute('d', collapsed ? 'M6 2L3 5l3 3' : 'M4 2l3 3-3 3');
  });

  // ── Credits ─────────────────────────────────────────────────────────────
  (async () => {
    const chip = document.getElementById('credits-chip');
    try {
      const r = await fetch('/api/credits');
      const d = await r.json();
      if (d.ok) {
        // Extract the first number from the CLI output (e.g. "66.5" from any format)
        const match = d.output.match(/[\d,]+(?:\.\d+)?/);
        chip.textContent = match ? `${match[0].replace(/,/g, '')} credits` : '— credits';
      } else {
        chip.textContent = '— credits';
      }
    } catch {
      chip.textContent = '— credits';
    }
  })();

  // ── Persistence (save/load workflow to server) ──────────────────────────
  let saveTimer = null;
  let savePending = false;
  let loading = false;

  function serialize() {
    return {
      nodes: [...nodes.values()].map(n => {
        // Only persist running/queued status when there's an actual taskId
        // to resume — otherwise there's nothing to poll on reload, so we
        // downgrade to idle so the queue panel doesn't lie to the user.
        const inFlight = (n.status === 'running' || n.status === 'queued') && !!n.taskId;
        const persistedStatus = inFlight
          ? n.status
          : ((n.status === 'running' || n.status === 'queued') ? 'idle' : n.status);
        return {
          id: n.id, type: n.type, x: n.x, y: n.y,
          title: n.title, prompt: n.prompt, params: n.params,
          status: persistedStatus,
          taskId: inFlight ? n.taskId : null,
          queueIdx: inFlight ? (n.queueIdx ?? null) : null,
          error: n.error || null,
          results: n.results || [], uploadUrl: n.uploadUrl, uploadPath: n.uploadPath,
          uploadKind: n.uploadKind || null, uploadRatio: n.uploadRatio || null, uploadText: n.uploadText || null,
        };
      }),
      edges: edges.map(e => ({ id: e.id, fromId: e.fromId, toId: e.toId })),
      view: { x: view.x, y: view.y, scale: view.scale },
      projectInputs: projectInputs.slice(),
      projectVars: projectVars.slice(),
    };
  }

  function scheduleSave() {
    if (loading) return;
    // View users CAN save — the server merges their payload to allow only
    // projectInputs / projectVars / per-node run-state to change.
    savePending = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 600);
  }

  async function doSave() {
    saveTimer = null;
    if (!savePending) return;
    savePending = false;
    try {
      await fetch(WORKFLOW_API, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(serialize()),
      });
    } catch { savePending = true; }  // mark dirty so the next scheduler picks it up
  }

  // Force-persist now (await-able) — used after Input-panel actions where the
  // user expects "I added it, it's saved" without waiting on the debounce.
  async function flushSaveNow() {
    if (loading) return;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    savePending = true;
    await doSave();
  }

  // Synchronous best-effort save on tab close / reload using fetch keepalive,
  // so any pending debounced edit still lands on the server.
  function flushSaveOnUnload() {
    if (loading || !savePending) return;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    savePending = false;
    try {
      fetch(WORKFLOW_API, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(serialize()),
        keepalive: true,
      });
    } catch {}
  }
  window.addEventListener('beforeunload', flushSaveOnUnload);
  window.addEventListener('pagehide', flushSaveOnUnload);

  // Re-pull the workflow whenever the tab becomes visible after being
  // hidden, so edits made by other shared users land without a manual
  // reload. Skips the refresh if we have a pending local save OR an
  // input/textarea is focused — in either case clobbering the in-progress
  // edit would be worse than the staleness it would fix.
  async function refreshFromServer() {
    if (loading) return;
    if (savePending || saveTimer) return;
    // Don't blow away the canvas while the user has an in-flight
    // bulk-download running. The selbar download button stays disabled
    // until the promise settles; that's our signal to skip the refresh.
    const dl = document.getElementById('files-selbar-download');
    if (dl && dl.disabled) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) return;
    // Clear local state so a second loadWorkflow doesn't duplicate edges
    // or strand nodes that were deleted on the server side.
    for (const id of [...nodes.keys()]) document.getElementById(id)?.remove();
    nodes.clear();
    edges.length = 0;
    if (edgesSvg) edgesSvg.innerHTML = '';
    try {
      await loadWorkflow();
    } catch (err) {
      // loadWorkflow's internal catch swallows most failures, but a bug
      // there (cf. the saveStatus ReferenceError fixed in this commit)
      // could propagate. Make sure renderRightPanel still runs so the
      // user isn't stranded with an empty canvas.
      console.log('[refreshFromServer] loadWorkflow rejected:', err);
    }
    renderRightPanel();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshFromServer();
  });

  // Observe mutations on canvas + edges SVG to catch drags/renders/connections
  const mo = new MutationObserver(scheduleSave);
  mo.observe(canvas,   { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
  mo.observe(edgesSvg, { childList: true, subtree: true });

  // Save on field edits inside nodes (prompt, params)
  canvas.addEventListener('input', scheduleSave);

  // ── Auto-refresh expired CDN media ────────────────────────────────────
  // Jimeng signs every CDN URL with a short-lived x-signature/x-expires
  // pair. If a generated result was kept as just `url` (cache step never
  // saved a /uploads/ copy), the browser will eventually 403 on it.
  // /api/refresh_media re-queries Jimeng with the task's submit_id, which
  // hands back a freshly-signed URL; the server downloads that to /uploads
  // and returns the permanent servePath. We do this once per element so a
  // genuinely-dead asset doesn't loop forever.
  const _refreshInflight = new Map();  // staleUrl → Promise
  async function _refreshMedia(staleUrl) {
    if (_refreshInflight.has(staleUrl)) return _refreshInflight.get(staleUrl);
    const p = (async () => {
      try {
        const r = await fetch('/api/refresh_media', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: staleUrl }),
        });
        const d = await r.json();
        if (!d.ok) return null;
        // Patch every node.results entry that pointed at the stale URL so
        // the next page load skips media_proxy entirely.
        let touched = false;
        for (const node of nodes.values()) {
          for (const res of (node.results || [])) {
            if (res.url === staleUrl || res.servePath === staleUrl) {
              res.url = d.url || res.url;
              res.servePath = d.servePath;
              touched = true;
            }
          }
        }
        if (touched) scheduleSave();
        return d.servePath;
      } catch (_) {
        return null;
      }
    })();
    _refreshInflight.set(staleUrl, p);
