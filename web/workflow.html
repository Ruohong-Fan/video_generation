<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f0ea;
  --surface: oklch(0.95 0.008 75);
  --surface2: oklch(0.92 0.010 75);
  --surface3: oklch(0.88 0.012 75);
  --border: oklch(0.78 0.010 75 / 0.5);
  --accent: #a07850;
  --accent2: #c9a87c;
  --text: oklch(0.22 0.02 70);
  --muted: oklch(0.50 0.022 72);
  --success: oklch(0.60 0.14 155);
  --warning: oklch(0.65 0.15 85);
  --error: oklch(0.55 0.18 25);
  --grid: oklch(0.90 0.005 75);
  --bg-0: oklch(0.97 0.006 75);
  --bg-1: oklch(0.95 0.008 75);
  --bg-2: oklch(0.92 0.010 75);
  --bg-3: oklch(0.88 0.012 75);
  --bg-4: oklch(0.82 0.014 75);
  --line: oklch(0.78 0.010 75 / 0.45);
  --line-soft: oklch(0.78 0.010 75 / 0.2);
  --fg-0: oklch(0.22 0.02 70);
  --fg-1: oklch(0.35 0.02 72);
  --fg-2: oklch(0.50 0.022 74);
  --fg-3: oklch(0.62 0.020 74);
  --amber: oklch(0.62 0.145 55);
  --amber-dim: oklch(0.52 0.10 55);
  --amber-glow: oklch(0.62 0.145 55 / 0.12);
  --ok: oklch(0.55 0.14 155);
  --err: oklch(0.50 0.18 25);
}

[data-theme="dark"] {
  /* Dark theme (default) */
  --bg: #0f0e0c;
  --surface: oklch(0.21 0.014 62);
  --surface2: oklch(0.25 0.016 64);
  --surface3: oklch(0.30 0.018 65);
  --border: oklch(0.32 0.015 65 / 0.5);
  --accent: #a07850;
  --accent2: #c9a87c;
  --text: oklch(0.95 0.02 85);
  --muted: oklch(0.55 0.02 72);
  --success: oklch(0.75 0.14 155);
  --warning: oklch(0.80 0.15 85);
  --error: oklch(0.70 0.18 25);
  --grid: oklch(0.22 0.01 65);
  --bg-0: oklch(0.17 0.012 60);
  --bg-1: oklch(0.21 0.014 62);
  --bg-2: oklch(0.25 0.016 64);
  --bg-3: oklch(0.30 0.018 65);
  --bg-4: oklch(0.36 0.020 66);
  --line: oklch(0.32 0.015 65 / 0.5);
  --line-soft: oklch(0.32 0.015 65 / 0.25);
  --fg-0: oklch(0.95 0.02 85);
  --fg-1: oklch(0.82 0.025 80);
  --fg-2: oklch(0.62 0.025 75);
  --fg-3: oklch(0.48 0.022 72);
  --amber: oklch(0.78 0.145 70);
  --amber-dim: oklch(0.52 0.10 68);
  --amber-glow: oklch(0.78 0.145 70 / 0.35);
  --ok: oklch(0.75 0.14 155);
  --err: oklch(0.70 0.18 25);
}

[data-theme="dark"] .file-thumb-placeholder,
[data-theme="dark"] .node-upload-drop,
[data-theme="dark"] .input-media-placeholder,
[data-theme="dark"] .var-file-thumb {
  background: repeating-linear-gradient(45deg,
    oklch(0.22 0.01 65), oklch(0.22 0.01 65) 4px,
    oklch(0.25 0.012 65) 4px, oklch(0.25 0.012 65) 8px);
}
[data-theme="dark"] .var-wrap .var-token {
  background: oklch(0.24 0.045 65);
}
[data-theme="dark"] .var-wrap .var-token.unknown {
  color: oklch(0.78 0.16 25);
  background: oklch(0.24 0.06 25);
}


html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
}

/* ── Top bar ────────────────────────────────────────────────────────────── */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: linear-gradient(to bottom, var(--bg-1), var(--bg-0));
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  z-index: 100;
  font-family: var(--type-ui);
}
.back-btn {
  color: var(--fg-3);
  text-decoration: none;
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line);
  transition: color 0.12s, background 0.12s;
  flex-shrink: 0;
}
.back-btn:hover { color: var(--fg-0); background: var(--bg-2); }
.logo {
  display: flex; align-items: baseline; gap: 7px;
  padding-right: 14px;
  border-right: 1px solid var(--line);
  height: 100%;
}
.logo-mark {
  width: 20px; height: 20px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--amber), oklch(0.6 0.15 50), var(--amber));
  position: relative; align-self: center;
  box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--amber-dim);
}
.logo-mark::after {
  content: ""; position: absolute; inset: 5px;
  background: var(--bg-0); border-radius: 50%;
}
.logo-name { font-family: var(--type-display); font-size: 22px; letter-spacing: -0.01em; align-self: center; color: var(--fg-0); }
.logo-sub { font-family: var(--type-mono); font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; align-self: center; }
.breadcrumb { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 14px; }
.breadcrumb .sep { color: var(--fg-3); }
.topbar-project { color: var(--fg-0); font-weight: 500; font-size: 14px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-spacer { flex: 1; }

/* User menu — avatar + sign-out dropdown */
.topbar-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--amber), oklch(0.55 0.12 30));
  display: grid; place-items: center;
  font-family: var(--type-display); font-size: 17px;
  color: oklch(0.18 0.03 65); font-weight: 600;
  flex-shrink: 0; cursor: pointer;
  border: 1px solid transparent;
  transition: border-color 0.12s, transform 0.05s;
}
.topbar-avatar:hover { border-color: var(--amber); }
.topbar-avatar:active { transform: scale(0.96); }
.user-menu { position: relative; flex-shrink: 0; }
.user-menu-pop {
  position: absolute; top: calc(100% + 6px); right: 0;
  min-width: 160px; padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 12px 32px oklch(0 0 0 / 0.45);
  z-index: 200; display: none;
}
.user-menu.open .user-menu-pop { display: block; }
.user-menu-info {
  padding: 8px 10px 6px; font-size: 13px;
  color: var(--fg-3);
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
  font-family: var(--type-mono);
  text-transform: uppercase; letter-spacing: 0.06em;
  word-break: break-all;
}
.user-menu-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 8px 10px;
  font-size: 14px; color: var(--fg-0);
  border-radius: 5px; text-align: left;
  background: none; border: none; cursor: pointer; font-family: inherit;
}
.user-menu-item:hover { background: var(--surface2); }
.user-menu-item.danger { color: oklch(0.78 0.16 25); }
.user-menu-item.danger:hover { background: oklch(0.70 0.18 25 / 0.10); }
.topbar-run-group {
  display: flex; align-items: center; gap: 4px;
  padding: 3px; background: var(--bg-1);
  border: 1px solid var(--line); border-radius: 8px;
}

.toggle-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 6px;
  font-size: 13px; font-weight: 500;
  color: var(--fg-2); background: var(--bg-1); border: 1px solid var(--line);
  font-family: var(--type-mono); letter-spacing: 0.03em;
}
.toggle-chip.on { color: var(--amber); border-color: var(--amber-dim); background: oklch(0.78 0.145 70 / 0.08); }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 6px;
  font-size: 14px; font-weight: 500;
  color: var(--fg-1); background: transparent;
  border: 1px solid transparent; cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  white-space: nowrap; font-family: var(--type-ui);
}
.btn:hover { background: var(--bg-2); color: var(--fg-0); }
.btn.ghost { border-color: var(--line); }
.btn.ghost:hover { border-color: var(--bg-4); }
.btn.primary { background: var(--amber); color: oklch(0.18 0.03 65); font-weight: 600; border-color: transparent; }
.btn.primary:hover { background: oklch(0.82 0.15 72); }
.btn.primary:disabled { background: var(--bg-3); color: var(--fg-3); cursor: not-allowed; }
.btn.danger { color: var(--err); }
.btn.danger:hover { background: oklch(0.70 0.18 25 / 0.12); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Canvas overlays ────────────────────────────────────────────────────── */
.canvas-overlay {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
}
.canvas-overlay > * { pointer-events: auto; }
.canvas-help {
  position: absolute; top: 12px; right: 12px;
  display: flex; align-items: center; gap: 2px;
  padding: 5px 10px; background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; font-family: var(--type-mono); font-size: 12px; color: var(--fg-3);
  user-select: none;
}
.canvas-help .kbd {
  color: var(--fg-1); background: var(--bg-2); padding: 1px 5px;
  border-radius: 3px; border: 1px solid var(--line); margin: 0 2px;
}
.zoom-ctl {
  position: absolute; bottom: 16px; left: 16px;
  display: flex; align-items: center;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.zoom-ctl button {
  padding: 5px 9px; color: var(--fg-1); background: transparent;
  border: none; border-right: 1px solid var(--line);
  cursor: pointer; font-size: 16px; line-height: 1;
  font-family: var(--type-ui); transition: background 0.12s, color 0.12s;
}
.zoom-ctl button:last-child { border-right: none; }
.zoom-ctl button:hover { background: var(--bg-2); color: var(--fg-0); }
.zoom-val {
  min-width: 46px; text-align: center;
  font-family: var(--type-mono); font-size: 13px; color: var(--fg-2);
  padding: 5px 8px; border-right: 1px solid var(--line);
  white-space: nowrap;
}
.minimap {
  position: absolute; bottom: 16px; right: 16px;
  width: 160px; height: 100px;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.minimap-inner { position: relative; width: 100%; height: 100%; background: var(--bg-0); border-radius: 4px; overflow: hidden; }
.minimap-node { position: absolute; background: var(--fg-3); border-radius: 1px; min-width: 2px; min-height: 2px; }
.minimap-node.selected { background: var(--amber); }
.minimap-viewport { position: absolute; border: 1px solid var(--amber); background: oklch(0.78 0.145 70 / 0.1); pointer-events: none; }

/* ── Canvas ─────────────────────────────────────────────────────────────── */
/* ── Panel collapse ─────────────────────────────────────────────────────── */
.side-left, .side-right { transition: transform 0.2s ease; }
.side-left.collapsed  { transform: translateX(-260px); }
.side-right.collapsed { transform: translateX(320px); }
.panel-toggle {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 18px; height: 42px;
  background: var(--bg-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--fg-3); cursor: pointer; z-index: 90;
  transition: color 0.12s, background 0.12s, left 0.2s ease, right 0.2s ease;
}
.panel-toggle:hover { color: var(--fg-0); background: var(--bg-3); }
.panel-toggle svg { width: 10px; height: 10px; }
.panel-toggle-left  { left: 260px; border-left: none; border-radius: 0 4px 4px 0; }
.panel-toggle-right { right: 320px; border-right: none; border-radius: 4px 0 0 4px; }
body.left-collapsed  .panel-toggle-left  { left: 0; }
body.right-collapsed .panel-toggle-right { right: 0; }

/* ── Node title inline edit ─────────────────────────────────────────────── */
.node-title-input {
  flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--fg-0);
  background: var(--bg-3); border: 1px solid var(--amber-dim); border-radius: 3px;
  padding: 0 4px; height: 20px; outline: none; font-family: var(--type-ui);
}

.canvas-wrap {
  position: fixed;
  top: 52px;
  left: 260px; right: 320px; bottom: 0;
  transition: left 0.2s ease, right 0.2s ease;
  overflow: hidden;
  cursor: grab;
  background:
    radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0)
    0 0 / 24px 24px;
}
.canvas-wrap.panning { cursor: grabbing; }
.canvas-wrap.mode-select { cursor: crosshair; }
.canvas-wrap.mode-select.panning { cursor: grabbing; }
body.left-collapsed  .canvas-wrap { left: 0; }
body.right-collapsed .canvas-wrap { right: 0; }
.canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  transform-origin: 0 0;
}

/* SVG layer for edges */
.edges {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  transform-origin: 0 0;
}
.edge { fill: none; stroke: var(--muted); stroke-width: 2; opacity: 0.55; transition: stroke 0.15s, opacity 0.15s; pointer-events: stroke; cursor: pointer; }
.edge:hover, .edge.selected { stroke: var(--accent2); opacity: 1; stroke-width: 3; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edge-temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; opacity: 0.8; fill: none; pointer-events: none; }

/* ── Node cards ─────────────────────────────────────────────────────────── */
.node {
  position: absolute;
  width: 240px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md, 10px);
  box-shadow: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 8px 24px oklch(0 0 0 / 0.35);
  transition: border-color 0.12s, box-shadow 0.2s;
  cursor: grab;
  user-select: none;
}
.node:active { cursor: grabbing; }
.node:hover { border-color: var(--bg-4); }
.node.selected {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 18px 48px oklch(0.78 0.145 70 / 0.25);
}
.node.running {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 0 32px var(--amber-glow);
}
.node.error { border-color: var(--err); }

/* ── Node head ──────────────────────────────────────────────────────────── */
.node-head {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px 7px;
  border-bottom: 1px solid var(--line-soft);
}
.node-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--type-mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--amber); padding: 2px 6px 2px 4px;
  border-radius: 3px; background: oklch(0.78 0.145 70 / 0.12);
  flex-shrink: 0;
}
.node-title {
  font-size: 14px; font-weight: 600; color: var(--fg-0);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.node-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.12s; }
.node:hover .node-actions, .node.selected .node-actions { opacity: 1; }
.node-action {
  width: 22px; height: 22px; display: grid; place-items: center;
  border-radius: 4px; color: var(--fg-2); flex-shrink: 0;
}
.node-action:hover { background: var(--bg-3); color: var(--fg-0); }
.node-action.run:hover { color: var(--amber); }
.node-action.delete:hover { color: var(--err); }

/* ── Node body / preview ────────────────────────────────────────────────── */
.node-preview {
  position: relative; aspect-ratio: 16 / 10;
  background: var(--bg-0); overflow: hidden;
  border-bottom: 1px solid var(--line-soft);
}
.node-preview video { width: 100%; height: 100%; object-fit: cover; display: block; }
.video-play-badge {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: oklch(0 0 0 / 0.35); opacity: 1; transition: opacity 0.15s; pointer-events: none;
}
.video-play-badge svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 3px oklch(0 0 0 / 0.5)); }
.node-preview.playing .video-play-badge { opacity: 0; }
.node-preview.playing:hover .video-play-badge { opacity: 0.6; }
.node-preview.empty {
  display: grid; place-items: center;
  background:
    repeating-linear-gradient(45deg,
      oklch(0.88 0.008 75), oklch(0.88 0.008 75) 6px,
      oklch(0.92 0.010 75) 6px, oklch(0.92 0.010 75) 12px);
  color: var(--fg-3); font-family: var(--type-mono); font-size: 12px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.node-text-body {
  padding: 10px 12px; font-size: 14px; color: var(--fg-1);
  line-height: 1.45; max-height: 110px; overflow: hidden;
  position: relative; font-family: var(--type-ui);
  white-space: pre-wrap;
}
.node-text-body::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0;
  height: 24px; background: linear-gradient(transparent, var(--bg-2));
  pointer-events: none;
}
.node-text-label {
  display: inline-block; font-family: var(--type-mono); font-size: 11px;
  letter-spacing: 0.1em; color: var(--fg-3); margin-bottom: 6px;
}
.node-text-label.generated { color: var(--amber); }
.node-audio-body {
  padding: 12px; display: flex; align-items: center; gap: 10px;
}
.wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 32px; }
.wave span { flex: 1; background: var(--amber); border-radius: 1px; opacity: 0.6; min-height: 2px; }
.wave span.active { opacity: 1; }
/* ── Edit node filmstrip ────────────────────────────────────────────────── */
.node-edit-strip {
  display: flex; gap: 3px; padding: 6px 8px 4px; flex-wrap: nowrap;
  overflow: hidden;
}
/* Video-node run-strip: same flex layout as the Edit node's input
   filmstrip, but horizontal-scrolling with fixed-width tiles so a
   6-or-more-clip batch stays browsable instead of getting squished
   to thumbnail-of-a-thumbnail size. */
.node-edit-strip[data-run-strip] {
  overflow-x: auto; overflow-y: hidden; padding-bottom: 8px;
  scrollbar-width: thin;
}
.node-edit-strip[data-run-strip] .node-edit-clip {
  flex: 0 0 90px; min-width: 90px;
}
.node-edit-clip {
  flex: 1; min-width: 0; aspect-ratio: 16/9;
  border-radius: 3px; overflow: hidden;
  background: var(--bg-0); border: 1px solid var(--line-soft);
  position: relative;
}
.node-edit-clip video, .node-edit-clip img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.node-edit-clip-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  font-size: 10px; padding: 2px 3px;
  background: linear-gradient(to top, oklch(0 0 0 / 0.7), transparent);
  color: white; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--type-mono);
}
.node-edit-audio-note {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 8px 5px; font-size: 11px; color: var(--amber);
  font-family: var(--type-mono); letter-spacing: 0.05em;
}
.node-output-wrap { position: relative; }
.node-output-count {
  position: absolute; bottom: 6px; right: 6px;
  background: oklch(0 0 0 / 0.65); color: var(--fg-0);
  font-family: var(--type-mono); font-size: 12px;
  padding: 2px 7px; border-radius: 10px; pointer-events: none;
  backdrop-filter: blur(4px);
}

/* ── Node foot / status ─────────────────────────────────────────────────── */
.node-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; font-family: var(--type-mono);
  font-size: 12px; color: var(--fg-3);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.node-status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 6px; border-radius: 3px;
  font-family: var(--type-mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.node-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.node-status.idle  { color: var(--fg-3); }
.node-status.queued { color: oklch(0.78 0.09 230); }
.node-status.running { color: var(--amber); }
.node-status.running .dot { animation: pulse 1.2s ease-in-out infinite; }
.node-status.done  { color: var(--ok); }
.node-status.error { color: var(--err); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── Node progress ──────────────────────────────────────────────────────── */
.node-progress { height: 2px; background: var(--bg-0); overflow: hidden; }
.node-progress-bar {
  height: 100%; background: var(--amber);
  transition: width 0.3s ease;
  box-shadow: 0 0 8px var(--amber-glow);
}

/* ── Node checkbox (multi-select) ───────────────────────────────────────── */
.node-checkbox {
  position: absolute; top: 8px; left: 8px;
  width: 16px; height: 16px; border-radius: 3px;
  border: 1px solid var(--fg-3); background: var(--bg-0);
  display: grid; place-items: center;
  opacity: 0; transition: opacity 0.12s, background 0.12s, border-color 0.12s;
  z-index: 2; color: oklch(0.18 0.03 65); cursor: pointer;
}
.node:hover .node-checkbox, .node.selected .node-checkbox { opacity: 1; }
.node.selected .node-checkbox { background: var(--amber); border-color: var(--amber); }

/* ── Connection handles (ports) ─────────────────────────────────────────── */
.handle {
  position: absolute;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--bg-0); border: 2px solid var(--fg-3);
  top: 50%; transform: translateY(-50%);
  cursor: crosshair; z-index: 5;
  transition: border-color 0.12s, transform 0.12s, background 0.12s;
}
.handle:hover, .handle.connecting {
  border-color: var(--amber); background: var(--amber);
  transform: translateY(-50%) scale(1.25);
}
.handle.in  { left: -7px; }
.handle.out { right: -7px; }

/* ── Selection box ──────────────────────────────────────────────────────── */
.sel-box {
  position: absolute;
  border: 1px solid var(--amber);
  background: oklch(0.78 0.145 70 / 0.08);
  pointer-events: none; z-index: 50;
}

/* ── Edges ──────────────────────────────────────────────────────────────── */
.edge {
  fill: none;
  stroke: oklch(0.62 0.04 75 / 0.55);
  stroke-width: 1.5;
  transition: stroke 0.15s;
}
.edge:hover, .edge.selected { stroke: var(--amber); stroke-width: 2; opacity: 1; }
.edge.flowing {
  stroke: var(--amber); stroke-width: 2;
  stroke-dasharray: 6 4;
  animation: flow 1s linear infinite;
}
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edge-temp { stroke: var(--amber); stroke-width: 2; stroke-dasharray: 5 5; opacity: 0.8; fill: none; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: -20; } }

/* ── Add node menu ──────────────────────────────────────────────────────── */
.add-menu {
  position: fixed; background: var(--bg-1);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 6px; z-index: 200;
  box-shadow: 0 8px 30px oklch(0 0 0 / 0.6);
  min-width: 200px; display: none;
}
.add-menu.open { display: flex; flex-direction: column; gap: 2px; }
.add-menu-item {
  padding: 8px 12px; font-size: 0.98rem; cursor: pointer;
  border-radius: 6px; display: flex; align-items: center; gap: 10px;
  transition: background 0.1s; color: var(--fg-1);
}
.add-menu-item:hover { background: var(--bg-3); color: var(--fg-0); }
.add-menu-item .icon { font-size: 1.15rem; width: 22px; text-align: center; }
.add-menu-item .sub { font-size: 0.83rem; color: var(--fg-3); }

/* ── Status toast ───────────────────────────────────────────────────────── */
.toast {
  position: fixed; top: 70px; right: 20px;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px;
  font-size: 0.94rem; z-index: 300;
  animation: slideIn 0.2s ease; color: var(--fg-1);
}
.toast.error { border-color: var(--err); color: var(--err); }
.toast.success { border-color: var(--ok); color: var(--ok); }
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }

/* ── Scrollbars ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-4); }

/* ── Left sidebar panel ─────────────────────────────────────────────────── */
.side-left {
  position: fixed;
  top: 52px; left: 0;
  width: 260px; bottom: 0;
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  z-index: 80; font-family: var(--type-ui);
}
.side-tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  padding: 0 8px; gap: 2px; flex-shrink: 0;
}
.side-tab {
  padding: 10px 10px 9px;
  font-size: 13px; font-weight: 500;
  color: var(--fg-2);
  letter-spacing: 0.04em; text-transform: uppercase;
  border: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px; background: none; cursor: pointer;
  transition: color 0.12s;
}
.side-tab:hover { color: var(--fg-0); }
.side-tab.active { color: var(--fg-0); border-bottom-color: var(--amber); }
.side-body { flex: 1; overflow-y: auto; padding: 12px; }
.side-body::-webkit-scrollbar { width: 6px; }
.side-body::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
.side-section-title {
  font-family: var(--type-mono); font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--fg-3);
  margin: 14px 4px 8px;
}
.side-section-title:first-child { margin-top: 0; }
.lib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lib-card {
  display: flex; flex-direction: column;
  align-items: flex-start; gap: 14px; padding: 14px;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s, transform 0.08s;
  text-align: left; width: 100%;
}
.lib-card:hover { border-color: var(--amber-dim); background: var(--bg-3); }
.lib-card:active { transform: scale(0.98); }
.lib-card-icon {
  width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 8px; background: oklch(0.78 0.145 70 / 0.14);
  color: var(--amber);
}
.lib-card-icon svg { width: 18px; height: 18px; }
.lib-card-name {
  font-family: var(--type-display); font-size: 18px; font-weight: 600;
  color: var(--fg-0); line-height: 1.1;
}
.tree { display: flex; flex-direction: column; gap: 1px; }
.tree-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 6px; border-radius: 4px;
  font-size: 14px; color: var(--fg-1); cursor: pointer;
}
.tree-item:hover { background: var(--bg-2); color: var(--fg-0); }
.tree-item.active { background: oklch(0.78 0.145 70 / 0.12); color: var(--amber); }
.tree-item-icon { width: 16px; text-align: center; }
.side-empty { font-size: 13px; color: var(--fg-3); text-align: center; padding: 24px 8px; line-height: 1.5; }
.file-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px; border-radius: 6px; margin-bottom: 2px;
  border: 1px solid transparent; cursor: default;
  transition: background 0.1s;
}
.file-item:hover { background: var(--bg-2); border-color: var(--line); }
.file-item.selected { background: oklch(0.78 0.145 70 / 0.08); border-color: var(--amber); }
/* Leading checkbox on each file-item for bulk Download-as-package. Dim
   by default, full-opacity on hover or when selected so it doesn't
   visually clutter the resting state of the file list. */
.file-check {
  flex-shrink: 0; width: 16px; height: 16px;
  margin-top: 12px;  /* align with the 40px thumb's vertical centre-ish */
  border: 1px solid var(--line); border-radius: 3px;
  background: var(--bg-0);
  display: grid; place-items: center; cursor: pointer;
  opacity: 0.45; transition: opacity 0.1s, background 0.1s, border-color 0.1s;
}
.file-item:hover .file-check, .file-item.selected .file-check { opacity: 1; }
.file-check svg { width: 10px; height: 10px; display: none; }
.file-item.selected .file-check {
  background: var(--amber); border-color: var(--amber);
  color: oklch(0.18 0.03 65);
}
.file-item.selected .file-check svg { display: block; }
.files-selbar {
  display: flex;
  align-items: center; gap: 6px;
  padding: 6px 8px; margin-bottom: 8px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg-2);
  font-size: 12px;
  position: sticky; top: 0; z-index: 2;
}
/* Amber tint when at least one file is ticked — same visual cue as
   before, just always-present so the Select-all toggle inside the
   bar is discoverable from the resting state. */
.files-selbar.on { border-color: var(--amber-dim); background: oklch(0.78 0.145 70 / 0.08); }
.files-selbar-count { color: var(--fg-2); font-family: var(--type-mono); font-size: 11px; flex: 1; }
.files-selbar.on .files-selbar-count { color: var(--amber); }
.files-selbar button {
  padding: 4px 10px; font-size: 11px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg-1); color: var(--fg-1);
  font-family: inherit;
}
.files-selbar button:hover { color: var(--fg-0); border-color: var(--amber-dim); }
.files-selbar button.primary {
  background: var(--amber); color: oklch(0.18 0.03 65);
  border-color: transparent; font-weight: 500;
}
.files-selbar button.primary:hover { background: var(--amber); border-color: var(--amber); }
.files-selbar button:disabled { opacity: 0.5; cursor: not-allowed; }
.file-thumb {
  width: 40px; height: 40px; flex-shrink: 0; border-radius: 5px;
  background: var(--bg-3); border: 1px solid var(--line);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.file-thumb img, .file-thumb video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.file-thumb-placeholder {
  width: 100%; height: 100%; display: grid; place-items: center;
  color: var(--fg-3); border-radius: 4px;
  background: repeating-linear-gradient(45deg,
    oklch(0.88 0.008 75), oklch(0.88 0.008 75) 4px,
    oklch(0.92 0.010 75) 4px, oklch(0.92 0.010 75) 8px);
}
.file-thumb-placeholder svg { width: 16px; height: 16px; }

/* Input panel — project-scope assets */
/* Project variables */
.var-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.var-row {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg-2);
}
.var-row:focus-within { border-color: var(--amber-dim); }
.var-key, .var-value {
  flex: 1; min-width: 0; padding: 4px 6px;
  background: transparent; border: none; outline: none;
  color: var(--fg-0); font-size: 13px; font-family: var(--type-mono);
}
.var-key { flex: 0 0 32%; color: var(--amber); }
.var-eq { color: var(--fg-3); font-family: var(--type-mono); font-size: 13px; }
.var-expand {
  flex-shrink: 0; width: 22px; height: 22px; padding: 0;
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  color: var(--fg-3); display: grid; place-items: center; cursor: pointer;
  opacity: 0; transition: opacity 0.1s, color 0.1s, border-color 0.1s;
}
.var-row:hover .var-expand, .var-row:focus-within .var-expand { opacity: 1; }
.var-expand:hover { color: var(--amber); border-color: var(--amber-dim); }
.var-delete {
  flex-shrink: 0; width: 22px; height: 22px; padding: 0;
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  color: var(--fg-3); display: grid; place-items: center; cursor: pointer;
  opacity: 0; transition: opacity 0.1s, color 0.1s, border-color 0.1s;
}
.var-row:hover .var-delete, .var-row:focus-within .var-delete { opacity: 1; }
.var-row:hover .var-copy, .var-row:focus-within .var-copy { opacity: 1; }
.var-delete:hover { color: var(--err); border-color: var(--err); }
.var-copy {
  flex-shrink: 0; width: 22px; height: 22px; padding: 0;
  background: transparent; border: 1px solid transparent; border-radius: 4px;
  color: var(--fg-3); display: grid; place-items: center; cursor: pointer;
  opacity: 0; transition: opacity 0.1s, color 0.1s, border-color 0.1s;
}
.var-copy:hover { color: var(--amber); border-color: var(--amber-dim); }

/* ── Expand modal (full-screen variable editor) ─────────────────────── */
.var-modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: oklch(0 0 0 / 0.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  animation: var-modal-in 0.15s ease;
}
@keyframes var-modal-in { from { opacity: 0; } to { opacity: 1; } }
.var-modal {
  width: min(720px, 92vw); max-height: 85vh;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 24px 80px oklch(0 0 0 / 0.5);
  display: flex; flex-direction: column;
  animation: var-modal-scale 0.15s ease;
}
@keyframes var-modal-scale { from { transform: scale(0.96); } to { transform: scale(1); } }
.var-modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.var-modal-key {
  font-family: var(--type-mono); font-size: 15px; color: var(--amber);
  font-weight: 600;
}
.var-modal-label { color: var(--fg-3); font-size: 14px; }
.var-modal-close {
  margin-left: auto; width: 28px; height: 28px;
  background: var(--bg-3); border: none; border-radius: 6px;
  color: var(--fg-2); display: grid; place-items: center; cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.var-modal-close:hover { background: var(--bg-4); color: var(--fg-0); }
.var-modal-body { flex: 1; padding: 14px 18px; overflow: hidden; display: flex; flex-direction: column; }
.var-modal-textarea {
  flex: 1; width: 100%; min-height: 200px;
  background: var(--bg-0); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px;
  color: var(--fg-0); font-size: 14px; font-family: var(--type-mono);
  line-height: 1.55; resize: none; outline: none;
  transition: border-color 0.12s;
}
.var-modal-textarea:focus { border-color: var(--amber-dim); }
.var-modal-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px 14px; flex-shrink: 0;
}
.var-modal-chars { font-family: var(--type-mono); font-size: 12px; color: var(--fg-3); }
.var-modal-save {
  padding: 6px 18px; border: none; border-radius: 6px;
  background: var(--amber); color: var(--bg-0); font-weight: 600;
  font-size: 14px; cursor: pointer; transition: opacity 0.12s;
}
.var-modal-save:hover { opacity: 0.85; }
.var-modal-save:active { opacity: 0.7; }

/* ── File preview modal ─────────────────────────────────────────────── */
.file-modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: oklch(0 0 0 / 0.7); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  animation: var-modal-in 0.15s ease;
}
.file-modal {
  width: min(640px, 92vw); max-height: 85vh;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 24px 80px oklch(0 0 0 / 0.5);
  display: flex; flex-direction: column;
  animation: var-modal-scale 0.15s ease;
}
.file-modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.file-modal-title {
  font-family: var(--type-mono); font-size: 15px; color: var(--amber);
  font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.file-modal-kind {
  font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em;
}
.file-modal-close {
  margin-left: auto; width: 28px; height: 28px;
  background: var(--bg-3); border: none; border-radius: 6px;
  color: var(--fg-2); display: grid; place-items: center; cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.file-modal-close:hover { background: var(--bg-4); color: var(--fg-0); }
.file-modal-body {
  flex: 1; padding: 14px 18px; overflow: auto;
  display: flex; align-items: center; justify-content: center;
  min-height: 200px;
}
.file-modal-body img {
  max-width: 100%; max-height: 60vh; border-radius: 6px; object-fit: contain;
}
.file-modal-body video {
  max-width: 100%; max-height: 60vh; border-radius: 6px;
}
.file-modal-body audio {
  width: 100%;
}

/* File-typed variable row: thumbnail pill instead of a value text input. */
.file-var-row .var-file-pill {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 6px;
  padding: 2px 6px 2px 2px;
  border-radius: 5px; background: var(--bg-3);
  cursor: pointer;
}
/* Empty placeholder pill: looks dashed-bordered like the + Add buttons so
   it reads as "click to attach" rather than a populated file display. */
.file-var-row .var-file-pill.empty {
  background: transparent;
  border: 1px dashed var(--bg-4);
}
.file-var-row .var-file-pill.empty:hover {
  border-color: var(--amber-dim);
  background: var(--bg-2);
}
.file-var-row .var-file-pill.empty .var-file-name { color: var(--fg-3); font-style: italic; }
.var-file-thumb {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 3px;
  overflow: hidden; background: var(--bg-0);
  display: grid; place-items: center;
}
.var-file-thumb img, .var-file-thumb video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.var-file-thumb .file-thumb-placeholder svg { width: 12px; height: 12px; }
.var-file-name {
  font-size: 13px; color: var(--fg-1);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.var-add-row { display: flex; gap: 6px; margin-bottom: 8px; }
.var-add {
  flex: 1; padding: 6px 8px;
  background: var(--bg-2); border: 1px dashed var(--bg-4);
  border-radius: 6px; color: var(--fg-3); font-size: 13px; cursor: pointer;
  font-family: inherit; text-align: center;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
}
.var-add:hover, .var-add.drag {
  border-color: var(--amber-dim); color: var(--fg-1); background: var(--bg-3);
}
.var-help {
  font-size: 12px; color: var(--fg-3); line-height: 1.45;
  margin: 0 4px 16px; padding-left: 2px;
}
.var-help code {
  background: var(--bg-2); padding: 1px 5px; border-radius: 3px;
  color: var(--amber); font-family: var(--type-mono); font-size: 12px;
}

.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 13px; font-weight: 500; color: var(--fg-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-sub { font-size: 12px; color: var(--fg-3); margin-top: 2px; font-family: var(--type-mono); }
.file-actions { display: flex; gap: 4px; margin-top: 4px; }
.file-link {
  font-size: 12px; color: var(--amber); text-decoration: none;
  padding: 1px 6px; border-radius: 3px; border: 1px solid var(--amber-dim);
  background: oklch(0.78 0.145 70 / 0.08);
  transition: background 0.1s;
}
.file-link:hover { background: oklch(0.78 0.145 70 / 0.18); }

/* ── Right panel ────────────────────────────────────────────────────────── */
.side-right {
  position: fixed; top: 52px; right: 0;
  width: 320px; bottom: 0;
  background: var(--bg-1); border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  z-index: 80; font-family: var(--type-ui); overflow: hidden;
}
#right-panel-content { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.rp-divider { border: none; border-top: 1px solid var(--line-soft); margin: 0; }
.rp-inputs-head { padding: 10px 14px 6px; font-size: 12px; font-family: var(--type-mono); color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; }

/* shared tab count badge */
.tab-count {
  display: inline-grid; place-items: center;
  min-width: 16px; height: 14px; padding: 0 4px; margin-left: 5px;
  border-radius: 7px; background: var(--amber); color: oklch(0.18 0.03 65);
  font-family: var(--type-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0; vertical-align: 1px;
}
.side-tab:not(.active) .tab-count { background: var(--bg-3); color: var(--fg-1); }

/* ── Upstream inputs panel ──────────────────────────────────────────────── */
.upstream { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.upstream-head {
  padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
  background: var(--bg-1); flex-shrink: 0;
}
.upstream-target {
  display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
}
.upstream-target-badge {
  width: 24px; height: 24px; border-radius: 5px;
  display: grid; place-items: center;
  background: oklch(0.78 0.145 70 / 0.14); color: var(--amber); flex-shrink: 0;
}
.upstream-target-meta { min-width: 0; flex: 1; }
.upstream-target-label {
  font-family: var(--type-mono); font-size: 11px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-3); line-height: 1; margin-bottom: 3px;
}

.input-text-fade {

.input-audio {

}

.input-card-foot {

}

/* ── Params / inspector panel ───────────────────────────────────────────── */
.inspector-head {
  padding: 14px 14px 12px; border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; align-items: flex-start; flex-shrink: 0;
}
.inspector-thumb {
  width: 48px; height: 48px; border-radius: 6px; background: var(--bg-2);
  object-fit: cover; flex-shrink: 0; border: 1px solid var(--line);
}
.inspector-thumb img, .inspector-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 6px; }
.inspector-thumb.placeholder {
  background: repeating-linear-gradient(45deg,
    oklch(0.88 0.008 75), oklch(0.88 0.008 75) 4px,
    oklch(0.92 0.010 75) 4px, oklch(0.92 0.010 75) 8px);
  display: grid; place-items: center; color: var(--fg-3);
}
.inspector-meta { flex: 1; min-width: 0; }
.inspector-title {
  font-family: var(--type-display); font-size: 20px; line-height: 1.1;
  color: var(--fg-0); margin: 0 0 2px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.inspector-sub {
  font-family: var(--type-mono); font-size: 12px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--fg-3);
}
.params-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1; }
.field { margin-bottom: 0; }
.field-label {
  display: block; font-family: var(--type-mono); font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-3); margin-bottom: 6px;
}
.field-input, .field-textarea, .field-select {
  width: 100%; padding: 8px 10px;
  background: var(--bg-0); border: 1px solid var(--line);
  border-radius: 6px; color: var(--fg-0); font-size: 14px;
  outline: none; transition: border-color 0.12s; font-family: inherit;
}
.field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--amber); }
.field-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

/* View-only collaborator mode — visually disable node-editing affordances.
   Run buttons + Input tab + Output tab stay fully interactive. */
body.view-only .lib-card,
body.view-only .field-input,
body.view-only .field-textarea,
body.view-only .field-select,
body.view-only .chip,
body.view-only .node-title-input,
body.view-only [data-action=del],
body.view-only [data-action=dup] {
  opacity: 0.55; pointer-events: none; cursor: not-allowed;
}
body.view-only .field-input[data-field="title"],
body.view-only .field-textarea[data-field="prompt"] { cursor: not-allowed; }
/* Re-enable read-only-acceptable controls inside the inspector that aren't
   parameter fields. Audio playback, the file picker on Upload nodes, etc.
   are already handled because they don't carry data-field. */

/* Inline {{var}} highlighting in prompt/instruction textareas.
   Strategy: keep the textarea's text fully visible (default fg colour)
   so what the user types is never hidden. An overlay div sits ON TOP
   (pointer-events:none) and renders the same content with transparent
   text — only the {{var}} spans paint anything: an opaque amber chip
   that covers the underlying token text and re-prints it in amber.
   Padding / border / font on the overlay must match .field-textarea
   so each chip lines up exactly with the typed token. */
.var-wrap {
  position: relative; display: block;
  background: var(--bg-0);
  border: 1px solid var(--line);
  border-radius: 6px;
  transition: border-color 0.12s;
}
.var-wrap:focus-within { border-color: var(--amber); }
.var-wrap > textarea.field-textarea {
  position: relative; z-index: 1;
  background: transparent;
  border: 1px solid transparent;     /* preserve metrics — wrap shows the real border */
}
.var-wrap .var-overlay {
  position: absolute; inset: 0; z-index: 2;
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 8px 10px;
  font-family: inherit; font-size: 14px; line-height: 1.5;
  white-space: pre-wrap; word-wrap: break-word; overflow: hidden;
  color: transparent;                 /* plain text comes from the textarea below */
  pointer-events: none;
}
.var-wrap .var-token {
  /* Soft amber chip painted on top of the textarea's {{var}} text. The
     bg must be OPAQUE — at 15% wash the cream textarea text bleeds
     through and clashes with the chip's amber re-print. No padding /
     margin / weight — they'd change rendered width and the cursor
     would drift from the visible glyphs (see commit 39af5c4). */
  color: var(--amber);
  background: oklch(0.90 0.025 75);
  border-radius: 3px;
}
.var-wrap .var-token.unknown {
  color: oklch(0.55 0.16 25);
  background: oklch(0.92 0.03 75);
  border-radius: 3px;
}
.field-helper { font-size: 10.5px; color: var(--fg-3); margin-top: 4px; line-height: 1.4; }
.generated-text {
  display: block; width: 100%; box-sizing: border-box;
  padding: 10px 12px; background: var(--bg-0); border: 1px solid var(--line);
  border-left: 2px solid var(--amber); border-radius: 6px;
  color: var(--fg-0); font-size: 14px; line-height: 1.55;
  min-height: 80px; max-height: 280px;
  overflow-y: auto; white-space: pre-wrap; font-family: inherit;
  resize: vertical; outline: none;
  transition: border-color 0.12s;
}
textarea.generated-text:focus { border-color: var(--amber); }
/* View-only mode dims most field controls but the generated-text editor
   is intentionally exempt — share recipients are expected to refine the
   draft text without needing edit access to the underlying prompt. */
body.view-only textarea.generated-text {
  opacity: 1; pointer-events: auto; cursor: text;
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip-row { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  padding: 4px 9px; font-size: 13px; color: var(--fg-2);
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
.chip:hover { color: var(--fg-0); border-color: var(--bg-4); }
.chip.active { color: oklch(0.18 0.03 65); background: var(--amber); border-color: var(--amber); font-weight: 500; }
.insp-status {
  font-size: 13px; padding: 7px 10px; border-radius: 6px;
  background: var(--bg-2); color: var(--fg-2); line-height: 1.4;
}
.insp-status.error { color: var(--err); background: oklch(0.70 0.18 25 / 0.1); }
.insp-run-count { font-size: 12px; color: var(--fg-3); font-family: var(--type-mono); text-align: right; }
.file-thumb-expired {

  width: 100%; height: 100%; gap: 4px;
  font-size: 12px; color: var(--fg-3); text-align: center; padding: 4px;
}
.file-thumb-expired svg { opacity: 0.4; }

/* ── Queue / Done panels ────────────────────────────────────────────────── */
.queue-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg-2); margin-bottom: 6px;
}
.queue-thumb {
  width: 32px; height: 32px; border-radius: 4px; background: var(--bg-3);
  object-fit: cover; flex-shrink: 0; overflow: hidden;
}
.queue-thumb img, .queue-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.queue-info { flex: 1; min-width: 0; }
.queue-name { font-size: 14px; color: var(--fg-0); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-sub { font-family: var(--type-mono); font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; }
.queue-bar { height: 3px; background: var(--bg-0); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.queue-bar-fill { height: 100%; background: var(--amber); transition: width 0.4s ease; }

/* ── Inputs-tab upload section ──────────────────────────────────────────── */
.inputs-upload {
  padding: 12px 14px 14px; border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.inputs-upload-title {
  font-family: var(--type-mono); font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--fg-3); margin-bottom: 8px;
}
.inputs-upload-preview {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 6px; margin-bottom: 6px;
}
.inputs-upload-thumb {
  width: 36px; height: 36px; border-radius: 4px; background: var(--bg-0);
  flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.inputs-upload-thumb img,
.inputs-upload-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.inputs-upload-info { flex: 1; min-width: 0; }
.inputs-upload-name {
  font-size: 13px; color: var(--fg-1); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.inputs-upload-meta { font-family: var(--type-mono); font-size: 12px; color: var(--fg-3); }
.inputs-upload-remove {
  width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0;
  display: grid; place-items: center; color: var(--fg-3);
}
.inputs-upload-remove:hover { background: var(--bg-3); color: var(--err); }
.inputs-upload-btn {
  display: block; width: 100%; padding: 7px; text-align: center;
  border: 1px dashed var(--line); border-radius: 6px;
  font-size: 13px; color: var(--fg-3); cursor: pointer;
  transition: border-color 0.12s, color 0.12s; background: none;
}
.inputs-upload-btn:hover { border-color: var(--amber-dim); color: var(--fg-1); }
.inputs-upload-input { display: none; }

/* ── Upload node ────────────────────────────────────────────────────────── */
.node-upload-drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; padding: 18px 12px; margin: 6px 8px 8px;
  border: 1.5px dashed var(--line); border-radius: 6px;
  cursor: pointer; text-align: center; color: var(--fg-3);
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.node-upload-drop:hover, .node.upload-drag-over .node-upload-drop {
  border-color: var(--amber-dim); background: var(--amber-glow); color: var(--fg-1);
}
.node-upload-drop svg { width: 18px; height: 18px; opacity: 0.55; }
.node-upload-drop-hint { font-size: 12px; font-family: var(--type-mono); line-height: 1.5; }
.node-upload-drop-hint small { display: block; color: var(--fg-3); font-size: 11px; }
.node-upload-preview { position: relative; }
.node-upload-replace {
  position: absolute; top: 5px; right: 5px; z-index: 2;
  background: oklch(0 0 0 / 0.6); color: #fff;
  border: none; border-radius: 4px; font-size: 11px; padding: 3px 7px;
  font-family: var(--type-mono); cursor: pointer;
  opacity: 0; transition: opacity 0.15s; pointer-events: auto;
}
.node-upload-preview:hover .node-upload-replace { opacity: 1; }

/* ── Empty state ────────────────────────────────────────────────────────── */
.empty-state { padding: 40px 20px; text-align: center; color: var(--fg-3); }
.empty-state-title {
  font-family: var(--type-display); font-size: 20px; color: var(--fg-1);
  margin: 12px 0 4px; font-style: italic;
}
.empty-state-sub { font-size: 14px; line-height: 1.5; }
</style>

<script>
  // ── Project context ──────────────────────────────────────────────────────
  const _urlParams = new URLSearchParams(location.search);
  const projectId  = _urlParams.get('project');
  const WORKFLOW_API = projectId
    ? '/api/projects/' + encodeURIComponent(projectId) + '/workflow'
    : '/api/workflow';

  // Project role state. Populated from /api/projects/<pid> below.
  //   'owner' — full access
  //   'edit'  — can change anything except sharing/delete
  //   'view'  — can run nodes and edit project inputs/variables only
  // We start as 'edit' so the editor stays interactive while the role check
  // is still in flight; once /api/projects/<pid> resolves we lock down to
  // view-mode if that's what came back.
  let projectRole = 'edit';
  function canEdit() { return projectRole === 'owner' || projectRole === 'edit'; }
  function isViewOnly() { return projectRole === 'view'; }

  if (projectId) {
    fetch('/api/projects/' + encodeURIComponent(projectId))
      .then(r => r.json())
      .then(d => {
        if (d.ok) {
          document.getElementById('topbar-project').textContent = d.name;
          projectRole = d.your_role || 'edit';
          applyAccessMode();
          // Re-render the inspector so disabled-state updates land on any
          // node selection that happened before the role came back.
          if (typeof renderRightPanel === 'function') renderRightPanel();
        }
      })
      .catch(() => {});
  }

  // Decorate <body> so the CSS can lock down node-editing affordances when
  // the user only has view access. Run + Input-tab actions stay enabled —
  // they're explicitly part of view-mode. The disabled-state styling on
  // the controls themselves is enough to signal mode to the user; we don't
  // need a top-of-page banner.
  function applyAccessMode() {
    document.body.classList.toggle('view-only', isViewOnly());
  }

  // ── State ────────────────────────────────────────────────────────────────
  const nodes = new Map();   // id -> node
  const edges = [];          // { id, fromId, toId }
  const selected = new Set();
  const projectInputs = [];  // { id, name, kind, url, path, ts } — project-scope assets
  const projectVars = [];    // { id, key, value } — project-scope text variables, {{key}} in prompts
  const outputsSelected = new Set();  // file refs ticked for bulk download in the Output tab.
                                       // Each ref is "<nodeId>:upload" (the
                                       // node's uploadUrl) or "<nodeId>:r<i>"
                                       // (the i-th result on that node).

  // Bulk download: POSTs the selected refs to the project's outputs/download
  // endpoint, which streams back a zip. Server resolves each ref against the
  // saved workflow.json and packages the matching files. Triggers a blob
  // download client-side.
  async function downloadOutputsPackage() {
    if (!projectId) { toast('No project context', 'error'); return; }
    if (!outputsSelected.size) return;
    const refs = [...outputsSelected];
    const btn = document.getElementById('files-selbar-download');
    if (btn) { btn.disabled = true; btn.textContent = 'Packaging…'; }
    const url = `/api/projects/${encodeURIComponent(projectId)}/outputs/download`;
    console.log('[download-outputs] POST', url, 'refs:', refs.length);
    try {
      const t0 = performance.now();
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ refs }),
      });
      console.log('[download-outputs] response', resp.status, 'after', Math.round(performance.now() - t0), 'ms');
      if (!resp.ok) {
        let msg = `HTTP ${resp.status}`;
        try { const d = await resp.json(); if (d?.error) msg = d.error; } catch (_) {}
        console.log('[download-outputs] failed', resp.status, url, msg);
        throw new Error(msg);
      }
      const blob = await resp.blob();
      console.log('[download-outputs] blob', blob.size, 'bytes', blob.type);
      // Pull the filename out of Content-Disposition so the saved file
      // matches what the server picked (project name + "-outputs.zip").
      const cd = resp.headers.get('Content-Disposition') || '';
      let filename = 'outputs.zip';
      const utf8 = cd.match(/filename\*=UTF-8''([^;]+)/i);
      const ascii = cd.match(/filename="([^"]+)"/i);
      if (utf8) { try { filename = decodeURIComponent(utf8[1]); } catch (_) {} }
      else if (ascii) filename = ascii[1];
      const a = document.createElement('a');
      const blobUrl = URL.createObjectURL(blob);
      a.href = blobUrl; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      toast(`Downloaded ${refs.length} file${refs.length === 1 ? '' : 's'}`, 'success');
    } catch (err) {
      toast('Download failed: ' + err.message, 'error');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Download'; }
    }
  }

  const view = { x: 0, y: 0, scale: 1 };
  let nextId = 1;

  // Right-panel state — declared up-front so renderRightPanel() and the
  // initial updateSelInfo() call don't hit a TDZ error.
  let inputsFilter = 'all';
  let inputsGroupBy = 'type';

  const NODE_SPECS = {
    upload:{ title: 'Upload', hasIn: false, hasOut: true },
    text:  { title: 'Text',  hasIn: true,  hasOut: true },
    image: { title: 'Image', hasIn: true,  hasOut: true },
    video: { title: 'Video', hasIn: true,  hasOut: true },
    audio: { title: 'Audio', hasIn: true,  hasOut: true },
    edit:  { title: 'Edit',  hasIn: true,  hasOut: true },
  };

  // SVG icons for node types and actions
  const ICONS = {
    text:   `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h10M8 4v9M5 13h6"/></svg>`,
    image:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 10l3-3 3 3 2.5-2.5L14 10"/><circle cx="11" cy="6" r="1" fill="currentColor" stroke="none"/></svg>`,
    video:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="10" height="8" rx="1.5"/><path d="M11 7l4-2v6l-4-2V7z" fill="currentColor" stroke="none"/></svg>`,
    audio:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6v4M6 4v8M9 5v6M12 3v10"/></svg>`,
    upload: `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V3M5 6l3-3 3 3M3 13h10"/></svg>`,
    play:   `<svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3l9 5-9 5V3z"/></svg>`,
    dup:    `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M5 5V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1"/></svg>`,
    trash:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5 4.5v8a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-8"/></svg>`,
    check:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3.5 8.5l3 3 6-7"/></svg>`,
    chevD:  `<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>`,
    chevR:  `<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4l4 4-4 4"/></svg>`,
    layers: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2L2 5l6 3 6-3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/></svg>`,
    fit:    `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg>`,
    refresh:`<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8A6 6 0 1 0 3.5 3.5"/><path d="M2 4V8h4"/></svg>`,
    pause:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="3.5" height="10" rx="1"/><rect x="9.5" y="3" width="3.5" height="10" rx="1"/></svg>`,
    edit:   `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-1 7-7-1-1-7 7-1 2z"/><path d="M11 4l1 1"/><path d="M9 6l1 1"/></svg>`,
  };

  // ── DOM references ──────────────────────────────────────────────────────
  const canvas    = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvas-wrap');
  const edgesSvg  = document.getElementById('edges');
  const addMenu   = document.getElementById('add-menu');

  // ── Helpers ──────────────────────────────────────────────────────────────
  const uid = () => 'n' + (nextId++) + Math.random().toString(36).slice(2, 6);
  const esc = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mediaUrl = (url) => (url && /^https?:\/\//i.test(url))
    ? `/api/media_proxy?url=${encodeURIComponent(url)}`
    : (url || '');

  // navigator.clipboard.writeText only works in secure contexts (HTTPS or
  // localhost). On bare-IP HTTP deploys (like this app's typical setup)
  // navigator.clipboard is undefined; the old code did
  // navigator.clipboard?.writeText(...).then(...) which crashed with
  // "Cannot read properties of undefined (reading 'then')" — no toast,
  // no copy, no clue why. Fall back to a hidden-textarea + execCommand
  // which works in every browser regardless of TLS.
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('Clipboard write failed'));
    });
  }

  // Render a thumbnail element (img or video) for a result object.
  function resultThumb(r, cls = '') {
    if (!r) return null;
    const src = esc(mediaUrl(r.servePath || r.url));
    if (!src) return null;
    const c = cls ? ` class="${cls}"` : '';
    if (r.kind === 'video') {
      return `<video${c} src="${src}" muted preload="metadata" referrerpolicy="no-referrer"></video>`;
    }
    return `<img${c} src="${src}" alt="" referrerpolicy="no-referrer"/>`;
  }

  function markMediaExpired(el) {
    const wrap = el.closest('.file-thumb') || el.parentElement;
    if (wrap) wrap.innerHTML = `<div class="file-thumb-expired">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
      </svg>
      <span>Expired</span></div>`;
  }

  function toast(msg, kind='') {
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function applyView() {
    canvas.style.transform   = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    edgesSvg.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    const zv = document.getElementById('zoom-val');
    if (zv) zv.textContent = Math.round(view.scale * 100) + '%';
    updateMinimap();
  }

  function screenToWorld(sx, sy) {
    const rect = canvasWrap.getBoundingClientRect();
    return {
      x: (sx - rect.left - view.x) / view.scale,
      y: (sy - rect.top  - view.y) / view.scale,
    };
  }

  function updateSelInfo() {
    const nc = document.getElementById('node-count');
    if (nc) {
      if (selected.size > 0) {
        nc.textContent = `${selected.size} selected`;
        nc.classList.add('on'); nc.classList.remove('off');
      } else {
        nc.textContent = `${nodes.size} node${nodes.size===1?'':'s'}`;
        nc.classList.remove('on'); nc.classList.add('off');
      }
    }
    updateMinimap();
    updateInspector();
  }

  // ── Node creation ───────────────────────────────────────────────────────
  function createNode(type, x, y) {
    const spec = NODE_SPECS[type];
    if (!spec) return;
    const id = uid();
    const typeCount = [...nodes.values()].filter(n => n.type === type).length;
    const node = {
      id, type, x, y,
      title: spec.title + (typeCount > 0 ? ' ' + (typeCount + 1) : ''),
      prompt: '',
      params: type === 'upload' ? {} : {
        duration: type === 'audio' ? '30' : '5',
        ratio: '16:9',
        resolution: type === 'video' ? '720P' : '2k',
        modelVersion: 'seedance2.0',
        count: 1,          // per-node loop count: how many results to generate per Run press
        videoMode: 'T2V',  // video node: 'T2V' | 'I2V' | 'R2V' (reference-to-video)
      },
      status: 'idle',
      results: [],    // [{ url, kind, localPath, ts }] — newest last
      taskId: null,
      queueIdx: null,
      error: null,
      uploadUrl: null,
      uploadPath: null,
      uploadKind: null,  // upload node: 'image' | 'video' | 'audio'
      uploadRatio: null, // upload node video: detected '16/9' style ratio string
      uploadText: null,  // text node: content of an uploaded text file
    };
    nodes.set(id, node);
    renderNode(node);
    updateSelInfo();
    return node;
  }

  const STATUS_LABEL = { idle:'Idle', queued:'Queued', running:'Running', done:'Ready', error:'Error' };

  function nodeStatusHtml(node) {
    const label = STATUS_LABEL[node.status] || node.status;
    const prog = node.status === 'running' && node.progress != null ? ` · ${node.progress}%` : '';
    // Loop progress: "2/3" rendered after the status label when a
    // multi-iteration runNode is mid-loop. Only shown for running/queued
    // — done state already reports total via the results count.
    const lp = node.loopProgress;
    const loop = lp && lp.total > 1 && (node.status === 'running' || node.status === 'queued')
      ? ` · ${lp.current}/${lp.total}` : '';
    return `<span class="node-status ${node.status}"><span class="dot"></span>${label}${prog}${loop}</span>`;
  }

  function renderNode(node) {
    const existing = document.getElementById(node.id);
    if (existing) existing.remove();
    const spec = NODE_SPECS[node.type];
    const el = document.createElement('div');
    el.className = `node ${node.status}${selected.has(node.id) ? ' selected' : ''}`;
    el.id = node.id;
    el.style.left = node.x + 'px';
    el.style.top  = node.y + 'px';
    const isPassive = PASSIVE_TYPES.has(node.type);
    const nodeTitle = node.title || spec.title;
    const progressBar = node.status === 'running'
      ? `<div class="node-progress"><div class="node-progress-bar" style="width:${node.progress || 0}%"></div></div>`
      : '';
    el.innerHTML = `
      ${spec.hasIn  ? `<div class="handle in"  data-node="${node.id}" data-dir="in"></div>`  : ''}
      ${spec.hasOut ? `<div class="handle out" data-node="${node.id}" data-dir="out"></div>` : ''}
      <div class="node-checkbox" data-action="check">${selected.has(node.id) ? ICONS.check : ''}</div>
      <div class="node-head">
        <span class="node-badge">${ICONS[node.type] || ''}${esc(spec.title)}</span>
        <span class="node-title">${esc(nodeTitle)}</span>
        <div class="node-actions">
          ${node.type === 'upload'
            ? `<button class="node-action" data-action="upload" title="Choose file">${ICONS.upload}</button>`
            : (!isPassive ? `<button class="node-action run" data-action="run" title="Run">${ICONS.play}</button>` : '')}
          <button class="node-action" data-action="dup" title="Duplicate">${ICONS.dup}</button>
          <button class="node-action delete" data-action="del" title="Delete">${ICONS.trash}</button>
        </div>
      </div>
      ${renderNodeBody(node)}
      ${progressBar}
      <div class="node-foot">
        ${nodeStatusHtml(node)}
        <span>${esc(
          node.type === 'video' ? `${videoMode(node)} · ${node.params.modelVersion || ''}`
          : node.type === 'edit' ? `${upstreamNodes(node.id).filter(u => u.type === 'video' || (u.type === 'upload' && u.uploadKind === 'video')).length} clips`
          : node.type === 'upload' ? (node.uploadKind || 'image · video · audio')
          : ''
        )}</span>
      </div>
    `;
    canvas.appendChild(el);

    // Action buttons
    el.querySelector('[data-action=check]')?.addEventListener('click', e => {
      e.stopPropagation();
      toggleSelectNode(node.id);
    });
    el.querySelector('[data-action=run]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=run]')?.addEventListener('click', e => { e.stopPropagation(); runNode(node.id); });
    el.querySelector('[data-action=dup]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=dup]')?.addEventListener('click', e => { e.stopPropagation(); duplicateNode(node.id); });
    el.querySelector('[data-action=del]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=del]')?.addEventListener('click', e => { e.stopPropagation(); deleteNode(node.id); });

    // Upload node: file picker + drag-and-drop
    if (node.type === 'upload') {
      const doUpload = async (file) => {
        if (!file) return;
        const kind = file.type.startsWith('video/') ? 'video'
                   : file.type.startsWith('audio/') ? 'audio'
                   : 'image';
        const fd = new FormData(); fd.append('file', file);
        toast('Uploading…');
        try {
          const resp = await fetch('/api/upload', { method: 'POST', body: fd });
          const d = await resp.json();
          if (d.ok) {
            node.uploadUrl = d.url; node.uploadPath = d.path || null; node.uploadKind = kind; node.uploadRatio = null;
            renderNode(node); renderRightPanel(); scheduleSave();
            if (document.getElementById('panel-output')?.style.display !== 'none') renderFilesPanel();
            toast('Upload done', 'success');
          } else { toast('Upload failed', 'error'); }
        } catch { toast('Upload failed', 'error'); }
      };
      const openPicker = () => {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*,video/*,audio/*';
        inp.addEventListener('change', () => doUpload(inp.files[0]));
        inp.click();
      };
      el.querySelector('[data-action=upload]')?.addEventListener('pointerdown', e => e.stopPropagation());
      el.querySelector('[data-action=upload]')?.addEventListener('click', e => { e.stopPropagation(); openPicker(); });
      el.querySelector('[data-upload-zone]')?.addEventListener('pointerdown', e => e.stopPropagation());
      el.querySelector('[data-upload-zone]')?.addEventListener('click', e => { e.stopPropagation(); openPicker(); });
      el.querySelector('[data-upload-replace]')?.addEventListener('pointerdown', e => e.stopPropagation());
      el.querySelector('[data-upload-replace]')?.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); openPicker(); });
      el.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); el.classList.add('upload-drag-over'); } });
      el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('upload-drag-over'); });
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('upload-drag-over'); doUpload(e.dataTransfer?.files[0]); });
    }

    // Inline rename on double-click of node title
    el.querySelector('.node-title')?.addEventListener('dblclick', e => {
      e.stopPropagation();
      const titleEl = e.currentTarget;
      const input = document.createElement('input');
      input.className = 'node-title-input';
      input.value = node.title || NODE_SPECS[node.type]?.title || '';
      titleEl.replaceWith(input);
      input.focus(); input.select();
      const commit = () => {
        const val = input.value.trim();
        node.title = val || null;
        renderNode(node);
        scheduleSave();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e2 => {
        if (e2.key === 'Enter') { e2.preventDefault(); commit(); }
        if (e2.key === 'Escape') { e2.preventDefault(); renderNode(node); }
      });
      input.addEventListener('pointerdown', e2 => e2.stopPropagation());
    });

    // Video thumbnail play/pause on click (must run BEFORE the pointerdown drag handler)
    el.querySelector('[data-video-preview]')?.addEventListener('pointerdown', e => {
      e.stopPropagation(); // prevent canvas pan from firing
    });
    el.querySelector('[data-video-preview]')?.addEventListener('click', e => {
      e.stopPropagation();
      if (!selected.has(node.id)) selectOnly(node.id);
      const preview = e.currentTarget;
      const vid = preview.querySelector('video');
      if (!vid) return;
      if (vid.paused) { vid.play(); preview.classList.add('playing'); }
      else { vid.pause(); preview.classList.remove('playing'); }
    });
    el.querySelector('[data-video-preview] video')?.addEventListener('ended', e => {
      e.target.closest('[data-video-preview]')?.classList.remove('playing');
    });

    // Seek all video thumbnails to first frame; also detect real ratio for upload video nodes
    el.querySelectorAll('video[preload="metadata"]').forEach(v => {
      const seek = () => { try { v.currentTime = 0.01; } catch (_) {} };
      const detectRatio = () => {
        if (node.type === 'upload' && node.uploadKind === 'video' && v.videoWidth && v.videoHeight) {
          const ratio = `${v.videoWidth}/${v.videoHeight}`;
          if (node.uploadRatio !== ratio) {
            node.uploadRatio = ratio;
            // Update the preview container's aspect-ratio in-place — no full re-render needed
            const preview = v.closest('[data-upload-preview]');
            if (preview) preview.style.aspectRatio = ratio;
            scheduleSave();
          }
        }
      };
      const onMeta = () => { seek(); detectRatio(); };
      if (v.readyState >= 1) onMeta();
      else v.addEventListener('loadedmetadata', onMeta, { once: true });
    });

    // Selection + drag start on pointerdown anywhere on the node card
    el.addEventListener('pointerdown', (e) => {
      if (e.button === 2) return;
      // Let buttons, inputs, handles, checkbox, video previews, and upload zones handle their own events
      if (e.target.closest('button, input, textarea, select, .handle, [data-action=check], [data-video-preview], [data-upload-zone]')) return;
      e.stopPropagation();
      e.preventDefault();
      if (e.shiftKey) {
        toggleSelect(node.id);
      } else if (!selected.has(node.id)) {
        selectOnly(node.id);
      }
      // View users can select but not drag — moving nodes mutates the graph.
      if (!canEdit()) return;
      const group = [...selected].map(id => {
        const n = nodes.get(id);
        return n ? { id, origX: n.x, origY: n.y } : null;
      }).filter(Boolean);
      dragState = { group, moved: false, startX: e.clientX, startY: e.clientY };
      // Capture pointer to canvasWrap (not the node) so pointermove/pointerup fire
      // on the same element that handles pan + rubber-band — single state machine.
      canvasWrap.setPointerCapture?.(e.pointerId);
    });
  }

  function previewAspectStyle(node) {
    const r = node.params?.ratio;
    if (!r) return '';
    const parts = r.split(':').map(Number);
    if (parts.length !== 2 || !parts[0] || !parts[1]) return '';
    return ` style="aspect-ratio:${parts[0]}/${parts[1]}"`;
  }

  function renderNodeBody(node) {
    const results = node.results || [];
    const last = results[results.length - 1];
    const count = results.length;
    const countBadge = count > 1
      ? `<div class="node-output-count">${count} outputs — see Files</div>`
      : '';

    // Upload node: source-only, no generation
    if (node.type === 'upload') {
      if (!node.uploadUrl) {
        return `<div class="node-upload-drop" data-upload-zone>
          <div>${ICONS.upload}</div>
          <div class="node-upload-drop-hint">Drop or click to upload<small>image · video · audio</small></div>
        </div>`;
      }
      const kind = node.uploadKind;
      const u = esc(mediaUrl(node.uploadUrl));
      if (kind === 'video') {
        const playBadge = `<div class="video-play-badge"><svg viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg></div>`;
        const ratioStyle = node.uploadRatio ? `aspect-ratio:${node.uploadRatio}` : 'aspect-ratio:16/9';
        return `<div class="node-output-wrap"><div class="node-upload-preview node-preview" style="${ratioStyle}" data-video-preview data-upload-preview>
          <video preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover;display:block"><source src="${u}" type="video/mp4"/></video>${playBadge}
          <button class="node-upload-replace" data-upload-replace>Replace</button>
        </div></div>`;
      }
      if (kind === 'audio') {
        const bars = 28;
        const waveBars = Array.from({ length: bars }, (_, i) => {
          const h = 10 + 20 * Math.abs(Math.sin(i * 0.6 + (node.id.charCodeAt(1) || 1))) + 5 * Math.abs(Math.sin(i * 1.3));
          return `<span style="height:${h}px"></span>`;
        }).join('');
        return `<div class="node-audio-body">
          <audio id="aud-${node.id}" src="${u}" preload="none" style="display:none"></audio>
          <button class="node-action" style="width:28px;height:28px;border-radius:50%;background:var(--amber);color:oklch(0.18 0.03 65);flex-shrink:0" title="Play" data-audio-play="${esc(node.id)}">${ICONS.play}</button>
          <div class="wave">${waveBars}</div>
        </div>`;
      }
      // image (default)
      return `<div class="node-upload-preview node-preview">
        <img src="${u}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"/>
        <button class="node-upload-replace" data-upload-replace>Replace</button>
      </div>`;
    }

    if (node.type === 'text') {
      // Prefer the most recent generated output; fall back to the user's instruction.
      const generated = last?.kind === 'text' ? last.text : '';
      const display = generated || node.prompt || '';
      if (display) {
        const labelCls = generated ? 'node-text-label generated' : 'node-text-label';
        const labelTxt = generated ? 'OUTPUT' : 'INSTRUCTION';
        return `<div class="node-text-body">
          <div class="${labelCls}">${labelTxt}</div>
          ${esc(display.slice(0, 360))}${display.length > 360 ? '…' : ''}
        </div>${countBadge}`;
      }
      return `<div class="node-preview empty">Type an instruction or connect inputs</div>`;
    }

    if (node.type === 'audio') {
      // Prefer generated result; fall back to manual upload.
      const audioSrc = (last?.kind === 'audio' ? (last.servePath || last.url) : null) || node.uploadUrl;
      if (audioSrc) {
        const bars = 28;
        const waveBars = Array.from({ length: bars }, (_, i) => {
          const h = 10 + 20 * Math.abs(Math.sin(i * 0.6 + (node.id.charCodeAt(1) || 1))) + 5 * Math.abs(Math.sin(i * 1.3));
          return `<span style="height:${h}px"></span>`;
        }).join('');
        const isGenerated = !!(last?.kind === 'audio');
        const badge = isGenerated ? `<div class="node-text-label generated" style="position:absolute;top:6px;right:8px">GEN</div>` : '';
        return `<div class="node-audio-body" style="position:relative">
          ${badge}
          <audio id="aud-${node.id}" src="${esc(mediaUrl(audioSrc))}" preload="none" style="display:none"></audio>
          <button class="node-action" style="width:28px;height:28px;border-radius:50%;background:var(--amber);color:oklch(0.18 0.03 65);flex-shrink:0" title="Play" data-audio-play="${esc(node.id)}">${ICONS.play}</button>
          <div class="wave">${waveBars}</div>
          ${countBadge}
        </div>`;
