  <div class="add-menu-item" data-node-type="edit">
    <span class="icon">✂️</span>
    <div><div>Edit</div><div class="sub">AI-planned trim · speed · concat</div></div>
  </div>
</div>


<div class="side-right" id="side-right">
  <div id="right-panel-content"></div>
</div>

<script>
  // ── Project context ──────────────────────────────────────────────────────
  const _urlParams = new URLSearchParams(location.search);
  const projectId  = _urlParams.get('project');
  const WORKFLOW_API = projectId
    ? '/api/projects/' + encodeURIComponent(projectId) + '/workflow'
    : '/api/workflow';
  if (projectId) {
    fetch('/api/projects/' + encodeURIComponent(projectId))
      .then(r => r.json())
      .then(d => { if (d.ok) document.getElementById('topbar-project').textContent = d.name; })
      .catch(() => {});
  }

  // ── State ────────────────────────────────────────────────────────────────
  const nodes = new Map();   // id -> node
  const edges = [];          // { id, fromId, toId }
  const selected = new Set();

  const view = { x: 0, y: 0, scale: 1 };
  let nextId = 1;

  // Right-panel state — declared up-front so renderRightPanel() and the
  // initial updateSelInfo() call don't hit a TDZ error.
  let inputsFilter = 'all';
  let inputsGroupBy = 'type';

  const NODE_SPECS = {
    upload:{ title: 'Upload', hasIn: false, hasOut: true },
    text:  { title: 'Text',  hasIn: true,  hasOut: true },
    image: { title: 'Image', hasIn: true,  hasOut: true },
    video: { title: 'Video', hasIn: true,  hasOut: true },
    audio: { title: 'Audio', hasIn: true,  hasOut: true },
    edit:  { title: 'Edit',  hasIn: true,  hasOut: true },
  };

  // SVG icons for node types and actions
  const ICONS = {
    text:   `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h10M8 4v9M5 13h6"/></svg>`,
    image:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 10l3-3 3 3 2.5-2.5L14 10"/><circle cx="11" cy="6" r="1" fill="currentColor" stroke="none"/></svg>`,
    video:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="10" height="8" rx="1.5"/><path d="M11 7l4-2v6l-4-2V7z" fill="currentColor" stroke="none"/></svg>`,
    audio:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6v4M6 4v8M9 5v6M12 3v10"/></svg>`,
    upload: `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V3M5 6l3-3 3 3M3 13h10"/></svg>`,
    play:   `<svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3l9 5-9 5V3z"/></svg>`,
    dup:    `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M5 5V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1"/></svg>`,
    trash:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5 4.5v8a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-8"/></svg>`,
    check:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3.5 8.5l3 3 6-7"/></svg>`,
    chevD:  `<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg>`,
    chevR:  `<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4l4 4-4 4"/></svg>`,
    layers: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2L2 5l6 3 6-3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/></svg>`,
    fit:    `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg>`,
    refresh:`<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8A6 6 0 1 0 3.5 3.5"/><path d="M2 4V8h4"/></svg>`,
    pause:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="3.5" height="10" rx="1"/><rect x="9.5" y="3" width="3.5" height="10" rx="1"/></svg>`,
    edit:   `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-1 7-7-1-1-7 7-1 2z"/><path d="M11 4l1 1"/><path d="M9 6l1 1"/></svg>`,
  };

  // ── DOM references ──────────────────────────────────────────────────────
  const canvas    = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvas-wrap');
  const edgesSvg  = document.getElementById('edges');
  const addMenu   = document.getElementById('add-menu');

  // ── Helpers ──────────────────────────────────────────────────────────────
  const uid = () => 'n' + (nextId++) + Math.random().toString(36).slice(2, 6);
  const esc = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mediaUrl = (url) => (url && /^https?:\/\//i.test(url))
    ? `/api/media_proxy?url=${encodeURIComponent(url)}`
    : (url || '');

  // Render a thumbnail element (img or video) for a result object.
  function resultThumb(r, cls = '') {
    if (!r) return null;
    const src = esc(mediaUrl(r.servePath || r.url));
    if (!src) return null;
    const c = cls ? ` class="${cls}"` : '';
    if (r.kind === 'video') {
      return `<video${c} src="${src}" muted preload="metadata" referrerpolicy="no-referrer"></video>`;
    }
    return `<img${c} src="${src}" alt="" referrerpolicy="no-referrer"/>`;
  }

  function markMediaExpired(el) {
    const wrap = el.closest('.file-thumb') || el.parentElement;
    if (wrap) wrap.innerHTML = `<div class="file-thumb-expired">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
      </svg>
      <span>Expired</span></div>`;
  }

  function toast(msg, kind='') {
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function applyView() {
    canvas.style.transform   = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    edgesSvg.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    const zv = document.getElementById('zoom-val');
    if (zv) zv.textContent = Math.round(view.scale * 100) + '%';
    updateMinimap();
  }

  function screenToWorld(sx, sy) {
    const rect = canvasWrap.getBoundingClientRect();
    return {
      x: (sx - rect.left - view.x) / view.scale,
      y: (sy - rect.top  - view.y) / view.scale,
    };
  }

  function updateSelInfo() {
    const nc = document.getElementById('node-count');
    if (nc) {
      if (selected.size > 0) {
        nc.textContent = `${selected.size} selected`;
        nc.classList.add('on'); nc.classList.remove('off');
      } else {
        nc.textContent = `${nodes.size} node${nodes.size===1?'':'s'}`;
        nc.classList.remove('on'); nc.classList.add('off');
      }
    }
    updateMinimap();
    updateInspector();
  }

  // ── Node creation ───────────────────────────────────────────────────────
  function createNode(type, x, y) {
    const spec = NODE_SPECS[type];
    if (!spec) return;
    const id = uid();
    const typeCount = [...nodes.values()].filter(n => n.type === type).length;
    const node = {
      id, type, x, y,
      title: spec.title + (typeCount > 0 ? ' ' + (typeCount + 1) : ''),
      prompt: '',
      params: type === 'upload' ? {} : {
        duration: type === 'audio' ? '30' : '5',
        ratio: '16:9',
        resolution: type === 'video' ? '720P' : '2k',
        modelVersion: 'seedance2.0',
      },
      status: 'idle',
      results: [],    // [{ url, kind, localPath, ts }] — newest last
      taskId: null,
      queueIdx: null,
      error: null,
      uploadUrl: null,
      uploadPath: null,
      uploadKind: null,  // upload node: 'image' | 'video' | 'audio'
      uploadRatio: null, // upload node video: detected '16/9' style ratio string
      uploadText: null,  // text node: content of an uploaded text file
    };
    nodes.set(id, node);
    renderNode(node);
    updateSelInfo();
    return node;
  }

  const STATUS_LABEL = { idle:'Idle', queued:'Queued', running:'Running', done:'Ready', error:'Error' };

  function nodeStatusHtml(node) {
    const label = STATUS_LABEL[node.status] || node.status;
    const prog = node.status === 'running' && node.progress != null ? ` · ${node.progress}%` : '';
    return `<span class="node-status ${node.status}"><span class="dot"></span>${label}${prog}</span>`;
  }

  function renderNode(node) {
    const existing = document.getElementById(node.id);
    if (existing) existing.remove();
    const spec = NODE_SPECS[node.type];
    const el = document.createElement('div');
    el.className = `node ${node.status}${selected.has(node.id) ? ' selected' : ''}`;
    el.id = node.id;
    el.style.left = node.x + 'px';
    el.style.top  = node.y + 'px';
    const isPassive = PASSIVE_TYPES.has(node.type);
    const nodeTitle = node.title || spec.title;
    const progressBar = node.status === 'running'
      ? `<div class="node-progress"><div class="node-progress-bar" style="width:${node.progress || 0}%"></div></div>`
      : '';
    el.innerHTML = `
      ${spec.hasIn  ? `<div class="handle in"  data-node="${node.id}" data-dir="in"></div>`  : ''}
      ${spec.hasOut ? `<div class="handle out" data-node="${node.id}" data-dir="out"></div>` : ''}
      <div class="node-checkbox" data-action="check">${selected.has(node.id) ? ICONS.check : ''}</div>
      <div class="node-head">
        <span class="node-badge">${ICONS[node.type] || ''}${esc(spec.title)}</span>
        <span class="node-title">${esc(nodeTitle)}</span>
        <div class="node-actions">
          ${node.type === 'upload'
            ? `<button class="node-action" data-action="upload" title="Choose file">${ICONS.upload}</button>`
            : (!isPassive ? `<button class="node-action run" data-action="run" title="Run">${ICONS.play}</button>` : '')}
          <button class="node-action" data-action="dup" title="Duplicate">${ICONS.dup}</button>
          <button class="node-action delete" data-action="del" title="Delete">${ICONS.trash}</button>
        </div>
      </div>
      ${renderNodeBody(node)}
      ${progressBar}
      <div class="node-foot">
        ${nodeStatusHtml(node)}
        <span>${esc(
          node.type === 'video' ? `${videoMode(node)} · ${node.params.modelVersion || ''}`
          : node.type === 'edit' ? `${upstreamNodes(node.id).filter(u => u.type === 'video' || (u.type === 'upload' && u.uploadKind === 'video')).length} clips`
          : node.type === 'upload' ? (node.uploadKind || 'image · video · audio')
          : ''
        )}</span>
      </div>
    `;
    canvas.appendChild(el);

    // Action buttons
    el.querySelector('[data-action=check]')?.addEventListener('click', e => {
      e.stopPropagation();
      toggleSelectNode(node.id);
    });
    el.querySelector('[data-action=run]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=run]')?.addEventListener('click', e => { e.stopPropagation(); runNode(node.id); });
    el.querySelector('[data-action=dup]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=dup]')?.addEventListener('click', e => { e.stopPropagation(); duplicateNode(node.id); });
    el.querySelector('[data-action=del]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=del]')?.addEventListener('click', e => { e.stopPropagation(); deleteNode(node.id); });

    // Upload node: file picker + drag-and-drop
    if (node.type === 'upload') {
      const doUpload = async (file) => {
        if (!file) return;
        const kind = file.type.startsWith('video/') ? 'video'
                   : file.type.startsWith('audio/') ? 'audio'
                   : 'image';
        const fd = new FormData(); fd.append('file', file);
        toast('Uploading…');
        try {
          const resp = await fetch('/api/upload', { method: 'POST', body: fd });
          const d = await resp.json();
          if (d.ok) {
            node.uploadUrl = d.url; node.uploadPath = d.path || null; node.uploadKind = kind; node.uploadRatio = null;
            renderNode(node); renderRightPanel(); scheduleSave();
            if (document.getElementById('panel-files')?.style.display !== 'none') renderFilesPanel();
            toast('Upload done', 'success');
          } else { toast('Upload failed', 'error'); }
        } catch { toast('Upload failed', 'error'); }
      };
      const openPicker = () => {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'image/*,video/*,audio/*';
        inp.addEventListener('change', () => doUpload(inp.files[0]));
        inp.click();
      };
      el.querySelector('[data-action=upload]')?.addEventListener('pointerdown', e => e.stopPropagation());
      el.querySelector('[data-action=upload]')?.addEventListener('click', e => { e.stopPropagation(); openPicker(); });
      el.querySelector('[data-upload-zone]')?.addEventListener('pointerdown', e => e.stopPropagation());
      el.querySelector('[data-upload-zone]')?.addEventListener('click', e => { e.stopPropagation(); openPicker(); });
      el.querySelector('[data-upload-replace]')?.addEventListener('pointerdown', e => e.stopPropagation());
      el.querySelector('[data-upload-replace]')?.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); openPicker(); });
      el.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); el.classList.add('upload-drag-over'); } });
      el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('upload-drag-over'); });
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('upload-drag-over'); doUpload(e.dataTransfer?.files[0]); });
    }

    // Inline rename on double-click of node title
    el.querySelector('.node-title')?.addEventListener('dblclick', e => {
      e.stopPropagation();
      const titleEl = e.currentTarget;
      const input = document.createElement('input');
      input.className = 'node-title-input';
      input.value = node.title || NODE_SPECS[node.type]?.title || '';
      titleEl.replaceWith(input);
      input.focus(); input.select();
      const commit = () => {
        const val = input.value.trim();
        node.title = val || null;
        renderNode(node);
        scheduleSave();
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e2 => {
        if (e2.key === 'Enter') { e2.preventDefault(); commit(); }
        if (e2.key === 'Escape') { e2.preventDefault(); renderNode(node); }
      });
      input.addEventListener('pointerdown', e2 => e2.stopPropagation());
    });

    // Video thumbnail play/pause on click (must run BEFORE the pointerdown drag handler)
    el.querySelector('[data-video-preview]')?.addEventListener('pointerdown', e => {
      e.stopPropagation(); // prevent canvas pan from firing
    });
    el.querySelector('[data-video-preview]')?.addEventListener('click', e => {
      e.stopPropagation();
      if (!selected.has(node.id)) selectOnly(node.id);
      const preview = e.currentTarget;
      const vid = preview.querySelector('video');
      if (!vid) return;
      if (vid.paused) { vid.play(); preview.classList.add('playing'); }
      else { vid.pause(); preview.classList.remove('playing'); }
    });
    el.querySelector('[data-video-preview] video')?.addEventListener('ended', e => {
      e.target.closest('[data-video-preview]')?.classList.remove('playing');
    });

    // Seek all video thumbnails to first frame; also detect real ratio for upload video nodes
    el.querySelectorAll('video[preload="metadata"]').forEach(v => {
      const seek = () => { try { v.currentTime = 0.01; } catch (_) {} };
      const detectRatio = () => {
        if (node.type === 'upload' && node.uploadKind === 'video' && v.videoWidth && v.videoHeight) {
          const ratio = `${v.videoWidth}/${v.videoHeight}`;
          if (node.uploadRatio !== ratio) {
            node.uploadRatio = ratio;
            // Update the preview container's aspect-ratio in-place — no full re-render needed
            const preview = v.closest('[data-upload-preview]');
            if (preview) preview.style.aspectRatio = ratio;
            scheduleSave();
          }
        }
      };
      const onMeta = () => { seek(); detectRatio(); };
      if (v.readyState >= 1) onMeta();
      else v.addEventListener('loadedmetadata', onMeta, { once: true });
    });

    // Selection + drag start on pointerdown anywhere on the node card
    el.addEventListener('pointerdown', (e) => {
      if (e.button === 2) return;
      // Let buttons, inputs, handles, checkbox, video previews, and upload zones handle their own events
      if (e.target.closest('button, input, textarea, select, .handle, [data-action=check], [data-video-preview], [data-upload-zone]')) return;
      e.stopPropagation();
      e.preventDefault();
      if (e.shiftKey) {
        toggleSelect(node.id);
      } else if (!selected.has(node.id)) {
        selectOnly(node.id);
      }
      const group = [...selected].map(id => {
        const n = nodes.get(id);
        return n ? { id, origX: n.x, origY: n.y } : null;
      }).filter(Boolean);
      dragState = { group, moved: false, startX: e.clientX, startY: e.clientY };
      // Capture pointer to canvasWrap (not the node) so pointermove/pointerup fire
      // on the same element that handles pan + rubber-band — single state machine.
      canvasWrap.setPointerCapture?.(e.pointerId);
    });
  }

  function previewAspectStyle(node) {
    const r = node.params?.ratio;
    if (!r) return '';
    const parts = r.split(':').map(Number);
    if (parts.length !== 2 || !parts[0] || !parts[1]) return '';
    return ` style="aspect-ratio:${parts[0]}/${parts[1]}"`;
  }

  function renderNodeBody(node) {
    const results = node.results || [];
    const last = results[results.length - 1];
    const count = results.length;
    const countBadge = count > 1
      ? `<div class="node-output-count">${count} outputs — see Files</div>`
      : '';

    // Upload node: source-only, no generation
    if (node.type === 'upload') {
      if (!node.uploadUrl) {
        return `<div class="node-upload-drop" data-upload-zone>
          <div>${ICONS.upload}</div>
          <div class="node-upload-drop-hint">Drop or click to upload<small>image · video · audio</small></div>
        </div>`;
      }
      const kind = node.uploadKind;
      const u = esc(mediaUrl(node.uploadUrl));
      if (kind === 'video') {
        const playBadge = `<div class="video-play-badge"><svg viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg></div>`;
        const ratioStyle = node.uploadRatio ? `aspect-ratio:${node.uploadRatio}` : 'aspect-ratio:16/9';
        return `<div class="node-output-wrap"><div class="node-upload-preview node-preview" style="${ratioStyle}" data-video-preview data-upload-preview>
          <video preload="metadata" muted playsinline style="width:100%;height:100%;object-fit:cover;display:block"><source src="${u}" type="video/mp4"/></video>${playBadge}
          <button class="node-upload-replace" data-upload-replace>Replace</button>
        </div></div>`;
      }
      if (kind === 'audio') {
        const bars = 28;
        const waveBars = Array.from({ length: bars }, (_, i) => {
          const h = 10 + 20 * Math.abs(Math.sin(i * 0.6 + (node.id.charCodeAt(1) || 1))) + 5 * Math.abs(Math.sin(i * 1.3));
          return `<span style="height:${h}px"></span>`;
        }).join('');
        return `<div class="node-audio-body">
          <audio id="aud-${node.id}" src="${u}" preload="none" style="display:none"></audio>
          <button class="node-action" style="width:28px;height:28px;border-radius:50%;background:var(--amber);color:oklch(0.18 0.03 65);flex-shrink:0" title="Play" data-audio-play="${esc(node.id)}">${ICONS.play}</button>
          <div class="wave">${waveBars}</div>
        </div>`;
      }
      // image (default)
      return `<div class="node-upload-preview node-preview">
        <img src="${u}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"/>
        <button class="node-upload-replace" data-upload-replace>Replace</button>
      </div>`;
    }

    if (node.type === 'text') {
      // Prefer the most recent generated output; fall back to the user's instruction.
      const generated = last?.kind === 'text' ? last.text : '';
      const display = generated || node.prompt || '';
      if (display) {
        const labelCls = generated ? 'node-text-label generated' : 'node-text-label';
        const labelTxt = generated ? 'OUTPUT' : 'INSTRUCTION';
        return `<div class="node-text-body">
          <div class="${labelCls}">${labelTxt}</div>
          ${esc(display.slice(0, 360))}${display.length > 360 ? '…' : ''}
        </div>${countBadge}`;
      }
      return `<div class="node-preview empty">Type an instruction or connect inputs</div>`;
    }

    if (node.type === 'audio') {
      // Prefer generated result; fall back to manual upload.
      const audioSrc = (last?.kind === 'audio' ? (last.servePath || last.url) : null) || node.uploadUrl;
      if (audioSrc) {
        const bars = 28;
        const waveBars = Array.from({ length: bars }, (_, i) => {
          const h = 10 + 20 * Math.abs(Math.sin(i * 0.6 + (node.id.charCodeAt(1) || 1))) + 5 * Math.abs(Math.sin(i * 1.3));
          return `<span style="height:${h}px"></span>`;
        }).join('');
        const isGenerated = !!(last?.kind === 'audio');
        const badge = isGenerated ? `<div class="node-text-label generated" style="position:absolute;top:6px;right:8px">GEN</div>` : '';
        return `<div class="node-audio-body" style="position:relative">
          ${badge}
          <audio id="aud-${node.id}" src="${esc(mediaUrl(audioSrc))}" preload="none" style="display:none"></audio>
          <button class="node-action" style="width:28px;height:28px;border-radius:50%;background:var(--amber);color:oklch(0.18 0.03 65);flex-shrink:0" title="Play" data-audio-play="${esc(node.id)}">${ICONS.play}</button>
          <div class="wave">${waveBars}</div>
          ${countBadge}
        </div>`;
      }
      if (node.status === 'running') return `<div class="node-preview empty">Generating…</div>`;
      if (node.status === 'queued')  return `<div class="node-preview empty">Queued…</div>`;
      return `<div class="node-preview empty">Type a prompt or upload a file</div>`;
    }

    // Edit node: show output if done, else filmstrip of upstream clips
    if (node.type === 'edit') {
      if (last?.url || last?.servePath) {
        const u = mediaUrl(last.servePath || last.url);
        const playBadge = `<div class="video-play-badge"><svg viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg></div>`;
        // Derive ratio from first upstream video node's params, fall back to 16:9
        const firstVidUp = upstreamNodes(node.id).find(u => u.type === 'video');
        const editRatio = firstVidUp?.params?.ratio || '16:9';
        const editRatioParts = editRatio.split(':').map(Number);
        const editAspect = (editRatioParts.length === 2 && editRatioParts[0] && editRatioParts[1])
          ? `aspect-ratio:${editRatioParts[0]}/${editRatioParts[1]}`
          : 'aspect-ratio:16/9';
        return `<div class="node-output-wrap"><div class="node-preview" style="${editAspect}" data-video-preview>
          <video preload="metadata" muted playsinline referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"><source src="${esc(u)}" type="video/mp4"/></video>${playBadge}
        </div>${countBadge}</div>`;
      }
      if (node.status === 'running') return `<div class="node-preview empty">Editing…</div>`;
      if (node.status === 'queued')  return `<div class="node-preview empty">Queued…</div>`;
      const videoUps = upstreamNodes(node.id).filter(u => u.type === 'video' || (u.type === 'upload' && u.uploadKind === 'video'));
      const audioUps = upstreamNodes(node.id).filter(u => u.type === 'audio' || (u.type === 'upload' && u.uploadKind === 'audio'));
      if (!videoUps.length) return `<div class="node-preview empty">Connect Video or Upload nodes to edit</div>`;
      const stripItems = videoUps.map(u => {
        const uLast = u.results?.[u.results.length - 1];
        const src = uLast ? (uLast.servePath || uLast.url) : (u.uploadUrl || null);
        const isVid = uLast?.kind === 'video' || u.type === 'upload';
        const mediaEl = src
          ? (isVid
              ? `<video src="${esc(mediaUrl(src))}" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block"></video>`
              : `<img src="${esc(mediaUrl(src))}" style="width:100%;height:100%;object-fit:cover;display:block"/>`)
          : `<div style="display:grid;place-items:center;height:100%;color:var(--fg-3)">${ICONS.video}</div>`;
        return `<div class="node-edit-clip">${mediaEl}<div class="node-edit-clip-label">${esc(u.title || 'Video')}</div></div>`;
      }).join('');
      const audioNote = audioUps.length
        ? `<div class="node-edit-audio-note">${ICONS.audio} +${audioUps.length} audio</div>` : '';
      return `<div class="node-edit-strip">${stripItems}</div>${audioNote}`;
    }

    const aspectStyle = previewAspectStyle(node);
    if (last?.url || last?.localPath || last?.servePath) {
      const u = mediaUrl(last.servePath || last.url);
      const playBadge = `<div class="video-play-badge"><svg viewBox="0 0 16 16" fill="white"><path d="M5 3l9 5-9 5V3z"/></svg></div>`;
      const media = last.kind === 'video'
        ? `<video preload="metadata" muted playsinline referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"><source src="${esc(u)}" type="video/mp4"/></video>${playBadge}`
        : `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"/>`;
      return `<div class="node-output-wrap"><div class="node-preview"${aspectStyle} data-video-preview>${media}</div>${countBadge}</div>`;
    }
    if ((node.type === 'image' || node.type === 'video') && node.uploadUrl) {
      return `<div class="node-preview"${aspectStyle}><img src="${esc(mediaUrl(node.uploadUrl))}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"/></div>`;
    }
    const msg = {
      running: node.progress != null ? `Rendering · ${node.progress}%` : 'Rendering…',
      queued: 'Queued…',
      error: 'Error — see Params',
    };
    return `<div class="node-preview empty"${aspectStyle}>${msg[node.status] || 'No output yet'}</div>`;
  }

  function duplicateNode(id) {
    const n = nodes.get(id);
    if (!n) return;
    const newNode = createNode(n.type, n.x + 260, n.y + 20);
    if (newNode) {
      newNode.prompt = n.prompt;
      newNode.params = { ...n.params };
      newNode.title  = (n.title || NODE_SPECS[n.type].title) + ' copy';
      renderNode(newNode);
    }
  }

  function deleteNode(id) {
    const n = nodes.get(id);
    if (!n) return;
    document.getElementById(id)?.remove();
    nodes.delete(id);
    selected.delete(id);
    // Remove connected edges
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].fromId === id || edges[i].toId === id) edges.splice(i, 1);
    }
    renderAllEdges();
    updateSelInfo();
  }

  function toggleSelectNode(id) {
    setSelected(id, !selected.has(id));
    updateSelInfo();
  }

  // ── Execution ───────────────────────────────────────────────────────────
  function setNodeStatus(id, status, extra = {}) {
    const n = nodes.get(id);
    if (!n) return;
    n.status = status;
    Object.assign(n, extra);
    renderNode(n);
    updateEdgesFor(id);
    if (document.getElementById('panel-files')?.style.display !== 'none') renderFilesPanel();
    if (selected.has(id)) renderInspector(id);
    // Refresh downstream nodes so they pick up new upstream outputs (image
    // becoming available switches a Video node from T2V to I2V mode, etc.)
    if (status === 'done') {
      edges.filter(e => e.fromId === id).forEach(e => {
        const dn = nodes.get(e.toId);
        if (dn) renderNode(dn);
        if (selected.has(e.toId)) renderInspector(e.toId);
      });
    }
  }

  function upstreamNodes(id) {
    return edges.filter(e => e.toId === id).map(e => nodes.get(e.fromId)).filter(Boolean);
  }

  // 'I2V' if a Video node has any usable image reference upstream/uploaded,
  // otherwise 'T2V'. Used for the node-foot mode badge.
  function videoMode(node) {
    if (node.type !== 'video') return '';
    if (node.uploadPath || node.uploadUrl) return 'I2V';
    for (const u of upstreamNodes(node.id)) {
      if (u.type === 'upload' && (u.uploadKind === 'image' || u.uploadKind === 'video')) return 'I2V';
      if (u.type !== 'image') continue;
      const last = u.results?.[u.results.length - 1];
      if (last?.kind === 'image' && (last.localPath || last.url)) return 'I2V';
      if (u.uploadUrl) return 'I2V';
    }
    return 'T2V';
  }

  // Pull the most recent generated text from a Text node, falling back to its prompt.
  function textNodeOutput(n) {
    const last = n.results?.[n.results.length - 1];
    if (last?.text) return last.text;
    return n.prompt || '';
  }

  function collectInputs(node) {
    const up = upstreamNodes(node.id);
    let prompt = node.prompt || '';
    const imageRefs = [];
    const imagePrompts = [];
    for (const u of up) {
      if (u.type === 'text') {
        const t = textNodeOutput(u);
        if (t) prompt = t;
      }
      if (u.type === 'upload' && (u.uploadKind === 'image' || u.uploadKind === 'video')) {
        const ref = u.uploadPath || u.uploadUrl;
        if (ref) imageRefs.push(ref);
      }
      if (u.type === 'image') {
        const uLast = u.results?.[u.results.length - 1];
        if (uLast?.kind === 'image') {
          const ref = uLast.servePath || uLast.localPath || uLast.url || null;
          if (ref) imageRefs.push(ref);
        } else if (u.uploadPath || u.uploadUrl) {
          imageRefs.push(u.uploadPath || u.uploadUrl);
        }
        if (u.prompt) imagePrompts.push(u.prompt);
      }
    }
    // Node's own upload (legacy — from before Upload node existed)
    if (node.uploadPath) imageRefs.push(node.uploadPath);
    else if (node.uploadUrl) imageRefs.push(node.uploadUrl);
    return { prompt, imageRefs, imagePrompts };
  }

  // Walk upstream and pack everything into the multi-modal payload Doubao expects.
  function collectMultimodalInputs(node) {
    const up = upstreamNodes(node.id);
    const inputs = [];
    for (const u of up) {
      const label = u.title || NODE_SPECS[u.type]?.title || u.type;
      if (u.type === 'upload') {
        const ref = u.uploadPath || u.uploadUrl;
        if (!ref) continue;
        if (u.uploadKind === 'image') inputs.push({ type: 'image', url: ref, label });
        else if (u.uploadKind === 'video') inputs.push({ type: 'video', url: ref, label });
        else if (u.uploadKind === 'audio') inputs.push({ type: 'text', content: `[${label}] (audio: ${ref})` });
      } else if (u.type === 'text') {
        const t = textNodeOutput(u);
        if (t) inputs.push({ type: 'text', content: `[${label}]\n${t}` });
        if (u.uploadText) inputs.push({ type: 'text', content: `[${label} · uploaded text]\n${u.uploadText}` });
      } else if (u.type === 'image') {
        const last = u.results?.[u.results.length - 1];
        const ref = last?.servePath || last?.url || u.uploadUrl;
        if (ref) inputs.push({ type: 'image', url: ref, label });
        if (u.prompt) inputs.push({ type: 'text', content: `[${label} prompt]\n${u.prompt}` });
      } else if (u.type === 'video') {
        const last = u.results?.[u.results.length - 1];
        const ref = last?.servePath || last?.url;
        if (ref) inputs.push({ type: 'video', url: ref, label });
        if (u.prompt) inputs.push({ type: 'text', content: `[${label} prompt]\n${u.prompt}` });
      } else if (u.type === 'audio') {
        if (u.uploadUrl) inputs.push({ type: 'text', content: `[${label}] (audio reference: ${u.uploadUrl})` });
      }
    }
    return inputs;
  }

  // Upload nodes are passive sources — they hold a file rather than generating one.
  const PASSIVE_TYPES = new Set(['upload']);

  async function startTask(node) {
    const { prompt, imageRefs, imagePrompts } = collectInputs(node);
    const imageRef = imageRefs[0] || null;
    let endpoint, body;

    if (node.type === 'text') {
      // Doubao multi-modal text generation. Synchronous — handled separately below.
      const inputs = collectMultimodalInputs(node);
      if (node.uploadText) inputs.push({ type: 'text', content: `[Uploaded text]\n${node.uploadText}` });
      if (!node.prompt && !inputs.length) {
        throw new Error('Add an instruction or connect upstream inputs to generate text');
      }
      const resp = await fetch('/api/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ prompt: node.prompt || '', inputs }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        throw new Error(data.error || `Doubao request failed (HTTP ${resp.status})`);
      }
      return { sync: true, text: data.text };
    }

    if (node.type === 'audio') {
      const audioPrompt = prompt || '';
      if (!audioPrompt) throw new Error('prompt required — describe the music or audio you want');
      endpoint = '/api/text2audio';
      body = { prompt: audioPrompt };
    } else if (node.type === 'image') {
      if (imageRef) {
        if (!prompt) throw new Error('prompt required for image transform');
        endpoint = '/api/image2image';
        body = { image: imageRef, prompt, ratio: node.params.ratio };
      } else {
        if (!prompt) throw new Error('prompt required (connect a Text node or type one)');
        endpoint = '/api/text2image';
        body = { prompt, ratio: node.params.ratio, resolution: node.params.resolution };
      }
    } else if (node.type === 'video') {
      if (imageRef) {
        // I2V mode — animate the upstream/uploaded image. Prompt becomes
        // the motion description (optional but recommended).
        endpoint = '/api/image2video';
        body = {
          image: imageRef,
          prompt: prompt || imagePrompts.join(', '),
          duration: node.params.duration,
          model_version: node.params.modelVersion,
        };
      } else {
        // T2V mode — text only.
        const videoPrompt = prompt || imagePrompts.join(', ');
        if (!videoPrompt) throw new Error('prompt required (connect a Text or Image node, or type one)');
        endpoint = '/api/text2video';
        body = { prompt: videoPrompt, duration: node.params.duration, ratio: node.params.ratio, resolution: node.params.resolution, model_version: node.params.modelVersion };
      }
    } else if (node.type === 'edit') {
      const up = upstreamNodes(node.id);
      const clips = [];
      let audioPath = null;
      for (const u of up) {
        if (u.type === 'upload') {
          const path = u.uploadPath || u.uploadUrl || null;
          if (u.uploadKind === 'video' && path) clips.push({ path, label: u.title || 'Upload' });
          else if (u.uploadKind === 'audio' && path && !audioPath) audioPath = path;
        } else if (u.type === 'video') {
          const last = u.results?.[u.results.length - 1];
          const path = last?.servePath || last?.localPath || u.uploadPath || last?.url || u.uploadUrl || null;
          if (path) clips.push({ path, label: u.title || 'Video' });
        } else if (u.type === 'audio') {
          const last = u.results?.[u.results.length - 1];
          const path = last?.servePath || last?.localPath || u.uploadPath || last?.url || u.uploadUrl || null;
          if (path && !audioPath) audioPath = path;
        }
      }
      if (!clips.length) throw new Error('Connect at least one Video or Upload (video) node');
      endpoint = '/api/video_edit';
      body = { clips, audio_path: audioPath, instructions: node.prompt || '' };
    } else {
      throw new Error('Unsupported node type: ' + node.type);
    }

    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.ok) throw new Error(data.error || `Request failed (HTTP ${resp.status})`);
    return data.task_id;
  }

  function extractOutputUrl(task) {
    const r = task?.result;
    if (!r || typeof r !== 'object') return null;
    if (r.url) return r.url;
    if (r.data?.url) return r.data.url;
    if (r.video_url) return r.video_url;
    if (r.image_url) return r.image_url;
    if (r.data?.video_url) return r.data.video_url;
    if (r.data?.image_url) return r.data.image_url;
    if (r.local_path) return r.local_path;
    if (r.data?.local_path) return r.data.local_path;
    if (Array.isArray(r.urls) && r.urls[0]) return r.urls[0];
    if (Array.isArray(r.data) && r.data[0]?.url) return r.data[0].url;
    if (r.item_list && Array.isArray(r.item_list) && r.item_list[0]) {
      const it = r.item_list[0];
      return it.video?.url || it.image?.url || it.url || null;
    }
    if (r.data?.item_list && Array.isArray(r.data.item_list) && r.data.item_list[0]) {
      const it = r.data.item_list[0];
      return it.video?.url || it.image?.url || it.url || null;
    }
    if (r.result_json?.videos?.[0]?.video_url) return r.result_json.videos[0].video_url;
    if (r.result_json?.videos?.[0]?.url) return r.result_json.videos[0].url;
    if (r.result_json?.images?.[0]?.image_url) return r.result_json.images[0].image_url;
    if (r.result_json?.images?.[0]?.url) return r.result_json.images[0].url;
    if (r.data?.result_json?.videos?.[0]?.video_url) return r.data.result_json.videos[0].video_url;
    if (r.data?.result_json?.videos?.[0]?.url) return r.data.result_json.videos[0].url;
    if (r.data?.result_json?.images?.[0]?.image_url) return r.data.result_json.images[0].image_url;
    if (r.data?.result_json?.images?.[0]?.url) return r.data.result_json.images[0].url;
    return null;
  }

  async function pollUntilDone(taskId, nodeId) {
    let networkErrors = 0;
    while (true) {
      await new Promise(r => setTimeout(r, 3000));
      let resp, t;
      try {
        resp = await fetch('/api/task/' + taskId);
        t = await resp.json();
      } catch (e) {
        // Transient network error (server restart, brief hiccup) — retry up to 5 times
        networkErrors++;
        if (networkErrors >= 5) throw new Error('Server unreachable after several retries');
        await new Promise(r => setTimeout(r, 2000 * networkErrors));
        continue;
      }
      networkErrors = 0;
      if (!resp.ok) throw new Error('Task lookup failed');
      if (t.status === 'done')  return t;
      if (t.status === 'error') throw new Error(t.error || 'Task errored');
      const n = nodes.get(nodeId);
      if (n && t.queue_idx != null) {
        n.queueIdx = t.queue_idx;
        const el = document.getElementById(nodeId);
        const badge = el?.querySelector('.node-id');
        if (badge) badge.textContent = `queued #${t.queue_idx}`;
      }
    }
  }

  async function runNode(id) {
    const node = nodes.get(id);
    if (!node) return;
    if (node.type === 'upload') {
      // Upload nodes don't generate — use the upload button (↑) in the node header
      toast('Use the upload button on the node to choose a file', '');
      return;
    }
    if (PASSIVE_TYPES.has(node.type)) {
      toast('This node type provides data — no generation needed', '');
      return;
    }
    if (node.status === 'running' || node.status === 'queued') {
      toast('Already running', '');
      return;
    }
    try {
      setNodeStatus(id, 'queued', { error: null, queueIdx: null });
      const submitResult = await startTask(node);

      // Text node: the response is synchronous, no polling.
      if (submitResult && submitResult.sync) {
        const newResults = [...(node.results || [])];
        newResults.push({ kind: 'text', text: submitResult.text, ts: Date.now() });
        setNodeStatus(id, 'done', { results: newResults, error: null, queueIdx: null });
        toast('text done', 'success');
        return;
      }

      const taskId = submitResult;
      node.taskId = taskId;
      setNodeStatus(id, 'running', { taskId });
      const task = await pollUntilDone(taskId, id);
      const url = extractOutputUrl(task);
      const kind = (node.type === 'video' || node.type === 'edit') ? 'video' : node.type === 'audio' ? 'audio' : 'image';
      // localPath = CLI's own saved file (for passing back to CLI as --image input)
      // servePath = server-downloaded /uploads/ copy (for browser display)
      const localPath = task?.result?.data?.local_path || task?.result?.local_path || null;
      const servePath = task?.result?.data?.serve_path || task?.result?.serve_path || null;
      const editPlan = node.type === 'edit' ? (task?.result?.edit_plan || null) : null;
      const newResults = [...(node.results || [])];
      if (url || localPath || servePath) newResults.push({ url, kind, localPath, servePath, editPlan, ts: Date.now() });
      setNodeStatus(id, 'done', { results: newResults, error: null, queueIdx: null });
      toast(`${node.type} done`, 'success');
    } catch (err) {
      setNodeStatus(id, 'error', { error: err.message, queueIdx: null });
      toast(`${node.type}: ${err.message}`, 'error');
    }
  }

  function topoSort(ids) {
    const set = new Set(ids);
    const inDeg = new Map();
    for (const id of ids) inDeg.set(id, 0);
    for (const e of edges) {
      if (set.has(e.fromId) && set.has(e.toId)) {
        inDeg.set(e.toId, (inDeg.get(e.toId) || 0) + 1);
      }
    }
    const queue = [...ids].filter(id => inDeg.get(id) === 0);
    const out = [];
    while (queue.length) {
      const id = queue.shift();
      out.push(id);
      for (const e of edges) {
        if (e.fromId === id && set.has(e.toId)) {
          inDeg.set(e.toId, inDeg.get(e.toId) - 1);
          if (inDeg.get(e.toId) === 0) queue.push(e.toId);
        }
      }
    }
    return out.length === ids.length ? out : null;
  }

  async function runGraph(ids) {
    const order = topoSort(ids);
    if (!order) { toast('Cycle detected — cannot run', 'error'); return; }
    const runnableSet = new Set(order.filter(id => !PASSIVE_TYPES.has(nodes.get(id)?.type)));
    if (!runnableSet.size) { toast('Nothing runnable selected'); return; }
    toast(`Running ${runnableSet.size} node(s)…`);

    // For each runnable node, find which OTHER runnable nodes it depends on (direct upstream edges within selection)
    const upstreamDeps = new Map(); // id -> [upstream id, ...]
    for (const id of runnableSet) {
      upstreamDeps.set(id, edges.filter(e => e.toId === id && runnableSet.has(e.fromId)).map(e => e.fromId));
    }

    // One promise per runnable node; resolve when that node finishes (success or error)
    const promises = new Map();

    function launchNode(id) {
      if (promises.has(id)) return promises.get(id);
      const p = (async () => {
        // Wait for all upstream runnable deps first
        const ups = upstreamDeps.get(id);
        if (ups.length) await Promise.all(ups.map(uid => launchNode(uid)));
        // Skip if any direct upstream errored
        const upstreamFailed = ups.some(uid => nodes.get(uid)?.status === 'error');
        if (upstreamFailed) {
          setNodeStatus(id, 'error', { error: 'Skipped — upstream node failed' });
          return;
        }
        await runNode(id);
      })();
      promises.set(id, p);
      return p;
    }

    // Launch all — each one will self-suspend until its deps resolve
    await Promise.all([...runnableSet].map(id => launchNode(id)));
  }

  // ── Edge drawing ────────────────────────────────────────────────────────
  const NODE_WIDTH = 240;

  function handlePos(nodeId, dir) {
    const el = document.getElementById(nodeId);
    const n = nodes.get(nodeId);
    if (!el || !n) return { x: 0, y: 0 };
    const h = el.offsetHeight || 200;
    return {
      x: n.x + (dir === 'out' ? NODE_WIDTH : 0),
      y: n.y + h / 2,
    };
  }

  function edgePath(x1, y1, x2, y2) {
    const dx = Math.max(60, Math.abs(x2 - x1) * 0.5);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }

  function renderAllEdges() {
    edgesSvg.innerHTML = '';
    for (const edge of edges) renderEdge(edge);
  }

  function renderEdge(edge) {
    const existing = edgesSvg.querySelector(`[data-edge-id="${edge.id}"]`);
    const existingHit = edgesSvg.querySelector(`[data-edge-hit="${edge.id}"]`);
    if (existing) existing.remove();
    if (existingHit) existingHit.remove();

    const a = handlePos(edge.fromId, 'out');
    const b = handlePos(edge.toId,   'in');
    const d = edgePath(a.x, a.y, b.x, b.y);

    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'edge-hit');
    hit.setAttribute('data-edge-hit', edge.id);
    hit.addEventListener('click', (e) => { e.stopPropagation(); selectEdge(edge.id); });
    edgesSvg.appendChild(hit);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge' + (edge.selected ? ' selected' : ''));
    path.setAttribute('data-edge-id', edge.id);
    path.addEventListener('click', (e) => { e.stopPropagation(); selectEdge(edge.id); });
    edgesSvg.appendChild(path);
  }

  function updateEdgesFor(nodeId) {
    for (const edge of edges) {
      if (edge.fromId === nodeId || edge.toId === nodeId) renderEdge(edge);
    }
  }

  function selectEdge(id) {
    clearSelection();
    for (const e of edges) e.selected = (e.id === id);
    renderAllEdges();
    toast('Edge selected — press Delete to remove');
  }

  function deleteSelectedEdges() {
    const affected = new Set();
    let removed = 0;
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].selected) { affected.add(edges[i].toId); edges.splice(i, 1); removed++; }
    }
    if (removed) {
      renderAllEdges();
      for (const id of affected) { const n = nodes.get(id); if (n) renderNode(n); }
      toast(`${removed} edge(s) deleted`);
    }
    return removed;
  }

  function canConnect(fromId, toId) {
    if (fromId === toId) return false;
    if (!NODE_SPECS[nodes.get(fromId).type].hasOut) return false;
    if (!NODE_SPECS[nodes.get(toId).type].hasIn) return false;
    for (const e of edges) if (e.fromId === fromId && e.toId === toId) return false;
    return true;
  }

  function addEdge(fromId, toId) {
    if (!canConnect(fromId, toId)) { toast('Cannot connect these nodes', 'error'); return; }
    edges.push({ id: 'e' + Math.random().toString(36).slice(2, 8), fromId, toId, selected: false });
    renderAllEdges();
    const n = nodes.get(toId); if (n) renderNode(n);
    if (selected.has(toId)) renderInspector(toId);
    if (selected.has(fromId)) renderInspector(fromId);
  }

  // ── Handle drag (create edges) ──────────────────────────────────────────
  let edgeDrag = null;

  function cancelEdgeDrag() {
    document.querySelectorAll('.handle.connecting').forEach(h => h.classList.remove('connecting'));
    edgesSvg.querySelector('.edge-temp')?.remove();
    edgeDrag = null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.handle');
    if (!handle) return;
    if (handle.dataset.dir !== 'out') return;
    e.stopPropagation();
    e.preventDefault();

    const fromId = handle.dataset.node;
    edgeDrag = { fromId };
    handle.classList.add('connecting');

    function onMove(ev) {
      const a = handlePos(fromId, 'out');
      const w = screenToWorld(ev.clientX, ev.clientY);
      let tempPath = edgesSvg.querySelector('.edge-temp');
      if (!tempPath) {
        tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tempPath.setAttribute('class', 'edge-temp');
        edgesSvg.appendChild(tempPath);
      }
      tempPath.setAttribute('d', edgePath(a.x, a.y, w.x, w.y));
    }

    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup',   onUp);
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = el?.closest?.('.handle');
      if (target && target.dataset.dir === 'in' && target.dataset.node !== fromId) {
        addEdge(fromId, target.dataset.node);
      }
      cancelEdgeDrag();
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup',   onUp);
  });

  // Cancel edge drag on Escape
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && edgeDrag) cancelEdgeDrag();
  });

  // ── Selection ───────────────────────────────────────────────────────────
  function setSelected(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    if (value) { selected.add(id); el.classList.add('selected'); }
    else       { selected.delete(id); el.classList.remove('selected'); }
  }
  function clearSelection() {
    for (const id of [...selected]) setSelected(id, false);
    updateSelInfo();
  }
  function selectOnly(id) {
    clearSelection();
    setSelected(id, true);
    updateSelInfo();
  }
  function toggleSelect(id) {
    setSelected(id, !selected.has(id));
    updateSelInfo();
  }
  function selectInRect(x1, y1, x2, y2) {
    const [lo, hi] = [Math.min(x1,x2), Math.max(x1,x2)];
    const [to, bo] = [Math.min(y1,y2), Math.max(y1,y2)];
    clearSelection();
    for (const n of nodes.values()) {
      const nx2 = n.x + 240, ny2 = n.y + 260;
      if (n.x < hi && nx2 > lo && n.y < bo && ny2 > to) setSelected(n.id, true);
    }
    updateSelInfo();
  }

  function deleteNode(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    const downstream = new Set();
    let edgeRemoved = false;
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].fromId === id) { downstream.add(edges[i].toId); edges.splice(i, 1); edgeRemoved = true; }
      else if (edges[i].toId === id) { edges.splice(i, 1); edgeRemoved = true; }
    }
    nodes.delete(id);
    selected.delete(id);
    if (edgeRemoved) renderAllEdges();
    for (const did of downstream) { const n = nodes.get(did); if (n) renderNode(n); }
    updateSelInfo();
  }

  function deleteSelected() {
    const removedEdges = deleteSelectedEdges();
    if (selected.size === 0) {
      if (!removedEdges) return;
      return;
    }
    const n = selected.size;
    for (const id of [...selected]) deleteNode(id);
    toast(`${n} node(s) deleted`);
  }

  // ── Node interactions ────────────────────────────────────────────────────
  // Selection + drag-start are attached per-node inside renderNode(). Pointer
  // is captured to canvasWrap, so drag-move + drag-end live in the consolidated
  // canvasWrap pointermove / pointerup handlers below alongside pan + rubber-band.
  let dragState = null;

  // ── Tool mode ────────────────────────────────────────────────────────────
  let canvasTool = 'pan'; // 'pan' | 'select'

  function setTool(tool) {
    canvasTool = tool;
    canvasWrap.classList.toggle('mode-select', tool === 'select');
  }

  // ── Canvas panning + box-selection ──────────────────────────────────────
  let panState = null;
  let selBoxState = null;
  let selBoxEl = null;
  let selBoxMoved = false;

  window.addEventListener('keydown', (e) => {
    const active = document.activeElement.tagName;
    if (active === 'TEXTAREA' || active === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); } // prevent page scroll
    if (e.key === 'h' || e.key === 'H') setTool('pan');
    if (e.key === 'v' || e.key === 'V') setTool('select');
    if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
    if (e.key === 'Escape') clearSelection();
  });

  canvasWrap.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.node')) return;
    if (e.target.closest('svg')) return; // let edge-path clicks reach their handlers
    if (e.target.closest('.canvas-overlay')) return; // let overlay controls handle their own events
    if (e.button === 2) return;

    // Middle-click always pans regardless of mode
    const wantPan = canvasTool === 'pan' || e.button === 1;

    if (wantPan) {
      panState = { startX: e.clientX, startY: e.clientY, origX: view.x, origY: view.y, moved: false };
      canvasWrap.classList.add('panning');
      canvasWrap.setPointerCapture?.(e.pointerId);
      return;
    }

    // Select mode: drag to draw a selection box
    const start = screenToWorld(e.clientX, e.clientY);
    selBoxState = { sx: start.x, sy: start.y };
    selBoxMoved = false;
    selBoxEl = document.createElement('div');
    selBoxEl.className = 'sel-box';
    canvas.appendChild(selBoxEl);
    canvasWrap.setPointerCapture?.(e.pointerId);
  });

  canvasWrap.addEventListener('pointermove', (e) => {
    // Self-heal: if a button was released outside the viewport, pointerup may
    // have been missed. Reset all gesture state when no buttons are held.
    if (e.buttons === 0 && (dragState || panState || selBoxState)) {
      dragState = null;
      panState = null;
      canvasWrap.classList.remove('panning');
      if (selBoxEl) { selBoxEl.remove(); selBoxEl = null; }
      selBoxState = null;
      selBoxMoved = false;
      return;
    }
    if (dragState) {
      const dx = (e.clientX - dragState.startX) / view.scale;
      const dy = (e.clientY - dragState.startY) / view.scale;
      if (Math.abs(dx) + Math.abs(dy) > 2) dragState.moved = true;
      for (const g of dragState.group) {
        const n = nodes.get(g.id);
        if (!n) continue;
        n.x = g.origX + dx;
        n.y = g.origY + dy;
        const nEl = document.getElementById(g.id);
        if (nEl) { nEl.style.left = n.x + 'px'; nEl.style.top = n.y + 'px'; }
        updateEdgesFor(g.id);
      }
      return;
    }
    if (panState) {
      const dx = e.clientX - panState.startX;
      const dy = e.clientY - panState.startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) panState.moved = true;
      view.x = panState.origX + dx;
      view.y = panState.origY + dy;
      applyView();
      return;
    }
    if (selBoxState && selBoxEl) {
      const cur = screenToWorld(e.clientX, e.clientY);
      const lo = Math.min(selBoxState.sx, cur.x);
      const to = Math.min(selBoxState.sy, cur.y);
      const w  = Math.abs(cur.x - selBoxState.sx);
      const h  = Math.abs(cur.y - selBoxState.sy);
      if (w + h > 4) selBoxMoved = true;
      selBoxEl.style.left   = lo + 'px';
      selBoxEl.style.top    = to + 'px';
      selBoxEl.style.width  = w  + 'px';
      selBoxEl.style.height = h  + 'px';
      selectInRect(selBoxState.sx, selBoxState.sy, cur.x, cur.y);
    }
  });

  function _endGesture(e) {
    if (dragState) {
      dragState = null;
    } else if (panState) {
      if (!panState.moved) clearSelection();
      panState = null;
      canvasWrap.classList.remove('panning');
    } else if (selBoxState || selBoxEl) {
      if (selBoxEl) { selBoxEl.remove(); selBoxEl = null; }
      if (!selBoxMoved) clearSelection();
      selBoxState = null;
      selBoxMoved = false;
    }
    if (e?.pointerId != null) {
      try { canvasWrap.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  }
  canvasWrap.addEventListener('pointerup',     _endGesture);
  canvasWrap.addEventListener('pointercancel', _endGesture);

  // ── Canvas zoom (wheel) ─────────────────────────────────────────────────
  canvasWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.0015;
    const newScale = Math.min(2, Math.max(0.3, view.scale * (1 + delta)));
    const w = screenToWorld(e.clientX, e.clientY);
    view.scale = newScale;
    // Re-center around cursor position
    const rect = canvasWrap.getBoundingClientRect();
    view.x = e.clientX - rect.left - w.x * view.scale;
    view.y = e.clientY - rect.top  - w.y * view.scale;
    applyView();
  }, { passive: false });

  // ── Add-node menu wiring ────────────────────────────────────────────────
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#add-menu')) addMenu.classList.remove('open');
  });
  addMenu.querySelectorAll('.add-menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const type = item.dataset.nodeType;
      // Drop the new node near the center of the current viewport
      const rect = canvasWrap.getBoundingClientRect();
      const center = screenToWorld(rect.left + rect.width/2, rect.top + rect.height/2);
      createNode(type, center.x - 120 + Math.random()*40, center.y - 60 + Math.random()*40);
      addMenu.classList.remove('open');
    });
  });

  // ── Fit to view ──────────────────────────────────────────────────────────
  function fitToView() {
    if (nodes.size === 0) return;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 240); maxY = Math.max(maxY, n.y + 260);
    }
    const rect = canvasWrap.getBoundingClientRect();
    const sx = (rect.width  - 80) / (maxX - minX || 1);
    const sy = (rect.height - 80) / (maxY - minY || 1);
    view.scale = Math.min(2, Math.max(0.3, Math.min(sx, sy)));
    view.x = 40 - minX * view.scale;
    view.y = 40 - minY * view.scale;
    applyView();
  }
  document.getElementById('btn-fit').addEventListener('click', fitToView);

  // ── Clear canvas ────────────────────────────────────────────────────────
  // ── Run buttons ─────────────────────────────────────────────────────────
  document.getElementById('btn-run-selected').addEventListener('click', () => {
    if (!selected.size) { toast('Select nodes first (click or drag a box)'); return; }
    runGraph([...selected]);
  });
  document.getElementById('btn-run-all').addEventListener('click', () => {
    if (!nodes.size) { toast('Canvas is empty'); return; }
    runGraph([...nodes.keys()]);
  });

  // ── Panel toggle ────────────────────────────────────────────────────────
  const sideLeft  = document.getElementById('side-left');
  const sideRight = document.getElementById('side-right');
  const iconLeft  = document.getElementById('toggle-left-icon');
  const iconRight = document.getElementById('toggle-right-icon');

  document.getElementById('toggle-left').addEventListener('click', () => {
    const collapsed = sideLeft.classList.toggle('collapsed');
    document.body.classList.toggle('left-collapsed', collapsed);
    iconLeft.querySelector('path').setAttribute('d', collapsed ? 'M4 2l3 3-3 3' : 'M6 2L3 5l3 3');
  });
  document.getElementById('toggle-right').addEventListener('click', () => {
    const collapsed = sideRight.classList.toggle('collapsed');
    document.body.classList.toggle('right-collapsed', collapsed);

  // ── Persistence (save/load workflow to server) ──────────────────────────
  let saveTimer = null;
  let loading = false;

  function serialize() {
    return {
      nodes: [...nodes.values()].map(n => ({
        id: n.id, type: n.type, x: n.x, y: n.y,
        title: n.title, prompt: n.prompt, params: n.params,
        status: n.status === 'running' || n.status === 'queued' ? 'idle' : n.status,
        results: n.results || [], uploadUrl: n.uploadUrl, uploadPath: n.uploadPath,
        uploadKind: n.uploadKind || null, uploadRatio: n.uploadRatio || null, uploadText: n.uploadText || null,
      })),
      edges: edges.map(e => ({ id: e.id, fromId: e.fromId, toId: e.toId })),
      view: { x: view.x, y: view.y, scale: view.scale },
    };
  }

  function scheduleSave() {
    if (loading) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await fetch(WORKFLOW_API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(serialize()),
        });
      } catch { /* silent */ }
    }, 600);
  }

  // Observe mutations on canvas + edges SVG to catch drags/renders/connections
  const mo = new MutationObserver(scheduleSave);
  mo.observe(canvas,   { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
  mo.observe(edgesSvg, { childList: true, subtree: true });

  // Save on field edits inside nodes (prompt, params)
  canvas.addEventListener('input', scheduleSave);

  // Audio play/pause for node cards (event delegation so re-renders don't lose listeners)
  canvas.addEventListener('click', e => {
    const btn = e.target.closest('[data-audio-play]');
    if (!btn) return;
    e.stopPropagation();
    const nodeId = btn.dataset.audioPlay;
    const audio = document.getElementById('aud-' + nodeId);
    if (!audio) return;
    if (audio.paused) {
      // Pause all other audios first
      document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); });
      audio.play();
      btn.innerHTML = ICONS.pause || '⏸';
    } else {
      audio.pause();
      btn.innerHTML = ICONS.play;
    }
    audio.addEventListener('ended', () => { btn.innerHTML = ICONS.play; }, { once: true });
  });

  async function loadWorkflow() {
    loading = true;
    try {
      const resp = await fetch(WORKFLOW_API);
      const d = await resp.json();
      const wf = d.workflow || {};
      if (wf.nodes && typeof wf.nodes === 'object') {
        const arr = Array.isArray(wf.nodes) ? wf.nodes : Object.values(wf.nodes);
        const LEGACY_TYPES = { script:'text', text2image:'image', image2image:'image', text2video:'video', image2video:'video' };
        for (const n of arr) {
          const nodeType = LEGACY_TYPES[n.type] || n.type;
          nodes.set(n.id, {
            id: n.id, type: nodeType, x: n.x, y: n.y,
            prompt: n.prompt || '',
            params: {
              duration: n.params?.duration || '5',
              ratio: n.params?.ratio || '16:9',
              resolution: n.params?.resolution || (nodeType === 'video' ? '720P' : '2k'),
              modelVersion: n.params?.modelVersion || 'seedance2.0',
            },
            title: n.title || (LEGACY_TYPES[n.type] ? NODE_SPECS[LEGACY_TYPES[n.type] || n.type]?.title : NODE_SPECS[nodeType]?.title) || nodeType,
            status: n.status || 'idle',
            results: Array.isArray(n.results) ? n.results : (n.result ? [n.result] : []),
            taskId: null,
            queueIdx: n.queueIdx ?? null,
            error: n.error || null,
            uploadUrl: n.uploadUrl || null,
            uploadPath: n.uploadPath || null,
            uploadKind: n.uploadKind || null,
            uploadRatio: n.uploadRatio || null,
            uploadText: n.uploadText || null,
          });
          renderNode(nodes.get(n.id));
        }
      }
      if (Array.isArray(wf.edges)) {
        for (const e of wf.edges) {
          if (nodes.has(e.fromId) && nodes.has(e.toId)) {
            edges.push({ id: e.id, fromId: e.fromId, toId: e.toId, selected: false });
          }
        }
        renderAllEdges();
        // Re-render downstream nodes now that edges are known (shows connection indicators)
        const downstream = new Set(edges.map(e => e.toId));
        for (const id of downstream) { const n = nodes.get(id); if (n) renderNode(n); }
      }
      if (wf.view) {
        view.x = wf.view.x ?? 0;
        view.y = wf.view.y ?? 0;
        view.scale = wf.view.scale ?? 1;
        applyView();
      }
      saveStatus.textContent = 'Saved';
    } catch {
      saveStatus.textContent = 'Offline';
    } finally {
      loading = false;
    }
    repairResults();
  }

  // After loading, download any CDN results that have no servePath yet (parallel)
  async function repairResults() {
    const repairs = [];
    for (const node of nodes.values()) {
      for (const r of (node.results || [])) {
        // Need a servePath for browser display; url must be a CDN http URL
        const needsRepair = !r.servePath && r.url && r.url.startsWith('http');
        if (needsRepair) {
          repairs.push(
            fetch('/api/download_url', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: r.url }),
            })
            .then(res => res.json())
            .then(d => {
              if (d.ok && d.localPath) { r.servePath = d.localPath; return node; }
            })
            .catch(() => null)
          );
        }
      }
    }
    if (!repairs.length) return;
    const changed = new Set((await Promise.all(repairs)).filter(Boolean));
    if (!changed.size) return;
    for (const node of changed) {
      renderNode(node);
      if (selected.has(node.id)) renderInspector(node.id);
    }
    if (document.getElementById('panel-files')?.style.display !== 'none') renderFilesPanel();
    scheduleSave();
  }

  // ── Zoom overlay controls ───────────────────────────────────────────────
  function zoomAround(factor) {
    const rect = canvasWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const w = screenToWorld(cx, cy);
    view.scale = Math.min(2, Math.max(0.3, view.scale * factor));
    view.x = cx - rect.left - w.x * view.scale;
    view.y = cy - rect.top  - w.y * view.scale;
    applyView();
  }
  document.getElementById('btn-zoom-in').addEventListener('click',  () => zoomAround(1.25));
  document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAround(0.8));

  // F key → fit to view
  window.addEventListener('keydown', (e) => {
    const active = document.activeElement.tagName;
    if (active === 'TEXTAREA' || active === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') fitToView();
  });

  // ── Minimap ─────────────────────────────────────────────────────────────
  function updateMinimap() {
    const inner = document.getElementById('minimap-inner');
    if (!inner) return;
    inner.innerHTML = '';
    if (nodes.size === 0) return;

    // Node bounds in world space
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 240); maxY = Math.max(maxY, n.y + 260);
    }

    // Viewport bounds in world space
    const wrap = canvasWrap.getBoundingClientRect();
    const tl = screenToWorld(wrap.left, wrap.top);
    const br = screenToWorld(wrap.right, wrap.bottom);

    // Expand world extent to always include the viewport so the rect is visible
    minX = Math.min(minX, tl.x) - 40;
    minY = Math.min(minY, tl.y) - 40;
    maxX = Math.max(maxX, br.x) + 40;
    maxY = Math.max(maxY, br.y) + 40;

    const worldW = maxX - minX || 1;
    const worldH = maxY - minY || 1;
    const mw = inner.offsetWidth  || 150;
    const mh = inner.offsetHeight || 90;
    const scale = Math.min(mw / worldW, mh / worldH);
    // Center content within the minimap
    const ox = (mw - worldW * scale) / 2;
    const oy = (mh - worldH * scale) / 2;

    for (const n of nodes.values()) {
      const d = document.createElement('div');
      d.className = 'minimap-node' + (selected.has(n.id) ? ' selected' : '');
      d.style.left   = (ox + (n.x - minX) * scale) + 'px';
      d.style.top    = (oy + (n.y - minY) * scale) + 'px';
      d.style.width  = Math.max(4, 240 * scale) + 'px';
      d.style.height = Math.max(3, 80  * scale) + 'px';
      inner.appendChild(d);
    }

    const vp = document.createElement('div');
    vp.className = 'minimap-viewport';
    vp.style.left   = (ox + (tl.x - minX) * scale) + 'px';
    vp.style.top    = (oy + (tl.y - minY) * scale) + 'px';
    vp.style.width  = Math.max(4, (br.x - tl.x) * scale) + 'px';
    vp.style.height = Math.max(4, (br.y - tl.y) * scale) + 'px';
    inner.appendChild(vp);
  }

  function renderFilesPanel() {
    const panel = document.getElementById('panel-files');
    if (!panel) return;

    const fmtTs = ts => { try { return ts ? new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''; } catch { return ''; } };

    const fileThumb = (src, kind) => {
      const p = esc(mediaUrl(src));
      if (kind === 'video') return `<video src="${p}" muted preload="metadata" referrerpolicy="no-referrer" onerror="markMediaExpired(this)"></video>`;
      if (kind === 'audio') return `<div style="display:grid;place-items:center;height:100%;background:oklch(0.78 0.12 320/0.1);border-radius:4px;color:oklch(0.78 0.12 320)">${ICONS.audio}</div>`;
      return `<img src="${p}" alt="" referrerpolicy="no-referrer" onerror="markMediaExpired(this)"/>`;
    };

    let html = '';
    let total = 0;

    for (const n of nodes.values()) {
      const nodeTitle = n.title || NODE_SPECS[n.type]?.title || n.type;
      const results = n.results || [];
      // Upload node: uploadUrl is its primary file (not a "legacy" upload)
      const hasUpload = !!(n.uploadUrl) && n.type !== 'upload';
      const isUploadNode = n.type === 'upload' && n.uploadUrl;
      if (!results.length && !hasUpload && !isUploadNode) continue;
      total += results.length + (hasUpload || isUploadNode ? 1 : 0);

      html += `<div class="side-section-title">${esc(nodeTitle)}</div>`;

      // Upload node: show its file as the primary entry
      if (isUploadNode) {
        const uploadKind = n.uploadKind || 'image';
        const href = esc(mediaUrl(n.uploadUrl));
        html += `<div class="file-item">
          <div class="file-thumb">${fileThumb(n.uploadUrl, uploadKind)}</div>
          <div class="file-info">
            <div class="file-name">${esc(n.uploadUrl.split('/').pop())} <span style="color:var(--amber);font-size:9px">SOURCE</span></div>
            <div class="file-sub">${esc(uploadKind)}</div>
            <div class="file-actions">
              <a class="file-link" href="${href}" target="_blank" download>↓ download</a>
              <a class="file-link" href="${href}" target="_blank">↗ open</a>
            </div>
          </div>
        </div>`;
      }

      // Legacy: non-upload nodes with uploadUrl (backward compat)
      if (hasUpload) {
        const uploadKind = n.type === 'video' ? 'video' : n.type === 'audio' ? 'audio' : 'image';
        const href = esc(mediaUrl(n.uploadUrl));
        html += `<div class="file-item">
          <div class="file-thumb">${fileThumb(n.uploadUrl, uploadKind)}</div>
          <div class="file-info">
            <div class="file-name">Upload <span style="color:var(--fg-3);font-size:9px">SOURCE</span></div>
            <div class="file-sub">${uploadKind}</div>
            <div class="file-actions">
              <a class="file-link" href="${href}" target="_blank" download>↓ download</a>
              <a class="file-link" href="${href}" target="_blank">↗ open</a>
            </div>
          </div>
        </div>`;
      }

      // Generated results, newest first
      for (let i = results.length - 1; i >= 0; i--) {
        const r = results[i];
        const src = r.servePath || r.url;
        if (!src) continue;
        const runNum = i + 1;
        const isLatest = i === results.length - 1;
        const t = fmtTs(r.ts);
        const href = esc(mediaUrl(src));
        const audioPlayer = r.kind === 'audio'
          ? `<audio src="${href}" controls style="width:100%;margin:4px 0;border-radius:4px"></audio>`
          : '';
        html += `<div class="file-item">
          <div class="file-thumb">${fileThumb(src, r.kind)}</div>
          <div class="file-info">
            <div class="file-name">Run ${runNum}${isLatest ? ' <span style="color:var(--amber);font-size:9px">LATEST</span>' : ''}</div>
            <div class="file-sub">${r.kind}${t ? ' · ' + t : ''}</div>
            ${audioPlayer}
            <div class="file-actions">
              <a class="file-link" href="${href}" target="_blank" download>↓ download</a>
              <a class="file-link" href="${href}" target="_blank">↗ open</a>
            </div>
          </div>
        </div>`;
      }
    }

    if (total === 0) {
      panel.innerHTML = '<div class="side-empty">No files yet.<br>Run nodes to generate outputs,<br>or add an Upload node as a source.</div>';
      return;
    }
    panel.innerHTML = html;

    // Seek video thumbnails to first frame so they don't appear black
    panel.querySelectorAll('.file-thumb video').forEach(v => {
      const seek = () => { try { v.currentTime = 0.01; } catch (_) {} };
      if (v.readyState >= 1) seek();
      else v.addEventListener('loadedmetadata', seek, { once: true });
    });
  }

  // ── Upstream computation ──────────────────────────────────────────────────
  function computeUpstreamAll(targetId) {
    // Returns [{node, depth}] for all ancestors
    const incoming = {};
    edges.forEach(e => { (incoming[e.toId] = incoming[e.toId] || []).push(e.fromId); });
    const byId = node => nodes.get(node);

    const direct = (incoming[targetId] || []).map(byId).filter(Boolean);
    const seen = new Set([targetId, ...direct.map(n => n.id)]);
    const result = direct.map(n => ({ node: n, depth: 1 }));
    let frontier = direct.map(n => ({ id: n.id, depth: 1 }));
    while (frontier.length) {
      const next = [];
      for (const f of frontier) {
        for (const pid of incoming[f.id] || []) {
          if (seen.has(pid)) continue;
          seen.add(pid);
          const n = nodes.get(pid);
          if (!n) continue;
          result.push({ node: n, depth: f.depth + 1 });
          next.push({ id: pid, depth: f.depth + 1 });
        }
      }
      frontier = next;
    }
    return result;
  }

    const totalSize = all.length;

    const filtered = all.filter(({node}) => {
      if (inputsFilter === 'all') return true;
      return node.type === inputsFilter;
    });

    const TYPE_ORDER = ['upload','text','image','video','audio'];
    const TYPE_LABEL = { upload:'Uploads', text:'Text prompts', image:'Images', video:'Videos', audio:'Audio' };

    // Filter chips

      const active = inputsFilter === type;

      }
      panel.innerHTML = `<div class="upstream" style="display:flex;flex-direction:column;height:100%">

        </div>
        <div class="upstream-body" style="flex:1;overflow-y:auto">
          <div class="inputs-upload" style="margin:12px 10px 0">

      panel.querySelector('#upload-remove')?.addEventListener('click', () => {

        renderNode(selNode); renderRightPanel(); scheduleSave();

      panel.querySelector('#upload-file-input')?.addEventListener('change', async e => {
