        </div>
      </div>`;
    }

    // Resolution select
    if (node.type === 'image') {
      f += `<div class="field"><label class="field-label">Resolution</label>
        <select class="field-select" data-field="resolution">
          ${sel([['1k','1K'],['2k','2K'],['4k','4K']], node.params.resolution)}
        </select></div>`;
    }
    if (node.type === 'video') {
      f += `<div class="field"><label class="field-label">Resolution</label>
        <select class="field-select" data-field="resolution">
          ${sel([['480P','480P'],['720P','720P'],['1080P','1080P']], node.params.resolution)}
        </select></div>`;
    }

    // Model (video)
    if (node.type === 'video') {
      f += `<div class="field"><label class="field-label">Model</label>
        <select class="field-select" data-field="modelVersion">
          ${sel([['seedance2.0fast','Non-VIP Fast'],['seedance2.0','Non-VIP'],['seedance2.0fast_vip','VIP Fast'],['seedance2.0_vip','VIP']], node.params.modelVersion)}
        </select></div>`;
    }

    // Upload node params
    if (node.type === 'upload') {
      const kind = node.uploadKind;
      const url = node.uploadUrl;
      if (url) {
        if (kind === 'image') {
          f += `<div class="field"><label class="field-label">Uploaded image</label>
            <img src="${esc(mediaUrl(url))}" alt="" referrerpolicy="no-referrer" style="width:100%;border-radius:6px;max-height:160px;object-fit:contain;background:var(--bg-0)"/>
          </div>`;
        } else if (kind === 'video') {
          f += `<div class="field"><label class="field-label">Uploaded video</label>
            <video src="${esc(mediaUrl(url))}" controls muted style="width:100%;border-radius:6px;max-height:160px;background:var(--bg-0)"></video>
          </div>`;
        } else if (kind === 'audio') {
          f += `<div class="field"><label class="field-label">Uploaded audio</label>
            <audio src="${esc(mediaUrl(url))}" controls style="width:100%;border-radius:6px"></audio>
          </div>`;
        }
        f += `<div class="field" style="display:flex;gap:6px">
          <label style="flex:1"><input type="file" accept="image/*,video/*,audio/*" data-upload-replace-input style="display:none"/>
            <span class="btn ghost" style="width:100%;justify-content:center;font-size: 13px;cursor:pointer">Replace</span>
          </label>
          <button class="btn ghost" type="button" data-clear-upload style="font-size: 13px;color:var(--err)">Remove</button>
        </div>`;
      } else {
        f += `<div class="field">
          <label style="display:block"><input type="file" accept="image/*,video/*,audio/*" data-upload-replace-input style="display:none"/>
            <span class="btn primary" style="width:100%;justify-content:center;font-size: 14px;cursor:pointer">${ICONS.upload} Choose file</span>
          </label>
          <div class="field-helper" style="text-align:center;margin-top:6px">Or drag a file onto the node.</div>
        </div>`;
      }
    }

    // Audio: prompt + voice + generated preview (MiniMax TTS)
    if (node.type === 'audio') {
      f += `<div class="field">
        <label class="field-label">Prompt</label>
        <textarea class="field-textarea" data-field="prompt" rows="4"
          placeholder="Upbeat cinematic background music, orchestral with piano and strings…">${esc(node.prompt)}</textarea>
        <div class="field-helper">Describe the audio. MiniMax TTS generates speech or music based on your description. Set MINIMAX_API_KEY and optionally MINIMAX_VOICE_ID on the server.</div>
      </div>`;
      const lastAudio = (node.results||[]).slice().reverse().find(r => r?.kind === 'audio');
      if (lastAudio) {
        const src = esc(mediaUrl(lastAudio.servePath || lastAudio.url));
        f += `<div class="field">
          <label class="field-label">Generated audio <span style="color:var(--amber);font-size: 12px">${(node.results||[]).length} run${(node.results||[]).length===1?'':'s'}</span></label>
          <audio src="${src}" controls style="width:100%;border-radius:6px"></audio>
        </div>`;
      }
    }

    // Edit node params
    if (node.type === 'edit') {
      f += `<div class="field">
        <label class="field-label">Instructions</label>
        <textarea class="field-textarea" data-field="prompt" rows="5"
          placeholder="Trim clip 1 to 3s · 2x speed on clip 2 · fade-in 0.5s · cinematic cool look · caption 'Chapter One' for first 3s · crossfade 0.5s between clips · watermark bottom-right…">${esc(node.prompt)}</textarea>
        <div class="field-helper">AI converts instructions into an ffmpeg edit plan. Supports: trim · speed · mute · transitions (fade, wipe, slide, etc.) · color/look · per-clip captions/titles · subtitle burn-in (.srt upload) · watermark (image upload) · picture-in-picture · title card · background audio · fade in/out.</div>
      </div>`;
      // Show connected clips (video and upload-video nodes)
      const editClips = upstreamNodes(node.id).filter(u => u.type === 'video' || (u.type === 'upload' && u.uploadKind === 'video'));
      const editAudio = upstreamNodes(node.id).filter(u => u.type === 'audio' || (u.type === 'upload' && u.uploadKind === 'audio'));
      if (editClips.length) {
        const clipList = editClips.map((u, i) => {
          const uLast = u.results?.[u.results.length - 1];
          const dur = uLast ? '' : (u.uploadUrl ? '(uploaded)' : '(not run)');
          return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line-soft)">
            <span style="font-family:var(--type-mono);font-size: 12px;color:var(--amber);min-width:16px">${i}</span>
            <span style="flex:1;font-size: 13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.title||'Video')}</span>
            <span style="font-size: 12px;color:var(--fg-3)">${esc(dur)}</span>
          </div>`;
        }).join('');
        f += `<div class="field">
          <label class="field-label">Clips (${editClips.length})${editAudio.length ? ` · +${editAudio.length} audio` : ''}</label>
          ${clipList}
        </div>`;
      }
      // Show edit plan if available
      const lastEditResult = (node.results||[]).slice().reverse().find(r => r?.editPlan);
      if (lastEditResult?.editPlan) {
        const plan = lastEditResult.editPlan;
        const planSummary = (plan.clips||[]).map((c, i) =>
          `<span style="color:var(--amber)">${c.index}</span> ${c.trim_start||0}–${c.trim_end??'end'}s${c.speed&&c.speed!==1?' ×'+c.speed:''}${c.mute?' 🔇':''}`
        ).join(', ');
        f += `<div class="field">
          <label class="field-label">Last edit plan <span style="color:var(--fg-3);font-size: 12px">AI generated</span></label>
          <div style="font-family:var(--type-mono);font-size: 12px;color:var(--fg-2);background:var(--bg-0);padding:8px;border-radius:4px;overflow:auto;max-height:100px;white-space:pre-wrap;word-break:break-all">${esc(planSummary||JSON.stringify(plan,null,2))}</div>
        </div>`;
      }
    }

    // Status
    let statusHtml = '';
    const lp = node.loopProgress;
    const loopSuffix = lp && lp.total > 1 ? ` (${lp.current}/${lp.total})` : '';
    if (node.status === 'running') statusHtml = `<div class="insp-status">${node.type === 'edit' ? 'Editing…' : 'Rendering…'}${loopSuffix}</div>`;
    else if (node.status === 'queued') statusHtml = `<div class="insp-status">Queued${node.queueIdx!=null?' #'+node.queueIdx:''}…${loopSuffix}</div>`;
    else if (node.status === 'error' && node.error) statusHtml = `<div class="insp-status error">⚠ ${esc(node.error)}</div>`;

    const rc = node.results?.length || 0;
    const rcHtml = rc ? `<div class="insp-run-count">${rc} run${rc===1?'':'s'} · see Files</div>` : '';

    panel.innerHTML = `
      <div class="inspector-head">
        ${thumbHtml}
        <div class="inspector-meta">
          <div class="inspector-title">${esc(node.title||spec.title)}</div>
          <div class="inspector-sub">${esc(spec.title)} · ${esc(node.id)}</div>
        </div>
      </div>
      <div class="params-body">
        ${f}
        ${statusHtml}
        ${rcHtml}
        ${!isPassive ? `<button class="btn primary" style="width:100%;justify-content:center" data-action="run">${ICONS.play} Run this node</button>` : ''}
      </div>`;

    // Seek inspector-head video to first frame so it doesn't show as a black box
    panel.querySelectorAll('.inspector-thumb video').forEach(v => {
      const seek = () => { try { v.currentTime = 0.01; } catch (_) {} };
      if (v.readyState >= 1) seek();
      else v.addEventListener('loadedmetadata', seek, { once: true });
    });

    // Wire input/select changes — gated by edit access. View users still
    // see the panel but can't change the node's prompt / title / params;
    // CSS also dims/disables the controls so the gate is just a guard rail.
    panel.querySelectorAll('[data-field]').forEach(el => {
      if (!canEdit()) { el.setAttribute('disabled', ''); return; }
      el.addEventListener('input', e => {
        const field = e.target.dataset.field;
        if (field === 'prompt') { node.prompt = e.target.value; renderNode(node); }
        else if (field === 'title') { node.title = e.target.value; renderNode(node); }
        else node.params[field] = e.target.value;
        scheduleSave();
      });
      // Numeric range clamp on commit (blur / Enter). Mid-typing stays free
      // so the user can backspace through the value without losing focus.
      const clamp = el.dataset.clamp;
      if (clamp) {
        const [lo, hi] = clamp.split('-').map(Number);
        el.addEventListener('change', e => {
          const field = e.target.dataset.field;
          const n = Math.round(Number(e.target.value));
          const v = Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : lo;
          e.target.value = String(v);
          node.params[field] = String(v);
          scheduleSave();
        });
      }
    });
    // Chip buttons — gated by edit access (view users see them dimmed).
    panel.querySelectorAll('.chip[data-field]').forEach(btn => {
      if (!canEdit()) { btn.setAttribute('disabled', ''); return; }
      btn.addEventListener('click', () => {
        const field = btn.dataset.field;
        node.params[field] = btn.dataset.val;
        panel.querySelectorAll(`.chip[data-field="${field}"]`).forEach(b => b.classList.toggle('active', b === btn));
        scheduleSave();
        // videoMode change affects prompt placeholder/helper and the node-foot badge — re-render
        if (field === 'videoMode') { renderNode(node); renderRightPanel(); }
      });
    });
    // Run button
    panel.querySelector('[data-action=run]')?.addEventListener('click', () => runNode(node.id));
    // Copy generated text (Text node)
    panel.querySelector('[data-action=copy-text]')?.addEventListener('click', () => {
      const lastTxt = (node.results || []).slice().reverse().find(r => r?.kind === 'text');
      if (!lastTxt?.text) return;
      copyToClipboard(lastTxt.text).then(
        () => toast('Copied', 'success'),
        () => toast('Copy failed', 'error'),
      );
    });
    // Editable generated-text output. NOT gated by canEdit() — view-only
    // collaborators are allowed to refine the draft. The server's merge
    // function for view users keeps `results` from the incoming payload,
    // so the edit persists. We rewrite the latest text-result in place
    // and re-render the node card so the canvas preview tracks the edit.
    const textOut = panel.querySelector('[data-text-output]');
    if (textOut) {
      const writeBack = value => {
        for (let i = node.results.length - 1; i >= 0; i--) {
          if (node.results[i]?.kind === 'text') {
            node.results[i].text = value;
            break;
          }
        }
        renderNode(node);
      };
      textOut.addEventListener('input', e => {
        writeBack(e.target.value);
        scheduleSave();
      });
      // Belt-and-braces: a rapid blur / tab-switch / refresh shouldn't lose
      // the in-flight 600ms debounce, so flush immediately on focus loss
      // and on change (Enter / commit). flushSaveNow is await-able but we
      // fire-and-forget here since the user already moved on.
      textOut.addEventListener('blur', () => { flushSaveNow(); });
      textOut.addEventListener('change', () => { flushSaveNow(); });
    }
    // Clear-upload button (upload node)
    panel.querySelector('[data-clear-upload]')?.addEventListener('click', () => {
      node.uploadUrl = null; node.uploadPath = null; node.uploadKind = null; node.uploadRatio = null;
      renderNode(node); renderRightPanel(); scheduleSave();
    });
    // Replace/choose file input (upload node params)
    panel.querySelector('[data-upload-replace-input]')?.addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      const kind = file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'image';
      const fd = new FormData(); fd.append('file', file);
      toast('Uploading…');
      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: fd });
        const d = await resp.json();
        if (d.ok) {
          node.uploadUrl = d.url; node.uploadPath = d.path || null; node.uploadKind = kind; node.uploadRatio = null;
          renderNode(node); renderRightPanel(); scheduleSave();
          if (document.getElementById('panel-output')?.style.display !== 'none') renderFilesPanel();
          toast('Upload done', 'success');
        } else { toast('Upload failed', 'error'); }
      } catch { toast('Upload failed', 'error'); }
    });
  }

  // ── Queue + Done tabs ─────────────────────────────────────────────────────
  function renderQueueTab(panel) {
    const queue = [...nodes.values()].filter(n => n.status === 'running' || n.status === 'queued');
    if (!queue.length) {
      panel.innerHTML = `<div class="empty-state"><div style="margin-bottom:12px;opacity:0.4">${ICONS.refresh}</div><div class="empty-state-title">Queue is clear</div><div class="empty-state-sub">Runs will appear here with live progress.</div></div>`;
      return;
    }
    panel.innerHTML = `<div style="padding:14px">
      <div class="side-section-title" style="margin-top:0">Active · ${queue.length}</div>
      ${queue.map(n => `<div class="queue-item">
        ${(() => { const lr = (n.results||[]).slice(-1)[0]; const t = resultThumb(lr); return t ? `<div class="queue-thumb">${t}</div>` : `<div class="queue-thumb" style="display:grid;place-items:center;color:var(--fg-3)">${ICONS[n.type]||''}</div>`; })()}
        <div class="queue-info">
          <div class="queue-name">${esc(n.title||NODE_SPECS[n.type].title)}</div>
          <div class="queue-sub">${esc(n.type)}${n.progress!=null?' · '+n.progress+'%':''}</div>
          ${n.status==='running' ? `<div class="queue-bar"><div class="queue-bar-fill" style="width:${n.progress||0}%"></div></div>` : ''}
        </div>
        ${nodeStatusHtml(n)}
      </div>`).join('')}
    </div>`;
  }

  function renderDoneTab(panel) {
    const done = [...nodes.values()].filter(n => n.status === 'done' || n.status === 'error');
    if (!done.length) {
      panel.innerHTML = `<div class="empty-state"><div style="opacity:0.4;margin-bottom:12px">${ICONS.layers}</div><div class="empty-state-title">No runs yet</div></div>`;
      return;
    }
    panel.innerHTML = `<div style="padding:14px">
      <div class="side-section-title" style="margin-top:0">Completed · ${done.length}</div>
      ${done.map(n => {
        const last = (n.results||[]).slice(-1)[0];
        return `<div class="queue-item">
          ${(() => { const t = resultThumb(last); return t ? `<div class="queue-thumb">${t}</div>` : `<div class="queue-thumb" style="display:grid;place-items:center;color:var(--fg-3)">${ICONS[n.type]||''}</div>`; })()}
          <div class="queue-info">
            <div class="queue-name">${esc(n.title||NODE_SPECS[n.type].title)}</div>
            <div class="queue-sub">${esc(n.type)}${last?` · ${last.kind||''}`:''}</div>
          </div>
          ${nodeStatusHtml(n)}
        </div>`;
      }).join('')}
    </div>`;
  }

  // Wire right panel input → save
  document.getElementById('right-panel-content')?.addEventListener('input', scheduleSave);

  // ── User menu (avatar dropdown + sign out) ────────────────────────────────
  (function setupUserMenu() {
    const menu    = document.getElementById('user-menu');
    const trigger = document.getElementById('user-menu-trigger');
    const emailEl = document.getElementById('user-menu-email');
    const signOut = document.getElementById('user-menu-signout');
    if (!menu || !trigger) return;

    fetch('/api/me', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(d => {
        if (d?.user) {
          emailEl.textContent = d.user;
          trigger.textContent = (d.user[0] || 'R').toUpperCase();
        }
      }).catch(() => {});

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = menu.classList.toggle('open');
      trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target)) {
        menu.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
      }
    });
    signOut.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
      } finally {
        window.location.href = '/login';
      }
    });
  })();
</script>
</body>
</html>
