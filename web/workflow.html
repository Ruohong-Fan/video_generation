    chevR:  `<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4l4 4-4 4"/></svg>`,
    layers: `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2L2 5l6 3 6-3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/></svg>`,
    fit:    `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"/></svg>`,
    refresh:`<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8A6 6 0 1 0 3.5 3.5"/><path d="M2 4V8h4"/></svg>`,
  };

  // ── DOM references ──────────────────────────────────────────────────────
  const canvas    = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvas-wrap');
  const edgesSvg  = document.getElementById('edges');
  const addMenu   = document.getElementById('add-menu');

  // ── Helpers ──────────────────────────────────────────────────────────────
  const uid = () => 'n' + (nextId++) + Math.random().toString(36).slice(2, 6);
  const esc = (s) => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const mediaUrl = (url) => (url && /^https?:\/\//i.test(url))
    ? `/api/media_proxy?url=${encodeURIComponent(url)}`
    : (url || '');

  function markMediaExpired(el) {
    const wrap = el.closest('.file-thumb') || el.parentElement;
    if (wrap) wrap.innerHTML = `<div class="file-thumb-expired">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
      </svg>
      <span>Expired</span></div>`;
  }

  function toast(msg, kind='') {
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function applyView() {
    canvas.style.transform   = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    edgesSvg.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    const zv = document.getElementById('zoom-val');
    if (zv) zv.textContent = Math.round(view.scale * 100) + '%';
    updateMinimap();
  }

  function screenToWorld(sx, sy) {
    const rect = canvasWrap.getBoundingClientRect();
    return {
      x: (sx - rect.left - view.x) / view.scale,
      y: (sy - rect.top  - view.y) / view.scale,
    };
  }

  function updateSelInfo() {
    const nc = document.getElementById('node-count');
    if (nc) {
      if (selected.size > 0) {
        nc.textContent = `${selected.size} selected`;
        nc.classList.add('on'); nc.classList.remove('off');
      } else {
        nc.textContent = `${nodes.size} node${nodes.size===1?'':'s'}`;
        nc.classList.remove('on'); nc.classList.add('off');
      }
    }
    updateMinimap();
    updateInspector();
  }

  // ── Node creation ───────────────────────────────────────────────────────
  function createNode(type, x, y) {
    const spec = NODE_SPECS[type];
    if (!spec) return;
    const id = uid();
    const typeCount = [...nodes.values()].filter(n => n.type === type).length;
    const node = {
      id, type, x, y,
      title: spec.title + (typeCount > 0 ? ' ' + (typeCount + 1) : ''),
      prompt: '',
      params: {
        duration: '5',
        ratio: '16:9',
        resolution: type === 'video' ? '720P' : '2k',
        modelVersion: 'seedance2.0',
      },
      status: 'idle',
      results: [],    // [{ url, kind, localPath, ts }] — newest last
      taskId: null,
      queueIdx: null,
      error: null,
      uploadUrl: null,
      uploadPath: null,
    };
    nodes.set(id, node);
    renderNode(node);
    updateSelInfo();
    return node;
  }

  const STATUS_LABEL = { idle:'Idle', queued:'Queued', running:'Running', done:'Ready', error:'Error' };

  function nodeStatusHtml(node) {
    const label = STATUS_LABEL[node.status] || node.status;
    const prog = node.status === 'running' && node.progress != null ? ` · ${node.progress}%` : '';
    return `<span class="node-status ${node.status}"><span class="dot"></span>${label}${prog}</span>`;
  }

  function renderNode(node) {
    const existing = document.getElementById(node.id);
    if (existing) existing.remove();
    const spec = NODE_SPECS[node.type];
    const el = document.createElement('div');
    el.className = `node ${node.status}${selected.has(node.id) ? ' selected' : ''}`;
    el.id = node.id;
    el.style.left = node.x + 'px';
    el.style.top  = node.y + 'px';
    const isPassive = PASSIVE_TYPES.has(node.type);
    const nodeTitle = node.title || spec.title;
    const progressBar = node.status === 'running'
      ? `<div class="node-progress"><div class="node-progress-bar" style="width:${node.progress || 0}%"></div></div>`
      : '';
    el.innerHTML = `
      ${spec.hasIn  ? `<div class="handle in"  data-node="${node.id}" data-dir="in"></div>`  : ''}
      ${spec.hasOut ? `<div class="handle out" data-node="${node.id}" data-dir="out"></div>` : ''}
      <div class="node-checkbox" data-action="check">${selected.has(node.id) ? ICONS.check : ''}</div>
      <div class="node-head">
        <span class="node-badge">${ICONS[node.type] || ''}${esc(spec.title)}</span>
        <span class="node-title">${esc(nodeTitle)}</span>
        <div class="node-actions">
          ${!isPassive ? `<button class="node-action run" data-action="run" title="Run">${ICONS.play}</button>` : ''}
          <button class="node-action" data-action="dup" title="Duplicate">${ICONS.dup}</button>
          <button class="node-action delete" data-action="del" title="Delete">${ICONS.trash}</button>
        </div>
      </div>
      ${renderNodeBody(node)}
      ${progressBar}
      <div class="node-foot">
        ${nodeStatusHtml(node)}
        <span>${esc(node.type === 'video' ? (node.params.modelVersion || '') : '')}</span>
      </div>
    `;
    canvas.appendChild(el);

    // Action buttons
    el.querySelector('[data-action=check]')?.addEventListener('click', e => {
      e.stopPropagation();
      toggleSelectNode(node.id);
    });
    el.querySelector('[data-action=run]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=run]')?.addEventListener('click', e => { e.stopPropagation(); runNode(node.id); });
    el.querySelector('[data-action=dup]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=dup]')?.addEventListener('click', e => { e.stopPropagation(); duplicateNode(node.id); });
    el.querySelector('[data-action=del]')?.addEventListener('pointerdown', e => e.stopPropagation());
    el.querySelector('[data-action=del]')?.addEventListener('click', e => { e.stopPropagation(); deleteNode(node.id); });
  }

  function renderNodeBody(node) {
    const results = node.results || [];
    const last = results[results.length - 1];
    const count = results.length;
    const countBadge = count > 1
      ? `<div class="node-output-count">${count} outputs — see Files</div>`
      : '';

    if (node.type === 'text') {
      if (node.prompt) {
        return `<div class="node-text-body">${esc(node.prompt.slice(0, 300))}</div>`;
      }
      return `<div class="node-preview empty">No prompt yet</div>`;
    }

    if (node.type === 'audio') {
      if (node.uploadUrl) {
        // Deterministic waveform bars
        const bars = 28;
        const waveBars = Array.from({ length: bars }, (_, i) => {
          const h = 10 + 20 * Math.abs(Math.sin(i * 0.6 + (node.id.charCodeAt(1) || 1))) + 5 * Math.abs(Math.sin(i * 1.3));
          return `<span style="height:${h}px"></span>`;
        }).join('');
        return `<div class="node-audio-body">
          <button class="node-action run" style="width:28px;height:28px;border-radius:50%;background:var(--amber);color:oklch(0.18 0.03 65);flex-shrink:0" title="Play">${ICONS.play}</button>
          <div class="wave">${waveBars}</div>
        </div>`;
      }
      return `<div class="node-preview empty">No audio — upload in Params</div>`;
    }

    if (last?.url || last?.localPath) {
      const u = mediaUrl(last.servePath || last.url);
      const media = last.kind === 'video'
        ? `<video controls preload="metadata" muted playsinline referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"><source src="${esc(u)}" type="video/mp4"/></video>`
        : `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"/>`;
      return `<div class="node-output-wrap"><div class="node-preview">${media}</div>${countBadge}</div>`;
    }
    if ((node.type === 'image' || node.type === 'video') && node.uploadUrl) {
      return `<div class="node-preview"><img src="${esc(mediaUrl(node.uploadUrl))}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:cover;display:block"/></div>`;
    }
    const msg = {
      running: node.progress != null ? `Rendering · ${node.progress}%` : 'Rendering…',
      queued: 'Queued…',
      error: 'Error — see Params',
    };
    return `<div class="node-preview empty">${msg[node.status] || 'No output yet'}</div>`;
  }

  function duplicateNode(id) {
    const n = nodes.get(id);
    if (!n) return;
    const newNode = createNode(n.type, n.x + 260, n.y + 20);
    if (newNode) {
      newNode.prompt = n.prompt;
      newNode.params = { ...n.params };
      newNode.title  = (n.title || NODE_SPECS[n.type].title) + ' copy';
      renderNode(newNode);
    }
  }

  function deleteNode(id) {
    const n = nodes.get(id);
    if (!n) return;
    document.getElementById(id)?.remove();
    nodes.delete(id);
    selected.delete(id);
    // Remove connected edges
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].fromId === id || edges[i].toId === id) edges.splice(i, 1);
    }
    renderAllEdges();
    updateSelInfo();
  }

  function toggleSelectNode(id) {
    setSelected(id, !selected.has(id));
    updateSelInfo();
  }

  // ── Execution ───────────────────────────────────────────────────────────
  function setNodeStatus(id, status, extra = {}) {
    const n = nodes.get(id);
    if (!n) return;
    n.status = status;
    Object.assign(n, extra);
    renderNode(n);
    updateEdgesFor(id);
    if (document.getElementById('panel-files')?.style.display !== 'none') renderFilesPanel();
    if (selected.has(id)) renderInspector(id);
    // Refresh inspector of any selected downstream node so upstream output appears
    if (status === 'done') {
      edges.filter(e => e.fromId === id).forEach(e => {
        if (selected.has(e.toId)) renderInspector(e.toId);
      });
    }
  }

  function upstreamNodes(id) {
    return edges.filter(e => e.toId === id).map(e => nodes.get(e.fromId)).filter(Boolean);
  }

  function collectInputs(node) {
    const up = upstreamNodes(node.id);
    let prompt = node.prompt || '';
    const imageRefs = [];
    const imagePrompts = [];
    for (const u of up) {
      if (u.type === 'text' && u.prompt) prompt = u.prompt;
      const uLast = u.results?.[u.results.length - 1];
      if (uLast?.kind === 'image') {
        const ref = uLast.localPath || uLast.url || null;
        if (ref) imageRefs.push(ref);
      }
      if (u.type === 'image' && u.prompt) imagePrompts.push(u.prompt);
    }
    // Node's own upload appended after upstream results
    if (node.uploadPath) imageRefs.push(node.uploadPath);
    else if (node.uploadUrl) imageRefs.push(node.uploadUrl);
    return { prompt, imageRefs, imagePrompts };
  }

  // Nodes that don't need to call an API — they provide data to downstream
  const PASSIVE_TYPES = new Set(['text', 'audio']);

  async function startTask(node) {
    const { prompt, imageRefs, imagePrompts } = collectInputs(node);
    const imageRef = imageRefs[0] || null;
    let endpoint, body;

    if (node.type === 'image') {
      if (imageRef) {
        if (!prompt) throw new Error('prompt required for image transform');
        endpoint = '/api/image2image';
        body = { image: imageRef, prompt, ratio: node.params.ratio };
      } else {
        if (!prompt) throw new Error('prompt required (connect a Text node or type one)');
        endpoint = '/api/text2image';
        body = { prompt, ratio: node.params.ratio, resolution: node.params.resolution };
      }
    } else if (node.type === 'video') {
      // Always use text2video — image upload to Jimeng is unreliable.
      // If the node has no prompt, fall back to upstream image nodes' prompts.
      const videoPrompt = prompt || imagePrompts.join(', ');
      if (!videoPrompt) throw new Error('prompt required (connect a Text or Image node, or type one)');
      endpoint = '/api/text2video';
      body = { prompt: videoPrompt, duration: node.params.duration, ratio: node.params.ratio, resolution: node.params.resolution, model_version: node.params.modelVersion };
    } else {
      throw new Error('Unsupported node type: ' + node.type);
    }

    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Submit failed');
    return data.task_id;
  }

  function extractOutputUrl(task) {
    const r = task?.result;
    if (!r || typeof r !== 'object') return null;
    if (r.url) return r.url;
    if (r.data?.url) return r.data.url;
    if (r.video_url) return r.video_url;
    if (r.image_url) return r.image_url;
    if (r.data?.video_url) return r.data.video_url;
    if (r.data?.image_url) return r.data.image_url;
    if (r.local_path) return r.local_path;
    if (r.data?.local_path) return r.data.local_path;
    if (Array.isArray(r.urls) && r.urls[0]) return r.urls[0];
    if (Array.isArray(r.data) && r.data[0]?.url) return r.data[0].url;
    if (r.item_list && Array.isArray(r.item_list) && r.item_list[0]) {
      const it = r.item_list[0];
      return it.video?.url || it.image?.url || it.url || null;
    }
    if (r.data?.item_list && Array.isArray(r.data.item_list) && r.data.item_list[0]) {
      const it = r.data.item_list[0];
      return it.video?.url || it.image?.url || it.url || null;
    }
    if (r.result_json?.videos?.[0]?.video_url) return r.result_json.videos[0].video_url;
    if (r.result_json?.videos?.[0]?.url) return r.result_json.videos[0].url;
    if (r.result_json?.images?.[0]?.image_url) return r.result_json.images[0].image_url;
    if (r.result_json?.images?.[0]?.url) return r.result_json.images[0].url;
    if (r.data?.result_json?.videos?.[0]?.video_url) return r.data.result_json.videos[0].video_url;
    if (r.data?.result_json?.videos?.[0]?.url) return r.data.result_json.videos[0].url;
    if (r.data?.result_json?.images?.[0]?.image_url) return r.data.result_json.images[0].image_url;
    if (r.data?.result_json?.images?.[0]?.url) return r.data.result_json.images[0].url;
    return null;
  }

  async function pollUntilDone(taskId, nodeId) {
    while (true) {
      await new Promise(r => setTimeout(r, 3000));
      const resp = await fetch('/api/task/' + taskId);
      if (!resp.ok) throw new Error('Task lookup failed');
      const t = await resp.json();
      if (t.status === 'done')  return t;
      if (t.status === 'error') throw new Error(t.error || 'Task errored');
      const n = nodes.get(nodeId);
      if (n && t.queue_idx != null) {
        n.queueIdx = t.queue_idx;
        const el = document.getElementById(nodeId);
        const badge = el?.querySelector('.node-id');
        if (badge) badge.textContent = `queued #${t.queue_idx}`;
      }
    }
    throw new Error('Timed out');
  }

  async function runNode(id) {
    const node = nodes.get(id);
    if (!node) return;
    if (PASSIVE_TYPES.has(node.type)) {
      toast('Script/Audio nodes provide data to downstream — no run needed');
      return;
    }
    if (node.status === 'running' || node.status === 'queued') {
      toast('Already running', '');
      return;
    }
    try {
      setNodeStatus(id, 'queued', { error: null, queueIdx: null });
      const taskId = await startTask(node);
      node.taskId = taskId;
      setNodeStatus(id, 'running', { taskId });
      const task = await pollUntilDone(taskId, id);
      const url = extractOutputUrl(task);
      const kind = node.type === 'video' ? 'video' : 'image';
      // localPath = CLI's own saved file (for passing back to CLI as --image input)
      // servePath = server-downloaded /uploads/ copy (for browser display)
      const localPath = task?.result?.data?.local_path || task?.result?.local_path || null;
      const servePath = task?.result?.data?.serve_path || task?.result?.serve_path || null;
      const newResults = [...(node.results || [])];
      if (url || localPath || servePath) newResults.push({ url, kind, localPath, servePath, ts: Date.now() });
      setNodeStatus(id, 'done', { results: newResults, error: null, queueIdx: null });
      toast(`${node.type} done`, 'success');
    } catch (err) {
      setNodeStatus(id, 'error', { error: err.message, queueIdx: null });
      toast(`${node.type}: ${err.message}`, 'error');
    }
  }

  function topoSort(ids) {
    const set = new Set(ids);
    const inDeg = new Map();
    for (const id of ids) inDeg.set(id, 0);
    for (const e of edges) {
      if (set.has(e.fromId) && set.has(e.toId)) {
        inDeg.set(e.toId, (inDeg.get(e.toId) || 0) + 1);
      }
    }
    const queue = [...ids].filter(id => inDeg.get(id) === 0);
    const out = [];
    while (queue.length) {
      const id = queue.shift();
      out.push(id);
      for (const e of edges) {
        if (e.fromId === id && set.has(e.toId)) {
          inDeg.set(e.toId, inDeg.get(e.toId) - 1);
          if (inDeg.get(e.toId) === 0) queue.push(e.toId);
        }
      }
    }
    return out.length === ids.length ? out : null;
  }

  async function runGraph(ids) {
    const order = topoSort(ids);
    if (!order) { toast('Cycle detected — cannot run', 'error'); return; }
    const runnableSet = new Set(order.filter(id => !PASSIVE_TYPES.has(nodes.get(id)?.type)));
    if (!runnableSet.size) { toast('Nothing runnable selected'); return; }
    toast(`Running ${runnableSet.size} node(s)…`);

    // For each runnable node, find which OTHER runnable nodes it depends on (direct upstream edges within selection)
    const upstreamDeps = new Map(); // id -> [upstream id, ...]
    for (const id of runnableSet) {
      upstreamDeps.set(id, edges.filter(e => e.toId === id && runnableSet.has(e.fromId)).map(e => e.fromId));
    }

    // One promise per runnable node; resolve when that node finishes (success or error)
    const promises = new Map();

    function launchNode(id) {
      if (promises.has(id)) return promises.get(id);
      const p = (async () => {
        // Wait for all upstream runnable deps first
        const ups = upstreamDeps.get(id);
        if (ups.length) await Promise.all(ups.map(uid => launchNode(uid)));
        // Skip if any direct upstream errored
        const upstreamFailed = ups.some(uid => nodes.get(uid)?.status === 'error');
        if (upstreamFailed) {
          setNodeStatus(id, 'error', { error: 'Skipped — upstream node failed' });
          return;
        }
        await runNode(id);
      })();
      promises.set(id, p);
      return p;
    }

    // Launch all — each one will self-suspend until its deps resolve
    await Promise.all([...runnableSet].map(id => launchNode(id)));
  }

  // ── Edge drawing ────────────────────────────────────────────────────────
  const NODE_WIDTH = 240;

  function handlePos(nodeId, dir) {
    const el = document.getElementById(nodeId);
    const n = nodes.get(nodeId);
    if (!el || !n) return { x: 0, y: 0 };
    const h = el.offsetHeight || 200;
    return {
      x: n.x + (dir === 'out' ? NODE_WIDTH : 0),
      y: n.y + h / 2,
    };
  }

  function edgePath(x1, y1, x2, y2) {
    const dx = Math.max(60, Math.abs(x2 - x1) * 0.5);
    return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
  }

  function renderAllEdges() {
    edgesSvg.innerHTML = '';
    for (const edge of edges) renderEdge(edge);
  }

  function renderEdge(edge) {
    const existing = edgesSvg.querySelector(`[data-edge-id="${edge.id}"]`);
    const existingHit = edgesSvg.querySelector(`[data-edge-hit="${edge.id}"]`);
    if (existing) existing.remove();
    if (existingHit) existingHit.remove();

    const a = handlePos(edge.fromId, 'out');
    const b = handlePos(edge.toId,   'in');
    const d = edgePath(a.x, a.y, b.x, b.y);

    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('d', d);
    hit.setAttribute('class', 'edge-hit');
    hit.setAttribute('data-edge-hit', edge.id);
    hit.addEventListener('click', (e) => {
      e.stopPropagation();
      if (canvasTool === 'select') return;
      selectEdge(edge.id);
    });
    edgesSvg.appendChild(hit);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge' + (edge.selected ? ' selected' : ''));
    path.setAttribute('data-edge-id', edge.id);
    path.addEventListener('click', (e) => {
      e.stopPropagation();
      if (canvasTool === 'select') return;
      selectEdge(edge.id);
    });
    edgesSvg.appendChild(path);
  }

  function updateEdgesFor(nodeId) {
    for (const edge of edges) {
      if (edge.fromId === nodeId || edge.toId === nodeId) renderEdge(edge);
    }
  }

  function selectEdge(id) {
    clearSelection();
    for (const e of edges) e.selected = (e.id === id);
    renderAllEdges();
    toast('Edge selected — press Delete to remove');
  }

  function deleteSelectedEdges() {
    const affected = new Set();
    let removed = 0;
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].selected) { affected.add(edges[i].toId); edges.splice(i, 1); removed++; }
    }
    if (removed) {
      renderAllEdges();
      for (const id of affected) { const n = nodes.get(id); if (n) renderNode(n); }
      toast(`${removed} edge(s) deleted`);
    }
    return removed;
  }

  function canConnect(fromId, toId) {
    if (fromId === toId) return false;
    if (!NODE_SPECS[nodes.get(fromId).type].hasOut) return false;
    if (!NODE_SPECS[nodes.get(toId).type].hasIn) return false;
    for (const e of edges) if (e.fromId === fromId && e.toId === toId) return false;
    return true;
  }

  function addEdge(fromId, toId) {
    if (!canConnect(fromId, toId)) { toast('Cannot connect these nodes', 'error'); return; }
    edges.push({ id: 'e' + Math.random().toString(36).slice(2, 8), fromId, toId, selected: false });
    renderAllEdges();
    const n = nodes.get(toId); if (n) renderNode(n);
    if (selected.has(toId)) renderInspector(toId);
    if (selected.has(fromId)) renderInspector(fromId);
  }

  // ── Handle drag (create edges) ──────────────────────────────────────────
  let edgeDrag = null;

  function cancelEdgeDrag() {
    document.querySelectorAll('.handle.connecting').forEach(h => h.classList.remove('connecting'));
    edgesSvg.querySelector('.edge-temp')?.remove();
    edgeDrag = null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.handle');
    if (!handle) return;
    if (handle.dataset.dir !== 'out') return;
    e.stopPropagation();
    e.preventDefault();

    const fromId = handle.dataset.node;
    edgeDrag = { fromId };
    handle.classList.add('connecting');

    function onMove(ev) {
      const a = handlePos(fromId, 'out');
      const w = screenToWorld(ev.clientX, ev.clientY);
      let tempPath = edgesSvg.querySelector('.edge-temp');
      if (!tempPath) {
        tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tempPath.setAttribute('class', 'edge-temp');
        edgesSvg.appendChild(tempPath);
      }
      tempPath.setAttribute('d', edgePath(a.x, a.y, w.x, w.y));
    }

    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup',   onUp);
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = el?.closest?.('.handle');
      if (target && target.dataset.dir === 'in' && target.dataset.node !== fromId) {
        addEdge(fromId, target.dataset.node);
      }
      cancelEdgeDrag();
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup',   onUp);
  });

  // Cancel edge drag on Escape
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && edgeDrag) cancelEdgeDrag();
  });

  // ── Selection ───────────────────────────────────────────────────────────
  function setSelected(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    if (value) { selected.add(id); el.classList.add('selected'); }
    else       { selected.delete(id); el.classList.remove('selected'); }
  }
  function clearSelection() {
    for (const id of [...selected]) setSelected(id, false);
    updateSelInfo();
  }
  function selectOnly(id) {
    clearSelection();
    setSelected(id, true);
    updateSelInfo();
  }
  function toggleSelect(id) {
    setSelected(id, !selected.has(id));
    updateSelInfo();
  }
  function selectInRect(x1, y1, x2, y2) {
    const [lo, hi] = [Math.min(x1,x2), Math.max(x1,x2)];
    const [to, bo] = [Math.min(y1,y2), Math.max(y1,y2)];
    clearSelection();
    for (const n of nodes.values()) {
      const el = document.getElementById(n.id);
      const nx2 = n.x + (el?.offsetWidth || NODE_WIDTH);
      const ny2 = n.y + (el?.offsetHeight || 200);
      if (n.x < hi && nx2 > lo && n.y < bo && ny2 > to) setSelected(n.id, true);
    }
    updateSelInfo();
  }

  function deleteNode(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    const downstream = new Set();
    let edgeRemoved = false;
    for (let i = edges.length - 1; i >= 0; i--) {
      if (edges[i].fromId === id) { downstream.add(edges[i].toId); edges.splice(i, 1); edgeRemoved = true; }
      else if (edges[i].toId === id) { edges.splice(i, 1); edgeRemoved = true; }
    }
    nodes.delete(id);
    selected.delete(id);
    if (edgeRemoved) renderAllEdges();
    for (const did of downstream) { const n = nodes.get(did); if (n) renderNode(n); }
    updateSelInfo();
  }

  function deleteSelected() {
    const removedEdges = deleteSelectedEdges();
    if (selected.size === 0) {
      if (!removedEdges) return;
      return;
    }
    const n = selected.size;
    for (const id of [...selected]) deleteNode(id);
    toast(`${n} node(s) deleted`);
  }

  // ── Node interactions: click, shift-click, drag ─────────────────────────
  let dragState = null;

  canvas.addEventListener('pointerdown', (e) => {
    const nodeEl = e.target.closest('.node');
    if (!nodeEl) return;
    if (e.button !== 0) return;
    if (canvasTool === 'select') return;
    if (e.target.closest('input, textarea, select, button, .handle')) return;
    const node = nodes.get(nodeEl.id);
    if (!node) return;
    e.stopPropagation();

    // Selection logic on mousedown (like Figma)
    if (e.shiftKey) {
      toggleSelect(node.id);
    } else if (!selected.has(node.id)) {
      selectOnly(node.id);
    }

    // Capture starting positions of every selected node for group drag
    const group = [...selected].map(id => {
      const n = nodes.get(id);
      return { id, origX: n.x, origY: n.y };
    });
    dragState = {
      group, moved: false,
      startX: e.clientX, startY: e.clientY,
      pointerId: e.pointerId,
      captureEl: nodeEl,
    };
    nodeEl.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });

  function onNodeDragMove(e) {
    if (!dragState) return;
    if (e.pointerId !== dragState.pointerId) return;
    const dx = (e.clientX - dragState.startX) / view.scale;
    const dy = (e.clientY - dragState.startY) / view.scale;
    if (Math.abs(dx) + Math.abs(dy) > 2) dragState.moved = true;
    for (const g of dragState.group) {
      const n = nodes.get(g.id);
      if (!n) continue;
      n.x = g.origX + dx;
      n.y = g.origY + dy;
      const el = document.getElementById(g.id);
      if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
      updateEdgesFor(g.id);
    }
    e.preventDefault();
  }

  function endNodeDrag(e) {
    if (!dragState) return;
    if (e.pointerId != null && e.pointerId !== dragState.pointerId) return;
    if (dragState.captureEl?.hasPointerCapture?.(dragState.pointerId)) {
      dragState.captureEl.releasePointerCapture(dragState.pointerId);
    }
    if (dragState.moved) scheduleSave();
    dragState = null;
  }

  document.addEventListener('pointermove', onNodeDragMove);
  document.addEventListener('pointerup', endNodeDrag);
  document.addEventListener('pointercancel', endNodeDrag);
  window.addEventListener('blur', () => { dragState = null; });

  // ── Tool mode ────────────────────────────────────────────────────────────
  let canvasTool = 'pan'; // 'pan' | 'select'

  function setTool(tool) {
    canvasTool = tool;
    canvasWrap.classList.toggle('mode-select', tool === 'select');
  }

  // ── Canvas panning + box-selection ──────────────────────────────────────
  let panState = null;
  let selBoxState = null;
  let selBoxEl = null;
  let selBoxMoved = false;

  window.addEventListener('keydown', (e) => {
    const active = document.activeElement.tagName;
    if (active === 'TEXTAREA' || active === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); } // prevent page scroll
    if (e.key === 'h' || e.key === 'H') setTool('pan');
    if (e.key === 'v' || e.key === 'V') setTool('select');
    if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
    if (e.key === 'Escape') clearSelection();
  });

  canvasWrap.addEventListener('pointerdown', (e) => {
    const startNode = e.target.closest('.node');
    if (startNode && canvasTool !== 'select') return;
    if (e.target.closest('svg') && canvasTool !== 'select') return; // let edge-path clicks reach their handlers
    if (e.target.closest('.canvas-overlay')) return; // let overlay controls handle their own events
    if (e.button === 2) return;

    // Middle-click always pans regardless of mode
    const wantPan = canvasTool === 'pan' || e.button === 1;

    if (wantPan) {
      panState = { startX: e.clientX, startY: e.clientY, origX: view.x, origY: view.y, moved: false, pointerId: e.pointerId };
      canvasWrap.classList.add('panning');
      canvasWrap.setPointerCapture?.(e.pointerId);
      e.preventDefault();
      return;
    }

    // Select mode: drag to draw a selection box
    const start = screenToWorld(e.clientX, e.clientY);
    selBoxState = { sx: start.x, sy: start.y, pointerId: e.pointerId, startNodeId: startNode?.id || null };
    selBoxMoved = false;
    selBoxEl = document.createElement('div');
    selBoxEl.className = 'sel-box';
    canvas.appendChild(selBoxEl);
    canvasWrap.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });

  function onCanvasGestureMove(e) {
    if (panState) {
      if (e.pointerId !== panState.pointerId) return;
      const dx = e.clientX - panState.startX;
      const dy = e.clientY - panState.startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) panState.moved = true;
      view.x = panState.origX + dx;
      view.y = panState.origY + dy;
      applyView();
      e.preventDefault();
      return;
    }
    if (selBoxState && selBoxEl) {
      if (e.pointerId !== selBoxState.pointerId) return;
      const cur = screenToWorld(e.clientX, e.clientY);
      const lo = Math.min(selBoxState.sx, cur.x);
      const to = Math.min(selBoxState.sy, cur.y);
      const w  = Math.abs(cur.x - selBoxState.sx);
      const h  = Math.abs(cur.y - selBoxState.sy);
      if (w + h > 4) selBoxMoved = true;
      selBoxEl.style.left   = lo + 'px';
      selBoxEl.style.top    = to + 'px';
      selBoxEl.style.width  = w  + 'px';
      selBoxEl.style.height = h  + 'px';
      selectInRect(selBoxState.sx, selBoxState.sy, cur.x, cur.y);
      e.preventDefault();
    }
  }

  function endCanvasGesture(e) {
    const pointerId = e?.pointerId;
    if (pointerId != null) {
      if (panState && pointerId !== panState.pointerId) return;
      if (selBoxState && pointerId !== selBoxState.pointerId) return;
    }
    if (panState && !panState.moved) clearSelection(); // click on empty canvas = deselect
    panState = null;
    canvasWrap.classList.remove('panning');
    if (selBoxEl) { selBoxEl.remove(); selBoxEl = null; }
    if (selBoxState && !selBoxMoved) {
      if (selBoxState.startNodeId) selectOnly(selBoxState.startNodeId);
      else clearSelection(); // click without drag in select mode = deselect
    }
    selBoxState = null;
    selBoxMoved = false;
  }

  document.addEventListener('pointermove', onCanvasGestureMove);
  canvasWrap.addEventListener('pointerup', endCanvasGesture);
  canvasWrap.addEventListener('pointercancel', endCanvasGesture);
  document.addEventListener('pointerup', endCanvasGesture);
  document.addEventListener('pointercancel', endCanvasGesture);
  window.addEventListener('blur', endCanvasGesture);

  // ── Canvas zoom (wheel) ─────────────────────────────────────────────────
  canvasWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = -e.deltaY * 0.0015;
    const newScale = Math.min(2, Math.max(0.3, view.scale * (1 + delta)));
    const w = screenToWorld(e.clientX, e.clientY);
    view.scale = newScale;
    // Re-center around cursor position
    const rect = canvasWrap.getBoundingClientRect();
    view.x = e.clientX - rect.left - w.x * view.scale;
    view.y = e.clientY - rect.top  - w.y * view.scale;
    applyView();
  }, { passive: false });

  // ── Add-node menu wiring ────────────────────────────────────────────────
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#add-menu')) addMenu.classList.remove('open');
  });
  addMenu.querySelectorAll('.add-menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const type = item.dataset.nodeType;
      // Drop the new node near the center of the current viewport
      const rect = canvasWrap.getBoundingClientRect();
      const center = screenToWorld(rect.left + rect.width/2, rect.top + rect.height/2);
      createNode(type, center.x - 120 + Math.random()*40, center.y - 60 + Math.random()*40);
      addMenu.classList.remove('open');
    });
  });

  // ── Fit to view ──────────────────────────────────────────────────────────
  function fitToView() {
    if (nodes.size === 0) return;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 240); maxY = Math.max(maxY, n.y + 260);
    }
    const rect = canvasWrap.getBoundingClientRect();
    const sx = (rect.width  - 80) / (maxX - minX || 1);
    const sy = (rect.height - 80) / (maxY - minY || 1);
    view.scale = Math.min(2, Math.max(0.3, Math.min(sx, sy)));
    view.x = 40 - minX * view.scale;
    view.y = 40 - minY * view.scale;
    applyView();
  }
  document.getElementById('btn-fit').addEventListener('click', fitToView);

  // ── Clear canvas ────────────────────────────────────────────────────────
  document.getElementById('btn-clear-all').addEventListener('click', () => {
    if (!nodes.size) return;
    if (!confirm('Clear all nodes?')) return;
    nodes.clear();
    edges.length = 0;
    selected.clear();
    canvas.innerHTML = '';
    edgesSvg.innerHTML = '';
    updateSelInfo();
  });

  // ── Run buttons ─────────────────────────────────────────────────────────
  document.getElementById('btn-run-selected').addEventListener('click', () => {
    if (!selected.size) { toast('Select nodes first (click or drag a box)'); return; }
    runGraph([...selected]);
  });
  document.getElementById('btn-run-all').addEventListener('click', () => {
    if (!nodes.size) { toast('Canvas is empty'); return; }
    runGraph([...nodes.keys()]);
  });

  // ── Credits ─────────────────────────────────────────────────────────────
  (async () => {
    try {
      const r = await fetch('/api/credits');
      const d = await r.json();
      document.getElementById('credits-text').textContent =
        d.ok ? d.output.replace(/\n/g, ' ').slice(0, 50) : 'Login required';
    } catch {
      document.getElementById('credits-text').textContent = 'Server offline';
    }
  })();

  // ── Persistence (save/load workflow to server) ──────────────────────────
  const saveStatus = document.getElementById('save-status');
  let saveTimer = null;
  let loading = false;

  function serialize() {
    return {
      nodes: [...nodes.values()].map(n => ({
        id: n.id, type: n.type, x: n.x, y: n.y,
        title: n.title, prompt: n.prompt, params: n.params,
        status: n.status === 'running' || n.status === 'queued' ? 'idle' : n.status,
        results: n.results || [], uploadUrl: n.uploadUrl, uploadPath: n.uploadPath,
      })),
      edges: edges.map(e => ({ id: e.id, fromId: e.fromId, toId: e.toId })),
      view: { x: view.x, y: view.y, scale: view.scale },
    };
  }

  function scheduleSave() {
    if (loading) return;
    saveStatus.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        const resp = await fetch(WORKFLOW_API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(serialize()),
        });
        const d = await resp.json();
        saveStatus.textContent = d.ok ? 'Saved' : 'Save failed';
      } catch {
        saveStatus.textContent = 'Offline';
      }
    }, 600);
  }

  // Observe mutations on canvas + edges SVG to catch drags/renders/connections
  const mo = new MutationObserver(scheduleSave);
  mo.observe(canvas,   { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
  mo.observe(edgesSvg, { childList: true, subtree: true });

  // Save on field edits inside nodes (prompt, params)
  canvas.addEventListener('input', scheduleSave);

  async function loadWorkflow() {
    loading = true;
    try {
      const resp = await fetch(WORKFLOW_API);
      const d = await resp.json();
      const wf = d.workflow || {};
      if (wf.nodes && typeof wf.nodes === 'object') {
        const arr = Array.isArray(wf.nodes) ? wf.nodes : Object.values(wf.nodes);
        const LEGACY_TYPES = { script:'text', text2image:'image', image2image:'image', text2video:'video', image2video:'video' };
        for (const n of arr) {
          const nodeType = LEGACY_TYPES[n.type] || n.type;
          nodes.set(n.id, {
            id: n.id, type: nodeType, x: n.x, y: n.y,
            prompt: n.prompt || '',
            params: {
              duration: n.params?.duration || '5',
              ratio: n.params?.ratio || '16:9',
              resolution: n.params?.resolution || (nodeType === 'video' ? '720P' : '2k'),
              modelVersion: n.params?.modelVersion || 'seedance2.0',
            },
            title: n.title || (LEGACY_TYPES[n.type] ? NODE_SPECS[LEGACY_TYPES[n.type] || n.type]?.title : NODE_SPECS[nodeType]?.title) || nodeType,
            status: n.status || 'idle',
            results: Array.isArray(n.results) ? n.results : (n.result ? [n.result] : []),
            taskId: null,
            queueIdx: n.queueIdx ?? null,
            error: n.error || null,
            uploadUrl: n.uploadUrl || null,
            uploadPath: n.uploadPath || null,
          });
          renderNode(nodes.get(n.id));
        }
      }
      if (Array.isArray(wf.edges)) {
        for (const e of wf.edges) {
          if (nodes.has(e.fromId) && nodes.has(e.toId)) {
            edges.push({ id: e.id, fromId: e.fromId, toId: e.toId, selected: false });
          }
        }
        renderAllEdges();
        // Re-render downstream nodes now that edges are known (shows connection indicators)
        const downstream = new Set(edges.map(e => e.toId));
        for (const id of downstream) { const n = nodes.get(id); if (n) renderNode(n); }
      }
      if (wf.view) {
        view.x = wf.view.x ?? 0;
        view.y = wf.view.y ?? 0;
        view.scale = wf.view.scale ?? 1;
        applyView();
      }
      saveStatus.textContent = 'Saved';
    } catch {
      saveStatus.textContent = 'Offline';
    } finally {
      loading = false;
    }
    repairResults();
  }

  // After loading, download any CDN results that have no servePath yet (parallel)
  async function repairResults() {
    const repairs = [];
    for (const node of nodes.values()) {
      for (const r of (node.results || [])) {
        // Need a servePath for browser display; url must be a CDN http URL
        const needsRepair = !r.servePath && r.url && r.url.startsWith('http');
        if (needsRepair) {
          repairs.push(
            fetch('/api/download_url', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: r.url }),
            })
            .then(res => res.json())
            .then(d => {
              if (d.ok && d.localPath) { r.servePath = d.localPath; return node; }
            })
            .catch(() => null)
          );
        }
      }
    }
    if (!repairs.length) return;
    const changed = new Set((await Promise.all(repairs)).filter(Boolean));
    if (!changed.size) return;
    for (const node of changed) {
      renderNode(node);
      if (selected.has(node.id)) renderInspector(node.id);
    }
    if (document.getElementById('panel-files')?.style.display !== 'none') renderFilesPanel();
    scheduleSave();
  }

  // ── Zoom overlay controls ───────────────────────────────────────────────
  function zoomAround(factor) {
    const rect = canvasWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const w = screenToWorld(cx, cy);
    view.scale = Math.min(2, Math.max(0.3, view.scale * factor));
    view.x = cx - rect.left - w.x * view.scale;
    view.y = cy - rect.top  - w.y * view.scale;
    applyView();
  }
  document.getElementById('btn-zoom-in').addEventListener('click',  () => zoomAround(1.25));
  document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAround(0.8));

  // F key → fit to view
  window.addEventListener('keydown', (e) => {
    const active = document.activeElement.tagName;
    if (active === 'TEXTAREA' || active === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') fitToView();
  });

  // ── Minimap ─────────────────────────────────────────────────────────────
  function updateMinimap() {
    const inner = document.getElementById('minimap-inner');
    if (!inner) return;
    inner.innerHTML = '';
    if (nodes.size === 0) return;

    // Node bounds in world space
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 240); maxY = Math.max(maxY, n.y + 260);
    }

    // Viewport bounds in world space
    const wrap = canvasWrap.getBoundingClientRect();
    const tl = screenToWorld(wrap.left, wrap.top);
    const br = screenToWorld(wrap.right, wrap.bottom);

    // Expand world extent to always include the viewport so the rect is visible
    minX = Math.min(minX, tl.x) - 40;
    minY = Math.min(minY, tl.y) - 40;
    maxX = Math.max(maxX, br.x) + 40;
    maxY = Math.max(maxY, br.y) + 40;

    const worldW = maxX - minX || 1;
    const worldH = maxY - minY || 1;
    const mw = inner.offsetWidth  || 150;
    const mh = inner.offsetHeight || 90;
    const scale = Math.min(mw / worldW, mh / worldH);
    // Center content within the minimap
    const ox = (mw - worldW * scale) / 2;
    const oy = (mh - worldH * scale) / 2;

    for (const n of nodes.values()) {
      const d = document.createElement('div');
      d.className = 'minimap-node' + (selected.has(n.id) ? ' selected' : '');
      d.style.left   = (ox + (n.x - minX) * scale) + 'px';
      d.style.top    = (oy + (n.y - minY) * scale) + 'px';
      d.style.width  = Math.max(4, 240 * scale) + 'px';
      d.style.height = Math.max(3, 80  * scale) + 'px';
      inner.appendChild(d);
    }

    const vp = document.createElement('div');
    vp.className = 'minimap-viewport';
    vp.style.left   = (ox + (tl.x - minX) * scale) + 'px';
    vp.style.top    = (oy + (tl.y - minY) * scale) + 'px';
    vp.style.width  = Math.max(4, (br.x - tl.x) * scale) + 'px';
    vp.style.height = Math.max(4, (br.y - tl.y) * scale) + 'px';
    inner.appendChild(vp);
  }

  function renderFilesPanel() {
    const panel = document.getElementById('panel-files');
    if (!panel) return;

    const thumb = (r) => {
      const p = esc(mediaUrl(r.servePath || r.url));
      if (r.kind === 'video') return `<video src="${p}" muted preload="metadata" referrerpolicy="no-referrer" onerror="markMediaExpired(this)"></video>`;
      if (r.kind === 'audio') return '🎵';
      return `<img src="${p}" alt="" referrerpolicy="no-referrer" onerror="markMediaExpired(this)"/>`;
    };
    const fmtTs = ts => { try { return ts ? new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''; } catch { return ''; } };

    let html = '';
    let totalOutputs = 0;
    let totalUploads = 0;

    for (const n of nodes.values()) {
      const label = NODE_SPECS[n.type]?.title || n.type;
      const results = n.results || [];
      if (results.length) {
        totalOutputs += results.length;
        html += `<div class="side-section-title">${esc(label)}</div>`;
        // Show newest first
        for (let i = results.length - 1; i >= 0; i--) {
          const r = results[i];
          if (!r?.url) continue;
          const runNum = i + 1;
          const isLatest = i === results.length - 1;
          const t = fmtTs(r.ts);
          const fileHref = esc(mediaUrl(r.servePath || r.url));
          html += `<div class="file-item">
            <div class="file-thumb">${thumb(r)}</div>
            <div class="file-info">
              <div class="file-name">Run ${runNum}${isLatest ? ' <span style="color:var(--amber);font-size:9px">LATEST</span>' : ''}</div>
              <div class="file-sub">${r.kind}${t ? ' · ' + t : ''}</div>
              <div class="file-actions">
                <a class="file-link" href="${fileHref}" target="_blank" download>↓ download</a>
                <a class="file-link" href="${fileHref}" target="_blank">↗ open</a>
              </div>
            </div>
          </div>`;
        }
      }
      if (n.uploadUrl) {
        totalUploads++;
      }
    }

    // Uploads section
    if (totalUploads) {
      html += '<div class="side-section-title">Uploads</div>';
      for (const n of nodes.values()) {
        if (!n.uploadUrl) continue;
        const label = NODE_SPECS[n.type]?.title || n.type;
        const kind = n.type === 'audio' ? 'audio' : 'image';
        html += `<div class="file-item">
          <div class="file-thumb">${thumb(n.uploadUrl, kind)}</div>
          <div class="file-info">
            <div class="file-name">${esc(label)}</div>
            <div class="file-sub">${kind}</div>
          </div>
        </div>`;
      }
    }

    if (totalOutputs === 0 && totalUploads === 0) {
      panel.innerHTML = '<div class="side-empty">No files yet.<br>Run nodes to generate outputs,<br>or upload via image/audio nodes.</div>';
      return;
    }
    panel.innerHTML = html;
  }

  // ── Upstream computation ──────────────────────────────────────────────────
  function computeUpstreamAll(targetId) {
    // Returns [{node, depth}] for all ancestors
    const incoming = {};
    edges.forEach(e => { (incoming[e.toId] = incoming[e.toId] || []).push(e.fromId); });
    const byId = node => nodes.get(node);

    const direct = (incoming[targetId] || []).map(byId).filter(Boolean);
    const seen = new Set([targetId, ...direct.map(n => n.id)]);
    const result = direct.map(n => ({ node: n, depth: 1 }));
    let frontier = direct.map(n => ({ id: n.id, depth: 1 }));
    while (frontier.length) {
      const next = [];
      for (const f of frontier) {
        for (const pid of incoming[f.id] || []) {
          if (seen.has(pid)) continue;
          seen.add(pid);
          const n = nodes.get(pid);
          if (!n) continue;
          result.push({ node: n, depth: f.depth + 1 });
          next.push({ id: pid, depth: f.depth + 1 });
        }
      }
      frontier = next;
    }
    return result;
  }

  // ── Inputs tab ────────────────────────────────────────────────────────────
  let inputsFilter = 'all';
  let inputsGroupBy = 'type';

  function renderInputsTab(panel, selNode) {
    if (!selNode) {
      panel.innerHTML = `<div class="empty-state">
        ${ICONS.layers}
        <div class="empty-state-title">No node selected</div>
        <div class="empty-state-sub">Select a node on the canvas to inspect every text, image, video, and audio input flowing into it.</div>
      </div>`;
      return;
    }

    const all = computeUpstreamAll(selNode.id);
    const counts = all.reduce((acc, {node}) => { acc[node.type] = (acc[node.type]||0)+1; return acc; }, {});
    const totalSize = all.length;

    const filtered = all.filter(({node}) => {
      if (inputsFilter === 'all') return true;
      return node.type === inputsFilter;
    });

    const TYPE_ORDER = ['text','image','video','audio'];
    const TYPE_LABEL = { text:'Text prompts', image:'Images', video:'Videos', audio:'Audio' };

    // Filter chips
    const chipHtml = (type, label, count) => {
      const active = inputsFilter === type;
      return `<button class="upstream-chip${active?' active':''}" data-ifilter="${type}" title="${label}">
        ${type !== 'all' ? ICONS[type] || '' : ''}
        ${type === 'all' ? `All <span class="upstream-chip-n">${totalSize}</span>` : `<span class="upstream-chip-n">${count}</span>`}
      </button>`;
    };

    const filterRow = totalSize > 0 ? `<div class="upstream-filters">
      ${chipHtml('all','All',totalSize)}
      ${TYPE_ORDER.filter(t => counts[t]).map(t => chipHtml(t, TYPE_LABEL[t], counts[t])).join('')}
      <div class="upstream-filters-spacer"></div>
      <button class="upstream-toggle-group${inputsGroupBy==='depth'?' on':''}" data-toggle-group title="Toggle grouping">
        ${inputsGroupBy==='depth' ? ICONS.layers : ICONS.refresh}
      </button>
    </div>` : '';

    // Group content
    let groupsHtml = '';
    if (totalSize === 0) {
      groupsHtml = `<div class="empty-state" style="padding:30px 20px">
        ${ICONS.layers}
        <div class="empty-state-title">No inputs yet</div>
        <div class="empty-state-sub">Drag from another node's output port to feed it data.</div>
      </div>`;
    } else if (inputsGroupBy === 'type') {
      groupsHtml = TYPE_ORDER.map(t => {
        const items = filtered.filter(({node}) => node.type === t);
        if (!items.length) return '';
        return upstreamGroupHtml(TYPE_LABEL[t], t, items);
      }).join('');
    } else {
      groupsHtml = [1,2,3,4,5].map(d => {
        const items = filtered.filter(({depth}) => depth === d);
        if (!items.length) return '';
        const label = d === 1 ? 'Direct parents' : `${d} hops upstream`;
        return upstreamGroupHtml(label, null, items, d);
      }).join('');
    }

    panel.innerHTML = `<div class="upstream">
      <div class="upstream-head">
        <div class="upstream-target">
          <span class="upstream-target-badge">${ICONS[selNode.type] || ''}</span>
          <div class="upstream-target-meta">
            <div class="upstream-target-label">Feeding into</div>
            <div class="upstream-target-title">${esc(selNode.title || NODE_SPECS[selNode.type].title)}</div>
          </div>
          ${totalSize > 0 ? `<div class="upstream-target-count">
            <span class="num">${totalSize}</span>
            <span class="lbl">input${totalSize===1?'':'s'}</span>
          </div>` : ''}
        </div>
        ${filterRow}
      </div>
      <div class="upstream-body">${groupsHtml}</div>
    </div>`;

    // Wire filter chip clicks
    panel.querySelectorAll('[data-ifilter]').forEach(btn => {
      btn.addEventListener('click', () => { inputsFilter = btn.dataset.ifilter; renderRightPanel(); });
    });
    panel.querySelector('[data-toggle-group]')?.addEventListener('click', () => {
      inputsGroupBy = inputsGroupBy === 'type' ? 'depth' : 'type';
      renderRightPanel();
    });
    panel.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.jump;
        clearSelection(); setSelected(id, true); updateSelInfo();
      });
    });
    panel.querySelectorAll('[data-iexpand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const el = btn.closest('.input-text');
        if (el) { el.classList.toggle('expanded'); btn.textContent = el.classList.contains('expanded') ? 'less' : 'more'; }
      });
    });
  }

  function upstreamGroupHtml(title, type, items, hop) {
    const icon = type ? `<span class="upstream-group-icon">${ICONS[type]||''}</span>` :
      (hop ? `<span class="upstream-hop-pip">${hop}</span>` : '');
    const cards = items.map(({node, depth}) => inputCardHtml(node, depth)).join('');
    return `<section class="upstream-group">
      <header class="upstream-group-head">
        ${ICONS.chevD}
        ${icon}
        <span class="upstream-group-title">${esc(title)}</span>
        <span class="upstream-group-count">${items.length}</span>
      </header>
      <div class="upstream-group-body">${cards}</div>
    </section>`;
  }

  function inputCardHtml(node, depth) {
    const last = (node.results||[])[node.results.length-1];
    const mediaUrl_ = url => mediaUrl(url);

    let mediaHtml = '';
    if (node.type === 'text') {
      const content = node.prompt || '(empty prompt)';
      const isLong = content.length > 160;
      mediaHtml = `<div class="input-text${isLong?' expandable':''}">
        <div class="input-text-content">${esc(content)}</div>
        ${isLong ? `<div class="input-text-fade"><button data-iexpand style="font:inherit;color:inherit;cursor:pointer">more</button></div>` : ''}
      </div>`;
    } else if (node.type === 'audio') {
      const bars = 40;
      const waveBars = Array.from({length: bars}, (_,i) => {
        const h = 8 + 16*Math.abs(Math.sin(i*0.5+(node.id.charCodeAt(1)||1))) + 4*Math.abs(Math.sin(i*1.3));
        return `<span style="height:${h}px"></span>`;
      }).join('');
      mediaHtml = `<div class="input-audio">
        <button class="input-audio-btn">${ICONS.play}</button>
        <div class="input-audio-track">
          <div class="input-audio-wave">${waveBars}</div>
          <div class="input-audio-meta"><span>Audio</span></div>
        </div>
      </div>`;
    } else if (node.type === 'video' || node.type === 'image') {
      const imgUrl = last?.servePath || last?.url || node.uploadUrl;
      mediaHtml = `<div class="input-media ${node.type}">
        ${imgUrl
          ? `<img src="${esc(mediaUrl_(imgUrl))}" alt="" referrerpolicy="no-referrer"/>`
          : `<div class="input-media-placeholder">${node.status==='running'?`RENDERING · ${node.progress||0}%`:node.type.toUpperCase()}</div>`}
        ${node.type==='video' ? `<span class="input-media-pill duration">${node.params?.duration||'5s'}</span>` : ''}
      </div>`;
    }

    const rc = (node.results||[]).length;
    const metaStr = rc ? `${rc} run${rc===1?'':'s'}` : NODE_SPECS[node.type]?.title || node.type;

    return `<div class="input-card type-${node.type}">
      <div class="input-card-head">
        <span class="input-type-mark t-${node.type}">${ICONS[node.type]||''}</span>
        <span class="input-card-title" data-jump="${esc(node.id)}">${esc(node.title||NODE_SPECS[node.type].title)}</span>
        ${depth > 1 ? `<span class="input-hop">${depth}↑</span>` : ''}
        ${nodeStatusHtml(node)}
      </div>
      ${mediaHtml}
      <div class="input-card-foot">
        <span class="input-meta">${esc(metaStr)}</span>
        <div class="input-card-actions">
          <button class="input-action" data-jump="${esc(node.id)}" title="Reveal on canvas">${ICONS.fit}</button>
          <button class="input-action" title="Re-run" onclick="runNode('${esc(node.id)}')">${ICONS.refresh}</button>
        </div>
      </div>
    </div>`;
  }

  // ── Params tab ────────────────────────────────────────────────────────────
  function renderParamsTab(panel, selNode) {
    if (!selNode) {
      panel.innerHTML = `<div class="empty-state">
        ${ICONS.layers}
        <div class="empty-state-title">Nothing selected</div>
        <div class="empty-state-sub">Click a node on the canvas to edit its parameters.</div>
      </div>`;
      return;
    }
    const node = selNode;
    const spec = NODE_SPECS[node.type];
    const ups = upstreamNodes(node.id);
    const imageUps  = ups.filter(u => u.type === 'image');
    const isPassive = PASSIVE_TYPES.has(node.type);
    const sel = (opts, cur) => opts.map(([v,l]) => `<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('');

    // Thumbnail / preview header
    const last = (node.results||[])[(node.results||[]).length-1];
    const thumbUrl = last?.servePath || last?.url || node.uploadUrl;
    const thumbHtml = thumbUrl
      ? `<img class="inspector-thumb" src="${esc(mediaUrl(thumbUrl))}" alt="" referrerpolicy="no-referrer"/>`
      : `<div class="inspector-thumb placeholder">${ICONS[node.type]||''}</div>`;

    let f = '';

    // Name
    f += `<div class="field">
      <label class="field-label">Name</label>
      <input class="field-input" data-field="title" value="${esc(node.title||spec.title)}"/>
    </div>`;

    // Prompt
    if (['text','image','video'].includes(node.type)) {
      const ph = { text:'Write your prompt or notes…', image:'A misty mountain at dawn…', video:'Camera pushes in slowly…' }[node.type]||'';
      f += `<div class="field">
        <label class="field-label">Prompt</label>
        <textarea class="field-textarea" data-field="prompt" rows="5" placeholder="${esc(ph)}">${esc(node.prompt)}</textarea>
      </div>`;
    }

    // Duration chips (video)
    if (node.type === 'video') {
      f += `<div class="field">
        <label class="field-label">Duration</label>
        <div class="chip-row">
          ${['5','10'].map(d => `<button class="chip${node.params.duration===d?' active':''}" data-field="duration" data-val="${d}">${d}s</button>`).join('')}
        </div>
      </div>`;
    }

    // Aspect ratio chips
    if (node.type === 'image' || node.type === 'video') {
      const ratios = node.type === 'image' ? ['16:9','1:1','9:16','4:3','3:4'] : ['16:9','9:16','1:1'];
      f += `<div class="field">
        <label class="field-label">Aspect ratio</label>
        <div class="chip-row">
          ${ratios.map(r => `<button class="chip${node.params.ratio===r?' active':''}" data-field="ratio" data-val="${r}">${r}</button>`).join('')}
        </div>
      </div>`;
    }

    // Resolution select
    if (node.type === 'image') {
      f += `<div class="field"><label class="field-label">Resolution</label>
        <select class="field-select" data-field="resolution">
          ${sel([['1k','1K'],['2k','2K'],['4k','4K']], node.params.resolution)}
        </select></div>`;
    }
    if (node.type === 'video') {
      f += `<div class="field"><label class="field-label">Resolution</label>
        <select class="field-select" data-field="resolution">
          ${sel([['480P','480P'],['720P','720P'],['1080P','1080P']], node.params.resolution)}
        </select></div>`;
    }

    // Model (video)
    if (node.type === 'video') {
      f += `<div class="field"><label class="field-label">Model</label>
        <select class="field-select" data-field="modelVersion">
          ${sel([['seedance2.0fast','Non-VIP Fast'],['seedance2.0','Non-VIP'],['seedance2.0fast_vip','VIP Fast'],['seedance2.0_vip','VIP']], node.params.modelVersion)}
        </select></div>`;
    }

    // Image references
    if (node.type === 'image' || node.type === 'video') {
      let thumbs = '';
      for (const iu of imageUps) {
        const imgLast = iu.results?.[iu.results.length - 1];
        if (imgLast?.servePath || imgLast?.url) {
          thumbs += `<div class="insp-thumb"><img src="${esc(mediaUrl(imgLast.servePath||imgLast.url))}" alt="" referrerpolicy="no-referrer"/><div class="insp-thumb-label">Ref</div></div>`;
        } else {
          thumbs += `<div class="insp-thumb"><div class="insp-thumb-pending">⏳</div><div class="insp-thumb-label">Run first</div></div>`;
        }
      }
      if (node.uploadUrl) {
        thumbs += `<div class="insp-thumb"><img src="${esc(mediaUrl(node.uploadUrl))}" alt="" referrerpolicy="no-referrer"/><div class="insp-thumb-label">Upload</div></div>`;
      }
      const sectionLabel = node.type === 'video' ? 'Visual references' : 'Source images';
      f += `<div class="field">
        <label class="field-label">${sectionLabel}${imageUps.length > 0 ? ` <span style="color:var(--ok);font-size:10px">✓ ${imageUps.length}</span>` : ''}</label>
        ${thumbs ? `<div class="insp-thumb-grid">${thumbs}</div>` : ''}
        ${node.type === 'image' ? `<input type="file" accept="image/*" data-upload style="font-size:11px;color:var(--fg-2);margin-top:6px;cursor:pointer"/>` : ''}
      </div>`;
    }

    // Audio upload
    if (node.type === 'audio') {
      f += `<div class="field"><label class="field-label">Audio file</label>
        ${node.uploadUrl ? `<audio src="${esc(mediaUrl(node.uploadUrl))}" controls style="width:100%;margin-bottom:6px"></audio>` : ''}
        <input type="file" accept="audio/*" data-upload style="font-size:11px;color:var(--fg-2);cursor:pointer"/>
      </div>`;
    }

    // Status
    let statusHtml = '';
    if (node.status === 'running') statusHtml = `<div class="insp-status">Rendering…</div>`;
    else if (node.status === 'queued') statusHtml = `<div class="insp-status">Queued${node.queueIdx!=null?' #'+node.queueIdx:''}…</div>`;
    else if (node.status === 'error' && node.error) statusHtml = `<div class="insp-status error">⚠ ${esc(node.error)}</div>`;

    const rc = node.results?.length || 0;
    const rcHtml = rc ? `<div class="insp-run-count">${rc} run${rc===1?'':'s'} · see Files</div>` : '';

    panel.innerHTML = `
      <div class="inspector-head">
        ${thumbHtml}
        <div class="inspector-meta">
          <div class="inspector-title">${esc(node.title||spec.title)}</div>
          <div class="inspector-sub">${esc(spec.title)} · ${esc(node.id)}</div>
        </div>
      </div>
      <div class="params-body">
        ${f}
        ${statusHtml}
        ${rcHtml}
        ${!isPassive ? `<button class="btn primary" style="width:100%;justify-content:center" data-action="run">${ICONS.play} Run this node</button>` : ''}
      </div>`;

    // Wire input/select changes
    panel.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('input', e => {
        const field = e.target.dataset.field;
        if (field === 'prompt') { node.prompt = e.target.value; renderNode(node); }
        else if (field === 'title') { node.title = e.target.value; renderNode(node); }
        else node.params[field] = e.target.value;
        scheduleSave();
      });
    });
    // Chip buttons
    panel.querySelectorAll('.chip[data-field]').forEach(btn => {
      btn.addEventListener('click', () => {
        const field = btn.dataset.field;
        node.params[field] = btn.dataset.val;
        panel.querySelectorAll(`.chip[data-field="${field}"]`).forEach(b => b.classList.toggle('active', b === btn));
        scheduleSave();
      });
    });
    // Run button
    panel.querySelector('[data-action=run]')?.addEventListener('click', () => runNode(node.id));
    // File upload
    panel.querySelectorAll('[data-upload]').forEach(input => {
      input.addEventListener('change', async e => {
        const f = e.target.files[0];
        if (!f) return;
        const fd = new FormData(); fd.append('file', f);
        toast('Uploading…');
        const resp = await fetch('/api/upload', { method: 'POST', body: fd });
        const d = await resp.json();
        if (d.ok) {
          node.uploadUrl = d.url; node.uploadPath = d.path || null;
          renderNode(node); renderRightPanel();
          if (document.getElementById('panel-files')?.style.display !== 'none') renderFilesPanel();
        } else { toast('Upload failed', 'error'); }
      });
    });
  }

  // ── Queue + Done tabs ─────────────────────────────────────────────────────
  function renderQueueTab(panel) {
    const queue = [...nodes.values()].filter(n => n.status === 'running' || n.status === 'queued');
    if (!queue.length) {
      panel.innerHTML = `<div class="empty-state"><div style="margin-bottom:12px;opacity:0.4">${ICONS.refresh}</div><div class="empty-state-title">Queue is clear</div><div class="empty-state-sub">Runs will appear here with live progress.</div></div>`;
      return;
    }
    panel.innerHTML = `<div style="padding:14px">
      <div class="side-section-title" style="margin-top:0">Active · ${queue.length}</div>
      ${queue.map(n => `<div class="queue-item">
        ${(n.results||[]).slice(-1)[0]?.url ? `<img class="queue-thumb" src="${esc(mediaUrl((n.results.slice(-1)[0].servePath||n.results.slice(-1)[0].url)))}" referrerpolicy="no-referrer"/>` : `<div class="queue-thumb" style="display:grid;place-items:center;color:var(--fg-3)">${ICONS[n.type]||''}</div>`}
        <div class="queue-info">
          <div class="queue-name">${esc(n.title||NODE_SPECS[n.type].title)}</div>
          <div class="queue-sub">${esc(n.type)}${n.progress!=null?' · '+n.progress+'%':''}</div>
          ${n.status==='running' ? `<div class="queue-bar"><div class="queue-bar-fill" style="width:${n.progress||0}%"></div></div>` : ''}
        </div>
        ${nodeStatusHtml(n)}
      </div>`).join('')}
    </div>`;
  }

  function renderDoneTab(panel) {
    const done = [...nodes.values()].filter(n => n.status === 'done' || n.status === 'error');
    if (!done.length) {
      panel.innerHTML = `<div class="empty-state"><div style="opacity:0.4;margin-bottom:12px">${ICONS.layers}</div><div class="empty-state-title">No runs yet</div></div>`;
      return;
    }
    panel.innerHTML = `<div style="padding:14px">
      <div class="side-section-title" style="margin-top:0">Completed · ${done.length}</div>
      ${done.map(n => {
        const last = (n.results||[]).slice(-1)[0];
        return `<div class="queue-item">
          ${last?.url ? `<img class="queue-thumb" src="${esc(mediaUrl(last.servePath||last.url))}" referrerpolicy="no-referrer"/>` : `<div class="queue-thumb" style="display:grid;place-items:center;color:var(--fg-3)">${ICONS[n.type]||''}</div>`}
          <div class="queue-info">
            <div class="queue-name">${esc(n.title||NODE_SPECS[n.type].title)}</div>
            <div class="queue-sub">${esc(n.type)}${last?` · ${last.kind||''}`:''}</div>
          </div>
          ${nodeStatusHtml(n)}
        </div>`;
      }).join('')}
    </div>`;
  }

  // Wire right panel input → save
  document.getElementById('right-panel-content')?.addEventListener('input', scheduleSave);
</script>
</body>
</html>
