    p.finally(() => _refreshInflight.delete(staleUrl));
    return p;
  }
  document.addEventListener('error', async e => {
    const el = e.target;
    if (!el || (el.tagName !== 'IMG' && el.tagName !== 'VIDEO' && el.tagName !== 'SOURCE')) return;
    const target = el.tagName === 'SOURCE' ? el.parentElement : el;
    if (target.dataset.mediaRefreshed === '1') return;
    // We only know how to refresh URLs that went through /api/media_proxy
    // (i.e. originally a CDN url). Local /uploads/ paths reaching this
    // handler are real 404s — nothing to refresh.
    const src = el.currentSrc || el.src || el.getAttribute('src') || '';
    const m = src.match(/\/api\/media_proxy\?url=([^&]+)/);
    if (!m) return;
    const staleUrl = decodeURIComponent(m[1]);
    target.dataset.mediaRefreshed = '1';
    const fresh = await _refreshMedia(staleUrl);
    if (!fresh) return;
    const nextSrc = /^https?:\/\//i.test(fresh) ? `/api/media_proxy?url=${encodeURIComponent(fresh)}` : fresh;
    if (el.tagName === 'SOURCE') {
      el.src = nextSrc;
      target.load?.();
    } else {
      el.src = nextSrc;
    }
  }, true);  // capture phase — `error` doesn't bubble

  // Audio play/pause for node cards (event delegation so re-renders don't lose listeners)
  canvas.addEventListener('click', e => {
    const btn = e.target.closest('[data-audio-play]');
    if (!btn) return;
    e.stopPropagation();
    const nodeId = btn.dataset.audioPlay;
    const audio = document.getElementById('aud-' + nodeId);
    if (!audio) return;
    if (audio.paused) {
      // Pause all other audios first
      document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); });
      audio.play();
      btn.innerHTML = ICONS.pause || '⏸';
    } else {
      audio.pause();
      btn.innerHTML = ICONS.play;
    }
    audio.addEventListener('ended', () => { btn.innerHTML = ICONS.play; }, { once: true });
  });

  async function loadWorkflow() {
    loading = true;
    try {
      const resp = await fetch(WORKFLOW_API);
      const d = await resp.json();
      const wf = d.workflow || {};
      if (wf.nodes && typeof wf.nodes === 'object') {
        const arr = Array.isArray(wf.nodes) ? wf.nodes : Object.values(wf.nodes);
        const LEGACY_TYPES = { script:'text', text2image:'image', image2image:'image', text2video:'video', image2video:'video' };
        for (const n of arr) {
          const nodeType = LEGACY_TYPES[n.type] || n.type;
          nodes.set(n.id, {
            id: n.id, type: nodeType, x: n.x, y: n.y,
            prompt: n.prompt || '',
            params: {
              duration: n.params?.duration || '5',
              ratio: n.params?.ratio || '16:9',
              resolution: n.params?.resolution || (nodeType === 'video' ? '720P' : '2k'),
              modelVersion: n.params?.modelVersion || 'seedance2.0',
              // Per-node loop count (default 1 — backward compatible with
              // workflow.json files written before this feature shipped).
              count: parseInt(n.params?.count, 10) || 1,
              // Video-node generation mode. Map legacy values on the fly:
              //   'auto' (pre-selector) → 'T2V'   (explicit default now)
              //   'MM2V' (old name)     → 'R2V'   (renamed to "全能参考")
              videoMode: ({ auto: 'T2V', MM2V: 'R2V' })[n.params?.videoMode] || n.params?.videoMode || 'T2V',
            },
            title: n.title || (LEGACY_TYPES[n.type] ? NODE_SPECS[LEGACY_TYPES[n.type] || n.type]?.title : NODE_SPECS[nodeType]?.title) || nodeType,
            status: n.status || 'idle',
            results: Array.isArray(n.results) ? n.results : (n.result ? [n.result] : []),
            taskId: n.taskId || null,
            queueIdx: n.queueIdx ?? null,
            error: n.error || null,
            uploadUrl: n.uploadUrl || null,
            uploadPath: n.uploadPath || null,
            uploadKind: n.uploadKind || null,
            uploadRatio: n.uploadRatio || null,
            uploadText: n.uploadText || null,
          });
          renderNode(nodes.get(n.id));
        }
      }
      if (Array.isArray(wf.edges)) {
        for (const e of wf.edges) {
          if (nodes.has(e.fromId) && nodes.has(e.toId)) {
            edges.push({ id: e.id, fromId: e.fromId, toId: e.toId, selected: false });
          }
        }
        renderAllEdges();
        // Re-render downstream nodes now that edges are known (shows connection indicators)
        const downstream = new Set(edges.map(e => e.toId));
        for (const id of downstream) { const n = nodes.get(id); if (n) renderNode(n); }
      }
      if (wf.view) {
        view.x = wf.view.x ?? 0;
        view.y = wf.view.y ?? 0;
        view.scale = wf.view.scale ?? 1;
        applyView();
      }
      projectInputs.length = 0;
      if (Array.isArray(wf.projectInputs)) {
        for (const e of wf.projectInputs) {
          // Keep entries without a file too — the user (or a share recipient)
          // can declare an empty file-typed variable up front and attach the
          // actual upload later, mirroring how text variables work.
          if (!e || !e.id) continue;
          // Repair kind for legacy / mis-categorised entries. An image
          // sitting with kind='file' won't get routed to imageRefs by
          // collectInputs, which means the user's uploaded image silently
          // never reaches Jimeng. Re-detect from the filename / url so
          // saves predating proper kind tracking still work.
          let kind = e.kind;
          if (!kind || kind === 'file') {
            const guessed = _guessKindFromName(e.name || e.url || '');
            if (guessed && guessed !== 'file') kind = guessed;
            else kind = kind || 'file';
          }
          projectInputs.push({
            id: e.id,
            name: e.name || '',
            key: e.key || '',
            kind,
            url: e.url || '',
            path: e.path || null,
            ts: e.ts || Date.now(),
          });
        }
      }
      projectVars.length = 0;
      if (Array.isArray(wf.projectVars)) {
        for (const v of wf.projectVars) {
          if (v && v.id) projectVars.push({ id: v.id, key: v.key || '', value: v.value || '' });
        }
      }
    } catch (err) {
      // Vestigial saveStatus.textContent calls used to live here; the
      // UI element they targeted was removed but the calls weren't,
      // so a ReferenceError on every loadWorkflow run was propagating
      // out of try/catch/finally and silently aborting every
      // post-load renderer (renderInputsPanel / renderFilesPanel /
      // repairResults / resumeInFlightTasks). Log the failure
      // explicitly so the next regression is visible.
      console.log('[loadWorkflow] failed:', err);
    } finally {
      loading = false;
    }
    // Re-render side panels now that projectInputs / projectVars / results
    // have actually landed in memory. Both renderers are cheap and write to
    // hidden panels safely, so we always run them — the visibility check
    // I had here was racy (the panel could be made visible mid-frame after
    // loadWorkflow finished but before the user's click was processed).
    renderInputsPanel();
    renderFilesPanel();
    repairResults();
    // Pick up where we left off: any node whose taskId + queued/running
    // status survived serialisation gets re-attached to the polling loop,
    // so a refresh mid-generation doesn't lose work.
    resumeInFlightTasks();
  }

  // After loading, download any CDN results that have no servePath yet (parallel)
  async function repairResults() {
    const repairs = [];
    for (const node of nodes.values()) {
      for (const r of (node.results || [])) {
        // Need a servePath for browser display; url must be a CDN http URL
        const needsRepair = !r.servePath && r.url && r.url.startsWith('http');
        if (needsRepair) {
          repairs.push(
            fetch('/api/download_url', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: r.url }),
            })
            .then(res => res.json())
            .then(d => {
              if (d.ok && d.localPath) { r.servePath = d.localPath; return node; }
            })
            .catch(() => null)
          );
        }
      }
    }
    if (!repairs.length) return;
    const changed = new Set((await Promise.all(repairs)).filter(Boolean));
    if (!changed.size) return;
    for (const node of changed) {
      renderNode(node);
      if (selected.has(node.id)) renderInspector(node.id);
    }
    if (document.getElementById('panel-output')?.style.display !== 'none') renderFilesPanel();
    scheduleSave();
  }

  // ── Zoom overlay controls ───────────────────────────────────────────────
  function zoomAround(factor) {
    const rect = canvasWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top  + rect.height / 2;
    const w = screenToWorld(cx, cy);
    view.scale = Math.min(2, Math.max(0.3, view.scale * factor));
    view.x = cx - rect.left - w.x * view.scale;
    view.y = cy - rect.top  - w.y * view.scale;
    applyView();
  }
  document.getElementById('btn-zoom-in').addEventListener('click',  () => zoomAround(1.25));
  document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAround(0.8));

  // F key → fit to view
  window.addEventListener('keydown', (e) => {
    const active = document.activeElement.tagName;
    if (active === 'TEXTAREA' || active === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') fitToView();
  });

  // ── Minimap ─────────────────────────────────────────────────────────────
  function updateMinimap() {
    const inner = document.getElementById('minimap-inner');
    if (!inner) return;
    inner.innerHTML = '';
    if (nodes.size === 0) return;

    // Node bounds in world space
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 240); maxY = Math.max(maxY, n.y + 260);
    }

    // Viewport bounds in world space
    const wrap = canvasWrap.getBoundingClientRect();
    const tl = screenToWorld(wrap.left, wrap.top);
    const br = screenToWorld(wrap.right, wrap.bottom);

    // Expand world extent to always include the viewport so the rect is visible
    minX = Math.min(minX, tl.x) - 40;
    minY = Math.min(minY, tl.y) - 40;
    maxX = Math.max(maxX, br.x) + 40;
    maxY = Math.max(maxY, br.y) + 40;

    const worldW = maxX - minX || 1;
    const worldH = maxY - minY || 1;
    const mw = inner.offsetWidth  || 150;
    const mh = inner.offsetHeight || 90;
    const scale = Math.min(mw / worldW, mh / worldH);
    // Center content within the minimap
    const ox = (mw - worldW * scale) / 2;
    const oy = (mh - worldH * scale) / 2;

    for (const n of nodes.values()) {
      const d = document.createElement('div');
      d.className = 'minimap-node' + (selected.has(n.id) ? ' selected' : '');
      d.style.left   = (ox + (n.x - minX) * scale) + 'px';
      d.style.top    = (oy + (n.y - minY) * scale) + 'px';
      d.style.width  = Math.max(4, 240 * scale) + 'px';
      d.style.height = Math.max(3, 80  * scale) + 'px';
      inner.appendChild(d);
    }

    const vp = document.createElement('div');
    vp.className = 'minimap-viewport';
    vp.style.left   = (ox + (tl.x - minX) * scale) + 'px';
    vp.style.top    = (oy + (tl.y - minY) * scale) + 'px';
    vp.style.width  = Math.max(4, (br.x - tl.x) * scale) + 'px';
    vp.style.height = Math.max(4, (br.y - tl.y) * scale) + 'px';
    inner.appendChild(vp);
  }

  loadWorkflow();

  updateSelInfo();

  // ── Left panel tab switching ────────────────────────────────────────────
  function switchSideTab(tab) {
    document.getElementById('tab-library').classList.toggle('active', tab === 'library');
    document.getElementById('tab-input').classList.toggle('active', tab === 'input');
    document.getElementById('tab-output').classList.toggle('active', tab === 'output');
    document.getElementById('panel-library').style.display = tab === 'library' ? '' : 'none';
    document.getElementById('panel-input').style.display   = tab === 'input'   ? '' : 'none';
    document.getElementById('panel-output').style.display  = tab === 'output'  ? '' : 'none';
    if (tab === 'output') renderFilesPanel();
    if (tab === 'input') renderInputsPanel();
  }

  function renderFilesPanel() {
    const panel = document.getElementById('panel-output');
    if (!panel) return;

    const fmtTs = ts => { try { return ts ? new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''; } catch { return ''; } };

    const fileThumb = (src, kind) => {
      const p = esc(mediaUrl(src));
      if (kind === 'video') return `<video src="${p}" muted preload="metadata" referrerpolicy="no-referrer" onerror="markMediaExpired(this)"></video>`;
      if (kind === 'audio' || kind === 'text') return `<div class="file-thumb-placeholder">${ICONS[kind]||''}</div>`;
      return `<img src="${p}" alt="" referrerpolicy="no-referrer" onerror="markMediaExpired(this)"/>`;
    };

    // Bulk-select checkbox markup. Each .file-item carries a ref of the
    // form "<nodeId>:upload" or "<nodeId>:r<i>" — the server resolves
    // these against the saved workflow.json to find the actual file.
    const checkbox = (ref) => {
      const checked = outputsSelected.has(ref);
      return `<div class="file-check${checked ? '' : ''}" data-file-toggle="${esc(ref)}" title="Select for bulk download"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8.5 6.5 12 13 4.5"/></svg></div>`;
    };
    const itemCls = (ref) => `file-item${outputsSelected.has(ref) ? ' selected' : ''}`;

    // Collect every file-ref we render so we can prune outputsSelected of
    // entries that no longer exist (a node was deleted, a result was
    // cleared, etc.) before showing the selbar count.
    const liveRefs = new Set();

    let html = '';
    let total = 0;

    for (const n of nodes.values()) {
      const nodeTitle = n.title || NODE_SPECS[n.type]?.title || n.type;
      const results = n.results || [];
      // Upload node: uploadUrl is its primary file (not a "legacy" upload)
      const hasUpload = !!(n.uploadUrl) && n.type !== 'upload';
      const isUploadNode = n.type === 'upload' && n.uploadUrl;
      if (!results.length && !hasUpload && !isUploadNode) continue;
      total += results.length + (hasUpload || isUploadNode ? 1 : 0);

      html += `<div class="side-section-title">${esc(nodeTitle)}</div>`;

      // Upload node: show its file as the primary entry
      if (isUploadNode) {
        const uploadKind = n.uploadKind || 'image';
        const href = esc(mediaUrl(n.uploadUrl));
        const ref = `${n.id}:upload`;
        liveRefs.add(ref);
        html += `<div class="${itemCls(ref)}" data-file-ref="${esc(ref)}">
          ${checkbox(ref)}
          <div class="file-thumb">${fileThumb(n.uploadUrl, uploadKind)}</div>
          <div class="file-info">
            <div class="file-name">${esc(n.uploadUrl.split('/').pop())} <span style="color:var(--amber);font-size: 11px">SOURCE</span></div>
            <div class="file-sub">${esc(uploadKind)}</div>
            <div class="file-actions">
              <a class="file-link" href="${href}" target="_blank" download>↓ download</a>
              <a class="file-link" href="${href}" target="_blank">↗ open</a>
            </div>
          </div>
        </div>`;
      }

      // Legacy: non-upload nodes with uploadUrl (backward compat)
      if (hasUpload) {
        const uploadKind = n.type === 'video' ? 'video' : n.type === 'audio' ? 'audio' : 'image';
        const href = esc(mediaUrl(n.uploadUrl));
        const ref = `${n.id}:upload`;
        liveRefs.add(ref);
        html += `<div class="${itemCls(ref)}" data-file-ref="${esc(ref)}">
          ${checkbox(ref)}
          <div class="file-thumb">${fileThumb(n.uploadUrl, uploadKind)}</div>
          <div class="file-info">
            <div class="file-name">Upload <span style="color:var(--fg-3);font-size: 11px">SOURCE</span></div>
            <div class="file-sub">${uploadKind}</div>
            <div class="file-actions">
              <a class="file-link" href="${href}" target="_blank" download>↓ download</a>
              <a class="file-link" href="${href}" target="_blank">↗ open</a>
            </div>
          </div>
        </div>`;
      }

      // Generated results, newest first
      for (let i = results.length - 1; i >= 0; i--) {
        const r = results[i];
        const src = r.servePath || r.url;
        if (!src) continue;
        const runNum = i + 1;
        const isLatest = i === results.length - 1;
        const t = fmtTs(r.ts);
        const href = esc(mediaUrl(src));
        const ref = `${n.id}:r${i}`;
        liveRefs.add(ref);
        html += `<div class="${itemCls(ref)}" data-file-ref="${esc(ref)}">
          ${checkbox(ref)}
          <div class="file-thumb">${fileThumb(src, r.kind)}</div>
          <div class="file-info">
            <div class="file-name">Run ${runNum}${isLatest ? ' <span style="color:var(--amber);font-size: 11px">LATEST</span>' : ''}</div>
            <div class="file-sub">${r.kind}${t ? ' · ' + t : ''}</div>
            <div class="file-actions">
              <a class="file-link" href="${href}" target="_blank" download>↓ download</a>
              <a class="file-link" href="${href}" target="_blank">↗ open</a>
            </div>
          </div>
        </div>`;
      }
    }

    if (total === 0) {
      panel.innerHTML = '<div class="side-empty">No files yet.<br>Run nodes to generate outputs,<br>or add an Upload node as a source.</div>';
      return;
    }

    // Prune ghost refs (e.g. node deleted while items were selected).
    for (const ref of [...outputsSelected]) if (!liveRefs.has(ref)) outputsSelected.delete(ref);

    const selCount = outputsSelected.size;
    const allSelected = selCount > 0 && selCount === liveRefs.size;
    // Selbar is ALWAYS visible when there are files — the leading
    // "Select all" toggle lives in it, and that's not useful if the bar
    // only appears once the user has already ticked something.
    // .on just adds the amber-tinted background; Download/Clear are
    // disabled when nothing is ticked, so they read as inert.
    panel.innerHTML = `
      <div class="files-selbar on" id="files-selbar">
        <button id="files-selbar-all" title="${allSelected ? 'Deselect all' : 'Select all'}">${allSelected ? 'Deselect all' : 'Select all'}</button>
        <span class="files-selbar-count" id="files-selbar-count">${selCount} selected</span>
        <button id="files-selbar-download" class="primary"${selCount ? '' : ' disabled'}>Download</button>
        <button id="files-selbar-clear"${selCount ? '' : ' disabled'}>Clear</button>
      </div>
      ${html}
    `;

    // Seek video thumbnails to first frame so they don't appear black
    panel.querySelectorAll('.file-thumb video').forEach(v => {
      const seek = () => { try { v.currentTime = 0.01; } catch (_) {} };
      if (v.readyState >= 1) seek();
      else v.addEventListener('loadedmetadata', seek, { once: true });
    });

    // Wire bulk-select checkboxes and the selbar buttons. refreshSelbar
    // keeps the count, the Select-all label (Select all / Deselect all),
    // and the disabled state of Download / Clear in sync with the Set
    // after every toggle.
    const totalLive = liveRefs.size;
    const refreshSelbar = () => {
      const bar = panel.querySelector('#files-selbar');
      const cnt = panel.querySelector('#files-selbar-count');
      const allBtn = panel.querySelector('#files-selbar-all');
      const dl = panel.querySelector('#files-selbar-download');
      const clr = panel.querySelector('#files-selbar-clear');
      const n = outputsSelected.size;
      if (bar) bar.classList.toggle('on', n > 0);
      if (cnt) cnt.textContent = `${n} selected`;
      if (allBtn) {
        const all = n > 0 && n === totalLive;
        allBtn.textContent = all ? 'Deselect all' : 'Select all';
        allBtn.title = allBtn.textContent;
      }
      if (dl) dl.disabled = !n;
      if (clr) clr.disabled = !n;
    };
    panel.querySelectorAll('[data-file-toggle]').forEach(box => {
      box.addEventListener('click', e => {
        e.stopPropagation();
        const ref = box.dataset.fileToggle;
        if (outputsSelected.has(ref)) outputsSelected.delete(ref);
        else outputsSelected.add(ref);
        const item = box.closest('[data-file-ref]');
        if (item) item.classList.toggle('selected', outputsSelected.has(ref));
        refreshSelbar();
      });
    });
    panel.querySelector('#files-selbar-all')?.addEventListener('click', () => {
      // If everything's already ticked, this acts as Deselect all. Else
      // it ticks every live ref currently rendered in the panel.
      const all = outputsSelected.size > 0 && outputsSelected.size === totalLive;
      if (all) {
        outputsSelected.clear();
        panel.querySelectorAll('[data-file-ref].selected').forEach(r => r.classList.remove('selected'));
      } else {
        for (const ref of liveRefs) outputsSelected.add(ref);
        panel.querySelectorAll('[data-file-ref]').forEach(r => r.classList.add('selected'));
      }
      refreshSelbar();
    });
    panel.querySelector('#files-selbar-clear')?.addEventListener('click', () => {
      outputsSelected.clear();
      panel.querySelectorAll('[data-file-ref].selected').forEach(r => r.classList.remove('selected'));
      refreshSelbar();
    });
    panel.querySelector('#files-selbar-download')?.addEventListener('click', () => downloadOutputsPackage());
  }

  function addNodeFromLibrary(type) {
    if (!canEdit()) {
      toast('View only — ask the project owner for edit access', '');
      return;
    }
    const rect = canvasWrap.getBoundingClientRect();
    const center = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
    createNode(type, center.x - 120 + Math.random() * 40, center.y - 60 + Math.random() * 40);
  }

  // ── Project-scope variables: {{key}} → value ─────────────────────────
  // Used in any prompt / instruction / Text node — resolved client-side
  // before the body hits an API, so the LLM/CLI only ever sees plain text.
  // Keys and values may contain Unicode (Chinese, etc.).
  function resolveVars(text) {
    if (!text || typeof text !== 'string') return text;
    if (!projectVars.length) return text;
    return text.replace(/\{\{\s*([\p{L}\p{N}_]+)\s*\}\}/gu, (m, key) => {
      const v = projectVars.find(p => p.key === key);
      return v ? String(v.value ?? '') : m;  // leave un-matched tokens visible
    });
  }

  function _sanitizeVarKey(s) {
    return String(s || '')
      .replace(/[^\p{L}\p{N}_]/gu, '_')
      .replace(/^(\p{N})/u, '_$1');
  }

  // Variable key under which a project-input file is exposed to {{...}}.
  // The user can edit each input's key in the Input tab; if no key has been
  // set yet, fall back to the filename minus extension (sanitised). Two
  // entries with the same key: the most recent one wins because
  // collectRuntimeVars walks projectInputs in order.
  function _inputVarKey(input) {
    if (input?.key) return input.key;
    const base = String(input?.name || '').replace(/\.[^.]+$/, '');
    return _sanitizeVarKey(base) || _sanitizeVarKey(input?.id || '') || 'file';
  }

  // Sanitise + persist a new key for a project input. Returns the stored
  // value so the input field can echo back the (possibly cleaned) key.
  function updateProjectInputKey(id, raw) {
    const inp = projectInputs.find(e => e.id === id);
    if (!inp) return '';
    const k = _sanitizeVarKey(raw);
    inp.key = k;
    refreshAllVarHighlights();
    scheduleSave();
    return k;
  }

  // Runtime variables visible to a node when it runs:
  //   - every project variable,
  //   - every project input file by its sanitized name (URL as the value),
  //   - each upstream Text node's output, keyed by its (sanitised) title,
  //   - convenience aliases: `text` and `prev` → most recent upstream Text.
  // Project vars overlay last so a user-defined override beats an
  // accidental name collision with a node title or a file name.
  function collectRuntimeVars(node, overrides, iterationIndex) {
    const vars = {};
    // Project input files — value is the URL/path so {{logo}} substitutes
    // to /uploads/foo.png in any prompt that mentions it.
    for (const inp of projectInputs) {
      const k = _inputVarKey(inp);
      if (k) vars[k] = inp.url || inp.path || '';
    }
    const up = upstreamNodes(node.id);
    let lastText = '';
    for (const u of up) {
      if (u.type !== 'text') continue;
      const out = textNodeOutput(u);
      if (!out) continue;
      const titleKey = _sanitizeVarKey(u.title);
      if (titleKey) vars[titleKey] = out;
      lastText = out;
    }
    if (lastText) {
      if (vars.text === undefined) vars.text = lastText;
      if (vars.prev === undefined) vars.prev = lastText;
    }
    // Project vars overlay last so they win on key collisions. When a loop
    // is active (iterationIndex is a number), multi-line project-var
    // values get auto-indexed: each non-empty line maps to one iteration,
    // so `images = "url1\nurl2\nurl3"` referenced as {{images}} resolves
    // to url1 / url2 / url3 across iterations 0 / 1 / 2. Single-line vars
    // and project inputs are unchanged.
    const inLoop = typeof iterationIndex === 'number' && iterationIndex >= 0;
    for (const v of projectVars) {
      if (!v.key) continue;
      let value = v.value;
      if (inLoop && typeof value === 'string' && /\r?\n/.test(value)) {
        const lines = value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        if (lines.length > 1) value = lines[iterationIndex % lines.length];
      }
      vars[v.key] = value;
    }
    // Per-call overrides win over everything else. Used by the per-scene
    // loop in runNode to inject the current scene's text as {{text}} /
    // {{prev}} for each iteration without mutating node state.
    if (overrides && typeof overrides === 'object') {
      for (const k in overrides) vars[k] = overrides[k];
    }
    return vars;
  }

  // resolveVars + upstream output substitution. Used when a node runs.
  function resolveRuntimeVars(text, node, overrides, iterationIndex) {
    if (!text || typeof text !== 'string') return text;
    const vars = collectRuntimeVars(node, overrides, iterationIndex);
    return text.replace(/\{\{\s*([\p{L}\p{N}_]+)\s*\}\}/gu, (m, key) => (
      vars[key] !== undefined ? String(vars[key] ?? '') : m
    ));
  }

  // Split a Text-node script into per-scene blocks for the scene-driven
  // loop in runNode. Tries common scene markers in descending specificity:
  //   "Scene 1:", "SCENE 1:", "镜头 1:", "分镜 1:", "Shot 1:", "场景 1:",
  //   plus the same headers WITHOUT trailing punctuation ("Scene 1\n…",
  //   "## Scene 1\n…", "镜头一\n…") — many models emit headers as plain
  //   numbered lines and stripping the colon-required pattern caught
  //   only the strict-format outputs.
  //   "第 N 场" / "第N幕",
  //   numbered lists ("1.", "2)", "3、"),
  //   double-newline paragraphs.
  // Returns an array of scene strings. Length 1 means "no scenes detected"
  // — caller falls back to using the full upstream text for every loop
  // iteration (variants from the same prompt).
  function splitIntoScenes(text) {
    if (!text || typeof text !== 'string') return [];
    const patterns = [
      // Scene / Shot / 镜头 / 分镜 / 场景 header — only requires the keyword +
      // a number at the start of a line, then ANYTHING is allowed on the
      // rest of the line (duration markers like " (5s):", " — 8s:", a bare
      // newline, etc). The ^ anchor + multiline flag means prose with
      // "Scene 1" in the middle of a sentence won't false-match.
      /^[\t ]*(?:[*#]{1,4}\s*)?(?:Scene|SCENE|Shot|SHOT|镜头|分镜|场景)\s*[\d一二三四五六七八九十百]+/gmu,
      /^[\t ]*第\s*[\d一二三四五六七八九十百]+\s*[场镜幕节段]/gmu,
      /^[\t ]*\d+\s*[\.、\)\]]\s+\S/gm,
    ];
    for (const re of patterns) {
      re.lastIndex = 0;
      const starts = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        starts.push(m.index);
        if (m.index === re.lastIndex) re.lastIndex++;  // zero-width guard
      }
      if (starts.length >= 2) {
        const parts = [];
        for (let i = 0; i < starts.length; i++) {
          const end = i + 1 < starts.length ? starts[i + 1] : text.length;
          const block = text.slice(starts[i], end).trim();
          if (block) parts.push(block);
        }
        if (parts.length >= 2) return parts;
      }
    }
    // Fallback: paragraphs (only when there are several).
    const paras = text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    if (paras.length >= 2) return paras;
    const trimmed = text.trim();
    return trimmed ? [trimmed] : [];
  }

  function addProjectVar() {
    projectVars.push({ id: 'v' + Math.random().toString(36).slice(2, 10), key: '', value: '' });
    renderInputsPanel();
    flushSaveNow();
  }

  function deleteProjectVar(id) {
    const idx = projectVars.findIndex(v => v.id === id);
    if (idx < 0) return;
    projectVars.splice(idx, 1);
    renderInputsPanel();
    flushSaveNow();
  }

  function updateProjectVar(id, field, value) {
    const v = projectVars.find(v => v.id === id);
    if (!v) return;
    if (field === 'key') {
      // Allow Unicode letters/digits/underscore so keys like "品牌名" work.
      // Anything else (spaces, punctuation, braces) becomes "_" so the
      // {{...}} matcher's identifier rule stays predictable.
      v.key = String(value)
        .replace(/[^\p{L}\p{N}_]/gu, '_')
        .replace(/^(\p{N})/u, '_$1');
    } else {
      v.value = String(value);
    }
    refreshAllVarHighlights();  // valid/unknown styling depends on the dict
    scheduleSave();
  }

  // ── Full-screen expand modal for editing long variable values ───────
  function openVarExpandModal(id, key, value) {
    // Remove any existing modal
    document.getElementById('var-expand-modal')?.remove();

    const overlay = document.createElement('div');
    overlay.className = 'var-modal-overlay';
    overlay.id = 'var-expand-modal';
    overlay.innerHTML = `
      <div class="var-modal">
        <div class="var-modal-head">
          <span class="var-modal-key">{{${esc(key)}}}</span>
          <span class="var-modal-label">variable editor</span>
          <button class="var-modal-close" title="Close (Esc)">✕</button>
        </div>
        <div class="var-modal-body">
          <textarea class="var-modal-textarea" spellcheck="false">${esc(value)}</textarea>
        </div>
        <div class="var-modal-foot">
          <span class="var-modal-chars">${value.length} chars</span>
          <button class="var-modal-save">Done</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const textarea = overlay.querySelector('.var-modal-textarea');
    const chars = overlay.querySelector('.var-modal-chars');
    const closeBtn = overlay.querySelector('.var-modal-close');
    const doneBtn = overlay.querySelector('.var-modal-save');

    // Focus the textarea
    requestAnimationFrame(() => textarea.focus());

    // Live char count
    textarea.addEventListener('input', () => {
      chars.textContent = textarea.value.length + ' chars';
    });

    // Save & close
    const close = (save) => {
      if (save) {
        updateProjectVar(id, 'value', textarea.value);
        // Sync the inline input in the side panel
        const inline = document.querySelector(`[data-var-id="${id}"] .var-value`);
        if (inline) {
          inline.value = textarea.value;
        }
      }
      overlay.remove();
    };

    doneBtn.addEventListener('click', () => close(true));
    closeBtn.addEventListener('click', () => close(true));
    // Click backdrop to save & close
    overlay.addEventListener('click', e => { if (e.target === overlay) close(true); });
    // Escape to save & close
    const onKey = e => {
      if (e.key === 'Escape') { close(true); document.removeEventListener('keydown', onKey); }
      // Ctrl/Cmd+Enter also saves
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); close(true); document.removeEventListener('keydown', onKey); }
    };
    document.addEventListener('keydown', onKey);
  }

  // ── Inline {{var}} highlighting inside .field-textarea ───────────────
  // The textarea text itself is rendered transparent (caret/selection still
  // visible); an absolutely-positioned overlay shows the same text with each
  // {{key}} wrapped in a styled <span>. A MutationObserver auto-attaches
  // the overlay whenever the inspector renders a new textarea.
  const _VAR_RE_HL = /\{\{\s*([\p{L}\p{N}_]+)\s*\}\}/gu;
  function _varOverlayHtml(text, contextNode) {
    const escapeHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // A key is "known" if it matches a project variable OR an upstream
    // Text-node alias (title, plus the `text`/`prev` shorthand).
    const upstreamKeys = new Set();
    if (contextNode) {
      const up = upstreamNodes(contextNode.id);
      let hasText = false;
      for (const u of up) {
        if (u.type !== 'text') continue;
        const tk = _sanitizeVarKey(u.title);
        if (tk) upstreamKeys.add(tk);
        hasText = true;
      }
      if (hasText) { upstreamKeys.add('text'); upstreamKeys.add('prev'); }
    }
    let out = '', last = 0, m;
    _VAR_RE_HL.lastIndex = 0;
    while ((m = _VAR_RE_HL.exec(text)) !== null) {
      out += escapeHtml(text.slice(last, m.index));
      const known = projectVars.some(v => v.key === m[1])
                 || upstreamKeys.has(m[1])
                 || projectInputs.some(inp => _inputVarKey(inp) === m[1]);
      out += `<span class="var-token${known ? '' : ' unknown'}">${escapeHtml(m[0])}</span>`;
      last = _VAR_RE_HL.lastIndex;
    }
    out += escapeHtml(text.slice(last));
    return out + '\n';  // trailing newline keeps the overlay's last-line height
  }

  // Resolve "the inspector's current node" lazily for the var-overlay
  // callbacks below. `selNode` is a local of renderRightPanel; reaching
  // for it from these module-level helpers used to throw ReferenceError
  // every time the MutationObserver fired (which happens a lot during a
  // multi-iteration loop). Re-derive it from the selection Set instead.
  function _inspectorSelectedNode() {
    if (typeof selected === 'undefined' || selected.size !== 1) return null;
    return nodes.get([...selected][0]) || null;
  }

  function setupVarHighlight(textarea) {
    if (!textarea || textarea.dataset.varHighlight === '1') return;
    if (!textarea.classList.contains('field-textarea')) return;
    textarea.dataset.varHighlight = '1';

    const wrap = document.createElement('div');
    wrap.className = 'var-wrap';
    const overlay = document.createElement('div');
    overlay.className = 'var-overlay';
    overlay.setAttribute('aria-hidden', 'true');

    textarea.parentNode.insertBefore(wrap, textarea);
    wrap.appendChild(overlay);
    wrap.appendChild(textarea);

    const update = () => { overlay.innerHTML = _varOverlayHtml(textarea.value, _inspectorSelectedNode()); };
    const syncScroll = () => {
      overlay.scrollTop = textarea.scrollTop;
      overlay.scrollLeft = textarea.scrollLeft;
    };
    textarea.addEventListener('input', () => { update(); syncScroll(); });
    textarea.addEventListener('scroll', syncScroll);
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(syncScroll).observe(textarea);
    }
    update();
  }

  function refreshAllVarHighlights() {
    const sel = _inspectorSelectedNode();
    document.querySelectorAll('.var-wrap > textarea.field-textarea').forEach(t => {
      const overlay = t.parentNode.querySelector(':scope > .var-overlay');
      if (overlay) overlay.innerHTML = _varOverlayHtml(t.value, sel);
    });
  }

  // Auto-attach overlay to any field-textarea added by the inspector / panels.
  new MutationObserver(muts => {
    for (const mut of muts) {
      for (const n of mut.addedNodes) {
        if (n.nodeType !== 1) continue;
        if (n.matches?.('.field-textarea')) setupVarHighlight(n);
        n.querySelectorAll?.('.field-textarea').forEach(setupVarHighlight);
      }
    }
  }).observe(document.body, { childList: true, subtree: true });

  // ── Project-scope inputs (Input tab) ─────────────────────────────────
  // Detect the "kind" of an uploaded asset from its MIME / extension so the
  // Input list and any auto-spawned Upload node land on the right thumbnail
  // and downstream wiring.
  function detectInputKind(file) {
    const t = (file.type || '').toLowerCase();
    if (t.startsWith('image/'))  return 'image';
    if (t.startsWith('video/'))  return 'video';
    if (t.startsWith('audio/'))  return 'audio';
    return _guessKindFromName(file.name || '');
  }

  // Filename-only fallback for when we don't have a live File object —
  // used by loadWorkflow to repair legacy projectInputs entries that
  // were saved with kind='file' before kind tracking landed, and by
  // collectInputs at routing time as a belt-and-braces so a wrong-kind
  // entry can't silently block the upload to Jimeng.
  function _guessKindFromName(s) {
    const name = String(s || '').toLowerCase();
    if (/\.(srt|vtt|ass)$/i.test(name)) return 'subtitle';
    if (/\.txt$/i.test(name))    return 'text';
    if (/\.(png|jpe?g|gif|webp|bmp|svg|heic|avif)$/i.test(name))   return 'image';
    if (/\.(mp4|mov|webm|mkv|avi|m4v)$/i.test(name))               return 'video';
    if (/\.(mp3|wav|m4a|aac|flac|ogg|opus|wma)$/i.test(name))      return 'audio';
    return 'file';
  }

  async function uploadProjectInput(file) {
    if (!file) return null;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const resp = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
      const d = await resp.json();
      if (!resp.ok || !d.ok) throw new Error(d.error || `HTTP ${resp.status}`);
      const entry = {
        id: 'i' + Math.random().toString(36).slice(2, 10),
        name: file.name,
        // Editable in the Input tab; default = filename without extension,
        // sanitised to a valid {{var}} identifier.
        key: _sanitizeVarKey(String(file.name || '').replace(/\.[^.]+$/, '')) || 'file',
        kind: detectInputKind(file),
        url: d.url,
        path: d.path || null,
        ts: Date.now(),
      };
      projectInputs.push(entry);
      renderInputsPanel();
      refreshAllVarHighlights();  // {{name}} pills in any open textarea now turn known
      await flushSaveNow();
      return entry;
    } catch (err) {
      toast(`Upload failed: ${err.message}`, 'error');
      return null;
    }
  }

  // Append an empty file-typed variable. Mirrors addProjectVar so the user
  // can declare a {{key}} placeholder up front, share the project, and let
  // the recipient attach the actual file later.
  function addProjectInput() {
    projectInputs.push({
      id: 'i' + Math.random().toString(36).slice(2, 10),
      name: '',
      key: '',
      kind: 'file',
      url: '',
      path: null,
      ts: Date.now(),
    });
    renderInputsPanel();
    refreshAllVarHighlights();
    flushSaveNow();
  }

  // Attach (or replace) the file behind an existing project-input entry.
  // Used by the per-row picker so empty placeholder rows can be filled in
  // without losing the user-chosen {{key}}.
  async function replaceProjectInputFile(id, file) {
    const entry = projectInputs.find(e => e.id === id);
    if (!entry || !file) return null;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const resp = await fetch('/api/upload', { method: 'POST', body: fd, credentials: 'same-origin' });
      const d = await resp.json();
      if (!resp.ok || !d.ok) throw new Error(d.error || `HTTP ${resp.status}`);
      entry.name = file.name;
      entry.kind = detectInputKind(file);
      entry.url = d.url;
      entry.path = d.path || null;
      entry.ts = Date.now();
      // Default the key from the filename only if the user hasn't already
      // typed one — preserves intent when filling a pre-declared placeholder.
      if (!entry.key) {
        entry.key = _sanitizeVarKey(String(file.name).replace(/\.[^.]+$/, '')) || 'file';
      }
      renderInputsPanel();
      refreshAllVarHighlights();
      await flushSaveNow();
      return entry;
    } catch (err) {
      toast(`Upload failed: ${err.message}`, 'error');
      return null;
    }
  }

  // Drop a project input onto the canvas → spawn an Upload node referencing it.
  function spawnUploadFromInput(entry) {
    const rect = canvasWrap.getBoundingClientRect();
    const center = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
    const node = createNode('upload', center.x - 120 + Math.random() * 40, center.y - 60 + Math.random() * 40);
    if (!node) return;
    node.uploadUrl  = entry.url;
    node.uploadPath = entry.path || null;
    // Upload nodes only know image/video/audio. Subtitle/text fall back to
    // the generic kind so the Edit node's collector can still pull them.
    node.uploadKind = (entry.kind === 'subtitle' || entry.kind === 'text' || entry.kind === 'file')
                      ? null : entry.kind;
    node.title = entry.name || node.title;
    renderNode(node);
    if (selNode?.id === node.id) renderRightPanel();
    flushSaveNow();
  }

  function deleteProjectInput(id) {
    const idx = projectInputs.findIndex(e => e.id === id);
    if (idx < 0) return;
    projectInputs.splice(idx, 1);
    renderInputsPanel();
    refreshAllVarHighlights();
    flushSaveNow();
  }

  function renderInputsPanel() {
    const panel = document.getElementById('panel-input');
    if (!panel) return;

    // File-row content (key = thumb · filename, with hover copy/delete) for an
    // uploaded input. Rendered inline alongside text-variable rows so the user
    // sees one unified list.
    const fileVarRow = e => {
      const k = _inputVarKey(e);
      const hasFile = !!(e.url || e.path);
      const thumb = hasFile
        ? (e.kind === 'image'
            ? `<img src="${esc(mediaUrl(e.url))}" alt="" referrerpolicy="no-referrer"/>`
            : e.kind === 'video'
              ? `<video src="${esc(mediaUrl(e.url))}" muted preload="metadata" referrerpolicy="no-referrer"></video>`
              : `<div class="file-thumb-placeholder">${ICONS[e.kind] || ICONS.upload}</div>`)
        : `<div class="file-thumb-placeholder">${ICONS.upload}</div>`;
      const pillClass = hasFile ? 'var-file-pill' : 'var-file-pill empty';
      const pillTitle = hasFile ? esc(e.name) : 'Choose a file';
      const labelText = hasFile ? esc(e.name) : 'Choose file…';
      // Empty rows: pill is a <label> wrapping a hidden file input, so a
      // click opens the per-row picker (mirrors how + Add file works for
      // text vars but lets the user attach a file to this specific row).
      // Filled rows: pill stays a plain div — click still spawns an Upload
      // node (existing shortcut), and replacing the file means delete + add.
      const pillOpen = hasFile ? '<div' : '<label';
      const pillClose = hasFile ? '</div>' : '</label>';
      const replaceInput = hasFile ? '' : `<input type="file" data-input-replace="${esc(e.id)}" hidden
          accept="image/*,video/*,audio/*,.srt,.vtt,.ass,.txt"/>`;
      return `<div class="var-row file-var-row" data-input-id="${esc(e.id)}">
        <input class="var-key" data-input-key-edit value="${esc(e.key || '')}" placeholder="key"
               spellcheck="false" title="Reference as {{${esc(k)}}}"/>
        <span class="var-eq">=</span>
        ${pillOpen} class="${pillClass}" title="${pillTitle}">
          ${replaceInput}
          <div class="var-file-thumb">${thumb}</div>
          <span class="var-file-name">${labelText}</span>
        ${pillClose}
        ${hasFile ? `<button class="var-expand" data-input-preview="${esc(e.id)}" title="Preview">↗</button>` : ''}
        <button class="var-copy" data-copy-var="${esc(k)}" title="Copy {{${esc(k)}}}">${ICONS.dup}</button>
        <button class="var-delete" data-input-delete="${esc(e.id)}" title="Remove">${ICONS.trash}</button>
      </div>`;
    };

    const textVarRow = v => `
      <div class="var-row" data-var-id="${esc(v.id)}">
        <input class="var-key" data-var-field="key" placeholder="key"
               value="${esc(v.key)}" spellcheck="false"/>
        <span class="var-eq">=</span>
        <input class="var-value" data-var-field="value" placeholder="value"
               value="${esc(v.value)}"/>
        <button class="var-expand" data-var-expand="${esc(v.id)}" title="Expand editor">↗</button>
        <button class="var-copy" data-copy-var="${esc(v.key)}" title="Copy {{${esc(v.key)}}}">${ICONS.dup}</button>
        <button class="var-delete" data-var-delete="${esc(v.id)}" title="Remove">${ICONS.trash}</button>
      </div>`;

    const allRows = projectVars.map(textVarRow).join('') + projectInputs.map(fileVarRow).join('');

    panel.innerHTML = `
      <div class="side-section-title">Project variables</div>
      <div class="var-list">${allRows}</div>
      <div class="var-add-row">
        <button class="var-add" id="var-add">+ Add variable</button>
        <button class="var-add" id="input-add" title="Adds an empty file-typed variable. Drop files here to upload directly.">+ Add file</button>
      </div>
      <div class="var-help">Reference variables anywhere as <code>{{key}}</code> — resolved before the prompt hits any API. Keys may use Chinese / any Unicode (e.g. <code>{{品牌}}</code>). Uploads become file-typed variables; the file flows into the matching node argument (image / audio / video) automatically when you reference it.</div>
    `;

    // Variables: add / edit / delete (text variables only)
    panel.querySelector('#var-add')?.addEventListener('click', () => addProjectVar());
    panel.querySelectorAll('[data-var-id]').forEach(row => {
      const id = row.dataset.varId;
      row.querySelectorAll('[data-var-field]').forEach(input => {
        input.addEventListener('input', () => {
          updateProjectVar(id, input.dataset.varField, input.value);
          // Re-sync the field if the key was sanitized so the user sees the actual stored value
          if (input.dataset.varField === 'key') {
            const stored = projectVars.find(v => v.id === id)?.key ?? '';
            if (stored !== input.value) {
              const caret = input.selectionStart;
              input.value = stored;
              try { input.setSelectionRange(caret, caret); } catch (_) {}
            }
            // Keep the row's copy button pointing at the renamed key so
            // clicking it copies the current {{key}} (not the stale value
            // that was rendered when the row was first built).
            const copy = row.querySelector('[data-copy-var]');
            if (copy) {
              copy.dataset.copyVar = stored;
              copy.title = 'Copy {{' + stored + '}}';
            }
          }
        });
      });
    });
    panel.querySelectorAll('[data-var-delete]').forEach(btn => {
      btn.addEventListener('click', () => deleteProjectVar(btn.dataset.varDelete));
    });

    // Expand button: open a full-screen modal editor for the variable's value
    panel.querySelectorAll('[data-var-expand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.varExpand;
        const v = projectVars.find(x => x.id === id);
        if (!v) return;
        openVarExpandModal(id, v.key, v.value);
      });
    });

    // Seek video thumbs in file rows to the first frame
    panel.querySelectorAll('.var-file-thumb video').forEach(v => {
      const seek = () => { try { v.currentTime = 0.01; } catch (_) {} };
      if (v.readyState >= 1) seek();
      else v.addEventListener('loadedmetadata', seek, { once: true });
    });

    // "+ Add file" appends an empty file-typed row (the user can attach a
    // file later via the row's pill, or drag one onto it).
    panel.querySelector('#input-add')?.addEventListener('click', () => addProjectInput());

    // Per-row file picker — each empty file row carries its own hidden
    // <input type="file"> wrapped by the pill <label>, so a click attaches
    // a file to that specific entry without losing the user-chosen key.
    panel.querySelectorAll('[data-input-replace]').forEach(inp => {
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('change', async () => {
        const id = inp.dataset.inputReplace;
        const f = inp.files?.[0];
        inp.value = '';
        if (f) await replaceProjectInputFile(id, f);
      });
    });

    // Drag-and-drop onto the "+ Add file" button — fast path that uploads
    // and creates a populated row in one step. Drops on the whole panel
    // also count so users don't have to aim precisely.
    const drop = panel.querySelector('#input-add');
    if (drop) {
      drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('drag'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
      drop.addEventListener('drop', async e => {
        e.preventDefault(); drop.classList.remove('drag');
        for (const f of e.dataTransfer?.files || []) await uploadProjectInput(f);
      });
    }

    // File-row controls: delete / copy / inline key-edit. The whole-row
    // "click → spawn Upload node" shortcut still works on the empty space,
    // but only for rows that actually have a file behind them.
    panel.querySelectorAll('[data-input-id]').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('[data-input-delete]')) return;
        if (e.target.closest('[data-copy-var]')) return;
        if (e.target.closest('[data-input-preview]')) return;
        if (e.target.closest('[data-input-key-edit]')) return;
        if (e.target.closest('label, input, button')) return;
        const id = el.dataset.inputId;
        const entry = projectInputs.find(x => x.id === id);
        if (entry && (entry.url || entry.path)) spawnUploadFromInput(entry);
      });
    });
    panel.querySelectorAll('[data-input-delete]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        deleteProjectInput(btn.dataset.inputDelete);
      });
    });
    panel.querySelectorAll('[data-copy-var]').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const tok = '{{' + el.dataset.copyVar + '}}';
        copyToClipboard(tok).then(
          () => toast('Copied ' + tok, 'success'),
          () => toast('Copy failed', 'error'),
        );
      });
    });
    panel.querySelectorAll('[data-input-key-edit]').forEach(inp => {
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('focus', e => e.stopPropagation());
      inp.addEventListener('input', () => {
        const id = inp.closest('[data-input-id]').dataset.inputId;
        const stored = updateProjectInputKey(id, inp.value);
        if (stored !== inp.value) {
          const caret = inp.selectionStart;
          inp.value = stored;
          try { inp.setSelectionRange(caret, caret); } catch (_) {}
        }
        inp.title = 'Reference as {{' + stored + '}}';
        const copy = inp.closest('[data-input-id]')?.querySelector('[data-copy-var]');
        if (copy) {
          copy.dataset.copyVar = stored;
          copy.title = 'Copy {{' + stored + '}}';
        }
      });
    });

    // File preview expand: open a modal with a larger preview of the file
    panel.querySelectorAll('[data-input-preview]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = btn.dataset.inputPreview;
        const entry = projectInputs.find(x => x.id === id);
        if (!entry || (!entry.url && !entry.path)) return;
        openFilePreviewModal(entry);
      });
    });
  }

  function openFilePreviewModal(entry) {
    document.getElementById('file-preview-modal')?.remove();
    const url = mediaUrl(entry.url);
    const kind = entry.kind || 'upload';
    let mediaEl = '';
    if (kind === 'image') {
      mediaEl = `<img src="${esc(url)}" alt="${esc(entry.name)}" referrerpolicy="no-referrer"/>`;
    } else if (kind === 'video') {
      mediaEl = `<video src="${esc(url)}" controls autoplay referrerpolicy="no-referrer" style="max-width:100%;max-height:60vh;border-radius:6px;"></video>`;
    } else if (kind === 'audio') {
      mediaEl = `<audio controls src="${esc(url)}" style="width:100%;"></audio>`;
    } else {
      mediaEl = `<div style="color:var(--fg-3);font-family:var(--type-mono);font-size:14px;padding:40px;">File: ${esc(entry.name)}</div>`;
    }
    const overlay = document.createElement('div');
    overlay.className = 'file-modal-overlay';
    overlay.id = 'file-preview-modal';
    overlay.innerHTML = `
      <div class="file-modal">
        <div class="file-modal-head">
          <span class="file-modal-title">${esc(entry.name)}</span>
          <span class="file-modal-kind">${esc(kind)}</span>
          <button class="file-modal-close" title="Close (Esc)">✕</button>
        </div>
        <div class="file-modal-body">${mediaEl}</div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = () => { overlay.remove(); };
    overlay.querySelector('.file-modal-close').addEventListener('click', close);
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    const onKey = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
  }

  function updateInspector() { renderRightPanel(); }
  function renderInspector(nodeId) { renderRightPanel(); }

  function renderRightPanel() {
    const sideRight = document.getElementById('side-right');
    const panel = document.getElementById('right-panel-content');
    if (!panel) return;

    const selId = selected.size === 1 ? [...selected][0] : null;
    const selNode = selId ? nodes.get(selId) : null;

    // Auto-hide when no single node is selected
    const show = !!selNode;
    sideRight?.classList.toggle('collapsed', !show);
    document.body.classList.toggle('right-collapsed', !show);
    if (!show) { panel.innerHTML = ''; return; }

    // Combined panel: params on top, then upstream inputs below
    panel.innerHTML = '<div id="rp-params"></div><div id="rp-inputs"></div>';
    renderParamsTab(document.getElementById('rp-params'), selNode);
    renderInputsSection(document.getElementById('rp-inputs'), selNode);
  }

  // Compact upstream-connections section shown below params in the combined panel.
  // Upload nodes have no inputs; all others show their connected upstream nodes.
  function renderInputsSection(div, node) {
    if (!div) return;
    const up = upstreamNodes(node.id);
    if (node.type === 'upload' || !up.length) { div.innerHTML = ''; return; }

    const TYPE_ORDER = ['upload', 'text', 'image', 'video', 'audio'];
    const TYPE_LABEL = { upload: 'Uploads', text: 'Text', image: 'Images', video: 'Videos', audio: 'Audio' };
    const groups = TYPE_ORDER.map(t => {
      const items = up.filter(u => u.type === t).map(u => ({ node: u, depth: 1 }));
      return items.length ? upstreamGroupHtml(TYPE_LABEL[t], t, items) : '';
    }).join('');

    div.innerHTML = `<hr class="rp-divider"/><div class="rp-inputs-head">Inputs · ${up.length}</div>${groups}`;
    div.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.jump;
        clearSelection(); setSelected(id, true); updateSelInfo();
      });
    });
    div.querySelectorAll('[data-iexpand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const el = btn.closest('.input-text');
        if (el) { el.classList.toggle('expanded'); btn.textContent = el.classList.contains('expanded') ? 'less' : 'more'; }
      });
    });
  }

  // ── Upstream computation ──────────────────────────────────────────────────
  function computeUpstreamAll(targetId) {
    // Returns [{node, depth}] for all ancestors
    const incoming = {};
    edges.forEach(e => { (incoming[e.toId] = incoming[e.toId] || []).push(e.fromId); });
    const byId = node => nodes.get(node);

    const direct = (incoming[targetId] || []).map(byId).filter(Boolean);
    const seen = new Set([targetId, ...direct.map(n => n.id)]);
    const result = direct.map(n => ({ node: n, depth: 1 }));
    let frontier = direct.map(n => ({ id: n.id, depth: 1 }));
    while (frontier.length) {
      const next = [];
      for (const f of frontier) {
        for (const pid of incoming[f.id] || []) {
          if (seen.has(pid)) continue;
          seen.add(pid);
          const n = nodes.get(pid);
          if (!n) continue;
          result.push({ node: n, depth: f.depth + 1 });
          next.push({ id: pid, depth: f.depth + 1 });
        }
      }
      frontier = next;
    }
    return result;
  }

  // ── Inputs tab ────────────────────────────────────────────────────────────
  // (inputsFilter, inputsGroupBy declared at top-of-script with other state)

  function renderInputsTab(panel, selNode) {
    if (!selNode) {
      panel.innerHTML = `<div class="empty-state">
        ${ICONS.layers}
        <div class="empty-state-title">No node selected</div>
        <div class="empty-state-sub">Select a node on the canvas to inspect every text, image, video, and audio input flowing into it.</div>
      </div>`;
      return;
    }

    const all = upstreamNodes(selNode.id).map(node => ({ node, depth: 1 }));
    const counts = all.reduce((acc, {node}) => { acc[node.type] = (acc[node.type]||0)+1; return acc; }, {});
    const totalSize = all.length;

    const filtered = all.filter(({node}) => {
      if (inputsFilter === 'all') return true;
      return node.type === inputsFilter;
    });

    const TYPE_ORDER = ['upload','text','image','video','audio'];
    const TYPE_LABEL = { upload:'Uploads', text:'Text prompts', image:'Images', video:'Videos', audio:'Audio' };

    // Filter chips
    const chipHtml = (type, label, count) => {
      const active = inputsFilter === type;
      return `<button class="upstream-chip${active?' active':''}" data-ifilter="${type}" title="${label}">
        ${type !== 'all' ? ICONS[type] || '' : ''}
        ${type === 'all' ? `All <span class="upstream-chip-n">${totalSize}</span>` : `<span class="upstream-chip-n">${count}</span>`}
      </button>`;
    };

    const filterRow = totalSize > 0 ? `<div class="upstream-filters">
      ${chipHtml('all','All',totalSize)}
      ${TYPE_ORDER.filter(t => counts[t]).map(t => chipHtml(t, TYPE_LABEL[t], counts[t])).join('')}
    </div>` : '';

    // Group content
    let groupsHtml = '';
    if (totalSize === 0) {
      groupsHtml = `<div class="empty-state" style="padding:30px 20px">
        ${ICONS.layers}
        <div class="empty-state-title">No inputs yet</div>
        <div class="empty-state-sub">Drag from another node's output port to feed it data.</div>
      </div>`;
    } else {
      groupsHtml = TYPE_ORDER.map(t => {
        const items = filtered.filter(({node}) => node.type === t);
        if (!items.length) return '';
        return upstreamGroupHtml(TYPE_LABEL[t], t, items);
      }).join('');
    }

    // Upload node: show upload controls instead of upstream connections
    if (selNode.type === 'upload') {
      const kind = selNode.uploadKind;
      const url = selNode.uploadUrl;
      let previewHtml = '';
      if (url) {
        const kindLabel = kind || 'file';
        const fname = url.split('/').pop();
        let thumb = '';
        if (kind === 'video') thumb = `<div class="inputs-upload-thumb"><video src="${esc(mediaUrl(url))}" muted preload="metadata"></video></div>`;
        else if (kind === 'audio') thumb = `<div class="inputs-upload-thumb" style="background:var(--bg-3);color:var(--fg-3);font-size: 18px">${ICONS.audio}</div>`;
        else thumb = `<div class="inputs-upload-thumb"><img src="${esc(mediaUrl(url))}" alt=""/></div>`;
        previewHtml = `<div class="inputs-upload-preview">
          ${thumb}
          <div class="inputs-upload-info">
            <div class="inputs-upload-name">${esc(fname)}</div>
            <div class="inputs-upload-meta">${esc(kindLabel)}</div>
          </div>
          <button class="inputs-upload-remove" id="upload-remove" title="Remove">✕</button>
        </div>`;
      }
      panel.innerHTML = `<div class="upstream" style="display:flex;flex-direction:column;height:100%">
        <div class="upstream-head">
          <div class="upstream-target">
            <span class="upstream-target-badge">${ICONS.upload}</span>
            <div class="upstream-target-meta">
              <div class="upstream-target-label">Source node</div>
              <div class="upstream-target-title">${esc(selNode.title || 'Upload')}</div>
            </div>
          </div>
        </div>
        <div class="upstream-body" style="flex:1;overflow-y:auto">
          <div class="inputs-upload" style="margin:12px 10px 0">
            <div class="inputs-upload-title">File</div>
            ${previewHtml}
            <label>
              <input type="file" class="inputs-upload-input" id="upload-file-input" accept="image/*,video/*,audio/*"/>
              <span class="inputs-upload-btn">+ Choose file (image · video · audio)</span>
            </label>
          </div>
        </div>
      </div>`;

      panel.querySelector('#upload-remove')?.addEventListener('click', () => {
        selNode.uploadUrl = null; selNode.uploadPath = null; selNode.uploadKind = null; selNode.uploadRatio = null;
        renderNode(selNode); renderRightPanel(); scheduleSave();
      });
      panel.querySelector('#upload-file-input')?.addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        const fileKind = f.type.startsWith('video/') ? 'video' : f.type.startsWith('audio/') ? 'audio' : 'image';
        const fd = new FormData(); fd.append('file', f);
        toast('Uploading…');
        try {
          const resp = await fetch('/api/upload', { method: 'POST', body: fd });
          const d = await resp.json();
          if (d.ok) {
            selNode.uploadUrl = d.url; selNode.uploadPath = d.path || null; selNode.uploadKind = fileKind; selNode.uploadRatio = null;
            renderNode(selNode); renderRightPanel(); scheduleSave();
            if (document.getElementById('panel-output')?.style.display !== 'none') renderFilesPanel();
            toast('Upload done', 'success');
          } else { toast('Upload failed', 'error'); }
        } catch { toast('Upload failed', 'error'); }
      });
      return;
    }

    panel.innerHTML = `<div class="upstream" style="display:flex;flex-direction:column;height:100%">
      <div class="upstream-head">
        <div class="upstream-target">
          <span class="upstream-target-badge">${ICONS[selNode.type] || ''}</span>
          <div class="upstream-target-meta">
            <div class="upstream-target-label">Feeding into</div>
            <div class="upstream-target-title">${esc(selNode.title || NODE_SPECS[selNode.type].title)}</div>
          </div>
          ${totalSize > 0 ? `<div class="upstream-target-count">
            <span class="num">${totalSize}</span>
            <span class="lbl">input${totalSize===1?'':'s'}</span>
          </div>` : ''}
        </div>
        ${filterRow}
      </div>
      <div class="upstream-body" style="flex:1">${groupsHtml}</div>
    </div>`;

    // Wire filter chip clicks
    panel.querySelectorAll('[data-ifilter]').forEach(btn => {
      btn.addEventListener('click', () => { inputsFilter = btn.dataset.ifilter; renderRightPanel(); });
    });
    panel.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.jump;
        clearSelection(); setSelected(id, true); updateSelInfo();
      });
    });
    panel.querySelectorAll('[data-iexpand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const el = btn.closest('.input-text');
        if (el) { el.classList.toggle('expanded'); btn.textContent = el.classList.contains('expanded') ? 'less' : 'more'; }
      });
    });
  }

  function upstreamGroupHtml(title, type, items, hop) {
    const icon = type ? `<span class="upstream-group-icon">${ICONS[type]||''}</span>` :
      (hop ? `<span class="upstream-hop-pip">${hop}</span>` : '');
    const cards = items.map(({node, depth}) => inputCardHtml(node, depth)).join('');
    return `<section class="upstream-group">
      <header class="upstream-group-head">
        ${ICONS.chevD}
        ${icon}
        <span class="upstream-group-title">${esc(title)}</span>
        <span class="upstream-group-count">${items.length}</span>
      </header>
      <div class="upstream-group-body">${cards}</div>
    </section>`;
  }

  function inputCardHtml(node, depth) {
    const last = (node.results||[])[node.results.length-1];
    const mediaUrl_ = url => mediaUrl(url);

    let mediaHtml = '';
    if (node.type === 'text') {
      // Prefer generated text; fall back to instruction.
      const generated = last?.kind === 'text' ? last.text : '';
      const content = generated || node.prompt || '(empty)';
      const isLong = content.length > 160;
      const tag = generated ? '<span style="color:var(--amber);font-family:var(--type-mono);font-size: 11px;letter-spacing:0.1em">OUTPUT · </span>' : '';
      mediaHtml = `<div class="input-text${isLong?' expandable':''}">
        <div class="input-text-content">${tag}${esc(content)}</div>
        ${isLong ? `<div class="input-text-fade"><button data-iexpand style="font:inherit;color:inherit;cursor:pointer">more</button></div>` : ''}
      </div>`;
    } else if (node.type === 'audio') {
      const bars = 40;
      const waveBars = Array.from({length: bars}, (_,i) => {
        const h = 8 + 16*Math.abs(Math.sin(i*0.5+(node.id.charCodeAt(1)||1))) + 4*Math.abs(Math.sin(i*1.3));
        return `<span style="height:${h}px"></span>`;
      }).join('');
      mediaHtml = `<div class="input-audio">
        <button class="input-audio-btn">${ICONS.play}</button>
        <div class="input-audio-track">
          <div class="input-audio-wave">${waveBars}</div>
          <div class="input-audio-meta"><span>Audio</span></div>
        </div>
      </div>`;
    } else if (node.type === 'upload') {
      const src = node.uploadUrl;
      const kind = node.uploadKind;
      const mediaEl = src
        ? (kind === 'video'
            ? `<video src="${esc(mediaUrl_(src))}" muted preload="metadata" referrerpolicy="no-referrer"></video>`
            : kind === 'audio'
              ? `<div style="display:grid;place-items:center;height:100%;color:var(--fg-2)">${ICONS.audio}</div>`
              : `<img src="${esc(mediaUrl_(src))}" alt="" referrerpolicy="no-referrer"/>`)
        : null;
      mediaHtml = `<div class="input-media image">
        ${mediaEl || `<div class="input-media-placeholder">UPLOAD</div>`}
      </div>`;
    } else if (node.type === 'video' || node.type === 'image') {
      const mediaSrc = last ? (last.servePath || last.url) : null;
      const uploadSrc = node.uploadUrl || null;
      const isVideo = last?.kind === 'video';
      const mediaEl = mediaSrc
        ? (isVideo
            ? `<video src="${esc(mediaUrl_(mediaSrc))}" muted preload="metadata" referrerpolicy="no-referrer"></video>`
            : `<img src="${esc(mediaUrl_(mediaSrc))}" alt="" referrerpolicy="no-referrer"/>`)
        : uploadSrc
          ? `<img src="${esc(mediaUrl_(uploadSrc))}" alt="" referrerpolicy="no-referrer"/>`
          : null;
      mediaHtml = `<div class="input-media ${node.type}">
        ${mediaEl || `<div class="input-media-placeholder">${node.status==='running'?`RENDERING · ${node.progress||0}%`:node.type.toUpperCase()}</div>`}
        ${node.type==='video' ? `<span class="input-media-pill duration">${node.params?.duration||'5'}s</span>` : ''}
      </div>`;
    }

    const rc = (node.results||[]).length;
    const metaStr = rc ? `${rc} run${rc===1?'':'s'}` : NODE_SPECS[node.type]?.title || node.type;

    return `<div class="input-card type-${node.type}">
      <div class="input-card-head">
        <span class="input-type-mark t-${node.type}">${ICONS[node.type]||''}</span>
        <span class="input-card-title" data-jump="${esc(node.id)}">${esc(node.title||NODE_SPECS[node.type].title)}</span>
        ${depth > 1 ? `<span class="input-hop">${depth}↑</span>` : ''}
        ${nodeStatusHtml(node)}
      </div>
      ${mediaHtml}
      <div class="input-card-foot">
        <span class="input-meta">${esc(metaStr)}</span>
        <div class="input-card-actions">
          <button class="input-action" data-jump="${esc(node.id)}" title="Reveal on canvas">${ICONS.fit}</button>
          ${node.type !== 'upload' ? `<button class="input-action" title="Re-run" onclick="runNode('${esc(node.id)}')">${ICONS.refresh}</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  // ── Params tab ────────────────────────────────────────────────────────────
  function renderParamsTab(panel, selNode) {
    if (!selNode) {
      panel.innerHTML = `<div class="empty-state">
        ${ICONS.layers}
        <div class="empty-state-title">Nothing selected</div>
        <div class="empty-state-sub">Click a node on the canvas to edit its parameters.</div>
      </div>`;
      return;
    }
    const node = selNode;
    const spec = NODE_SPECS[node.type];
    const ups = upstreamNodes(node.id);
    const imageUps  = ups.filter(u => u.type === 'image' || u.type === 'video');
    const isPassive = PASSIVE_TYPES.has(node.type);
    const sel = (opts, cur) => opts.map(([v,l]) => `<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('');

    // Thumbnail / preview header
    const last = (node.results||[])[(node.results||[]).length-1];
    const lastSrc = last?.servePath || last?.url;
    const placeholderIcon = (() => {
      if (last?.kind === 'audio' || last?.kind === 'text') return ICONS[last.kind];
      if (node.type === 'upload' && node.uploadKind) return ICONS[node.uploadKind] || ICONS.upload;
      return ICONS[node.type] || '';
    })();
    let thumbHtml;
    if (last && (last.kind === 'image' || last.kind === 'video') && lastSrc) {
      thumbHtml = `<div class="inspector-thumb">${resultThumb(last)}</div>`;
    } else if (node.uploadUrl && node.uploadKind === 'video') {
      thumbHtml = `<div class="inspector-thumb"><video src="${esc(mediaUrl(node.uploadUrl))}" muted preload="metadata" referrerpolicy="no-referrer"></video></div>`;
    } else if (node.uploadUrl && (node.uploadKind === 'image' || !node.uploadKind)) {
      thumbHtml = `<img class="inspector-thumb" src="${esc(mediaUrl(node.uploadUrl))}" alt="" referrerpolicy="no-referrer"/>`;
    } else {
      thumbHtml = `<div class="inspector-thumb placeholder">${placeholderIcon}</div>`;
    }

    let f = '';

    // Name
    f += `<div class="field">
      <label class="field-label">Name</label>
      <input class="field-input" data-field="title" value="${esc(node.title||spec.title)}"/>
    </div>`;

    // Prompt
    if (['text','image','video'].includes(node.type)) {
      const vMode = node.type === 'video' ? videoMode(node) : '';
      const ph = {
        text:'Write a 30s product script highlighting the selling points above…',
        image:'A misty mountain at dawn…',
        video: vMode === 'R2V' ? 'Describe the scene; the reference image guides style/subject…'
             : vMode === 'I2V' ? 'Camera slowly pushes in, leaves rustle in the breeze…'
                               : 'A fox sitting in a snowy forest, cinematic 4K…',
      }[node.type] || '';
      const lbl = node.type === 'text' ? 'Instruction' : 'Prompt';
      let helper = '';
      if (node.type === 'text') {
        helper = `<div class="field-helper">The model receives all upstream inputs (text · images · video refs) plus this instruction.</div>`;
      } else if (node.type === 'video') {
        const helperText = {
          R2V:  'R2V (全能参考) — uses the reference image plus this prompt to compose a brand-new scene.',
          I2V:  'I2V — describes motion applied to the upstream image (optional).',
          T2V:  'T2V — text-only generation; no image reference is needed.',
        }[vMode] || '';
        const color = vMode === 'T2V' ? '' : 'color:var(--amber)';
        helper = `<div class="field-helper" style="${color}">${helperText}</div>`;
      }
      f += `<div class="field">
        <label class="field-label">${lbl}</label>
        <textarea class="field-textarea" data-field="prompt" rows="5" placeholder="${esc(ph)}">${esc(node.prompt)}</textarea>
        ${helper}
      </div>`;
    }

    // Generated text output (Text node) — editable for everyone, including
    // view-only collaborators. The latest text result is the source of
    // truth for downstream nodes' {{prev}}/{{text}} resolution, so letting
    // recipients tweak phrasing without touching the original prompt is
    // exactly the workflow we want when sharing a draft.
    if (node.type === 'text') {
      const lastTxt = (node.results || []).slice().reverse().find(r => r?.kind === 'text');
      if (lastTxt?.text) {
        f += `<div class="field">
          <label class="field-label">Generated text <span style="color:var(--amber);font-size: 12px">${node.results.length} run${node.results.length===1?'':'s'}</span></label>
          <textarea class="generated-text" data-text-output rows="6" spellcheck="false">${esc(lastTxt.text)}</textarea>
          <button class="btn ghost" type="button" data-action="copy-text" style="margin-top:6px;font-size: 13px">Copy</button>
        </div>`;
      }
    }

    // Mode chips (video) — Auto auto-detects T2V/I2V from connections; MM2V is multimodal2video (全能参考)
    if (node.type === 'video') {
      // Resolve to one of {T2V, I2V, R2V} so the chip always shows a real
      // selection (legacy 'auto' / 'MM2V' values are mapped by videoMode()).
      const cur = videoMode(node);
      const modes = [
        ['T2V', 'T2V'],
        ['I2V', 'I2V'],
        ['R2V', 'R2V (全能参考)'],
      ];
      // Heuristic: would startTask see an image reference on Run? Mirror
      // the inputs collectInputs would gather so the hint is accurate.
      const hasUpstreamImage = upstreamNodes(node.id).some(u => {
        if (u.type === 'upload' && u.uploadKind === 'image' && (u.uploadPath || u.uploadUrl)) return true;
        if (u.type === 'image' && (u.results?.some(r => r?.kind === 'image') || u.uploadUrl)) return true;
        return false;
      });
      const referencedProjectImage = (() => {
        const m = (node.prompt || '').matchAll(/\{\{\s*([\p{L}\p{N}_]+)\s*\}\}/gu);
        const referenced = new Set();
        for (const x of m) referenced.add(x[1]);
        return projectInputs.some(inp => inp.kind === 'image' && referenced.has(_inputVarKey(inp)) && (inp.url || inp.path));
      })();
      const hasImageRefAtRunTime = hasUpstreamImage || referencedProjectImage || !!node.uploadUrl;
      const needsImageMode = cur === 'T2V' && hasImageRefAtRunTime;
      // Inverse mismatch: user picked I2V or R2V (both need an image) but
      // didn't wire one up. Surface this now instead of letting the run
      // fail with a generic "requires an image reference" mid-loop.
      const missingImage = (cur === 'I2V' || cur === 'R2V') && !hasImageRefAtRunTime;
      // Image-typed project inputs the user has uploaded but isn't using.
      // Listing the keys here turns the "how do I reference it" question
      // into a copyable answer instead of a doc search.
      const availableImageKeys = projectInputs
        .filter(inp => inp.kind === 'image' && (inp.url || inp.path))
        .map(inp => _inputVarKey(inp))
        .filter(Boolean);
      let modeHint = '';
      if (needsImageMode) {
        modeHint = `<div class="field-helper" style="color:var(--err);margin-top:4px">An image is wired in but the mode is T2V — text2video can't carry an image, so the run will fail. Switch to R2V (style/subject reference) or I2V (animate this image) to use it.</div>`;
      } else if (missingImage) {
        const keyHint = availableImageKeys.length
          ? `Reference one in your prompt as ${availableImageKeys.map(k => `<code>{{${esc(k)}}}</code>`).join(' / ')}, or connect an Image / Upload node upstream.`
          : `Upload an image to the Input tab (or connect an Image / Upload node upstream), then reference it in your prompt as <code>{{key}}</code>.`;
      modeHint = `<div class="field-helper" style="color:var(--err);margin-top:4px">${cur} needs an image but none is wired in. ${keyHint}</div>`;
      }
      f += `<div class="field">
        <label class="field-label">Mode</label>
        <div class="chip-row">
          ${modes.map(([v,l]) => `<button class="chip${cur===v?' active':''}" data-field="videoMode" data-val="${v}">${esc(l)}</button>`).join('')}
        </div>
        ${modeHint}
      </div>`;
    }

    // Duration (video) — Seedance accepts integer seconds in [4, 15]. Free
    // numeric input, clamped on commit so out-of-range typing doesn't get
    // sent to the API.
    if (node.type === 'video') {
      const cur = String(node.params.duration ?? '5');
      f += `<div class="field">
        <label class="field-label">Duration (s)</label>
        <input class="field-input" type="number" min="4" max="15" step="1"
               inputmode="numeric" data-field="duration" data-clamp="4-15"
               value="${esc(cur)}"/>
      </div>`;
    }

    // Loop count (every generation node). When > 1, Run loops N times
    // sequentially. Two modes auto-detect at run-time:
    //   • SCENE mode — upstream Text node output contains scene markers
    //     ("Scene 1:", "镜头 1:", numbered list, etc.). Each iteration
    //     swaps {{text}}/{{prev}} for one scene block, so N clips get
    //     N different scripts. Effective count clamps to the number of
    //     scenes the splitter found.
    //   • VARIANT mode — no scene markers detected. Same prompt N times
    //     for stylistic variants.
    // Clamped [1, 20] to keep accidental paste of "999" from queuing
    // a runaway batch.
    if (['text', 'image', 'video', 'audio', 'edit'].includes(node.type)) {
      const cur = String(node.params.count ?? '1');
      f += `<div class="field">
        <label class="field-label">Count <span style="color:var(--fg-3);font-size:10px">1 = process every upstream scene · > 1 = cap to that many · no scenes → that many variants of one prompt</span></label>
        <input class="field-input" type="number" min="1" max="20" step="1"
               inputmode="numeric" data-field="count" data-clamp="1-20"
               value="${esc(cur)}"/>
      </div>`;
    }

    // Aspect ratio chips
    if (node.type === 'image' || node.type === 'video') {
      const ratios = ['16:9','9:16','1:1','4:3','3:4'];
      f += `<div class="field">
        <label class="field-label">Aspect ratio</label>
        <div class="chip-row">
          ${ratios.map(r => `<button class="chip${node.params.ratio===r?' active':''}" data-field="ratio" data-val="${r}">${r}</button>`).join('')}
