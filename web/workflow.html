<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>饼冰科技</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* legacy canvas vars (nodes / edges still use these) */
  --bg: #0f0e0c;
  --surface: oklch(0.21 0.014 62);
  --surface2: oklch(0.25 0.016 64);
  --surface3: oklch(0.30 0.018 65);
  --border: oklch(0.32 0.015 65 / 0.5);
  --accent: #a07850;
  --accent2: #c9a87c;
  --text: oklch(0.95 0.02 85);
  --muted: oklch(0.55 0.02 72);
  --success: oklch(0.75 0.14 155);
  --warning: oklch(0.80 0.15 85);
  --error: oklch(0.70 0.18 25);
  --grid: oklch(0.22 0.01 65);

  /* Reel design vars */
  --bg-0: oklch(0.17 0.012 60);
  --bg-1: oklch(0.21 0.014 62);
  --bg-2: oklch(0.25 0.016 64);
  --bg-3: oklch(0.30 0.018 65);
  --bg-4: oklch(0.36 0.020 66);
  --line: oklch(0.32 0.015 65 / 0.5);
  --line-soft: oklch(0.32 0.015 65 / 0.25);
  --fg-0: oklch(0.95 0.02 85);
  --fg-1: oklch(0.82 0.025 80);
  --fg-2: oklch(0.62 0.025 75);
  --fg-3: oklch(0.48 0.022 72);
  --amber: oklch(0.78 0.145 70);
  --amber-dim: oklch(0.52 0.10 68);
  --amber-glow: oklch(0.78 0.145 70 / 0.35);
  --ok: oklch(0.75 0.14 155);
  --err: oklch(0.70 0.18 25);
  --type-display: "Instrument Serif", Georgia, serif;
  --type-ui: "Inter", system-ui, sans-serif;
  --type-mono: "JetBrains Mono", ui-monospace, monospace;
}

html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  user-select: none;
}

/* ── Top bar ────────────────────────────────────────────────────────────── */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: linear-gradient(to bottom, var(--bg-1), var(--bg-0));
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  z-index: 100;
  font-family: var(--type-ui);
}
.back-btn {
  color: var(--fg-3);
  text-decoration: none;
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line);
  transition: color 0.12s, background 0.12s;
  flex-shrink: 0;
}
.back-btn:hover { color: var(--fg-0); background: var(--bg-2); }
.logo {
  display: flex; align-items: baseline; gap: 7px;
  padding-right: 14px;
  border-right: 1px solid var(--line);
  height: 100%;
}
.logo-mark {
  width: 20px; height: 20px; border-radius: 50%;
  background: conic-gradient(from 0deg, var(--amber), oklch(0.6 0.15 50), var(--amber));
  position: relative; align-self: center;
  box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3px var(--amber-dim);
}
.logo-mark::after {
  content: ""; position: absolute; inset: 5px;
  background: var(--bg-0); border-radius: 50%;
}
.logo-name { font-family: var(--type-display); font-size: 20px; letter-spacing: -0.01em; align-self: center; color: var(--fg-0); }
.logo-sub { font-family: var(--type-mono); font-size: 9px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; align-self: center; }
.breadcrumb { display: flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 12px; }
.breadcrumb .sep { color: var(--fg-3); }
.topbar-project { color: var(--fg-0); font-weight: 500; font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-spacer { flex: 1; }
.topbar-run-group {
  display: flex; align-items: center; gap: 4px;
  padding: 3px; background: var(--bg-1);
  border: 1px solid var(--line); border-radius: 8px;
}

.toggle-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 500;
  color: var(--fg-2); background: var(--bg-1); border: 1px solid var(--line);
  font-family: var(--type-mono); letter-spacing: 0.03em;
}
.toggle-chip.on { color: var(--amber); border-color: var(--amber-dim); background: oklch(0.78 0.145 70 / 0.08); }
.toggle-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.toggle-chip.off .dot { background: var(--fg-3); }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500;
  color: var(--fg-1); background: transparent;
  border: 1px solid transparent; cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  white-space: nowrap; font-family: var(--type-ui);
}
.btn:hover { background: var(--bg-2); color: var(--fg-0); }
.btn.ghost { border-color: var(--line); }
.btn.ghost:hover { border-color: var(--bg-4); }
.btn.primary { background: var(--amber); color: oklch(0.18 0.03 65); font-weight: 600; border-color: transparent; }
.btn.primary:hover { background: oklch(0.82 0.15 72); }
.btn.primary:disabled { background: var(--bg-3); color: var(--fg-3); cursor: not-allowed; }
.btn.danger { color: var(--err); }
.btn.danger:hover { background: oklch(0.70 0.18 25 / 0.12); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-kbd {
  font-family: var(--type-mono); font-size: 10px;
  padding: 1px 4px; background: oklch(0 0 0 / 0.25);
  border-radius: 3px; color: var(--fg-2); margin-left: 2px;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Canvas overlays ────────────────────────────────────────────────────── */
.canvas-overlay {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
}
.canvas-overlay > * { pointer-events: auto; }
.canvas-help {
  position: absolute; top: 12px; right: 12px;
  display: flex; align-items: center; gap: 2px;
  padding: 5px 10px; background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; font-family: var(--type-mono); font-size: 10px; color: var(--fg-3);
  user-select: none;
}
.canvas-help .kbd {
  color: var(--fg-1); background: var(--bg-2); padding: 1px 5px;
  border-radius: 3px; border: 1px solid var(--line); margin: 0 2px;
}
.zoom-ctl {
  position: absolute; bottom: 16px; left: 16px;
  display: flex; align-items: center;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.zoom-ctl button {
  padding: 5px 9px; color: var(--fg-1); background: transparent;
  border: none; border-right: 1px solid var(--line);
  cursor: pointer; font-size: 14px; line-height: 1;
  font-family: var(--type-ui); transition: background 0.12s, color 0.12s;
}
.zoom-ctl button:last-child { border-right: none; }
.zoom-ctl button:hover { background: var(--bg-2); color: var(--fg-0); }
.zoom-val {
  min-width: 46px; text-align: center;
  font-family: var(--type-mono); font-size: 11px; color: var(--fg-2);
  padding: 5px 8px; border-right: 1px solid var(--line);
  white-space: nowrap;
}
.minimap {
  position: absolute; bottom: 16px; right: 16px;
  width: 160px; height: 100px;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.minimap-inner { position: relative; width: 100%; height: 100%; background: var(--bg-0); border-radius: 4px; overflow: hidden; }
.minimap-node { position: absolute; background: var(--fg-3); border-radius: 1px; min-width: 2px; min-height: 2px; }
.minimap-node.selected { background: var(--amber); }
.minimap-viewport { position: absolute; border: 1px solid var(--amber); background: oklch(0.78 0.145 70 / 0.1); pointer-events: none; }

/* ── Canvas ─────────────────────────────────────────────────────────────── */
.canvas-wrap {
  position: fixed;
  top: 52px;
  left: 260px; right: 280px; bottom: 0;
  overflow: hidden;
  cursor: grab;
  background:
    radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0)
    0 0 / 24px 24px;
}
.canvas-wrap.panning { cursor: grabbing; }
.canvas-wrap.mode-select { cursor: crosshair; }
.canvas-wrap.mode-select.panning { cursor: grabbing; }
.canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  transform-origin: 0 0;
  z-index: 2;
  pointer-events: none;
}

/* SVG layer for edges */
.edges {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  transform-origin: 0 0;
  z-index: 1;
}
.edge { fill: none; stroke: var(--muted); stroke-width: 2; opacity: 0.55; transition: stroke 0.15s, opacity 0.15s; pointer-events: stroke; cursor: pointer; }
.edge:hover, .edge.selected { stroke: var(--accent2); opacity: 1; stroke-width: 3; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edge-temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 5; opacity: 0.8; fill: none; pointer-events: none; }

/* ── Node cards ─────────────────────────────────────────────────────────── */
.node {
  position: absolute;
  width: 240px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md, 10px);
  box-shadow: 0 1px 0 oklch(1 0 0 / 0.04) inset, 0 8px 24px oklch(0 0 0 / 0.35);
  transition: border-color 0.12s, box-shadow 0.2s;
  cursor: grab;
  user-select: none;
  pointer-events: auto;
}
.node:active { cursor: grabbing; }
.node:hover { border-color: var(--bg-4); }
.node.selected {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 18px 48px oklch(0.78 0.145 70 / 0.25);
}
.node.running {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 0 32px var(--amber-glow);
}
.node.error { border-color: var(--err); }

/* ── Node head ──────────────────────────────────────────────────────────── */
.node-head {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px 7px;
  border-bottom: 1px solid var(--line-soft);
}
.node-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--type-mono); font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--amber); padding: 2px 6px 2px 4px;
  border-radius: 3px; background: oklch(0.78 0.145 70 / 0.12);
  flex-shrink: 0;
}
.node-title {
  font-size: 12px; font-weight: 600; color: var(--fg-0);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.node-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.12s; }
.node:hover .node-actions, .node.selected .node-actions { opacity: 1; }
.node-action {
  width: 22px; height: 22px; display: grid; place-items: center;
  border-radius: 4px; color: var(--fg-2); flex-shrink: 0;
}
.node-action:hover { background: var(--bg-3); color: var(--fg-0); }
.node-action.run:hover { color: var(--amber); }
.node-action.delete:hover { color: var(--err); }

/* ── Node body / preview ────────────────────────────────────────────────── */
.node-preview {
  position: relative; aspect-ratio: 16 / 10;
  background: var(--bg-0); overflow: hidden;
  border-bottom: 1px solid var(--line-soft);
}
.node-preview img, .node-preview video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.node-preview.empty {
  display: grid; place-items: center;
  background:
    repeating-linear-gradient(45deg,
      oklch(0.22 0.01 65), oklch(0.22 0.01 65) 6px,
      oklch(0.25 0.012 65) 6px, oklch(0.25 0.012 65) 12px);
  color: var(--fg-3); font-family: var(--type-mono); font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.node-text-body {
  padding: 10px 12px; font-size: 12px; color: var(--fg-1);
  line-height: 1.45; max-height: 90px; overflow: hidden;
  position: relative; font-family: var(--type-ui);
}
.node-text-body::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0;
  height: 24px; background: linear-gradient(transparent, var(--bg-2));
  pointer-events: none;
}
.node-audio-body {
  padding: 12px; display: flex; align-items: center; gap: 10px;
}
.wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 32px; }
.wave span { flex: 1; background: var(--amber); border-radius: 1px; opacity: 0.6; min-height: 2px; }
.wave span.active { opacity: 1; }
.node-output-wrap { position: relative; }
.node-output-count {
  position: absolute; bottom: 6px; right: 6px;
  background: oklch(0 0 0 / 0.65); color: var(--fg-0);
  font-family: var(--type-mono); font-size: 10px;
  padding: 2px 7px; border-radius: 10px; pointer-events: none;
  backdrop-filter: blur(4px);
}

/* ── Node foot / status ─────────────────────────────────────────────────── */
.node-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; font-family: var(--type-mono);
  font-size: 10px; color: var(--fg-3);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.node-status {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 6px; border-radius: 3px;
  font-family: var(--type-mono); font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
}
.node-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.node-status.idle  { color: var(--fg-3); }
.node-status.queued { color: oklch(0.78 0.09 230); }
.node-status.running { color: var(--amber); }
.node-status.running .dot { animation: pulse 1.2s ease-in-out infinite; }
.node-status.done  { color: var(--ok); }
.node-status.error { color: var(--err); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── Node progress ──────────────────────────────────────────────────────── */
.node-progress { height: 2px; background: var(--bg-0); overflow: hidden; }
.node-progress-bar {
  height: 100%; background: var(--amber);
  transition: width 0.3s ease;
  box-shadow: 0 0 8px var(--amber-glow);
}

/* ── Node checkbox (multi-select) ───────────────────────────────────────── */
.node-checkbox {
  position: absolute; top: 8px; left: 8px;
  width: 16px; height: 16px; border-radius: 3px;
  border: 1px solid var(--fg-3); background: var(--bg-0);
  display: grid; place-items: center;
  opacity: 0; transition: opacity 0.12s, background 0.12s, border-color 0.12s;
  z-index: 2; color: oklch(0.18 0.03 65); cursor: pointer;
}
.node:hover .node-checkbox, .node.selected .node-checkbox { opacity: 1; }
.node.selected .node-checkbox { background: var(--amber); border-color: var(--amber); }

/* ── Connection handles (ports) ─────────────────────────────────────────── */
.handle {
  position: absolute;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--bg-0); border: 2px solid var(--fg-3);
  top: 50%; transform: translateY(-50%);
  cursor: crosshair; z-index: 5;
  transition: border-color 0.12s, transform 0.12s, background 0.12s;
}
.handle:hover, .handle.connecting {
  border-color: var(--amber); background: var(--amber);
  transform: translateY(-50%) scale(1.25);
}
.handle.in  { left: -7px; }
.handle.out { right: -7px; }

/* ── Selection box ──────────────────────────────────────────────────────── */
.sel-box {
  position: absolute;
  border: 1px solid var(--amber);
  background: oklch(0.78 0.145 70 / 0.08);
  pointer-events: none; z-index: 50;
}

/* ── Edges ──────────────────────────────────────────────────────────────── */
.edge {
  fill: none;
  stroke: oklch(0.62 0.04 75 / 0.55);
  stroke-width: 1.5;
  transition: stroke 0.15s;
}
.edge:hover, .edge.selected { stroke: var(--amber); stroke-width: 2; opacity: 1; }
.edge.flowing {
  stroke: var(--amber); stroke-width: 2;
  stroke-dasharray: 6 4;
  animation: flow 1s linear infinite;
}
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edge-temp { stroke: var(--amber); stroke-width: 2; stroke-dasharray: 5 5; opacity: 0.8; fill: none; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: -20; } }

/* ── Add node menu ──────────────────────────────────────────────────────── */
.add-menu {
  position: fixed; background: var(--bg-1);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 6px; z-index: 200;
  box-shadow: 0 8px 30px oklch(0 0 0 / 0.6);
  min-width: 200px; display: none;
}
.add-menu.open { display: flex; flex-direction: column; gap: 2px; }
.add-menu-item {
  padding: 8px 12px; font-size: 0.85rem; cursor: pointer;
  border-radius: 6px; display: flex; align-items: center; gap: 10px;
  transition: background 0.1s; color: var(--fg-1);
}
.add-menu-item:hover { background: var(--bg-3); color: var(--fg-0); }
.add-menu-item .icon { font-size: 1rem; width: 22px; text-align: center; }
.add-menu-item .sub { font-size: 0.72rem; color: var(--fg-3); }

/* ── Status toast ───────────────────────────────────────────────────────── */
.toast {
  position: fixed; top: 70px; right: 20px;
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px;
  font-size: 0.82rem; z-index: 300;
  animation: slideIn 0.2s ease; color: var(--fg-1);
}
.toast.error { border-color: var(--err); color: var(--err); }
.toast.success { border-color: var(--ok); color: var(--ok); }
@keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }

/* ── Scrollbars ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-4); }

/* ── Left sidebar panel ─────────────────────────────────────────────────── */
.side-left {
  position: fixed;
  top: 52px; left: 0;
  width: 260px; bottom: 0;
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  z-index: 80; font-family: var(--type-ui);
}
.side-tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  padding: 0 8px; gap: 2px; flex-shrink: 0;
}
.side-tab {
  padding: 10px 10px 9px;
  font-size: 11px; font-weight: 500;
  color: var(--fg-2);
  letter-spacing: 0.04em; text-transform: uppercase;
  border: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px; background: none; cursor: pointer;
  transition: color 0.12s;
}
.side-tab:hover { color: var(--fg-0); }
.side-tab.active { color: var(--fg-0); border-bottom-color: var(--amber); }
.side-body { flex: 1; overflow-y: auto; padding: 12px; }
.side-body::-webkit-scrollbar { width: 6px; }
.side-body::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
.side-section-title {
  font-family: var(--type-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--fg-3);
  margin: 14px 4px 8px;
}
.side-section-title:first-child { margin-top: 0; }
.lib-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lib-card {
  display: flex; flex-direction: column;
  align-items: flex-start; gap: 6px; padding: 10px;
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  text-align: left; width: 100%;
}
.lib-card:hover { border-color: var(--amber-dim); background: var(--bg-3); }
.lib-card-icon {
  width: 28px; height: 28px; display: grid; place-items: center;
  border-radius: 6px; background: oklch(0.78 0.145 70 / 0.12);
  color: var(--amber); font-size: 0.9rem;
}
.lib-card-name { font-size: 12px; font-weight: 600; color: var(--fg-0); }
.lib-card-desc { font-size: 11px; color: var(--fg-2); line-height: 1.35; }
.tree { display: flex; flex-direction: column; gap: 1px; }
.tree-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 6px; border-radius: 4px;
  font-size: 12px; color: var(--fg-1); cursor: pointer;
}
.tree-item:hover { background: var(--bg-2); color: var(--fg-0); }
.tree-item.active { background: oklch(0.78 0.145 70 / 0.12); color: var(--amber); }
.tree-item-icon { width: 16px; text-align: center; }
.side-empty { font-size: 11px; color: var(--fg-3); text-align: center; padding: 24px 8px; line-height: 1.5; }
.file-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px; border-radius: 6px; margin-bottom: 2px;
  border: 1px solid transparent; cursor: default;
  transition: background 0.1s;
}
.file-item:hover { background: var(--bg-2); border-color: var(--line); }
.file-thumb {
  width: 40px; height: 40px; flex-shrink: 0; border-radius: 5px;
  background: var(--bg-3); border: 1px solid var(--line);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.file-thumb img, .file-thumb video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 11px; font-weight: 500; color: var(--fg-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-sub { font-size: 10px; color: var(--fg-3); margin-top: 2px; font-family: var(--type-mono); }
.file-actions { display: flex; gap: 4px; margin-top: 4px; }
.file-link {
  font-size: 10px; color: var(--amber); text-decoration: none;
  padding: 1px 6px; border-radius: 3px; border: 1px solid var(--amber-dim);
  background: oklch(0.78 0.145 70 / 0.08);
  transition: background 0.1s;
}
.file-link:hover { background: oklch(0.78 0.145 70 / 0.18); }

/* ── Right panel ────────────────────────────────────────────────────────── */
.side-right {
  position: fixed; top: 52px; right: 0;
  width: 320px; bottom: 0;
  background: var(--bg-1); border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  z-index: 80; font-family: var(--type-ui); overflow: hidden;
}
#right-panel-content { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

/* shared tab count badge */
.tab-count {
  display: inline-grid; place-items: center;
  min-width: 16px; height: 14px; padding: 0 4px; margin-left: 5px;
  border-radius: 7px; background: var(--amber); color: oklch(0.18 0.03 65);
  font-family: var(--type-mono); font-size: 9px; font-weight: 600;
  letter-spacing: 0; vertical-align: 1px;
}
.side-tab:not(.active) .tab-count { background: var(--bg-3); color: var(--fg-1); }

/* ── Upstream inputs panel ──────────────────────────────────────────────── */
.upstream { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.upstream-head {
  padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
  background: var(--bg-1); flex-shrink: 0;
}
.upstream-target {
  display: flex; align-items: center; gap: 9px; margin-bottom: 10px;
}
.upstream-target-badge {
  width: 24px; height: 24px; border-radius: 5px;
  display: grid; place-items: center;
  background: oklch(0.78 0.145 70 / 0.14); color: var(--amber); flex-shrink: 0;
}
.upstream-target-meta { min-width: 0; flex: 1; }
.upstream-target-label {
  font-family: var(--type-mono); font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-3); line-height: 1; margin-bottom: 3px;
}
.upstream-target-title {
  font-size: 13px; font-weight: 600; line-height: 1.2; color: var(--fg-0);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.upstream-target-count { flex-shrink: 0; text-align: right; border-left: 1px solid var(--line); padding-left: 9px; }
.upstream-target-count .num {
  display: block; font-family: var(--type-display); font-size: 22px;
  line-height: 1; color: var(--amber); font-style: italic;
}
.upstream-target-count .lbl {
  font-family: var(--type-mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--fg-3);
}
.upstream-filters { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.upstream-filters-spacer { flex: 1; }
.upstream-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 4px;
  background: var(--bg-2); border: 1px solid var(--line);
  color: var(--fg-1); font-size: 11px; font-weight: 500; transition: all 0.12s;
}
.upstream-chip:hover { color: var(--fg-0); border-color: var(--bg-4); }
.upstream-chip.active {
  background: oklch(0.78 0.145 70 / 0.16); border-color: var(--amber-dim); color: var(--amber);
}
.upstream-chip-n { font-family: var(--type-mono); font-size: 10px; color: var(--fg-3); font-weight: 600; }
.upstream-chip.active .upstream-chip-n { color: var(--amber); }
.upstream-toggle-group {
  width: 24px; height: 24px; display: grid; place-items: center;
  border-radius: 4px; background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-2);
}
.upstream-toggle-group:hover { color: var(--fg-0); border-color: var(--bg-4); }
.upstream-toggle-group.on { color: var(--amber); border-color: var(--amber-dim); background: oklch(0.78 0.145 70 / 0.12); }
.upstream-body {
  flex: 1; overflow-y: auto; min-height: 0; padding: 6px 12px 16px;
}
.upstream-body::-webkit-scrollbar { width: 6px; }
.upstream-body::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
.upstream-group { padding: 0; margin-top: 14px; }
.upstream-group:first-child { margin-top: 6px; }
.upstream-group-head {
  display: flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 0 4px 7px; user-select: none; color: var(--fg-3);
}
.upstream-group-head:hover { color: var(--fg-1); }
.upstream-group-icon {
  display: inline-grid; place-items: center;
  width: 16px; height: 16px; border-radius: 3px;
  background: oklch(0.78 0.145 70 / 0.12); color: var(--amber);
}
.upstream-hop-pip {
  display: inline-grid; place-items: center;
  width: 16px; height: 16px; border-radius: 3px;
  background: var(--bg-3); color: var(--fg-1);
  font-family: var(--type-mono); font-size: 9px; font-weight: 600;
}
.upstream-group-title {
  flex: 1; font-family: var(--type-mono); font-size: 9px;
  letter-spacing: 0.14em; text-transform: uppercase;
}
.upstream-group-count { font-family: var(--type-mono); font-size: 10px; color: var(--fg-3); }
.upstream-group-body { display: flex; flex-direction: column; gap: 8px; }

/* input card */
.input-card {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: var(--r-md, 10px); overflow: hidden; transition: border-color 0.12s;
}
.input-card:hover { border-color: var(--bg-4); }
.input-card-head {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 6px;
}
.input-card-title {
  flex: 1; font-size: 12px; font-weight: 500; color: var(--fg-0);
  cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.input-card-title:hover { color: var(--amber); }
.input-type-mark {
  display: grid; place-items: center; width: 20px; height: 20px;
  border-radius: 4px; flex-shrink: 0;
}
.input-type-mark.t-text   { color: oklch(0.85 0.04 85);  background: oklch(0.85 0.04 85 / 0.10); }
.input-type-mark.t-image  { color: oklch(0.78 0.10 200); background: oklch(0.78 0.10 200 / 0.12); }
.input-type-mark.t-video  { color: var(--amber); background: oklch(0.78 0.145 70 / 0.14); }
.input-type-mark.t-audio  { color: oklch(0.78 0.12 320); background: oklch(0.78 0.12 320 / 0.12); }
.input-type-mark.t-upload { color: oklch(0.75 0.10 155); background: oklch(0.75 0.10 155 / 0.12); }
.input-hop {
  font-family: var(--type-mono); font-size: 9px; letter-spacing: 0.05em;
  color: var(--fg-3); padding: 1px 5px; background: var(--bg-3); border-radius: 3px; flex-shrink: 0;
}
.input-text {
  position: relative; padding: 0 12px 12px;
  font-size: 12.5px; line-height: 1.55; color: var(--fg-1);
  cursor: pointer; max-height: 96px; overflow: hidden;
}
.input-text.expanded { max-height: none; }
.input-text-content {
  font-family: var(--type-ui); color: var(--fg-1);
  border-left: 2px solid var(--amber-dim); padding-left: 10px;
}
.input-text-fade {
  position: absolute; left: 12px; right: 12px; bottom: 0; height: 30px;
  background: linear-gradient(transparent, var(--bg-2) 60%); pointer-events: none;
  font-family: var(--type-mono); font-size: 9px; letter-spacing: 0.1em;
  color: var(--fg-3); display: flex; align-items: flex-end;
  justify-content: flex-end; padding-right: 4px; text-transform: uppercase;
}
.input-media {
  position: relative; background: var(--bg-0);
  aspect-ratio: 16 / 9; overflow: hidden;
}
.input-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.input-media-placeholder {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--type-mono); font-size: 10px; letter-spacing: 0.14em;
  color: var(--fg-3);
  background: repeating-linear-gradient(45deg,
    oklch(0.22 0.01 65), oklch(0.22 0.01 65) 6px,
    oklch(0.25 0.012 65) 6px, oklch(0.25 0.012 65) 12px);
}
.input-media-pill {
  position: absolute; padding: 2px 6px;
  font-family: var(--type-mono); font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; background: oklch(0 0 0 / 0.6); color: var(--fg-0); border-radius: 3px;
}
.input-media-pill.duration { top: 6px; left: 6px; }
.input-media-pill.res { top: 6px; right: 6px; }
.input-audio {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px 12px;
}
.input-audio-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--amber); color: oklch(0.18 0.03 65);
  display: grid; place-items: center; flex-shrink: 0; transition: transform 0.12s;
}
.input-audio-btn:hover { transform: scale(1.06); }
.input-audio-track { flex: 1; min-width: 0; }
.input-audio-wave {
  display: flex; align-items: center; gap: 2px; height: 26px; margin-bottom: 4px;
}
.input-audio-wave span { flex: 1; background: var(--amber); border-radius: 1px; opacity: 0.45; min-height: 2px; }
.input-audio-wave span.active { opacity: 1; }
.input-audio-meta {
  display: flex; gap: 5px;
  font-family: var(--type-mono); font-size: 10px; color: var(--fg-3);
}
.input-card-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 8px 5px 10px; border-top: 1px solid var(--line-soft);
  background: oklch(0 0 0 / 0.15); gap: 8px;
}
.input-meta {
  font-family: var(--type-mono); font-size: 10px; color: var(--fg-3);
  letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; min-width: 0; flex: 1;
}
.input-card-actions { display: flex; gap: 2px; flex-shrink: 0; }
.input-action {
  width: 22px; height: 22px; display: grid; place-items: center;
  border-radius: 4px; color: var(--fg-2);
}
.input-action:hover { background: var(--bg-3); color: var(--amber); }

/* ── Params / inspector panel ───────────────────────────────────────────── */
.inspector-head {
  padding: 14px 14px 12px; border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; align-items: flex-start; flex-shrink: 0;
}
.inspector-thumb {
  width: 48px; height: 48px; border-radius: 6px; background: var(--bg-2);
  object-fit: cover; flex-shrink: 0; border: 1px solid var(--line);
}
.inspector-thumb.placeholder {
  background: repeating-linear-gradient(45deg,
    oklch(0.22 0.01 65), oklch(0.22 0.01 65) 4px,
    oklch(0.25 0.012 65) 4px, oklch(0.25 0.012 65) 8px);
  display: grid; place-items: center; color: var(--fg-3);
}
.inspector-meta { flex: 1; min-width: 0; }
.inspector-title {
  font-family: var(--type-display); font-size: 18px; line-height: 1.1;
  color: var(--fg-0); margin: 0 0 2px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.inspector-sub {
  font-family: var(--type-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--fg-3);
}
.params-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1; }
.field { margin-bottom: 0; }
.field-label {
  display: block; font-family: var(--type-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-3); margin-bottom: 6px;
}
.field-input, .field-textarea, .field-select {
  width: 100%; padding: 8px 10px;
  background: var(--bg-0); border: 1px solid var(--line);
  border-radius: 6px; color: var(--fg-0); font-size: 12px;
  outline: none; transition: border-color 0.12s; font-family: inherit;
}
.field-input:focus, .field-textarea:focus, .field-select:focus { border-color: var(--amber); }
.field-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip-row { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  padding: 4px 9px; font-size: 11px; color: var(--fg-2);
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
.chip:hover { color: var(--fg-0); border-color: var(--bg-4); }
.chip.active { color: oklch(0.18 0.03 65); background: var(--amber); border-color: var(--amber); font-weight: 500; }
.insp-status {
  font-size: 11px; padding: 7px 10px; border-radius: 6px;
  background: var(--bg-2); color: var(--fg-2); line-height: 1.4;
}
.insp-status.error { color: var(--err); background: oklch(0.70 0.18 25 / 0.1); }
.insp-run-count { font-size: 10px; color: var(--fg-3); font-family: var(--type-mono); text-align: right; }
.insp-thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.insp-thumb {
  position: relative; border-radius: 5px; overflow: hidden;
  background: var(--bg-0); aspect-ratio: 1; border: 1px solid var(--bg-3);
}
.insp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.insp-thumb-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  font-size: 9px; color: #fff; background: oklch(0 0 0 / 0.55);
  padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.insp-thumb-pending {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; font-size: 20px; color: var(--fg-3);
}
.insp-ref-note { font-size: 10px; color: var(--fg-3); margin-bottom: 6px; line-height: 1.4; font-style: italic; }
.file-thumb-expired {
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  width: 100%; height: 100%; gap: 4px;
  font-size: 10px; color: var(--fg-3); text-align: center; padding: 4px;
}
.file-thumb-expired svg { opacity: 0.4; }

/* ── Queue / Done panels ────────────────────────────────────────────────── */
.queue-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg-2); margin-bottom: 6px;
}
.queue-thumb {
  width: 32px; height: 32px; border-radius: 4px; background: var(--bg-3);
  object-fit: cover; flex-shrink: 0;
}
.queue-info { flex: 1; min-width: 0; }
.queue-name { font-size: 12px; color: var(--fg-0); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-sub { font-family: var(--type-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.05em; }
.queue-bar { height: 3px; background: var(--bg-0); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.queue-bar-fill { height: 100%; background: var(--amber); transition: width 0.4s ease; }

/* ── Empty state ────────────────────────────────────────────────────────── */
.empty-state { padding: 40px 20px; text-align: center; color: var(--fg-3); }
.empty-state-title {
  font-family: var(--type-display); font-size: 18px; color: var(--fg-1);
  margin: 12px 0 4px; font-style: italic;
}
.empty-state-sub { font-size: 12px; line-height: 1.5; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn" title="All projects">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg>
  </a>
  <div class="logo">
    <div class="logo-mark"></div>
    <div class="logo-name">Reel</div>
    <div class="logo-sub">studio</div>
  </div>
  <div class="breadcrumb">
    <span class="sep">/</span>
    <span class="topbar-project" id="topbar-project">Workflow</span>
  </div>
  <div class="topbar-spacer"></div>
  <div class="toggle-chip off" id="node-count">0 nodes</div>
  <div class="toggle-chip off"><span class="dot"></span><span id="credits-text">Loading…</span></div>
  <div class="toggle-chip off" id="save-status">Saved</div>
  <div class="topbar-run-group">
    <button class="btn ghost" id="btn-run-selected">▶ Run selected <span class="btn-kbd">↵</span></button>
    <button class="btn primary" id="btn-run-all">▶▶ Run all <span class="btn-kbd">⌘↵</span></button>
  </div>
  <button class="btn ghost" id="btn-clear-all">Clear</button>
</div>

<div class="side-left">
  <div class="side-tabs">
    <button class="side-tab active" id="tab-library" onclick="switchSideTab('library')">Library</button>
    <button class="side-tab" id="tab-files" onclick="switchSideTab('files')">Files</button>
  </div>
  <div class="side-body">
    <div id="panel-library">
      <div class="side-section-title">Add nodes</div>
      <div class="lib-grid">
        <button class="lib-card" onclick="addNodeFromLibrary('text')">
          <div class="lib-card-icon">📝</div>
          <div><div class="lib-card-name">Text</div><div class="lib-card-desc">Prompt or notes</div></div>
        </button>
        <button class="lib-card" onclick="addNodeFromLibrary('image')">
          <div class="lib-card-icon">🖼️</div>
          <div><div class="lib-card-name">Image</div><div class="lib-card-desc">Generate image</div></div>
        </button>
        <button class="lib-card" onclick="addNodeFromLibrary('video')">
          <div class="lib-card-icon">🎬</div>
          <div><div class="lib-card-name">Video</div><div class="lib-card-desc">Generate video</div></div>
        </button>
        <button class="lib-card" onclick="addNodeFromLibrary('audio')">
          <div class="lib-card-icon">🎵</div>
          <div><div class="lib-card-name">Audio</div><div class="lib-card-desc">Upload audio clip</div></div>
        </button>
      </div>
    </div>
    <div id="panel-files" style="display:none"></div>
  </div>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <div class="canvas" id="canvas"></div>
  <svg class="edges" id="edges"></svg>
  <div class="canvas-overlay">
    <div class="canvas-help">
      <kbd class="kbd">H</kbd> pan
      <kbd class="kbd" style="margin-left:6px">V</kbd> select
    </div>
    <div class="zoom-ctl">
      <button id="btn-zoom-out" title="Zoom out">−</button>
      <span class="zoom-val" id="zoom-val">100%</span>
      <button id="btn-zoom-in" title="Zoom in">+</button>
      <button id="btn-fit" title="Fit to view (F)">⛶</button>
    </div>
    <div class="minimap">
      <div class="minimap-inner" id="minimap-inner"></div>
    </div>
  </div>
</div>

<div class="add-menu" id="add-menu">
  <div class="add-menu-item" data-node-type="text">
    <span class="icon">📝</span>
    <div><div>Text</div><div class="sub">Prompt or notes</div></div>
  </div>
  <div class="add-menu-item" data-node-type="image">
    <span class="icon">🖼️</span>
    <div><div>Image</div><div class="sub">Generate or transform an image</div></div>
  </div>
  <div class="add-menu-item" data-node-type="video">
    <span class="icon">🎬</span>
    <div><div>Video</div><div class="sub">Generate or animate a video</div></div>
  </div>
  <div class="add-menu-item" data-node-type="audio">
    <span class="icon">🎵</span>
    <div><div>Audio (upload)</div><div class="sub">Attach an audio clip</div></div>
  </div>
</div>


<div class="side-right">
  <div class="side-tabs" id="right-tabs">
    <button class="side-tab active" data-rtab="inputs" onclick="switchRightTab('inputs')">Inputs<span class="tab-count" id="tab-inputs-count" style="display:none">0</span></button>
    <button class="side-tab" data-rtab="params" onclick="switchRightTab('params')">Params</button>
    <button class="side-tab" data-rtab="queue" onclick="switchRightTab('queue')">Queue<span class="tab-count" id="tab-queue-count" style="display:none">0</span></button>
    <button class="side-tab" data-rtab="done" onclick="switchRightTab('done')">Done</button>
  </div>
  <div id="right-panel-content"></div>
</div>

<script>
  // ── Project context ──────────────────────────────────────────────────────
  const _urlParams = new URLSearchParams(location.search);
  const projectId  = _urlParams.get('project');
  const WORKFLOW_API = projectId
    ? '/api/projects/' + encodeURIComponent(projectId) + '/workflow'
    : '/api/workflow';
  if (projectId) {
    fetch('/api/projects/' + encodeURIComponent(projectId))
      .then(r => r.json())
      .then(d => { if (d.ok) document.getElementById('topbar-project').textContent = d.name; })
      .catch(() => {});
  }

  // ── State ────────────────────────────────────────────────────────────────
  const nodes = new Map();   // id -> node
  const edges = [];          // { id, fromId, toId }
  const selected = new Set();

  const view = { x: 0, y: 0, scale: 1 };
  let nextId = 1;

  const NODE_SPECS = {
    text:  { title: 'Text',  hasIn: false, hasOut: true },
    image: { title: 'Image', hasIn: true,  hasOut: true },
    video: { title: 'Video', hasIn: true,  hasOut: true },
    audio: { title: 'Audio', hasIn: false, hasOut: true },
  };

  // SVG icons for node types and actions
  const ICONS = {
    text:   `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h10M8 4v9M5 13h6"/></svg>`,
    image:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 10l3-3 3 3 2.5-2.5L14 10"/><circle cx="11" cy="6" r="1" fill="currentColor" stroke="none"/></svg>`,

    dup:    `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M5 5V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1"/></svg>`,
    trash:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5 4.5v8a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-8"/></svg>`,
    check:  `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3.5 8.5l3 3 6-7"/></svg>`,
