<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reel · Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Warm film-studio palette */
  --bg:       oklch(0.17 0.012 60);
  --surface:  oklch(0.21 0.014 62);
  --surface2: oklch(0.25 0.016 64);
  --surface3: oklch(0.30 0.018 65);
  --border:   oklch(0.32 0.015 65 / 0.55);
  --accent:   oklch(0.78 0.145 70);
  --accent2:  oklch(0.86 0.11  70);
  --text:     oklch(0.95 0.02  85);
  --muted:    oklch(0.50 0.022 72);
  --success:  oklch(0.75 0.14 155);
  --error:    oklch(0.70 0.18  25);

  /* extended tokens used by new components */
  --bg-0: var(--bg);
  --bg-1: var(--surface);
  --bg-2: var(--surface2);
  --bg-3: var(--surface3);
  --fg-0: var(--text);
  --fg-1: oklch(0.82 0.025 80);
  --fg-2: oklch(0.62 0.025 75);
  --fg-3: var(--muted);
  --amber: var(--accent);
  --amber-dim: oklch(0.52 0.10 68);
  --line: var(--border);
  --line-soft: oklch(0.32 0.015 65 / 0.25);
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --type-display: "Instrument Serif", Georgia, serif;
  --type-ui: "Inter", system-ui, sans-serif;
  --type-mono: "JetBrains Mono", ui-monospace, monospace;
  --shadow-2: 0 1px 0 oklch(1 0 0 / 0.05) inset, 0 18px 48px oklch(0 0 0 / 0.55);
}

html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--type-ui);
  -webkit-font-smoothing: antialiased;
}

/* ── Topbar ──────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky;
  top: 0;
  height: 56px;
  background: color-mix(in oklch, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 12px;
  z-index: 100;
}
.logo { display: flex; align-items: baseline; gap: 8px; padding-right: 20px; border-right: 1px solid var(--border); height: 100%; }
.logo-mark {
  width: 22px; height: 22px; border-radius: 50%; align-self: center;
  background: conic-gradient(from 0deg, var(--amber), oklch(0.6 0.15 50), var(--amber));
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--amber-dim);
  position: relative;
}
.logo-mark::after { content:""; position:absolute; inset:6px; background:var(--bg); border-radius:50%; }
.logo-name { font-family: var(--type-display); font-size: 22px; letter-spacing: -0.01em; align-self: center; color: var(--text); }
.logo-sub  { font-family: var(--type-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; align-self: center; }
.topbar-spacer { flex: 1; }
.topbar-search { position: relative; width: 280px; }
.topbar-search input {
  width: 100%; padding: 7px 10px 7px 30px;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font: inherit; font-size: 12px; outline: none;
  transition: border-color 0.12s;
}
.topbar-search input:focus { border-color: var(--accent); }
.topbar-search input::placeholder { color: var(--muted); }
.topbar-search-icon { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
.topbar-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--amber), oklch(0.55 0.12 30));
  display: grid; place-items: center;
  font-family: var(--type-display); font-size: 15px;
  color: oklch(0.18 0.03 65); font-weight: 600;
  flex-shrink: 0;
}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 7px 14px;
  font-size: 0.83rem;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.btn:hover { background: var(--surface3); border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }
.btn.danger:hover { border-color: var(--error); color: var(--error); background: rgba(248,113,113,0.07); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── App shell ───────────────────────────────────────────────────────────── */
.projects-app {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "topbar topbar" "side main";
  height: 100vh; width: 100vw;
  overflow: hidden;
}
.topbar  { grid-area: topbar; }
.p-side  { grid-area: side; }
.p-main  { grid-area: main; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.p-side {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 14px 10px;
  overflow-y: auto;
}
.p-side-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-sm);
  font-size: 13px; color: var(--fg-1); cursor: pointer; margin-bottom: 1px;
}
.p-side-item:hover { background: var(--surface2); color: var(--text); }
.p-side-item.active { background: oklch(0.78 0.145 70 / 0.12); color: var(--accent); }
.p-side-item .count { margin-left: auto; font-family: var(--type-mono); font-size: 10px; color: var(--muted); }
.p-side-item.active .count { color: var(--accent); }

/* ── Main ────────────────────────────────────────────────────────────────── */
.p-main {
  overflow-y: auto;
  padding: 28px 36px 60px;
  background: var(--bg);
}
.p-main::-webkit-scrollbar { width: 8px; }
.p-main::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

/* ── Hero heading ────────────────────────────────────────────────────────── */
.p-hero { margin-bottom: 24px; }
.p-title {
  font-family: var(--type-display);
  font-size: 42px; line-height: 1; letter-spacing: -0.01em;
  color: var(--text); font-weight: 400;
}
.p-title em { color: var(--accent); font-style: italic; }
.p-subtitle { margin-top: 6px; color: var(--muted); font-size: 13px; }

/* ── Project grid ────────────────────────────────────────────────────────── */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 18px;
}

/* ── Project card ────────────────────────────────────────────────────────── */
.project-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  user-select: none;
}
.project-card:hover {
  border-color: var(--accent);
  box-shadow: 0 8px 32px rgba(0,0,0,0.55);
  transform: translateY(-2px);
}

.card-banner {
  height: 104px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-initial {
  font-size: 2.8rem;
  font-weight: 800;
  color: rgba(255,255,255,0.88);
  text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  letter-spacing: -0.03em;
}
.card-body {
  padding: 12px 14px 14px;
}
.card-name {
  font-size: 0.88rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 5px;
}
.card-meta {
  font-size: 0.72rem;
  color: var(--muted);
}

.card-menu-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.38);
  border: none;
  color: rgba(255,255,255,0.82);
  width: 28px;
  height: 28px;
  border-radius: 6px;
  font-size: 1.05rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s;
  line-height: 1;
}
.project-card:hover .card-menu-btn { opacity: 1; }
.card-menu-btn:hover { background: rgba(0,0,0,0.65); color: #fff; }

/* ── Empty state ─────────────────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 96px 20px;
}
.empty-icon { font-size: 3.2rem; margin-bottom: 18px; }
.empty-state h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 10px; }
.empty-state p {
  font-size: 0.875rem;
  color: var(--muted);
  max-width: 340px;
  margin: 0 auto 28px;
  line-height: 1.6;
}

/* ── Modal ───────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.68);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px;
  width: 420px;
  max-width: calc(100vw - 40px);
  box-shadow: 0 24px 64px rgba(0,0,0,0.7);
}
.modal h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 20px; }
.modal-field { margin-bottom: 20px; }
.modal-field label {
  display: block;
  font-size: 0.72rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  margin-bottom: 8px;
}
.modal-field input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.9rem;
  padding: 10px 12px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.modal-field input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ── Context menu ────────────────────────────────────────────────────────── */
.ctx-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px;
  min-width: 140px;
  z-index: 400;
  box-shadow: 0 10px 36px rgba(0,0,0,0.65);
}
.ctx-item {
  padding: 8px 12px;
  font-size: 0.84rem;
  cursor: pointer;
  border-radius: 6px;
  transition: background 0.1s;
}
.ctx-item:hover { background: var(--surface2); }
.ctx-item.danger { color: var(--error); }
.ctx-item.danger:hover { background: rgba(248,113,113,0.08); }

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 0.82rem;
  z-index: 500;
  pointer-events: none;
  animation: slideUp 0.2s ease;
}
.toast.error { border-color: var(--error); color: var(--error); }
.toast.success { border-color: var(--success); color: var(--success); }
@keyframes slideUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<div class="projects-app">
<div class="topbar">
  <div class="logo">
    <div class="logo-mark"></div>
    <div class="logo-name">Reel</div>
    <div class="logo-sub">studio</div>
  </div>

  <div class="topbar-search">
    <svg class="topbar-search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4"/><path d="M10 10l3 3"/></svg>
    <input id="search-input" placeholder="Search projects…" autocomplete="off" />
  </div>

  <div class="topbar-spacer"></div>

  <button class="btn primary" id="btn-new">
    <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
    New project
  </button>
  <div class="topbar-avatar">R</div>
</div>

<aside class="p-side" id="sidebar">
  <div class="p-side-item active" data-filter="all">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2L2 5l6 3 6-3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/></svg>
    <span>All projects</span><span class="count" id="side-count-all">0</span>
  </div>
  <div class="p-side-item" data-filter="recent">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a6 6 0 1 0 5.5 3.5"/><path d="M13 2v3.5h-3.5M8 5v3.5l2.5 1.5"/></svg>
    <span>Recent</span>
  </div>
  <div class="p-side-item" data-filter="favorites">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" stroke="none"><path d="M9 2L3 9h4l-1 5 6-7H8l1-5z"/></svg>
    <span>Favorites</span><span class="count" id="side-count-fav">0</span>
  </div>
  <div class="p-side-item" data-filter="archived">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z"/></svg>
    <span>Archived</span><span class="count" id="side-count-arch">0</span>
  </div>
</aside>

<main class="p-main">
  <div class="p-hero">
    <h1 class="p-title">Your <em>projects</em></h1>
    <p class="p-subtitle" id="p-subtitle">0 projects</p>
  </div>
  <div id="project-grid" class="project-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none">
    <svg width="32" height="32" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" style="opacity:0.4;margin-bottom:14px"><path d="M8 2L2 5l6 3 6-3-6-3z"/><path d="M2 8l6 3 6-3M2 11l6 3 6-3"/></svg>
    <h2>No projects yet</h2>
    <p>Create your first project to start building video generation workflows.</p>
    <button class="btn primary" id="btn-new-empty">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      Create first project
    </button>
  </div>
</main>
</div><!-- /.projects-app -->

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="modal-title">New Project</h3>
    <div class="modal-field">
      <label for="modal-name">Project name</label>
      <input type="text" id="modal-name" placeholder="e.g. Product launch video" maxlength="80" autocomplete="off" />
    </div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-ok">Create</button>
    </div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx-menu" style="display:none">
  <div class="ctx-item" id="ctx-rename">Rename</div>
  <div class="ctx-item danger" id="ctx-delete">Delete</div>
</div>

<script>
  const GRADIENTS = [
    ['#7c6af7','#a78bfa'],
    ['#3b82f6','#06b6d4'],
    ['#10b981','#34d399'],
    ['#f59e0b','#fb923c'],
    ['#ef4444','#f97316'],
    ['#8b5cf6','#d946ef'],
    ['#0ea5e9','#38bdf8'],
    ['#84cc16','#22c55e'],
  ];

  function cardGradient(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    const [a, b] = GRADIENTS[h % GRADIENTS.length];
    return `linear-gradient(135deg, ${a}, ${b})`;
  }

  function timeAgo(ts) {
    if (!ts) return '';
    const s = Date.now() / 1000 - ts;
    if (s < 60)     return 'just now';
    if (s < 3600)   return `${Math.floor(s / 60)}m ago`;
    if (s < 86400)  return `${Math.floor(s / 3600)}h ago`;
    if (s < 604800) return `${Math.floor(s / 86400)}d ago`;
    return new Date(ts * 1000).toLocaleDateString();
  }

  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function toast(msg, kind = '') {
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  // ── Project list ──────────────────────────────────────────────────────────
  let projects = {};

  async function loadProjects() {
    try {
      const d = await fetch('/api/projects').then(r => r.json());
      if (!d.ok) throw new Error(d.error);
      projects = d.projects || {};
      renderGrid();
    } catch (e) {
      toast('Failed to load projects: ' + e.message, 'error');
    }
  }

  let searchQuery = '';

  function renderGrid() {
    const grid  = document.getElementById('project-grid');
    const empty = document.getElementById('empty-state');
    const sub   = document.getElementById('p-subtitle');

    let entries = Object.entries(projects).sort(
      ([,a],[,b]) => (b.updated_at || b.created_at || 0) - (a.updated_at || a.created_at || 0)
    );

    // Apply sidebar filter
    if (activeFilter === 'favorites') entries = entries.filter(([,p]) => p.favorite);
    else if (activeFilter === 'archived') entries = entries.filter(([,p]) => p.archived);
    else if (activeFilter === 'recent') entries = entries.slice(0, 6);
    else entries = entries.filter(([,p]) => !p.archived); // 'all'

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      entries = entries.filter(([,p]) => (p.name||'').toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q));
    }

    if (sub) sub.textContent = `${entries.length} project${entries.length !== 1 ? 's' : ''}`;
    grid.innerHTML = '';

    updateSidebarCounts();

    if (!entries.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    for (const [id, project] of entries) grid.appendChild(makeCard(id, project));
  }

  function makeCard(id, project) {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.dataset.id = id;

    const initial  = (project.name || '?')[0].toUpperCase();
    const gradient = cardGradient(id);
    const ts       = project.updated_at || project.created_at;

    card.innerHTML = `
      <div class="card-banner" style="background:${gradient}">
        <div class="card-initial">${esc(initial)}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${esc(project.name)}</div>
        <div class="card-meta">${ts ? 'Modified ' + timeAgo(ts) : 'Just created'}</div>
      </div>
      <button class="card-menu-btn" title="Options">⋯</button>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.closest('.card-menu-btn')) return;
      location.href = '/workflow?project=' + encodeURIComponent(id);
    });

    card.querySelector('.card-menu-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openCtxMenu(id, e.currentTarget);
    });

    return card;
  }

  // ── Context menu ──────────────────────────────────────────────────────────
  const ctxMenu = document.getElementById('ctx-menu');
  let ctxId = null;

  function openCtxMenu(id, btn) {
    ctxId = id;
    const r = btn.getBoundingClientRect();
    const x = Math.min(r.right, window.innerWidth - 152);
    ctxMenu.style.top  = (r.bottom + 6) + 'px';
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.display = 'block';
  }

  document.addEventListener('click', () => { ctxMenu.style.display = 'none'; });
  ctxMenu.addEventListener('click', e => e.stopPropagation());

  document.getElementById('ctx-rename').addEventListener('click', () => {
    ctxMenu.style.display = 'none';
    if (!ctxId || !projects[ctxId]) return;
    openModal('rename', ctxId, projects[ctxId].name);
  });

  document.getElementById('ctx-delete').addEventListener('click', async () => {
    ctxMenu.style.display = 'none';
    if (!ctxId || !projects[ctxId]) return;
    const name = projects[ctxId].name;
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
      const d = await fetch('/api/projects/' + encodeURIComponent(ctxId), { method: 'DELETE' }).then(r => r.json());
      if (!d.ok) throw new Error(d.error);
      delete projects[ctxId];
      renderGrid();
      toast('Project deleted');
    } catch (e) {
      toast('Delete failed: ' + e.message, 'error');
    }
  });

  // ── Modal ─────────────────────────────────────────────────────────────────
  const modalOverlay = document.getElementById('modal-overlay');
  let modalMode = 'create';
  let modalProjectId = null;

  function openModal(mode, id = null, name = '') {
    modalMode = mode;
    modalProjectId = id;
    document.getElementById('modal-title').textContent = mode === 'create' ? 'New Project' : 'Rename Project';
    document.getElementById('modal-ok').textContent    = mode === 'create' ? 'Create' : 'Save';
    document.getElementById('modal-name').value = name;
    modalOverlay.style.display = 'flex';
    setTimeout(() => {
      const inp = document.getElementById('modal-name');
      inp.focus(); inp.select();
    }, 40);
  }

  function closeModal() {
    modalOverlay.style.display = 'none';
    document.getElementById('modal-name').value = '';
  }

  async function submitModal() {
    const name = document.getElementById('modal-name').value.trim();
    if (!name) { document.getElementById('modal-name').focus(); return; }
    const okBtn = document.getElementById('modal-ok');
    okBtn.disabled = true;
    try {
      if (modalMode === 'create') {
        const d = await fetch('/api/projects', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name}),
        }).then(r => r.json());
        if (!d.ok) throw new Error(d.error || 'Create failed');
        closeModal();
        location.href = '/workflow?project=' + encodeURIComponent(d.id);
      } else {
        const d = await fetch('/api/projects/' + encodeURIComponent(modalProjectId), {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name}),
        }).then(r => r.json());
        if (!d.ok) throw new Error(d.error || 'Rename failed');
        projects[modalProjectId].name = name;
        closeModal();
        renderGrid();
        toast('Renamed to "' + name + '"', 'success');
      }
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      okBtn.disabled = false;
    }
  }

  document.getElementById('btn-new').addEventListener('click', () => openModal('create'));
  document.getElementById('btn-new-empty').addEventListener('click', () => openModal('create'));
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-ok').addEventListener('click', submitModal);
  document.getElementById('modal-name').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitModal();
    if (e.key === 'Escape') closeModal();
  });
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderGrid();
  });

  // Sidebar filter
  let activeFilter = 'all';
  document.querySelectorAll('.p-side-item[data-filter]').forEach(el => {
    el.addEventListener('click', () => {
      activeFilter = el.dataset.filter;
      document.querySelectorAll('.p-side-item[data-filter]').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      renderGrid();
    });
  });

  function updateSidebarCounts() {
    const all  = Object.values(projects).filter(p => !p.archived).length;
    const fav  = Object.values(projects).filter(p => p.favorite).length;
    const arch = Object.values(projects).filter(p => p.archived).length;
    const allEl = document.getElementById('side-count-all');
    const favEl = document.getElementById('side-count-fav');
    const archEl = document.getElementById('side-count-arch');
    if (allEl)  allEl.textContent  = all;
    if (favEl)  favEl.textContent  = fav;
    if (archEl) archEl.textContent = arch;
  }

  loadProjects();
</script>
</body>
</html>
